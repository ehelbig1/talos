[package]
name = "talos-audit-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-task-supervision = { path = "../talos-task-supervision" }
anyhow.workspace = true
lru = "0.16"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# Only the gRPC/tonic exporter is used. `default-features = false` drops otlp's
# default http-proto + reqwest-blocking-client (opentelemetry-http + reqwest 0.13,
# a duplicate of the workspace's reqwest 0.12) for an HTTP path we never take.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tonic = "0.14"
async-nats = "0.47"
# `default-features = false` drops aws-sdk-s3's legacy `rustls` feature
# (rustls 0.21 / rustls-webpki 0.101); the retained `default-https-client`
# keeps the modern rustls-aws-lc (rustls 0.23) stack. Must stay in lockstep
# with controller/Cargo.toml — both pull aws-sdk-s3, so a divergence would
# re-introduce the legacy feature via feature unification.
aws-config = "1.5"
aws-sdk-s3 = { version = "1.30", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }
# The SDK's TYPED error surface, for the audit-chain verifier's failure
# classification (`verifier::classify_sdk_error`). `SdkError` and
# `ErrorMetadata` are re-exported by aws-sdk-s3, but the VARIANTS of `SdkError`
# (DispatchFailure / TimeoutError / ConstructionFailure) and the
# `ErrorMetadata::builder` used to construct probe errors in the classifier's
# tests are only nameable through the smithy crates directly. Both are already
# in the tree as transitive deps of aws-sdk-s3; naming them here is what makes
# `cargo` guarantee the version this crate compiles against.
aws-smithy-runtime-api = "1.12"
aws-smithy-types = "1.4"
chrono.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
talos-config = { path = "../talos-config" }
talos-audit-event = { path = "../talos-audit-event" }
# Prometheus counter for the two verification-failure detectors (event-level at
# ingest, chain-level in the sweep). Both were ERROR logs only, and every alert
# this platform ships is metric-based. `talos-metrics` is a true leaf (anyhow +
# prometheus), so this edge cannot introduce a cycle.
talos-metrics = { path = "../talos-metrics" }
# For the canonical NATS subject registry (talos.audit.ledger) shared with the
# worker producer — the ledger is the consumer of this subject.
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-http-utils = { path = "../talos-http-utils" }
# `redact_span_text` — the single redact-then-bound-then-failsafe helper for
# every string this crate writes to a span attribute. Replaced a local
# truncate-then-redact block (see the `talos.payload` site in src/lib.rs), which
# is why `talos-text-util` is no longer needed here.
talos-trace = { path = "../talos-trace" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid.workspace = true
zeroize = "1.8"

[lints]
workspace = true
