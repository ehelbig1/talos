[package]
name = "talos-memory-ranking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-task-supervision = { path = "../talos-task-supervision" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
talos-config = { path = "../talos-config" }
# The truncation disclosure's machine-readable half. `talos-metrics` is a
# near-leaf (prometheus + talos-workflow-liveness), so this edge introduces no
# cycle — the same argument `talos-task-supervision` makes above it.
talos-metrics = { path = "../talos-metrics" }
talos-memory = { path = "../talos-memory" }
talos-actor-repository = { path = "../talos-actor-repository" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
