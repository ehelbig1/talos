[package]
name = "send-gmail"
version = "0.1.0"
edition = "2021"

[dependencies]
# NOTE: no `base64` crate. template.rs hand-rolls base64/base64url
# (`base64_standard` / `base64url_encode`), and the ONLY reason is that
# `talos.json` — the sole dependency declaration production reads — never
# listed it, so the hand-rolled helpers are what actually compiled.
#
# `base64` IS on `DEFAULT_ALLOWED_DEPENDENCIES` (talos-compilation's
# dependency_allowlist). Do NOT read this comment as "the allowlist forbids
# base64" and hand-roll it again in the next template: declaring
# `"base64": "0.22"` in talos.json is permitted and would work. An earlier
# revision of this comment said the opposite; that would have propagated a
# reason that does not exist.
#
# The vestigial `base64 = "0.13.0"` line that used to sit here was dead: it
# made this crate build differently in local dev than in production, which is
# the same class of divergence that left `create-calendar-event` unable to
# compile at boot. Removing it, rather than adding base64 to talos.json,
# keeps this a manifest-only change with no template logic rewritten.
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
talos_sdk_macros = { path = "../../talos_sdk_macros" }

[lib]
crate-type = ["cdylib"]
path = "template.rs"

[package.metadata.component]
package = "talos:send-gmail"

[package.metadata.component.target]
path = "../../wit/talos.wit"
world = "network-node"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace]
