[package]
name = "talos-execution-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
chrono = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "json", "chrono"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

# Talos crates — utility
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-metrics = { path = "../talos-metrics" }
talos-shutdown = { path = "../talos-shutdown" }
talos-execution-pause = { path = "../talos-execution-pause" }
talos-http-utils = { path = "../talos-http-utils" }
talos-text-util = { path = "../talos-text-util" }

# Talos crates — repositories
talos-actor-repository = { path = "../talos-actor-repository" }
talos-execution-repository = { path = "../talos-execution-repository" }
talos-workflow-repository = { path = "../talos-workflow-repository" }
talos-workflow-liveness = { path = "../talos-workflow-liveness" }

# Talos crates — services
talos-actor-memory-service = { path = "../talos-actor-memory-service" }
talos-config = { path = "../talos-config" }
talos-engine = { path = "../talos-engine" }
talos-execution-result-collector = { path = "../talos-execution-result-collector" }
talos-registry = { path = "../talos-registry" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-workflow-authorization = { path = "../talos-workflow-authorization" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
talos-workflow-validation = { path = "../talos-workflow-validation" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
