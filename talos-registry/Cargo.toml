[package]
name = "talos-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-task-supervision = { path = "../talos-task-supervision" }
anyhow.workspace = true
axum = { workspace = true, features = ["json"] }
chrono.workspace = true
oci-client = { workspace = true, features = ["rustls-tls"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
talos-redis = { path = "../talos-redis" }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "json", "chrono"] }
async-trait.workspace = true
subtle.workspace = true
sha2.workspace = true
talos-capability-world = { path = "../talos-capability-world" }
# The two pure readers of a catalog manifest that the compile crate owns:
# `recommended_max_fuel` and `manifest_dependencies` (check 68 keeps the
# `dependencies` key read there). No compile is started from this crate.
talos-compilation = { path = "../talos-compilation" }
talos-config = { path = "../talos-config" }
talos-http-body = { path = "../talos-http-body" }
talos-sigstore-policy = { path = "../talos-sigstore-policy" }
# MCP-1036: bounded_preview for caller-supplied reflection in error messages.
talos-text-util = { path = "../talos-text-util" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "process"] }
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
