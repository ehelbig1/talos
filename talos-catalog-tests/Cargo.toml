[package]
name = "talos-catalog-tests"
description = "Runs the catalog templates' own tests natively, against the module test kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
doctest = false

# Besides the test kit: serde and serde_json (bundled into every module), and
# each crate a tested template declares in its talos.json `dependencies`.
# build.rs refuses a template whose crate is missing here.
[dependencies]
talos-module-testkit = { path = "../talos-module-testkit" }
# The crates the catalog templates themselves declare (`talos.json`). The
# templates' source is pulled in by build.rs from module-templates/, outside
# this crate, and build.rs refuses to run when one a template declares is
# missing here.
serde = { workspace = true }  # used-indirectly: named by included template source
serde_json = { workspace = true }
chrono = { workspace = true }  # used-indirectly: named by included template source

# The recorded-run fuel gate (tests/fuel_fixtures.rs): the production compile
# path and the worker runtime that executes the result.
[dev-dependencies]
talos-compilation = { path = "../talos-compilation" }
talos-worker-runtime = { path = "../talos-worker-runtime" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tempfile.workspace = true
uuid = { workspace = true }

[build-dependencies]
talos-module-testkit = { path = "../talos-module-testkit" }
# The one reader of a template's manifest (structural check 68).
talos-compilation = { path = "../talos-compilation" }
serde_json = { workspace = true }

[lints]
workspace = true
