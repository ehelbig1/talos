[package]
name = "talos-workflow-validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
petgraph = "0.6"
regex = "1.12"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
# MCP-1032: bounded_preview for caller-supplied reflection in schema validation errors.
# Fuel-sizing check: the `__actor_context__` injection budget
# (SMART_MEMORY_CONTEXT_BYTE_BUDGET) and the memory-eligibility gate on a
# node's capability world. Both are workspace path deps — no new external
# crates enter the dependency graph.
talos-capability-world = { path = "../talos-capability-world" }
talos-config = { path = "../talos-config" }
talos-text-util = { path = "../talos-text-util" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
talos-workflow-repository = { path = "../talos-workflow-repository" }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Retry-envelope saturation test binds to the REAL per-node caps rather than
# re-typing 600 / 100 — a saturation proof against a literal proves nothing
# once the cap moves.
talos-workflow-types = { path = "../talos-workflow-types" }

[lints]
workspace = true
