[package]
name = "talos-hygiene-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The ONE draft-substantiveness predicate, shared with `session_start`'s
# display AND its auto-archive sweep (leaf: serde_json only).
talos-draft-heuristics = { path = "../talos-draft-heuristics" }
talos-measurement = { path = "../talos-measurement" }
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

# Talos crates — repositories
talos-analytics-repository = { path = "../talos-analytics-repository" }
talos-execution-repository = { path = "../talos-execution-repository" }
talos-module-repository = { path = "../talos-module-repository" }
talos-workflow-repository = { path = "../talos-workflow-repository" }

[lints]
workspace = true
