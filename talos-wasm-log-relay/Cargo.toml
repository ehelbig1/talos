[package]
name = "talos-wasm-log-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-nats = "0.47"
futures = "0.3"
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing.workspace = true
uuid.workspace = true
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-engine-events = { path = "../talos-engine-events" }
talos-execution-repository = { path = "../talos-execution-repository" }
talos-metrics = { path = "../talos-metrics" }
talos-module-executions = { path = "../talos-module-executions" }
talos-task-supervision = { path = "../talos-task-supervision" }
# The subject and the queue-group name: one home, beside the signed-RPC group.
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }

[lints]
workspace = true
