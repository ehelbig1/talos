[package]
name = "talos-rpc-subscribers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-nats = "0.47"
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
# M-7: AST-based SQL validation re-applied at the controller boundary
# as defense-in-depth against worker↔Postgres parser-divergence. Same
# version as the worker uses so both sides agree on what's a single
# statement.
#
# Wasm-security review 2026-05-22 (MEDIUM-1): `visitor` feature
# enabled so the controller can mirror the worker's AST walk for
# `Expr::Function` deny-list checks (filesystem-reading / sleep /
# backend-killing pg_* functions that the statement-level deny-list
# misses).
sqlparser = { version = "0.53", features = ["visitor"] }
talos-sql-classify = { path = "../talos-sql-classify" }  # THE read-only/mutation classifier, shared with the worker
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
# #754: the write-ceiling gate reads `actors.max_write_ceiling` before
# persisting an actor-attributed mutation on a worker's behalf. The read lives
# in the persistence layer (`read_actor_write_ceiling`) so this crate does not
# become a second reader of a security column.
talos-actor-repository = { path = "../talos-actor-repository" }
talos-actor-memory-service = { path = "../talos-actor-memory-service" }
talos-graph-rag = { path = "../talos-graph-rag" }
talos-integration-state = { path = "../talos-integration-state" }
talos-db = { path = "../talos-db" }
talos-memory = { path = "../talos-memory" }
talos-memory-ranking = { path = "../talos-memory-ranking" }
# RFC 0011 P2c: `talos.ml.predict` serving (model resolution + knn
# batch inference under a tenant-scoped read tx).
talos-ml = { path = "../talos-ml" }
# #754: `memory_write_failures_total{reason="write_ceiling"}` — the SAME
# counter #750's envelope refusal increments, so an operator asking "which
# actor-memory writes did not happen, and why" finds every route in one place.
talos-metrics = { path = "../talos-metrics" }
talos-replay-guard = { path = "../talos-replay-guard" }
talos-tenancy = { path = "../talos-tenancy" }
# #603: `build_suffix` / `builds_match` / `build_is_verifiable` for the
# rejection-path build-skew hint. REUSED, never re-implemented — the MCP
# fleet view and the registration WARN already compare builds with these,
# and three surfaces disagreeing about whether the fleet is skewed would be
# worse than any one of them being wrong. Leaf crate (anyhow/chrono/sqlx/
# serde_json/uuid only), so this edge cannot form a cycle.
talos-worker-identity-repository = { path = "../talos-worker-identity-repository" }
# Wasm-security review 2026-05-22 (MEDIUM-1): canonical SQL function
# deny-list lives here so worker + controller subscriber agree byte-
# identically. Same single-source-of-truth pattern as
# `LLM_PROVIDER_VAULT_PATHS` / `EXTERNAL_LLM_HOSTS`.
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
# #754: the shared write-ceiling DECISION (`write_ceiling_denies`) and the
# shared audit vocabulary (`AGENT_MEMORY_SET_OP` / `WRITE_CEILING_POLICY`) —
# the same constants the worker's gate and #750's envelope gate use. Never a
# local re-derivation: two paths answering one question differently IS the
# defect this closes.
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
# #754: `write_ceiling_gate::controller_write_ceiling_enforced` — the
# controller process's ONE reader of `TALOS_WRITE_CEILING_ENFORCED`, already
# consulted by the #750 envelope gate. Reused rather than re-read here: a
# second env reader for one control is check 69's class. The edge is
# acyclic — `talos-workflow-engine` depends on capability-world / config /
# metrics / rhai-sandbox / engine-core / job-protocol and on nothing that
# reaches back here.
talos-workflow-engine = { path = "../talos-workflow-engine" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# #754 parity test: the ops the controller gates must be spelled exactly as the
# worker spells them. Test-only, so the production dep graph is unchanged.
talos-capability-world = { path = "../talos-capability-world" }

[lints]
workspace = true
