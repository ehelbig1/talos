[package]
name = "talos-session-brief-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

# Talos crates — repositories
talos-advanced-repository = { path = "../talos-advanced-repository" }
# `ChildProtection` — to render WHICH kind of child a listed draft is; the
# scan itself runs through the advanced repository.
talos-child-workflow-refs = { path = "../talos-child-workflow-refs" }
# `Readings` — a read that fails renders null and is named in the response,
# never a 0 or an empty list that reads as a healthy platform.
talos-measurement = { path = "../talos-measurement" }

# Talos crates — services (embedding-provider health probe; shared
# draft-substantiveness heuristics live in talos-hygiene-service so
# session_start and hygiene fix_all can never disagree)
talos-hygiene-service = { path = "../talos-hygiene-service" }
talos-search-service = { path = "../talos-search-service" }

[dev-dependencies]
# `unreadable_platform_tests` drives `build` against a pool whose every read
# fails (a closed port), so the null-not-zero rendering is tested without a
# database.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
