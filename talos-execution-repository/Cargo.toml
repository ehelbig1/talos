[package]
name = "talos-execution-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-config = { path = "../talos-config" }
anyhow.workspace = true
chrono.workspace = true
hex = "0.4"
rand = { version = "0.8", default-features = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
subtle = "2.4"
talos-db = { path = "../talos-db" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-engine-events = { path = "../talos-engine-events" }
talos-execution-finalizer = { path = "../talos-execution-finalizer" }
talos-metrics = { path = "../talos-metrics" }
talos-module-payload-encryption = { path = "../talos-module-payload-encryption" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-text-util = { path = "../talos-text-util" }
# `ExecutionPriority` — the one home for the `workflow_executions.priority`
# vocabulary; the GraphQL test row below writes the same column the workflow
# repository's creators do and must not re-spell it.
talos-workflow-repository = { path = "../talos-workflow-repository" }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Live-Postgres integration test for crash-recovery claim/fail/reclaim
# (gated on TALOS_TEST_DATABASE_URL).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
