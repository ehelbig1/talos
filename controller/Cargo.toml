[package]
name = "controller"
# not-inherited: the controller's release number, part of the build version it
# reports. scripts/release.sh reads the next line; keep it a bare assignment.
version = "1.0.0-r306"
edition.workspace = true
rust-version.workspace = true
# Internal workspace crate — not published to crates.io. License set so
# cargo-deny's unlicensed-crate check passes; no third-party distribution.
publish.workspace = true
license.workspace = true

[dependencies]
talos-local-inference = { path = "../talos-local-inference" }
# 2026-10-06: every dependency this crate declared and never named was
# removed (34 of them), and the 16 that only its tests name moved to
# [dev-dependencies]. They were left from the May-2026 split, when this
# crate's modules became crates and its manifest kept their dependencies. A
# crate that needs one declares it itself; nothing here was switching on a
# feature for another crate (the resolved feature sets of the controller and
# worker binaries are identical before and after). See
# docs/engineering-log/packages/2026-10-06-unused-declarations.md.
# Use Axum 0.8 (required by async-graphql‑axum 7.x)
axum = { workspace = true, features = ["json", "ws"] }
async-graphql = { workspace = true, features = ["uuid", "chrono", "dataloader"] }
async-graphql-axum = "7.2"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
talos-memory = { path = "../talos-memory" }
talos-auth-types = { path = "../talos-auth-types" }
