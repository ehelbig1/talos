sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono", "migrate"] } # `migrate` enables sqlx::migrate! macro for auto-applying migrations at controller startup. RUSTSEC-2024-0363 fix already in 0.8.
dotenvy.workspace = true
talos-worker-runtime = { path = "../talos-worker-runtime" }
rand = { workspace = true, features = ["default", "std"] }
anyhow.workspace = true
# Logging dependencies
tracing.workspace = true
# env-filter (RUST_LOG) + fmt + registry: the registry composes the fmt layer
# with the tracing_opentelemetry bridge layer. Declared explicitly rather than
# relying on feature-unification from the `worker` dep.
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }

# Node creation dependencies
sha2.workspace = true
chrono = { workspace = true, features = ["serde"] }

# Secrets management and webhook security
hex.workspace = true
subtle.workspace = true  # Constant‑time equality (used for HMAC verification)

# Cookie handling
tower-cookies.workspace = true

# Rate limiting
tower = { workspace = true, features = ["util"] }

# External services for WASM capabilities
# Updated to match worker versions for type compatibility
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
talos-redis = { path = "../talos-redis" }
# rustls is pulled in transitively by redis/sqlx/reqwest. We add it as a
# direct dep so main.rs can call rustls::crypto::ring::default_provider()
# .install_default() at startup — required since rustls 0.23 stopped
# auto-selecting a CryptoProvider when more than one is in the dep graph.
rustls = { workspace = true, features = ["ring"] }
async-nats.workspace = true
talos-nats-tls = { path = "../talos-nats-tls" }

urlencoding.workspace = true
tower_governor.workspace = true
prometheus.workspace = true # opentelemetry-prometheus 0.32 supports prometheus 0.14.x, which drops the
                    # vulnerable protobuf 2.x dependency (prometheus 0.14 uses protobuf 3.x, optional),
                    # clearing RUSTSEC-2024-0437 (protobuf recursion crash) — deny.toml exemption removed.

[dev-dependencies]
# fuel_ledger_tests drives the real hourly-budget admission (2026-09-29).
talos-actor-budget-refusal = { path = "../talos-actor-budget-refusal" }
# create_workflow_from_spec_gate_tests: `CompiledInline::prebuilt_for_tests`
# drives `persist_compiled` without a WASM toolchain (2026-09-25).
talos-inline-compile-service = { path = "../talos-inline-compile-service", features = ["test-support"] }
# oauth_tests pins the legacy OAuth sentinel by name.
talos-unusable-password = { path = "../talos-unusable-password" }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# `libc::atexit` in controller/tests/test_helpers: the shared testcontainer is
# held in a `static`, which is never dropped, so the crate's Drop-based
# `docker rm` never runs and every test-binary invocation leaked a live
# Postgres. Already in Cargo.lock as a transitive dep, so this adds no crate.
libc.workspace = true
# github_app_tenancy_tests: exercise the per-user installation lookup directly.
talos-github-repository = { path = "../talos-github-repository" }
# Used by gmail::pubsub_jwt tests to mint RSA keypairs that back
# locally-signed test JWTs. Production verifier fetches JWKs from
# Google and never calls rsa::* directly.
rsa = { workspace = true, features = ["pem"] }
# write_ceiling_memory_write_tests: builds a REAL `ParallelWorkflowEngine`
# wired to the REAL `ControllerNodeHook` and a stub dispatcher, so the
# `__memory_write__` write-ceiling gate (#750) is proven on the production
# node-completion chain rather than on a helper.
talos-workflow-engine-test-utils = { path = "../talos-workflow-engine-test-utils" }
# dormant_child_workflow_tests: renders the REAL cleanup recommendation from a
# REAL `HygieneReport`, because the defect is what the recommendation COUNTS —
# a test against the repository row alone cannot see the sentence that names
# `batch_delete_workflows`.
talos-hygiene-service = { path = "../talos-hygiene-service" }
talos-child-workflow-refs = { path = "../talos-child-workflow-refs" }
# session_start_substantive_draft_tests: drives the REAL `SessionBriefService`,
# because the defect is what ONE RESPONSE says — the archive sweep and the
# "ready for publish_version" list are assembled in the same function, and a
# test against either half alone cannot see them contradict each other.
talos-session-brief-service = { path = "../talos-session-brief-service" }
# …and names the two block REASONS from the one predicate that produces them,
# rather than restating the strings a third time.
talos-draft-heuristics = { path = "../talos-draft-heuristics" }
# child_run_ledger_tests: RFC 0012's ledger is a new TABLE with new SQL, so
# every assertion here is a round trip — the repository methods, the RLS
# policy, and the retention purge's pinned-parent exemption cannot be observed
# from Rust alone.
talos-child-run-ledger = { path = "../talos-child-run-ledger" }
# statement_stats_tests: the crate is deliberately OUTSIDE check 88's PREPARE
# roots (its relation is absent by design on most servers), so this binary is
# the only thing that can say the SQL runs — and the arm it exists for is the
# one where the extension is DROPPED, which no unit test can reach.
talos-statement-stats = { path = "../talos-statement-stats" }
# swallowed_read_disclosure_tests: builds a REAL `McpState` and drives the
# production MCP `dispatch` for three repaired swallowed-read sites, because
# the defect is what the HANDLER BODY renders — a test against the repository
# read alone cannot see a `Result` that is classified correctly and then
# discarded three hundred lines later (checks 74b / 79b state that limit).
# `talos-judge-probe` is the one `McpState` field with no other route into
# this crate's dev graph.
talos-judge-probe = { path = "../talos-judge-probe" }
# Used by tests only (moved from [dependencies] 2026-10-06).
async-stream.workspace = true
async-trait.workspace = true
dashmap.workspace = true
futures.workspace = true
hmac.workspace = true
ipnetwork.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
talos-admin-event-log = { path = "../talos-admin-event-log" }
talos-capability-world = { path = "../talos-capability-world" }
talos-engine-events = { path = "../talos-engine-events" }
talos-execution-pause = { path = "../talos-execution-pause" }
talos-mcp = { path = "../talos-mcp" }
talos-workflow-liveness = { path = "../talos-workflow-liveness" }
totp-rs.workspace = true
base64.workspace = true
bcrypt.workspace = true

[features]
default = []

[lints]
workspace = true
