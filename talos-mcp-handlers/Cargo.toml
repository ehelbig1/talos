[package]
name = "talos-mcp-handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-actor-budget-refusal = { path = "../talos-actor-budget-refusal" }
talos-task-supervision = { path = "../talos-task-supervision" }
anyhow.workspace = true
async-nats.workspace = true
async-stream.workspace = true
axum = { workspace = true, features = ["json"] }
bcrypt.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
hex.workspace = true
petgraph.workspace = true
rand = { workspace = true, features = ["default", "std"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
talos-redis = { path = "../talos-redis" }
regex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rhai = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
talos-actor-memory-service = { path = "../talos-actor-memory-service" }
talos-actor-policies = { path = "../talos-actor-policies" }
talos-actor-repository = { path = "../talos-actor-repository" }
talos-advanced-repository = { path = "../talos-advanced-repository" }
talos-analytics-repository = { path = "../talos-analytics-repository" }
# RFC 0012: the child-run ledger. The two P1 consumers — get_execution_lineage
# and get_workflow_reuse_stats — read it here.
talos-child-run-ledger = { path = "../talos-child-run-ledger" }
talos-operator-digest = { path = "../talos-operator-digest" }
talos-capability-world = { path = "../talos-capability-world" }
talos-compilation = { path = "../talos-compilation" }
talos-config = { path = "../talos-config" }
talos-continuation-trigger = { path = "../talos-continuation-trigger" }
talos-dlp = { path = "../talos-dlp" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-engine = { path = "../talos-engine" }
talos-execution-repository = { path = "../talos-execution-repository" }
talos-http-body = { path = "../talos-http-body" }
talos-graph-rag = { path = "../talos-graph-rag" }
talos-http-utils = { path = "../talos-http-utils" }
talos-public-url = { path = "../talos-public-url" }
talos-llm = { path = "../talos-llm" }
talos-mcp = { path = "../talos-mcp" }
talos-memory = { path = "../talos-memory" }
talos-memory-ranking = { path = "../talos-memory-ranking" }
talos-module-repository = { path = "../talos-module-repository" }
talos-oauth = { path = "../talos-oauth" }
# `list_connections`: the provider registry + the cross-provider listing, and
# the Plaid vault-path builder, so the tool derives a connection's reference
# from the code that stores it.
talos-integrations = { path = "../talos-integrations" }
# The push-channel inventory TRAIT. LEAF (types + one pure classification):
# this crate must NOT depend on talos-gmail / talos-google-calendar /
# talos-google-cloud, which sit above it.
talos-push-channel-inventory = { path = "../talos-push-channel-inventory" }
talos-registry = { path = "../talos-registry" }
talos-rate-limit = { path = "../talos-rate-limit" }
talos-replay-service = { path = "../talos-replay-service" }
talos-inline-compile-service = { path = "../talos-inline-compile-service" }
talos-search-service = { path = "../talos-search-service" }
# Verifying security audit — `security_audit` is a thin wrapper over this crate.
talos-security-audit = { path = "../talos-security-audit" }
talos-statement-stats = { path = "../talos-statement-stats" }
# `get_sql_statement_report` renders the Postgres ROLE each tracked statement
# ran as, and that is only provenance when the sandbox guest-role fence is on.
# `guest_role_for_query` is the ONE reader of TALOS_RPC_GUEST_ROLE (it also
# applies the identifier validation, without which an invalid value would be
# reported as a working fence). The edge already exists transitively via
# talos-security-audit, so this direct path adds no compile time and inverts
# nothing.
talos-rpc-subscribers = { path = "../talos-rpc-subscribers" }
# `latest_verifiable_execution` + `CHAIN_SETTLE_SECS` — the eligibility
# predicate `security_audit`'s audit-chain probe must share with the standing
# sweep. Resolved HERE rather than inside talos-security-audit so that crate
# keeps its single DB touchpoint (`pg_trigger`); same split as the
# write-ceiling fleet read directly above it.
talos-audit-ledger = { path = "../talos-audit-ledger" }
talos-failure-analysis-service = { path = "../talos-failure-analysis-service" }
talos-hygiene-service = { path = "../talos-hygiene-service" }
talos-session-brief-service = { path = "../talos-session-brief-service" }
talos-judge-probe = { path = "../talos-judge-probe" }
talos-actor-lifecycle-service = { path = "../talos-actor-lifecycle-service" }
talos-schedule-repo = { path = "../talos-schedule-repo" }
talos-ops-alerts-repository = { path = "../talos-ops-alerts-repository" }
talos-scheduler = { path = "../talos-scheduler" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-ml = { path = "../talos-ml" }
talos-db = { path = "../talos-db" }
talos-tenancy = { path = "../talos-tenancy" }
talos-subworkflow-contract = { path = "../talos-subworkflow-contract" }
talos-system-repo = { path = "../talos-system-repo" }
# Fleet build-identity listing for get_platform_info.fleet — the read goes
# through the repository so the handler stays raw-sqlx-free (lint check 6).
talos-worker-identity-repository = { path = "../talos-worker-identity-repository" }
talos-text-util = { path = "../talos-text-util" }
talos-measurement = { path = "../talos-measurement" }
# Canonical cross-protocol field validators shared with talos-api.
talos-validation = { path = "../talos-validation" }
talos-webhook-repository = { path = "../talos-webhook-repository" }
talos-webhooks = { path = "../talos-webhooks" }
talos-execution-orchestration = { path = "../talos-execution-orchestration" }
talos-evaluation = { path = "../talos-evaluation" }
