[package]
name = "talos-child-run-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono"] }
talos-db = { path = "../talos-db" }
# The record TYPE and the dispatch-kind taxonomy live with the port that
# produces them, so the writer and the row cannot name different things.
# engine-CORE, not the engine: a persistence crate must not reach up into the
# execution engine (check 51).
talos-workflow-engine-core = { path = "../talos-workflow-engine-core", default-features = false }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
