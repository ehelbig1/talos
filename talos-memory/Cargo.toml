[package]
name = "talos-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
talos-config = { path = "../talos-config" }
anyhow.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
# RFC 0010 P2 inc.3: per-worker Ed25519 RPC signing. Same major as
# talos-workflow-job-protocol so the re-exported key types unify.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
chrono = { workspace = true, features = ["serde"] }
hmac.workspace = true
pgvector = { workspace = true, features = ["sqlx"] }
rand = { workspace = true, features = ["default", "std"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
# `raw_value` powers `rpc_auth::RawSigned<T>`: signed bodies cover the EXACT
# wire text (Box<RawValue>) so serde_json's non-idempotent f64 round trip
# can't make signer and verifier disagree (#598). Declared here because this
# crate USES the feature directly — do not rely on transitive unification via
# talos-workflow-job-protocol, which could vanish under a future dep change.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
subtle.workspace = true
thiserror.workspace = true
talos-http-body = { path = "../talos-http-body" }
# MCP-1050: canonical truncate_at_char_boundary for embedding input.
talos-text-util = { path = "../talos-text-util" }
# RFC 0010 P2 inc.3: reuse the SINGLE per-worker identity-key surface —
# Ed25519 key parsing + the TALOS_WORKER_SIGNING_KEY / TALOS_WORKER_PUBLIC_KEYS
# registry — so RPC signing shares the same keypair the worker uses for result
# signing. No cycle: job-protocol does not depend on talos-memory.
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize.workspace = true

[dev-dependencies]
# The SHARED wire-invariant property harness (seeded `arbitrary_json`, the
# round-trip-unstable float counterexamples, the wire/transcode hop helpers).
# Same path dependency as above, re-declared here purely to turn on the
# non-default `test-support` feature for TEST builds: `cargo build` of this
# crate (and of everything that depends on it) still resolves job-protocol
# with default features, so the harness never enters a production binary.
# Sharing it is the point — the #598 fork of this generator drifted, leaving
# the memory signed-wire surface tested strictly more weakly than the
# dispatch one while both suites stayed green.
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol", features = [
    "test-support",
] }
# Hex encoding for the literal MAC digests in tests/wire_format_snapshots.rs.
hex.workspace = true
# Real AES-256-GCM for the integration-test MemoryCryptoHook — lets the
# live-Postgres suite exercise the genuine encrypt→store→read→decrypt round
# trip AND the MCP-S2 AAD-binding property, instead of stubbing crypto out.
aes-gcm.workspace = true
# Pins `MemoryWriteError::METRIC_LABELS` against the pre-seed loop of
# `talos_memory_write_failures_total` (write_error.rs tests): talos-metrics
# cannot depend on this crate, so the two lists meet in a test here. Light:
# prometheus plus one dependency-free leaf crate.
talos-metrics = { path = "../talos-metrics" }

[lints]
workspace = true
