[package]
name = "talos-retry-intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "json", "chrono"] }
tracing.workspace = true
uuid.workspace = true
# A zero-dependency leaf. Two uses:
#
# * Production (since 2026-10-12): `classify_error`'s LAST arm reads the
#   worker's weak `[after_host_failure=…]` marker through
#   `talos_reason_class::after_host_failure::parse`, so the worker that writes
#   the marker and this crate that reads it share one vocabulary.
# * Tests: `HTTP_POLICY_DENIAL_CLASSES` is still a HAND mirror of the worker's
#   closed `[reason_class=…]` token set, left as it was so the strong marker's
#   arms are byte-identical; a token renamed upstream fails
#   `the_hand_mirror_still_matches_the_shared_vocabulary` here.
talos-reason-class = { path = "../talos-reason-class" }

[lints]
workspace = true
