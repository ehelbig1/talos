name: Quality (heavy gates)

# The authoritative correctness gates. Local hooks are deliberately a FAST
# subset (rustfmt, the structural lints, eslint/prettier — see .githooks/); this
# workflow is the one place clippy, the test suites, the integration suite and
# the networked advisory scan run, so nothing is checked twice per change.
#
# How a change moves through it (docs/ci.md has the full picture):
#   * pull_request — every push to a PR branch; a newer push cancels the older
#     run. Job groups the diff cannot affect are skipped (`changes`).
#   * merge_group  — the merge queue runs it ONCE on the merge commit that will
#     land on main; that run is the per-SHA green run the publish gate reads.
#   * schedule / workflow_dispatch — everything, unconditionally.
# Branch protection requires ONE check: "Quality gate" (the `gate` job).
on:
  pull_request:
    branches: [main]
  # The merge queue is the ONE run a change gets on the tree it will become
  # (2026-09-25). The queue builds the merge commit that lands on main, so its
  # run is bound to main's SHA — which is what the publish gate
  # (`gh run list --commit <sha>`) looks up. That replaces `push: main`, which
  # re-ran the full suite on a tree the PR run had just tested and, with
  # cancel-in-progress, cancelled itself when merges landed close together
  # (2 of 5 main runs on 2026-09-25, leaving those SHAs with no green run).
  # Requires the repository's merge queue to be enabled for `main` with
  # "Quality gate" as the required check — see docs/ci.md.
  merge_group:
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC — catches new RUSTSEC advisories within 24h
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Single source of truth for the toolchain — keep in lockstep with ci.yml
  # and rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.95"

concurrency:
  # Only PR runs cancel each other (a newer push to the branch supersedes the
  # older run). A merge-queue, nightly or dispatched run is never cancelled:
  # each is the only run its commit will get.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Which job groups can this change affect? ───────────────────────────────
  # PR and merge-queue runs skip job groups a change cannot reach (a CLAUDE.md
  # or frontend-only change does not rebuild the Rust workspace). Skipped jobs
  # count as passing in the "Quality gate" job below. Nightly and dispatched
  # runs, and any change to the CI plumbing itself, run everything
  # (scripts/ci-changed-areas.sh).
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      frontend: ${{ steps.areas.outputs.frontend }}
      observability: ${{ steps.areas.outputs.observability }}
      migrations: ${{ steps.areas.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Classify the diff
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        # pipefail: a crash in the classifier must FAIL this job (the gate then
        # fails on it) rather than leave empty outputs that skip every job.
        run: |
          set -o pipefail
          case "$EVENT" in
            pull_request) bash scripts/ci-changed-areas.sh "$PR_BASE" "$(git rev-parse HEAD)" ;;
            merge_group)  bash scripts/ci-changed-areas.sh "$MQ_BASE" "$MQ_HEAD" ;;
            *)            bash scripts/ci-changed-areas.sh --all ;;
          esac | tee -a "$GITHUB_OUTPUT"

  # ── Supply-chain: networked RUSTSEC advisories + bans/licenses/sources ─────
  # `make audit` = cargo-deny (advisories + bans + licenses + sources) + the
  # secret-pattern scan + migration-idempotency checks. The advisory DB fetch
  # needs network, which is why this can't live in the offline pre-push hook.
  audit:
    name: Supply-chain (cargo-deny advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-deny

      - name: make audit
        # Full supply-chain gate: cargo-deny (networked advisories + bans +
        # licenses + sources) + the secret-pattern scan + migration-idempotency
        # check. Single source of truth with the local `make audit`. The scan's
        # earlier false-positive on DLP test fixtures (sk-AAAA…) is fixed via the
        # `// secret-scan-allow:` opt-out marker, so the full gate now runs here.
        run: make audit

      - name: Installer worker-trust state machine + Ed25519 derivation
        # deploy/k3s/lib/worker-trust.sh is pure bash the k3s installer sources;
        # its test pins the four-phase order (each phase distributes a key the
        # next one signs with) and checks the OpenSSL seed→public-key derivation
        # against RFC 8032 vector 1. Ubuntu's OpenSSL 3 runs the derivation
        # part that a LibreSSL laptop skips.
        run: bash deploy/k3s/tests/worker-trust-test.sh

      - name: LaunchAgent PATH helper (drill + off-host schedulers)
        # scripts/lib/launchd-path.sh derives a scheduled job's PATH from where
        # the installing shell finds cargo/docker/aws. Both schedulers used to
        # hardcode a PATH without ~/.cargo/bin, so the first scheduled drill
        # died at `cargo: No such file or directory`. The helper half runs
        # here; the plist render/status half needs macOS plutil and skips loudly.
        run: bash scripts/tests/launchd-path-test.sh

      - name: make up disk preflight + make clean prune flags
        # scripts/preflight-disk.sh refuses `make up` at >=95% Docker disk and
        # prints reclaim commands. On 2026-09-15 its first command reclaimed 0 B
        # at 95% with nothing on screen to say so. A fake `docker` on PATH
        # drives every branch: figures shown (or omitted when unreadable),
        # image prune first, the builder-prune flag this client knows, the
        # 95% refusal and the opt-out; plus make clean's prune line.
        run: bash scripts/tests/preflight-disk-test.sh

      - name: Chart Vault init Job + unsealer sidecar against a real Vault
        # deploy/helm/talos/files/vault-init.sh and vault-unseal-loop.sh, driven
        # against the chart's pinned hashicorp/vault image with a fake kubectl:
        # fresh init, a re-run that mints nothing, a legacy bootstrap.json whose
        # root token is revoked and removed, a failed Secret patch that revokes
        # the token it minted, and a restarted (sealed) Vault the sidecar
        # unseals. TALOS_REQUIRE_DOCKER makes a missing daemon a FAILURE here —
        # the test skips without docker locally, and a skip is not a gate.
        env:
          TALOS_REQUIRE_DOCKER: "1"
        run: bash scripts/tests/vault-chart-init-test.sh
      - name: Route crawl parser self-test
        # Package BZ. The crawl itself needs a running controller (smoke.sh
        # leg 7, the installer); CI proves the route derivation it relies on.
        run: python3 scripts/check-route-extensions.py --self-test

  # ── Rust unit tests: library unit tests + the DB-free integration binaries ──
  # The bulk is `--lib` (~1.3k DB-free unit tests). On top of that we explicitly
  # run the two `tests/`-dir integration binaries that are DB-free once their
  # never-in-CI bugs were fixed: `module_template_tests` (disk template
  # discovery) and `sandbox_security_tests` (WASM sandbox boundaries). The
  # remaining `tests/`-dir binaries need a full-app DB harness and run in the
  # `integration` job below (`make test-integration`). `--lib` keeps the
  # default run from re-executing (and failing on) the DB-requiring binaries.
  # Which binary belongs where is no longer a matter of memory: structural
  # lint check 64 fails if any `*/tests/*.rs` is named by neither this
  # workflow nor `scripts/test-integration.sh`.
  test:
    name: Rust tests (unit / lib)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `--lib` tests are DB-free (no Postgres service needed). Keep a non-zero
      # master key + JWT secret as defensive env in case a lib test constructs
      # SecretsManager/AuthService (all-zero is rejected). 64 hex = 32 bytes.
      TALOS_MASTER_KEY: "00000000000000000000000000000000000000000000000000000000deadbeef"
      JWT_SECRET: "ci-jwt-secret-32-bytes-of-padding-zzzzz"
      # Trim debuginfo so the workspace debug build doesn't exhaust runner disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install mold linker
        # .cargo/config.toml pins `-fuse-ld=mold` for x86_64-unknown-linux-gnu,
        # so a Linux host can't link the workspace without mold installed.
        # 2026-08-19: apt stalls on the hosted runners cancelled four jobs
        # across #646 and #658 — the integration job burned its FULL 40-minute
        # cap twice in a row on this exact line, and the migration job its
        # 15-minute cap twice on the pgdg install. A stall with no step timeout
        # costs the whole job budget and reports as a code failure, so this
        # retries and fails fast instead.
        timeout-minutes: 6
        run: |
          # 2026-08-19 (#659 follow-up): the retry alone did NOT help, because
          # apt HANGS rather than failing — the first attempt consumed the whole
          # 6-minute step budget and attempts 2/3 never ran. A retry only helps
          # against a FAST failure; a hang needs a per-ATTEMPT timeout. Budget:
          # 3 x 90s + 10s + 20s = 300s, inside the 6-minute step cap.
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq mold; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed or timed out; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "::error::apt-get failed to install mold after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-nextest

      - name: Run library + binary unit tests
        # `--bins` added 2026-08. `--lib` alone selects LIBRARY targets only, so
        # every `#[cfg(test)]` inside a bin-private module ran NOWHERE in CI —
        # `controller/src/bootstrap/*` is bin-private by design (`mod bootstrap;`
        # is declared in main.rs, not lib.rs), which silently excluded #620's own
        # `oauth_auth_metric_tests` and would have excluded the detector-metric
        # pins added alongside this line. Exactly the class those PRs are about:
        # a guard that exists and is never consulted.
        run: cargo nextest run --workspace --lib --bins --no-fail-fast

      # Every tests/ binary that needs no service: discovered by
      # scripts/ci_test_targets.py (`dbfree`), so a new test file registers
      # itself — no hand-kept `--test` list for parallel PRs to collide on.
      - name: Run DB-free integration-test binaries
        run: bash scripts/ci-run-dbfree-tests.sh

      - name: Run doctests
        # nextest does NOT run doctests (a documented limitation), so the steps
        # above skip them entirely — they were dropped from CI and went unrun.
        # `cargo test --doc` is the only runner for them. ~218 doctests across
        # the workspace, all DB-free. Confirmed green before re-adding (the last
        # item from the never-in-CI sweep's docs/backlog.md note).
        run: cargo test --workspace --doc

  # ── Catalog templates: compile every module-templates/* against the ────────
  # current WIT (DX #13). This gate previously lived only in the
  # workflow_dispatch-only ci.yml, so template type errors shipped silently
  # until a user ran install_module_from_catalog; scaffold-at-install
  # templates (no Cargo.toml — the whole ML set) were skipped even there.
  # ── Alert rules: promtool `check rules` + `test rules` ────────────────────
  # Both promtool fixtures said "NOT WIRED INTO CI — promtool is not available
  # on the runners" for six weeks, and in that time the chart fixture rotted
  # twice: #809 reworded two alerts' annotations without re-running it (four
  # cases red on main, found 2026-09-11), and its three crypto-blind cases
  # modelled a 60 s sweep a day after #794 made the sweep hourly. The runners
  # have Docker (every `services:` block below depends on it), so the toolchain
  # was never the obstacle. One `make` target, digest-pinned image, same
  # command locally and here. A sweep is not a gate (check 64); this is the gate.
  alert-rules:
    name: Alert rules (promtool check + unit tests)
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: make test-alert-rules
        run: make test-alert-rules

  catalog:
    name: Catalog templates compile
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip2

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: catalog

      - name: Install cargo-component
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-component@0.21.1

      - name: make check-catalog
        run: make check-catalog

  # ── Integration tests: the env-gated DB suite (RLS isolation, crash ────────
  # recovery, memory, …). `make test-integration` provisions its own disposable
  # pgvector + Redis via Docker (available on ubuntu-latest), applies the full
  # migration set, sets TALOS_TEST_*_URL, runs the gated tests, and tears down.
  # This is the gate that catches what `cargo nextest` SKIPS — e.g. the RLS
  # write-isolation regression in PR #181/#182.
  integration:
    name: Rust tests (integration / DB) ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One ~23-minute serial job was the whole run's critical path. The work
    # list partitions exactly (scripts/test-integration.sh, TALOS_IT_SHARD),
    # so three runners each compile and run a third of it.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TALOS_IT_SHARD: "${{ matrix.shard }}/3"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install mold linker
        # .cargo/config.toml pins `-fuse-ld=mold` for x86_64-unknown-linux-gnu,
        # so a Linux host can't link the workspace without mold installed.
        # 2026-08-19: apt stalls on the hosted runners cancelled four jobs
        # across #646 and #658 — the integration job burned its FULL 40-minute
        # cap twice in a row on this exact line, and the migration job its
        # 15-minute cap twice on the pgdg install. A stall with no step timeout
        # costs the whole job budget and reports as a code failure, so this
        # retries and fails fast instead.
        timeout-minutes: 6
        run: |
          # 2026-08-19 (#659 follow-up): the retry alone did NOT help, because
          # apt HANGS rather than failing — the first attempt consumed the whole
          # 6-minute step budget and attempts 2/3 never ran. A retry only helps
          # against a FAST failure; a hang needs a per-ATTEMPT timeout. Budget:
          # 3 x 90s + 10s + 20s = 300s, inside the 6-minute step cap.
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq mold; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed or timed out; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "::error::apt-get failed to install mold after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-integration
          # Three shards share one key; letting all three save races for the
          # same cache entry. Shard 1 saves; the dependency graph it caches is
          # what the other two reuse.
          save-if: ${{ matrix.shard == 1 }}

      - name: Install sqlx-cli
        # `make test-integration` provisions its migrated DBs from the RFC 0009
        # schema baseline + tail by default (phase 2), with `sqlx migrate run`
        # applying the post-cutpoint migrations. The `schema-baseline` job below
        # is the drift gate that keeps that fast path trustworthy.
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: sqlx-cli

      - name: make test-integration
        # Self-contained: provisions disposable Docker pgvector + Redis, migrates,
        # runs the TALOS_TEST_*_URL-gated tests, tears down. Single source of
        # truth with the local target.
        run: make test-integration

  # ── Frontend: lint + typecheck + tests (backstop for non-`make hooks` devs) ─
  frontend:
    name: Frontend (lint + test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # 10 left no headroom: `npm ci` is normally 1m02s-2m34s but was measured
    # at 7m02s on 2026-09-04 against a degraded registry, which alone spent 70%
    # of the budget and got the job cancelled mid-audit. 20 absorbs that without
    # hiding it — the audit now bounds itself, so a slow registry degrades to a
    # loud UNKNOWN warning rather than to no result at all.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Codegen snapshot is current
        # `src/generated/{schema,graphql}.ts` are DERIVED from
        # `frontend/schema.graphql` by graphql-codegen. `talos-api`'s
        # `schema_snapshot_tests` pins the INPUT against the compiled Rust
        # schema; nothing pinned the OUTPUT, and on 2026-09-07 both were six
        # weeks stale TOGETHER — they drift in lockstep, which is exactly why
        # neither noticed.
        #
        # None of the other steps in this job can see it: eslint EXCLUDES
        # `src/generated/**` (eslint.config.js), and `tsc --noEmit` only fails
        # if some file references a type the stale output is MISSING — a
        # snapshot that merely lacks new types typechecks perfectly.
        #
        # Deliberately here and NOT in `make lint-frontend`: that target skips
        # itself when `frontend/node_modules` is absent, and a gate that skips
        # is not a gate (checks 64/65). This job has already run `npm ci`.
        run: |
          npm run codegen
          git diff --exit-code -- src/generated \
            || { echo "::error::frontend/src/generated is stale. Run: (cd frontend && npm run codegen) and commit the result."; exit 1; }

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Dependency audit (blocking)
        # Blocks the job on any moderate+ frontend advisory, so dependency
        # CVEs can't silently accumulate (they had — 33, incl. runtime-shipped
        # react-router open-redirect; see docs/functional-audit-2026-06-25.md
        # "Frontend review"). The frontend mirror of the Rust side's
        # `make audit` (cargo-deny) gate.
        #
        # BLOCKING at `moderate`: the backlog was cleared to ZERO across #301
        # (33 → 2: npm audit fix + drop unused @apollo/server + @graphql-codegen
        # v7) and #303 (npm `overrides` forcing monaco's bundled dompurify to
        # patched 3.4.11). With 0 advisories on main the gate fails the job on
        # any NEWLY introduced moderate+ advisory — the tightest practical
        # threshold (low/info stay informational). The nightly schedule re-runs
        # this so a freshly-disclosed advisory surfaces within 24h even with no
        # open PR.
        #
        # NOT a bare `npm audit`. That command exits 1 for BOTH "moderate+
        # advisories were found" AND "I could not reach the advisory
        # service", and CI cannot tell those apart from an exit code. On
        # 2026-09-03 the registry answered `500 Internal Server Error` and
        # failed a Rust-only PR — the third time in three days this gate
        # blocked a change it had nothing to say about. npm's own notice in
        # that same output says the endpoint "is being retired", so this
        # gets more common, not less.
        #
        # The two outcomes are now distinguished, and UNREADABLE IS NOT
        # CLEAN: a transport/endpoint failure emits a loud ::warning:: that
        # says the advisory state is UNKNOWN and does not block, while real
        # moderate+ advisories still fail the job exactly as before. The
        # nightly schedule re-runs this, so a genuine advisory hidden
        # behind one outage surfaces within 24h.
        #
        # Silence on an unreadable audit would be the worse bug: a green
        # tick that means "I did not look".
        #
        # BOUNDED (2026-09-04). #738 taught this step to distinguish "found
        # advisories" from "could not reach the service", but only for a
        # service that ANSWERS. A service that simply does not answer was
        # still unhandled: the command substitution blocks, the step
        # consumes whatever remains of the job budget, and the JOB IS
        # CANCELLED. That is strictly worse than either outcome it was
        # built to separate — a cancelled check is neither green nor red,
        # so it reports nothing at all. "Unreadable is not clean" has to
        # include "unreachable within a bounded time".
        #
        # 300s is measured, not guessed: across the runs on record this
        # step succeeds in 1m13s-3m20s, so the bound sits at ~1.5x the
        # slowest observed SUCCESS. Setting it near the typical case would
        # cut legitimate slow audits and silently turn the gate off, which
        # is the failure this whole step exists to avoid.
        #
        # `set +e` IS LOad-BEARING. GitHub runs every `run:` block as
        # `bash -e {0}` (visible in the job log), and `set -uo pipefail`
        # does NOT turn that off. Under `-e` the assignment below is a
        # simple command whose status is the substitution's, so ANY
        # non-zero npm audit exit killed the step right there — `rc=$?`
        # and every branch under it were unreachable. That is precisely
        # how this step failed on its own PR with `exit code 124`: the
        # 300s bound fired exactly as intended and the handler for it
        # never ran.
        #
        # It also means #738's error paths had never executed in CI. They
        # were verified against a fixture harness run under a plain shell,
        # which does not model `-e`, and every real run until now happened
        # to be the clean case where npm audit exits 0. A verification
        # harness has to reproduce the ENVIRONMENT, not just the logic.
        run: |
          set -uo pipefail
          set +e
          out="$(timeout 300 npm audit --json --audit-level=moderate 2>/dev/null)"
          rc=$?
          set -e

          if [ "$rc" -eq 124 ]; then
            echo "::warning title=Frontend advisory state UNKNOWN::npm audit did not answer within 300s and was stopped. This is NOT a clean result — the advisory state was not read. The nightly run re-checks."
            exit 0
          fi

          if [ -z "$out" ] || ! printf '%s' "$out" | jq -e . >/dev/null 2>&1; then
            echo "::warning title=Frontend advisory state UNKNOWN::npm audit produced no parseable JSON (exit $rc). This is NOT a clean result — the advisory state was not read."
            exit 0
          fi

          if printf '%s' "$out" | jq -e '.error' >/dev/null 2>&1; then
            detail="$(printf '%s' "$out" | jq -r '.error.summary // .error.detail // .error | tostring' | head -c 400)"
            echo "::warning title=Frontend advisory state UNKNOWN::npm audit could not reach the advisory service, so no claim is made about frontend CVEs: $detail"
            exit 0
          fi

          crit=$(printf '%s' "$out" | jq -r '.metadata.vulnerabilities.critical // 0')
          high=$(printf '%s' "$out" | jq -r '.metadata.vulnerabilities.high // 0')
          mod=$(printf  '%s' "$out" | jq -r '.metadata.vulnerabilities.moderate // 0')
          total=$((crit + high + mod))

          echo "Frontend advisories — critical=$crit high=$high moderate=$mod"
          if [ "$total" -gt 0 ]; then
            printf '%s' "$out" | jq -r '
              .vulnerabilities // {} | to_entries[]
              | select(.value.severity == "critical" or .value.severity == "high" or .value.severity == "moderate")
              | "  \(.value.severity)\t\(.key)\t\(.value.via | if type=="array" then (map(if type=="object" then .title else . end) | join("; ")) else tostring end)"'
            echo "::error title=Frontend dependency advisories::$total moderate+ advisory(ies). The backlog is kept at ZERO on main, so these are newly introduced."
            exit 1
          fi

  # ── Migration baseline verifier (RFC 0009 phase 1) ─────────────────────────
  # Proves the committed migrations/.baseline/ artifacts (schema snapshot +
  # _sqlx_migrations seed) reproduce a schema BYTE-IDENTICAL to running the
  # full migration chain. Nothing consumes the baseline until phase 2, but
  # this gate must be continuously green first — a tail migration that
  # mutates something below the cutpoint, a hand-edited snapshot, or a bad
  # seed checksum all fail here instead of at a fresh install. First real
  # run already caught a dump-fixed-point subtlety (see migration
  # 20260702160000).
  schema-baseline:
    name: Migration baseline verifier (RFC 0009)
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Digest-pinned like docker-compose.yml and ci.yml — an unpinned tag
        # lets an upstream rebuild silently change what CI tests.
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install sqlx-cli
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: sqlx-cli

      - name: Install PostgreSQL 17 client
        # pg_dump refuses servers NEWER than itself; ubuntu-latest ships
        # client 16 vs the pg17 service. The scripts honor PG_DUMP_BIN /
        # PSQL_BIN overrides.
        timeout-minutes: 6
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          # --batch --yes: without them `gpg --dearmor -o` PROMPTS when the
          # target keyring already exists and blocks forever on stdin, which a
          # runner-image change could trigger at any time.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq postgresql-client-17; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get failed to install postgresql-client-17 after 3 attempts" >&2
              exit 1
            fi
            echo "apt attempt ${attempt}/3 failed or timed out; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "PG_DUMP_BIN=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PSQL_BIN=/usr/lib/postgresql/17/bin/psql" >> "$GITHUB_ENV"

      - name: Create the two disposable databases
        run: |
          "$PSQL_BIN" "postgres://postgres:verify@localhost:5432/postgres" \
            -c "CREATE DATABASE verify_chain;" \
            -c "CREATE DATABASE verify_baseline;"

      - name: Verify baseline == full chain
        env:
          CHAIN_DATABASE_URL: postgres://postgres:verify@localhost:5432/verify_chain
          BASELINE_DATABASE_URL: postgres://postgres:verify@localhost:5432/verify_baseline
        run: bash scripts/verify-schema-baseline.sh

  sqlx-cache:
    name: sqlx offline cache (compile-checked queries)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Guards the committed `.sqlx/` metadata against drift: every `sqlx::query!`
    # in the workspace is re-validated against a freshly-migrated schema, and the
    # cache must already match (no regeneration needed). If it's stale, the build
    # fails with "run `make sqlx-prepare`". This is what lets the repository crates
    # move from runtime-checked `sqlx::query()` to compile-checked `query!`
    # (review weakness #5) without the offline cache silently rotting.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Digest-pinned like docker-compose.yml and ci.yml — an unpinned tag
        # lets an upstream rebuild silently change what CI tests.
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: sqlxcheck
          # DATABASE_URL below points at /talos; without this the image
          # only creates the default `postgres` DB and migrate fails with
          # `database "talos" does not exist`.
          POSTGRES_DB: talos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:sqlxcheck@localhost:5432/talos
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Install mold linker
        # .cargo/config.toml pins `-fuse-ld=mold` for the Linux target.
        # 2026-08-19: apt stalls on the hosted runners cancelled four jobs
        # across #646 and #658 — the integration job burned its FULL 40-minute
        # cap twice in a row on this exact line, and the migration job its
        # 15-minute cap twice on the pgdg install. A stall with no step timeout
        # costs the whole job budget and reports as a code failure, so this
        # retries and fails fast instead.
        timeout-minutes: 6
        run: |
          # 2026-08-19 (#659 follow-up): the retry alone did NOT help, because
          # apt HANGS rather than failing — the first attempt consumed the whole
          # 6-minute step budget and attempts 2/3 never ran. A retry only helps
          # against a FAST failure; a hang needs a per-ATTEMPT timeout. Budget:
          # 3 x 90s + 10s + 20s = 300s, inside the 6-minute step cap.
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq mold; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed or timed out; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "::error::apt-get failed to install mold after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-sqlx

      - name: Install sqlx-cli
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: sqlx-cli

      - name: Migrate the check database
        run: sqlx migrate run --source migrations

      - name: Verify the committed .sqlx cache is fresh
        # `make sqlx-check` = `cargo sqlx prepare --workspace --check -- --all-targets`.
        # Compiles every query! against the live schema and fails if the checked-in
        # `.sqlx/` would change.
        run: make sqlx-check

  # ── Fast lints: rustfmt + the 90 structural checks + WIT drift ─────────────
  # Moved here from ci.yml on 2026-09-12 (one home; ci.yml is dispatch-only and
  # never ran). No Rust compile: rustfmt needs the toolchain, check 89 needs
  # `cargo tree` (lockfile resolution), check 5 needs `helm` — which is on the
  # ubuntu-latest image, and the `helm version` step below makes its absence a
  # FAILURE rather than the lint's own "⚠ helm not installed — skipping" (a
  # check that skips is not a gate — checks 64/65). Env-gated legs stay off
  # here by design: check 7 (clippy) has its own job below, check 36 (cargo
  # audit) is the `audit` job, check 88's PREPARE leg runs in `integration`
  # against the migrated DB, check 72 (PI markers) skips loudly without the
  # operator-local list.
  lint:
    name: Lint (rustfmt + structural checks)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: helm must be present (check 5 skips without it)
        run: helm version

      # rustfmt and the WIT drift diff used to be separate steps here AND
      # structural checks 35 and 16 — every PR ran each of them twice. The
      # structural copies are the ones kept: they name the offending files.
      - name: Structural lints (incl. rustfmt = check 35, WIT drift = check 16)
        run: bash scripts/lint-structural.sh

      - name: Changelog fragments are well-formed
        run: |
          python3 scripts/changelog-fragments.py self-test
          python3 scripts/changelog-fragments.py check

  # ── Clippy: workspace lint with -D warnings ────────────────────────────────
  # Separate from `test` so the two run in parallel; cargo cannot share
  # metadata across `--cfg test` and non-test invocations, so merging them
  # re-type-checks every dependency (ci.yml's own measurement). Scope matches
  # `make lint-full` (check 7): `--all-targets --no-deps` (since package DO).
  clippy:
    name: Clippy (-D warnings)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Install mold linker
        # .cargo/config.toml pins `-fuse-ld=mold` for x86_64-unknown-linux-gnu,
        # and clippy still LINKS every build script and proc-macro, so without
        # mold the job dies in the first minute on `collect2: cannot find 'ld'`.
        # That is exactly how this job failed on its first CI run (#839) — and
        # how ci.yml's copy would have failed on ITS first run, had it ever had
        # one. Same retry-with-per-attempt-timeout shape as the test job.
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq mold; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed or timed out; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "::error::apt-get failed to install mold after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain (clippy)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: clippy

      # `--all-targets` since 2026-09-22 (package DO). Until then this job
      # linted lib + bin targets only, and the test targets accumulated 107
      # warnings nothing in CI could see — including a test that ignored a
      # `#[must_use]` budget-admission verdict and a dead helper — found by
      # hand three times (packages AO, AP, DL) because `cargo check
      # --all-targets` was the pre-push discipline and no gate. The cost is
      # compiling the test targets, which the cache below already holds for
      # the test job.
      - name: cargo clippy --workspace --all-targets --no-deps -- -D warnings
        # clippy.toml's disallowed-methods rules (checks 29/53/63/78) fail
        # this step at any unsanctioned call. A rule whose path stopped
        # resolving is only a WARNING that -D warnings does not fail, so the
        # log is checked for it: that rule would otherwise be silently off.
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --no-deps -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          if grep -q 'does not refer to a reachable function' "$RUNNER_TEMP/clippy.log"; then
            echo "::error::a clippy.toml disallowed-methods path no longer resolves — that rule is off"
            grep -A3 'does not refer to a reachable function' "$RUNNER_TEMP/clippy.log"
            exit 1
          fi

  # ── The one required check ──────────────────────────────────────────────────
  # Branch protection and the merge queue require THIS job only. It passes
  # when every job above passed or was skipped as unaffected by the change
  # (see `changes`), and fails on any failure or cancellation — so adding a
  # job above needs no settings change, just an entry in `needs`.
  gate:
    name: Quality gate
    if: always()
    needs: [changes, audit, test, alert-rules, catalog, integration, frontend, schema-baseline, sqlx-cache, lint, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended '$r'"; exit 1 ;;
            esac
          done
