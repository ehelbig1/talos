# Dependabot: security updates, plus ONE grouped version-update pull request a
# week per ecosystem that CI exercises.
#
# SECURITY UPDATES (repository settings → Code security, on since 2026-10-06):
# GitHub lists advisories against the lockfiles below and, when one has a
# patched release, opens a pull request that moves to it. Not limited by
# anything in this file. They do not cover every case — see docs/ci.md,
# "A new advisory".
#
# VERSION UPDATES, and why they are shaped like this:
#   * Only where quality.yml builds and tests the result: Rust crates, the
#     frontend's npm packages, GitHub Actions. Docker images and compose
#     services are NOT listed — nothing in CI runs them, and a compose bump
#     lands on a running stack. They are bumped by hand.
#   * Minor and patch only, in ONE grouped pull request per ecosystem. Major
#     versions are ignored here and done by hand, as a change of their own.
#   * At most one open at a time per ecosystem: an unmerged one is updated,
#     not joined by another.
#   * Nothing younger than 7 days is proposed (`cooldown`): a release that
#     turns out to be broken or malicious is usually withdrawn within days.
#
# What the old shape cost, measured 2026-10-06: the previous file asked for
# ungrouped weekly bumps of seven ecosystems. Dependabot had been dormant
# (its features were off); switched on, it opened about 25 pull requests in
# ten minutes, each starting a CI run, and one proposed moving the Rust
# image past the pinned toolchain. The fix that week that needed an npm
# `overrides` entry was needed because a dependency was a major version
# behind its patched release — which is the case FOR small regular bumps.

version: 2

updates:
  # Rust: every workspace member, one lockfile.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Held at 5.91.3 (2026-10-06, #1153): from 5.92 its query-devtools
      # depend on solid-js, which pins seroval ~1.5.4 — inside two advisories
      # (GHSA-p6vx-979v-rg4c critical, GHSA-jp82-f5mq-hwhp high) patched only
      # from 1.6.3. Dev-only and not in the production bundle, but the audit
      # gate blocks on it, and it would sink the whole weekly group. Remove
      # this entry once `npm view solid-js dependencies` shows seroval >=1.6.3.
      - dependency-name: "@tanstack/react-query-devtools"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: pinned by commit; a bump moves the commit and its comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"
