# Dependabot: SECURITY updates only.
#
# What runs (turned on 2026-10-06, repository settings → Code security):
#   * Dependabot alerts — GitHub lists advisories against the lockfiles below;
#   * Dependabot security updates — when an advisory has a patched release,
#     GitHub opens a pull request that moves to it.
# Those pull requests go through quality.yml like any other and are merged by
# a person. They do not cover every case: an advisory whose patched release
# is outside what a dependent asks for needs a hand-made change (the npm
# `overrides` entry of 2026-10-06) — see docs/ci.md, "A new advisory".
#
# What does NOT run: weekly version bumps. `open-pull-requests-limit: 0`
# turns version updates off for an ecosystem and leaves security updates on.
#
# Until 2026-10-06 this file asked for weekly, grouped version-update pull
# requests for cargo, four Docker images, docker-compose and GitHub Actions.
# Dependabot ran once (2026-09-16), its log reported 56 pull requests
# "created" for cargo alone, and none exists in the repository; it never ran
# again, and alerts and security updates were off. The frontend — the source
# of three of that week's four advisory failures — was not listed at all.
# The file described a system that did not run, so it now describes this one.
#
# Docker images and GitHub Actions are not listed: both are pinned by digest
# or commit and are bumped by hand, with the change that needs the bump.

version: 2

updates:
  # Rust: every workspace member, one lockfile.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"

  # Frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
