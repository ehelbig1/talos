[package]
name = "talos-oauth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-http-utils = { path = "../talos-http-utils" }
anyhow.workspace = true
async-trait.workspace = true
bcrypt.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
hex.workspace = true
# Cookie / Set-Cookie header types for the connect browser binding (the same
# `http` 1.x axum and reqwest already use).
http.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
talos-redis = { path = "../talos-redis" }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
# Constant-time equality for the session-binding hash check.
subtle.workspace = true
talos-config = { path = "../talos-config" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-http-body = { path = "../talos-http-body" }
# Reactive-repair outcome counter (talos_oauth_reactive_refresh_total). The
# repair happens here, on the audited credential path, so the counter is
# emitted here too rather than from the engine.
talos-metrics = { path = "../talos-metrics" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
# MCP-1028: truncate-then-redact discipline on audit log error_message.
talos-text-util = { path = "../talos-text-util" }
# One home for the hash of an account with no password (OAuth sign-up).
talos-unusable-password = { path = "../talos-unusable-password" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Needed only by the oauth2-5.x migration guard tests (#647): a throwaway
# loopback listener that answers 302, to prove `oauth_http_client()` does NOT
# follow redirects. oauth2 4.x's built-in `async_http_client` set
# `redirect(Policy::none())` itself; 5.x sets nothing and takes the caller's
# client, so that property now lives in OUR code and needs its own test.
base64.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
