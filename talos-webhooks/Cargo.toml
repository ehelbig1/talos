[package]
name = "talos-webhooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-cost-attribution = { path = "../talos-cost-attribution" }
talos-task-supervision = { path = "../talos-task-supervision" }
anyhow.workspace = true
async-nats.workspace = true
# 2026-09-10: `StreamExt::next` on the signed reply-inbox subscription in
# `handle_webhook` (the last request/reply dispatcher to stop relying on the
# unsigned NATS wire reply header).
futures.workspace = true
axum = { workspace = true, features = ["json"] }
chrono.workspace = true
dashmap.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
ipnetwork.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
subtle.workspace = true
talos-actor-repository = { path = "../talos-actor-repository" }
talos-config = { path = "../talos-config" }
talos-continuation-trigger = { path = "../talos-continuation-trigger" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-engine = { path = "../talos-engine" }
talos-execution-orchestration = { path = "../talos-execution-orchestration" }
talos-execution-repository = { path = "../talos-execution-repository" }
talos-idempotency = { path = "../talos-idempotency" }
# MCP-1144: canonical encrypted_secrets composition (module-declared
# secrets + host-reserved LLM provider keys). Replaces ~50 lines of
# duplicated inline logic across the live webhook dispatch (line ~1133)
# and the DLQ replay dispatch (line ~2427).
talos-integration-helpers = { path = "../talos-integration-helpers" }
talos-metrics = { path = "../talos-metrics" }
talos-execution-pause = { path = "../talos-execution-pause" }
talos-workflow-liveness = { path = "../talos-workflow-liveness" }
talos-module-executions = { path = "../talos-module-executions" }
talos-ml = { path = "../talos-ml" }
talos-module-payload-encryption = { path = "../talos-module-payload-encryption" }
talos-rate-limit = { path = "../talos-rate-limit" }
talos-registry = { path = "../talos-registry" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
# MCP-1050: canonical truncate_at_char_boundary for webhook UA truncation.
talos-ops-alerts-repository = { path = "../talos-ops-alerts-repository" }
talos-text-util = { path = "../talos-text-util" }
talos-worker-fleet = { path = "../talos-worker-fleet" }
talos-workflow-engine = { path = "../talos-workflow-engine" }
talos-workflow-authorization = { path = "../talos-workflow-authorization" }
talos-workflow-repository = { path = "../talos-workflow-repository" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
zeroize.workspace = true
uuid.workspace = true

