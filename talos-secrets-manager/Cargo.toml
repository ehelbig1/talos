[package]
name = "talos-secrets-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
talos-integration-state = { path = "../talos-integration-state" }
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dashmap.workspace = true
hex.workspace = true
hkdf.workspace = true
rand = { workspace = true, features = ["default", "std"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "json", "chrono"] }
talos-config = { path = "../talos-config" }
talos-db = { path = "../talos-db" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-http-body = { path = "../talos-http-body" }
talos-tenancy = { path = "../talos-tenancy" }
talos-metrics = { path = "../talos-metrics" }
# MCP-1028: truncate-then-redact discipline on secret_audit_log.error_message.
talos-text-util = { path = "../talos-text-util" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Mock Vault for the token-renewal tests (vault_token_renewal_tests.rs).
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
