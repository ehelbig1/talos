  { path = "redis::Client::get_connection_manager_lazy", reason = "redis rule: the library puts its own default deadlines (500 ms per response, 1 s to connect) on a connection opened here — open it with talos_redis::multiplexed / talos_redis::manager, which state the workspace's" },
  { path = "redis::aio::ConnectionManager::new", reason = "redis rule: the library puts its own default deadlines (500 ms per response, 1 s to connect) on a connection opened here — open it with talos_redis::multiplexed / talos_redis::manager, which state the workspace's" },
