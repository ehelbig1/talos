[package]
name = "talos-actor-memory-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono"] }
# Memory read grants: the token is random bytes, stored as a hash and compared
# in constant time; minting and revoking are recorded in admin_event_log.
hex.workspace = true
subtle.workspace = true
talos-admin-event-log = { path = "../talos-admin-event-log" }
talos-db = { path = "../talos-db" }
talos-random = { path = "../talos-random" }
talos-text-util = { path = "../talos-text-util" }
talos-config = { path = "../talos-config" }
talos-graph-rag = { path = "../talos-graph-rag" }
talos-memory = { path = "../talos-memory" }
talos-memory-ranking = { path = "../talos-memory-ranking" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-repository = { path = "../talos-workflow-repository" }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing.workspace = true
uuid.workspace = true

