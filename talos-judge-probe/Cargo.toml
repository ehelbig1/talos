[package]
name = "talos-judge-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The engine's `graph()` accessor hands back a `petgraph::DiGraph`; walking
# its in-edges needs `Direction`. Version pinned to the engine's own.
petgraph = "0.6"
serde_json.workspace = true
talos-advanced-repository = { path = "../talos-advanced-repository" }
# `rhai_helpers::evaluate_expression` — the PRODUCTION Rhai sandbox. Reused,
# never re-configured: a probe with looser limits would pass expressions that
# abort at runtime, which is the one thing this tool must never do.
talos-engine = { path = "../talos-engine" }
talos-text-util = { path = "../talos-text-util" }
# `gather_inputs` (the arity rule), `JudgeVerdict::from_collapsed`,
# `build_judge_envelope` (the branch rule) — all reused from the engine.
talos-workflow-engine = { path = "../talos-workflow-engine" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-types = { path = "../talos-workflow-types" }
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
