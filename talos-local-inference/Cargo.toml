[package]
name = "talos-local-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Admission and progress deadlines for LOCAL (Ollama) inference, shared by the
# worker's `llm::complete*` host functions and the controller's
# `talos_llm::OllamaClient` (RFC 0014 P3a). A leaf: nothing Talos-specific
# above the HTTP body cap and the DLP redactor.
[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-http-body = { path = "../talos-http-body" }
tokio = { version = "1", features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }

[lints]
workspace = true
