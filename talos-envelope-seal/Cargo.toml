[package]
name = "talos-envelope-seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RFC 0010 P3 (D3b) controller-side per-execution secret-envelope sealing: in-flight seal-context store, claim handler, and Redis lease for the claim/lease state machine."

[dependencies]
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
dashmap.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
serde_json.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "script"] }
async-nats.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
rand = { workspace = true, features = ["default"] }

[lints]
workspace = true
