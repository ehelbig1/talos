[package]
name = "talos-ml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-task-supervision = { path = "../talos-task-supervision" }
# Fleet lease: this crate's periodic loops run once per interval, not once per replica or per boot.
talos-background-lease = { path = "../talos-background-lease" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
futures.workspace = true
pgvector = { workspace = true, features = ["sqlx"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
talos-llm = { path = "../talos-llm" }
talos-measurement = { path = "../talos-measurement" }
talos-memory = { path = "../talos-memory" }
talos-admin-event-log = { path = "../talos-admin-event-log" }
talos-db = { path = "../talos-db" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-tenancy = { path = "../talos-tenancy" }
talos-text-util = { path = "../talos-text-util" }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
