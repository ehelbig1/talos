[package]
name = "talos-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-actor-budget-refusal = { path = "../talos-actor-budget-refusal" }
talos-task-supervision = { path = "../talos-task-supervision" }
aes-gcm.workspace = true
anyhow.workspace = true
async-nats.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hkdf.workspace = true
rand = { workspace = true, features = ["default", "std"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
rhai = { workspace = true, features = ["serde"] }
talos-dlp = { path = "../talos-dlp" }
thiserror.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
talos-actor-memory-service = { path = "../talos-actor-memory-service" }
talos-actor-repository = { path = "../talos-actor-repository" }
talos-execution-repository = { path = "../talos-execution-repository" }
# `module_executions.error_type` derivation. Consumed rather than re-implemented:
# this crate's classifier is the SAME one `analyze_execution_failure` shows an
# operator for the same message, so the stored column and the report it sits
# beside cannot give two names to one cause. See `module_error_type`.
talos-failure-analysis-service = { path = "../talos-failure-analysis-service" }
talos-ops-alerts-repository = { path = "../talos-ops-alerts-repository" }
talos-config = { path = "../talos-config" }
talos-public-url = { path = "../talos-public-url" }
talos-cost-attribution = { path = "../talos-cost-attribution" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-engine-events = { path = "../talos-engine-events" }
talos-http-utils = { path = "../talos-http-utils" }
talos-memory = { path = "../talos-memory" }
talos-ml = { path = "../talos-ml" }
talos-operator-digest = { path = "../talos-operator-digest" }
talos-metrics = { path = "../talos-metrics" }
# The in-flight run registry and the shutdown drain flag.
talos-shutdown = { path = "../talos-shutdown" }
talos-analytics-repository = { path = "../talos-analytics-repository" }
# RFC 0012: the child-run ledger's SQL home. The engine holds only the adapter.
talos-child-run-ledger = { path = "../talos-child-run-ledger" }
talos-compilation = { path = "../talos-compilation" }
talos-module-executions = { path = "../talos-module-executions" }
talos-module-payload-encryption = { path = "../talos-module-payload-encryption" }
talos-integrations = { path = "../talos-integrations" }
talos-oauth = { path = "../talos-oauth" }
talos-registry = { path = "../talos-registry" }
talos-retry-intelligence = { path = "../talos-retry-intelligence" }
# The ONE Rhai sandbox builder — the thread-local engine in rhai_helpers.rs.
talos-rhai-sandbox = { path = "../talos-rhai-sandbox" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-text-util = { path = "../talos-text-util" }
talos-measurement = { path = "../talos-measurement" }
# Phase C: load_worker_shared_key() to key the per-node checkpoint AEAD,
# matching the scheduler's completion-time checkpoint.
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
talos-worker-fleet = { path = "../talos-worker-fleet" }
talos-workflow-engine = { path = "../talos-workflow-engine" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-engine-nats = { path = "../talos-workflow-engine-nats" }
# RFC 0010 P3 (D3b): shared InFlightSeals + the claim responder singleton wired
# into the dispatcher when TALOS_ENVELOPE_SEALING is on.
talos-envelope-seal = { path = "../talos-envelope-seal" }
talos-workflow-liveness = { path = "../talos-workflow-liveness" }
talos-workflow-repository = { path = "../talos-workflow-repository" }
talos-workflow-authorization = { path = "../talos-workflow-authorization" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# Only the `CancellationToken` (sync) is used — for the crash-recovery fence
# heartbeat in `fence.rs`. Matches the version the engine crate pins.
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true
