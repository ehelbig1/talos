[package]
name = "talos-advanced-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
# The child-workflow reference scan — `session_start`'s auto-archive is a
# DESTRUCTIVE draft path and must not treat a workflow somebody dispatches into
# as a scaffolding leftover. Shared leaf, not a second copy (see #758/#759).
talos-child-workflow-refs = { path = "../talos-child-workflow-refs" }
# RFC 0012: the child-run ledger keeps its OWN retention here, because it has
# no FK to `workflow_executions` — archival is a DELETE plus an INSERT, so a
# CASCADE would erase the ledger at day 30 while the parent lives to day 60.
talos-child-run-ledger = { path = "../talos-child-run-ledger" }
talos-config = { path = "../talos-config" }
# The ONE draft-substantiveness predicate. `session_start` renders a shaped
# draft as "ready for publish_version" in the SAME response this sweep runs in,
# so the sweep must consult the predicate that produced that sentence rather
# than a second copy of it. Leaf: serde_json only.
talos-draft-heuristics = { path = "../talos-draft-heuristics" }
talos-db = { path = "../talos-db" }
tokio = { workspace = true, features = ["time"] }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-tenancy = { path = "../talos-tenancy" }
talos-text-util = { path = "../talos-text-util" }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
