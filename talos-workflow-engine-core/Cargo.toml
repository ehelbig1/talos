# package-not-inherited: one of the five engine crates, written to be published
# on their own (see `repository` below): its version, minimum Rust, edition
# and licence are its own statements, not the workspace's.
# lints-not-inherited: its own, stricter table ([lints.rust] forbids unsafe
# code; [lints.clippy] turns on pedantic).
[package]
name = "talos-workflow-engine-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Core data model and traits for a portable workflow execution engine (DAG, edges, retry/join/system-node taxonomy)."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["workflow", "engine", "dag", "executor", "async"]
categories = ["asynchronous", "data-structures"]
repository = "https://github.com/aegix-dev/talos-workflow-engine"
homepage = "https://github.com/aegix-dev/talos-workflow-engine"

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Node-identity derivation (`engine_node_uuid`): the graph-node-id -> UUID
# mapping every `execution_events.node_id` row is keyed by. Pure-Rust, no_std
# capable, no transitive weight — the alternative is each reader forking the
# arithmetic, where a drifted copy silently joins zero rows.
sha2.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[features]
default = ["llm-primitives"]
# Enables LLM/agent-specific `SystemNodeKind` variants:
# `Judge`, `InlineJudge`, `Ensemble`, `LlmDispatch`, `AgentLoop`,
# `ReActLoop`, `ReflectiveRetry`, `ConfidenceGate`.
#
# Disabling this leaves the taxonomy at generic workflow primitives
# (loops, fan-in/out, waits, sub-workflows, verification, dynamic
# dispatch). Consumers who don't orchestrate LLM workflows can drop
# the feature to remove the variants from docs + binary output.
llm-primitives = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# New in the 1.99 toolchain's pedantic set: it asks for
# `assert_eq!(v, [] as [T; 0])` in place of `assert!(v.is_empty())`, so a
# failure prints the value. Allowed when the toolchain moved (2026-10-06)
# rather than rewriting 47 test assertions in that change; an assertion
# whose value matters on failure can say so with a message.
assert_is_empty = "allow"
# Pragmatic carve-outs for a data-model crate: these fire on patterns
# that are fine in application code and would be noise to silence per-site.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
