[package]
name = "talos-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# RS256 signing for GitHub App JWTs is done with `ring` (constant-time RSA,
# NOT affected by RUSTSEC-2023-0071 / the Marvin timing sidechannel). The
# `rsa` crate is used ONLY to parse/normalize the App private key PEM
# (PKCS#1 → PKCS#8) — never for the private-key signing/decryption operation
# the advisory covers. See docs/rfcs/0008-github-app-authentication.md (D3) and
# the RUSTSEC-2023-0071 note in deny.toml.
base64.workspace = true
chrono = { workspace = true }
ring = "0.17"
rsa = { workspace = true, features = ["std", "pem"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

# Optional — only the async `client` feature (controller-side HTTP). The
# crypto/parse core builds without these.
anyhow = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-tls"], optional = true }
talos-http-body = { path = "../talos-http-body", optional = true }
talos-http-utils = { path = "../talos-http-utils", optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tracing = { workspace = true, optional = true }

[features]
# Async GitHub App API client (mint installation token, get installation) +
# the in-memory installation-token cache. Off by default so the crypto/parse
# core stays reqwest-free.
client = ["dep:anyhow", "dep:dashmap", "dep:reqwest", "dep:talos-http-body", "dep:talos-http-utils", "dep:tokio", "dep:tracing"]

[dev-dependencies]
# Cross-check: sign with ring, VERIFY with jsonwebtoken (independent impl).
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
rand = { workspace = true, features = ["default"] }
# Runtime for the `app_smoke` example (live GitHub App credential check).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
