[package]
name = "talos-integration-helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `google_jwt::GoogleOidcVerifier::with_keys_for_test` to
# DOWNSTREAM crates' tests (e.g. talos-gmail's pubsub_jwt wrapper tests
# need to inject a locally-minted RSA key set). The helpers crate's own
# `#[cfg(test)]` covers it internally, so this feature is only enabled by
# a dependent's dev-dependency, never in production builds.
test-util = []

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["json"] }
chrono.workspace = true
dashmap.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
subtle.workspace = true
talos-config = { path = "../talos-config" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-envelope-seal = { path = "../talos-envelope-seal" }
talos-http-body = { path = "../talos-http-body" }
talos-http-utils = { path = "../talos-http-utils" }
talos-integration-state = { path = "../talos-integration-state" }
talos-memory = { path = "../talos-memory" }
# `google_jwt` records push refusals + JWK refresh outcomes (2026-09-12).
# `version` because the cargo-deny wildcard ban applies to publishable crates.
talos-metrics = { path = "../talos-metrics", version = "0.1.0" }
# The ONE three-valued module-visibility read, beside the dispatch-time load
# whose predicate it is pinned equal to (see `watch_binding`).
talos-registry = { path = "../talos-registry" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-task-supervision = { path = "../talos-task-supervision" }
talos-text-util = { path = "../talos-text-util" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# `start_paused = true` in the renewal-scheduler test needs tokio's
# test-util clock control.
# `net` + `io-util`: google_jwt::tests serve a JWK set from a loopback socket.
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "test-util", "net", "io-util"] }
# google_jwt::tests mint RSA keypairs to back locally-signed test JWTs
# and hand-assemble an `alg: none` token via base64. Production verifies
# Google's JWKs and never calls rsa::* / base64 directly.
base64.workspace = true
rand = { workspace = true, features = ["default"] }
rsa = { workspace = true, features = ["pem"] }
# `tests/absence_vs_failure.rs` drives a live pool (env-gated).
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }

[lints]
workspace = true
