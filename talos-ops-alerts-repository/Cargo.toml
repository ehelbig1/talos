[package]
name = "talos-ops-alerts-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-config = { path = "../talos-config" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
anyhow.workspace = true
chrono.workspace = true
hex.workspace = true
rand = { workspace = true, features = ["default", "std"] }
subtle.workspace = true
talos-text-util = { path = "../talos-text-util" }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "json", "chrono"] }
# envelope.rs — the shared `__ops_alert__` ingest core (parse → cap →
# DLP → tenancy → ingest) consumed by the engine node hook AND the
# module-result completion chokepoint. Domain crate owns the protocol
# semantics, mirroring talos-memory.
talos-actor-repository = { path = "../talos-actor-repository" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-metrics = { path = "../talos-metrics" }
# The worker's `[reason_class=…]` marker vocabulary. This classifier reads
# worker failure text and knew ZERO of the thirty-one tokens: every egress
# denial on the three sibling surfaces landed in `other`, and
# `tier1-llm-egress` was actively misfiled as an LLM BACKEND failure because
# the token contains the substring `llm`.
talos-reason-class = { path = "../talos-reason-class" }
# The one ops_alerts INSERT (package CD).
talos-ops-alert-store = { path = "../talos-ops-alert-store" }
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Pins UNATTENDED/ATTENDED trigger lists to the ingress vocabulary.
talos-workflow-authorization = { path = "../talos-workflow-authorization" }
# `apply_entry`'s refusal tests run the async fn against a pool that never connects.
tokio = { workspace = true, features = ["macros", "rt"] }

