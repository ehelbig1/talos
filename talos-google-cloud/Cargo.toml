[package]
name = "talos-google-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-execution-pause = { path = "../talos-execution-pause" }
talos-http-utils = { path = "../talos-http-utils" }
talos-public-url = { path = "../talos-public-url" }
anyhow.workspace = true
async-nats.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["json"] }
base64.workspace = true
# CSPRNG for minting the per-watch push token (32 bytes OsRng). Matches
# the `rand::rngs::OsRng.fill_bytes(..)` convention used across
# talos-secrets-manager and controller/main.rs.
talos-random = { path = "../talos-random" }
chrono.workspace = true
dashmap.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
talos-redis = { path = "../talos-redis" }
reqwest = { workspace = true, features = ["json", "rustls", "query"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "json", "chrono"] }
talos-config = { path = "../talos-config" }
talos-dlp-provider = { path = "../talos-dlp-provider" }
talos-http-body = { path = "../talos-http-body" }
talos-integration-helpers = { path = "../talos-integration-helpers" }
talos-memory = { path = "../talos-memory" }
talos-module-executions = { path = "../talos-module-executions" }
talos-actor-repository = { path = "../talos-actor-repository" }
talos-oauth = { path = "../talos-oauth" }
talos-push-channel-inventory = { path = "../talos-push-channel-inventory" }
talos-registry = { path = "../talos-registry" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
talos-text-util = { path = "../talos-text-util" }
talos-trace-nats = { path = "../talos-trace-nats" }
thiserror.workspace = true
talos-workflow-engine-core = { path = "../talos-workflow-engine-core" }
talos-workflow-job-protocol = { path = "../talos-workflow-job-protocol" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
urlencoding.workspace = true
uuid.workspace = true

[dev-dependencies]
# handlers::tests reads talos_google_push_accepted_total from the global
# registry.
talos-metrics = { path = "../talos-metrics" }
# handlers::tests mint RSA-signed push JWTs to exercise the push-handler
# auth ordering. Production verifies Google's JWKs; rsa is test-only.
rsa = { workspace = true, features = ["pem", "getrandom"] }
# Enable the helpers `test-util` feature so handler tests can call
# GoogleOidcVerifier::with_keys_for_test (gated cross-crate behind it).
talos-integration-helpers = { path = "../talos-integration-helpers", features = ["test-util"] }

[lints]
workspace = true
