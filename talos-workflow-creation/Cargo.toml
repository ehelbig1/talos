[package]
name = "talos-workflow-creation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
talos-dlp-provider = { path = "../talos-dlp-provider" }
# 2026-09-25: create_from_spec compiles inline nodes through the same service
# add_node_to_workflow uses (gates + refusal on a taken name).
talos-inline-compile-service = { path = "../talos-inline-compile-service" }
talos-llm = { path = "../talos-llm" }
talos-module-repository = { path = "../talos-module-repository" }
# MCP-1050: canonical truncate_at_char_boundary for sanitized workflow name.
talos-text-util = { path = "../talos-text-util" }
talos-workflow-creation-helpers = { path = "../talos-workflow-creation-helpers" }
talos-workflow-repository = { path = "../talos-workflow-repository" }
# The platform caps on node timeout / retry count (`validate_graph_timeouts`),
# the check every other graph write runs.
talos-workflow-types = { path = "../talos-workflow-types" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
