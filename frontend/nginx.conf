# Baked-in nginx config for the frontend IMAGE (frontend/Dockerfile copies
# this to /etc/nginx/conf.d/default.conf). It is what docker-compose.prod.yml
# serves; the Helm chart REPLACES it with
# deploy/helm/talos/templates/frontend/configmap.yaml, whose location set and
# security headers this file must mirror — structural lint check 2 reconciles
# the controller's top-level routes against BOTH files. Until 2026-09-10 this
# file proxied /graphql ALONE, so the compose-prod deployment 404'd the
# WebSocket (/ws), every REST integration route (/api/*), the CSRF seed
# (/auth/csrf — every mutation then failed CSRF), inbound webhooks, MCP, and
# the one-click /corrections + /approval-actions email links.
#
# ONE place names the upstream host. Every location proxies to this named
# upstream; changing the controller's service name is a one-line edit here.
# `controller:8000` is the docker-compose service name + port.
upstream talos_controller {
    server controller:8000;
}

server {
    listen 8080;  # Non-privileged port for non-root user
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # HTTPS enforcement: Redirect HTTP to HTTPS in production
    # Note: TLS termination happens at load balancer, which sets X-Forwarded-Proto
    # This is a soft redirect - development uses HTTP, production uses HTTPS
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Security headers — parity with the chart ConfigMap and the controller's
    # talos-security-headers middleware.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection is obsolete in modern browsers; CSP is the correct defense.

    # Content Security Policy (delivered as HTTP header so frame-ancestors works).
    #
    # style-src keeps 'unsafe-inline' because React's inline style={{}} props
    # render as style attributes, which browsers block without unsafe-inline.
    # script-src has no unsafe-inline or unsafe-eval.
    # style-src/font-src allow Google Fonts because index.html links to
    # fonts.googleapis.com / fonts.gstatic.com (same as the chart ConfigMap; a
    # stricter 'self' here silently fell back to system fonts in compose-prod).
    # frame-ancestors 'none' prevents clickjacking (X-Frame-Options below is
    # the legacy belt to these braces).
    # object-src 'none' prevents plugin-based injection (Flash etc.).
    # connect-src restricts fetch/WebSocket to same-origin only; the Nginx proxy
    # forwards every controller route below so the browser never needs to
    # connect directly to the backend host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # HSTS: emit unconditionally. Browsers ignore HSTS received over plain
    # HTTP per RFC 6797 §8.1, so this is safe even when the upstream load
    # balancer hasn't terminated TLS yet. Putting `add_header` inside an
    # `if` block in server context is rejected by nginx with
    # "add_header directive is not allowed here" — `if` in server only
    # allows return/rewrite/set/break/etc., not response-header directives.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cross-origin isolation + clickjacking. COOP is `same-origin-allow-popups`
    # (NOT `same-origin`): the SPA runs two OAuth flows in a popup and reads the
    # result back via `window.opener` (integrations/useConnectHandlers.ts,
    # builder/SlackAppSelector.tsx); plain same-origin severs the opener the
    # moment the popup navigates to the provider and the flow hangs. CORP
    # same-origin blocks other origins from no-cors loading our resources.
    # COEP is intentionally omitted — require-corp would break the cross-origin
    # Google Fonts / `img-src https:` the CSP above permits.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Permissions-Policy: deny invasive hardware/sensor/tracking APIs the
    # workflow editor never uses. `clipboard-write` is deliberately NOT denied —
    # the UI's copy buttons (navigator.clipboard.writeText) rely on it.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=(), interest-cohort=()" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ── Controller proxies. Same set as the chart ConfigMap. ────────────────

    # /graphql — GraphQL HTTP (POST queries; GET is 405 in prod).
    location /graphql {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ws — GraphQL subscriptions over WebSocket. Origin pass-through is
    # REQUIRED: the controller's ws_auth rejects a handshake with no Origin in
    # production, and nginx does not forward it without an explicit
    # proxy_set_header. Long timeouts keep idle subscriptions open.
    location /ws {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # /api/* — REST endpoints (integration OAuth connect/callback, watch
    # channels, Slack/Gmail/GCP/Atlassian helpers).
    location /api/ {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /auth/oauth/* — controller OAuth login + callback routes. Deliberately
    # NOT `location /auth/`: the SPA owns /auth/callback (see the ConfigMap
    # for the full argument), so only the two controller paths are proxied.
    location /auth/oauth/ {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /auth/csrf — the CSRF cookie seed GET'd before the first mutation.
    location = /auth/csrf {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /webhooks/* — inbound webhook handler (`/webhooks/{id}`); HMAC + replay
    # cache live in the controller.
    location /webhooks/ {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /corrections — one-click ops-alert severity-correction links in emails.
    location /corrections/ {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /approvals — the approval-GATE one-click links (`/approvals/{token}/
    # {approve,reject}`, PR #217: GET renders a confirmation page, POST acts;
    # token looked up by hash, constant-time compared). A DIFFERENT route
    # from /approval-actions below (confidence-gate suspensions). Neither
    # nginx config proxied it until 2026-09-10 — check 2's single-line grep
    # never saw the multi-line `.route(` that registers it, so every
    # approval-gate email link fell through to the SPA shell.
    location /approvals/ {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /approval-actions — one-click approve/reject links in approval emails.
    location /approval-actions/ {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /mcp — Model Context Protocol (streamable-HTTP / SSE; long-lived).
    location /mcp {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # /health — controller health probe (also used by scripts/smoke.sh).
    location /health {
        proxy_pass http://talos_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stop browser favicon probes from filling logs with 404s.
    # no-controller-route: served directly by nginx, no controller proxy.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Serve React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # MCP-799 (2026-05-14): repeat the server-block security headers.
        # Per nginx docs, `add_header` directives are inherited from the
        # parent level ONLY when no `add_header` exists at the current
        # level. The Cache-Control directive above disables inheritance,
        # so the server-block X-Content-Type-Options / Referrer-Policy /
        # CSP / HSTS would otherwise be DROPPED on every JS / CSS /
        # image / font response. Highest-impact gap: missing nosniff on
        # .js → MIME-sniff → XSS via mime confusion. Sibling fix to
        # MCP-798 which closed the helm-chart configmap version of the
        # same drift; this file is the docker-compose deploy path that
        # ships with `make up-dev` and the standalone container image.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=(), interest-cohort=()" always;
    }
}
