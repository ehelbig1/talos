[package]
name = "talos-module-testkit"
description = "A native stand-in for the host bindings, so a module's own tests run with cargo test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { workspace = true }
chrono-tz.workspace = true
hmac.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The gates over a module's source (hosts, config keys, the compile lint),
# re-exported as `source` so a lane that depends on the test kit alone has them.
talos-module-source = { path = "../talos-module-source" }

[lints]
workspace = true
