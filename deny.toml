# cargo-deny configuration — supply-chain policy gate for the Talos workspace.
#
# What this enforces:
#   [advisories] — fail CI on any RUSTSEC advisory for a crate we actually
#     use. This is the main security gate.
#   [licenses]   — allow only OSI-approved permissive licenses. Copyleft
#     (GPL/AGPL/LGPL/SSPL) is rejected; we don't want any crate pulling us
#     into license obligations.
#   [bans]       — deny specific crate versions / duplicates / unmaintained
#     crates that carry elevated risk.
#   [sources]    — only allow crates.io + our sibling workspace path.
#     Blocks "someone published a poisoned fork to a custom registry"
#     attacks.
#
# Run locally:
#   cargo install cargo-deny --locked
#   cargo deny check
#
# Run CI gate:
#   cargo deny --all-features check advisories bans sources licenses
#
# See https://embarkstudios.github.io/cargo-deny/ for the schema.

[graph]
# Check every target — Talos ships for Linux x86_64 + aarch64 in Docker,
# plus macOS for dev. Limiting to those targets cuts scan time in half
# vs. the default "every target triple ever seen".
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    # WASM targets — modules compile to wasm32-wasip1; any advisory on a
    # crate that builds for WASM still matters for the WASM runtime.
    { triple = "wasm32-wasip1" },
    { triple = "wasm32-unknown-unknown" },
]
# Exclude dev-dependencies from the scan — a vuln in a test-only crate
# (dev-dep) can't reach production. Build-deps (proc-macros, build.rs)
# DO reach CI/build machines so we keep them in scope.
exclude-dev = true

# ============================================================================
# Advisories — RUSTSEC vulnerability database gate.
# ============================================================================
[advisories]
# Fail on any advisory unless explicitly ignored below.
# `db-path` and `db-urls` left defaults (~/.cargo/advisory-dbs).
version = 2
yanked = "deny"
ignore = [
    # --- Transitive vulnerabilities in unused / unreachable code paths ---
    #
    # Each entry documents: (1) what pulls the bad crate, (2) why the vuln
    # is not reachable in our deployment, and (3) what we're tracking
    # upstream for a real fix. Re-review quarterly — silent suppressions
    # are forbidden.

    # NOTE (2026-06-02): the RUSTSEC-2024-0437 exemption (protobuf 2.x
    # uncontrolled-recursion crash) was REMOVED. It was pulled by `prometheus`
    # 0.13.x, which `opentelemetry-prometheus` 0.27 pinned. The otel stack is now
    # at 0.32, whose `opentelemetry-prometheus` 0.32 supports `prometheus` 0.14 —
    # and prometheus 0.14 drops protobuf 2.x (it uses protobuf 3.x as an optional,
    # non-default feature we don't enable). protobuf 2.28 is no longer in the tree,
    # so the advisory no longer applies. See controller/worker/talos-metrics
    # Cargo.toml (prometheus = "0.14").

    { id = "RUSTSEC-2023-0071", reason = """
Marvin Attack timing sidechannel in the `rsa` crate's RSA PRIVATE-KEY
operations (decryption / signing). The `rsa` crate is pulled by
`jsonwebtoken` 10.x (rust_crypto feature). Our exposure to the
VULNERABLE operation is nil — it is never invoked:
  * Session JWTs use HS256 (symmetric HMAC) — no RSA at all.
  * RS256 VERIFICATION (gmail Pub/Sub push) is an RSA PUBLIC-key
    operation, which the Marvin sidechannel does not affect.
  * RS256 SIGNING (GitHub App JWTs — talos-github, RFC 0008) is done
    with `ring` (constant-time, blinded), NOT the `rsa` crate. The
    `rsa` crate is used in talos-github ONLY to parse/normalize the
    App private-key PEM to PKCS#8 (a parse/encode operation), never a
    private-key sign/decrypt op.
So the `rsa` crate's vulnerable private-key code path is not reached
anywhere. No upstream fix is available per the advisory ("No safe
upgrade"). Re-evaluate ONLY if a signing/decryption op is ever routed
THROUGH the `rsa` crate (i.e. `jsonwebtoken` RS256 *signing*, or a
direct `RsaPrivateKey::{sign,decrypt}`) — switch such a path to `ring`
or `aws-lc-rs` instead.
""" },

    # NOTE (2026-06-02): the four rustls-webpki 0.101/0.102 exemptions
    # (RUSTSEC-2026-0098/0099/0104/0049) were REMOVED. They covered the
    # aws-smithy-http-client `legacy-rustls` chain (rustls 0.21 + rustls-webpki
    # 0.101). aws-sdk-s3 is now pinned `default-features = false` WITHOUT its
    # default `rustls` feature, so it uses only the modern `default-https-client`
    # TLS stack (rustls 0.23 + rustls-webpki 0.103 + aws-lc-rs). rustls 0.21 and
    # rustls-webpki 0.101/0.102 are no longer in the tree, so the advisories no
    # longer apply and the exemptions are unnecessary. See controller/Cargo.toml
    # + talos-audit-ledger/Cargo.toml.

    # --- Unmaintained crates (supply-chain risk, no current exploit) ---

    { id = "RUSTSEC-2024-0384", reason = """
`instant` is unmaintained. Pulled transitively. Provides Wasm-compatible
Instant; replacement `web-time` exists but upstream adoption is
gradual. No security issue — maintenance flag. Re-review 2026-Q3.
""" },

    { id = "RUSTSEC-2024-0436", reason = """
`paste` is unmaintained but still functional. Widely-used proc-macro
for identifier concatenation; no known vuln. Maintenance flag only.
Tracking: no single obvious replacement yet; many crates use it.
""" },

    { id = "RUSTSEC-2025-0012", reason = """
`backoff` is unmaintained. Pulled transitively for exponential-backoff
retries. No vulnerability — maintenance flag. Replacement target when
retry code is next touched: `backon` or `tokio-retry`.
""" },

    { id = "RUSTSEC-2025-0134", reason = """
`rustls-pemfile` is unmaintained — functionality has moved into
`rustls-pki-types` 1.9+. Pulled by `neo4rs` (Bolt TLS) and
`rustls-native-certs`. No vulnerability — maintenance flag. Will
drop automatically when upstream consumers migrate to the new API.
""" },

    { id = "RUSTSEC-2026-0249", reason = """
`smartstring` is unmaintained. Advisory published 2026-08-10/11; it
turned CI red on main at an UNCHANGED sha (1f5eefe passed 08-10 13:40Z,
failed 08-11 08:10Z), so this is a new advisory against an existing
dependency, not a new dependency.

Pulled by: `rhai` 1.24 only (`cargo tree -i smartstring` → a single
edge). rhai is our expression sandbox — `verdict_expr`, `skip_condition`
and dispatch expressions, the one engine required by structural check 63.

No escape hatch exists, verified rather than assumed:
  * NOT optional — `[dependencies.smartstring]` in rhai's manifest has no
    `optional = true` and no feature gate; rhai's own `std` feature
    requires `smartstring/std`.
  * Upgrading does NOT help — rhai 1.25.1 (tested by resolving to it)
    still depends on smartstring 1.0.1.

No vulnerability — maintenance flag only (cargo-deny reports it as
`error[unmaintained]`). The residual risk is the absence of FUTURE
patches, not a present defect.

The only real fixes are upstream rhai moving off smartstring, or Talos
dropping rhai — the latter is an architectural change to the expression
sandbox, deliberately not undertaken to clear a maintenance flag.
Re-review 2026-Q4, or sooner if rhai publishes a release that drops it.
""" },

    # --- Unsound, but unreachable given our key types ---

    { id = "RUSTSEC-2026-0253", reason = """
`lru` `LruCache::pop()` is not panic-safe: if a stored KEY's `Drop`
panics during `pop()`, `detach()` is skipped and a dangling pointer
stays linked in the internal list, so a later eviction writes to freed
memory (CWE-416 / CWE-415).

Reachability — the trigger is specifically a panicking `Drop` ON THE
KEY, so the key TYPE decides it. Every path in this tree stores keys
that cannot panic on drop:
  * talos-audit-ledger/src/lib.rs:293 — our ONLY direct use —
    `LruCache<Uuid, SdkTracerProvider>`. `Uuid` is `Copy` with a
    trivial drop.
  * async-graphql 7.2.1 — `LruCache<String, ExecutableDocument>`
    (persisted queries) and a generic dataloader cache whose keys in
    Talos are `Uuid`/`String`. `String`'s drop frees a buffer; it does
    not panic.
  * aws-sdk-s3 1.119 (via lru 0.12.5) — internal endpoint cache,
    string-keyed.
A panicking `Drop` on a key is not something Talos can introduce
accidentally: it would require writing a custom key type with a
panicking `Drop` impl. If a future cache does that, this exemption is
void — that is the condition to re-check, not the version number.

Why not simply upgrade: the fix is lru >=0.18.2, but the affected
versions are pinned by two INDEPENDENT upstreams we do not control —
`async-graphql` 7.2.1 requires `^0.16.2` and `aws-sdk-s3` 1.119 pulls
0.12.5. Bumping our own declarations cannot remove either, so it would
add a THIRD lru version to the tree without clearing the advisory.

Done anyway as defence in depth: `controller`'s `lru` declaration was
removed outright — it had ZERO usages (vestigial after the workspace
decomposition), so the crate no longer links lru at all.

Re-review 2026-Q4, or when async-graphql/aws-sdk-s3 ship releases on
lru >=0.18.2 — at which point this entry should be DELETED, not bumped.
""" },

    # --- Unmaintained, build-time only, and introduced DELIBERATELY ---

    { id = "RUSTSEC-2026-0173", reason = """
`proc-macro-error2` is unmaintained. Both it and the `proc-macro-error` it
forked are now flagged (RUSTSEC-2024-0370).

UNLIKE EVERY OTHER ENTRY IN THIS FILE, WE INTRODUCED THIS ONE. The others are
advisories published against dependencies we already had; this arrived because
2026-08-17 added `age` for client-side encryption of off-host backups. Saying
so matters — an exemption for a cost you chose deserves a different level of
scrutiny than one for a cost that landed on you.

Pulled by exactly one edge:
  proc-macro-error2 <- i18n-embed-fl (proc-macro) <- age 0.11 <- talos-offhost-backup

BUILD-TIME ONLY. `i18n-embed-fl` is a proc-macro crate — it runs in the
compiler and is never linked into any shipped binary. The exposure is to the
build host, not to the worker, the controller, or anything an attacker can
reach at runtime.

NOT REMOVABLE WHILE USING `age`, checked rather than assumed:
  * `i18n-embed-fl` is an UNCONDITIONAL dependency in age's manifest — no
    `optional = true`, no feature gate. It localises age's own error strings.
  * We already declare `age = "0.11"` with default features `[]`; there is no
    feature left to turn off.
  * The alternatives are worse. The age CLI cannot do unattended encryption at
    all (it reads its passphrase from `/dev/tty` and fails `ENOTTY` on a pipe,
    with no `--passphrase-file` and no env var). Hand-rolling scrypt +
    ChaCha20-Poly1305 is not on the table. Dropping client-side encryption
    entirely would publish the plaintext columns a `pg_dump` carries —
    workflow names, module source, `graph_json` — to the storage provider.

No vulnerability: RUSTSEC-2026-0173 is a maintenance flag. The residual risk is
the absence of FUTURE patches for a proc-macro that expands attribute macros at
compile time.

Tracking: `age` moving off the fluent/i18n stack, or `i18n-embed-fl` dropping
`proc-macro-error2`. Re-review 2026-Q4 — and if `age` is ever removed from this
workspace, DELETE this entry rather than leaving it to rot.

NOTE ON WHY THIS REACHED CI RATHER THAN `make lint`: the local gate runs
`cargo deny check bans licenses sources` and deliberately omits `advisories`
(they need network); the advisory scan is CI-only plus the env-gated
`make audit`. So an advisory introduced by a NEW dependency is structurally
invisible locally. Run `cargo deny --all-features check advisories` by hand
when adding a dependency — that is the only pre-CI signal for this class.
""" },

]

# ============================================================================
# Licenses — only permissive OSI licenses allowed.
# ============================================================================
[licenses]
version = 2
# SPDX IDs ONLY. cargo-deny will fail if a crate has no license metadata
# rather than silently skipping — intentional.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Unicode-3.0 supersedes Unicode-DFS-2016; unicode-ident 1.0.14+ uses
    # the new SPDX ID. Kept only 3.0 to surface any crate still stamping
    # the old license header.
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # CDLA-Permissive-2.0: Mozilla's license for the root-CA data set in
    # `webpki-roots`. It's a permissive data-sharing license (functionally
    # equivalent to MIT for our purposes — no copyleft, no patent trap).
    # See https://cdla.dev/permissive-2-0/.
    "CDLA-Permissive-2.0",
    # MPL-2.0 is a weak copyleft — file-level. Acceptable for us because
    # we don't modify MPL-licensed source; distributing binaries that
    # merely link to MPL code is fine. Document any MPL crate in the
    # third-party notices file.
    "MPL-2.0",
]
# Confidence threshold for license detection — bump to 0.93 so heuristic
# matches are rare. Known crates (in-tree workspace members) always
# match cleanly.
confidence-threshold = 0.93
exceptions = [
    # Per-crate license exemptions go here with justification, e.g.:
    # { allow = ["OpenSSL"], name = "ring", version = "*" },
]

# ============================================================================
# Bans — specific crate bans, duplicate-version policy, unmaintained gate.
# ============================================================================
[bans]
# `deny` fails the build. `warn` surfaces in output but doesn't block.
multiple-versions = "warn"  # bump to "deny" once the transitive-dep tree is cleaner
wildcards = "deny"          # any `crate = "*"` dep is a supply-chain footgun
# Exempt `path = "../..."` deps from the wildcard ban — in-tree workspace
# crates resolve via filesystem paths, not versions, and don't create
# the "version drift" risk the wildcard ban is targeting.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Explicit crate denials — crates we'll NEVER accept as direct or
# transitive deps. Kept small and specific; every entry has a reason.
deny = [
    # `openssl-src` bundles a vendored OpenSSL — rustls is our TLS stack,
    # pulling in openssl-src means someone in the dep tree is using
    # native-tls at build time, which is a security regression.
    { name = "openssl-src", reason = "prefer rustls — vendored OpenSSL expands attack surface" },
]
# NOTE on `native-tls`: the ideal policy is a hard deny (rustls is our
# TLS standard for every direct call). In practice, `oci-distribution`
# 0.11 and `opentelemetry-otlp` 0.27's `reqwest-client` feature pull
# native-tls transitively through reqwest's defaults — neither crate
# currently offers a `rustls-only` feature. Our controller + worker
# EXPLICITLY disable reqwest default features + enable only rustls-tls
# for our direct HTTP calls, so the native-tls code path is only hit
# by OCI registry fetches (our internal registry — trust boundary) and
# OTLP export (our OTLP collector — trust boundary). Both endpoints
# are operator-controlled, not attacker-controlled.
# Tracking upstream:
#   - oci-distribution: https://github.com/oras-project/rust-oci-client/issues (rustls feature)
#   - opentelemetry-rust: rustls support via default-features = false
# Revisit the ban once either ships a rustls-only path.

# Skip duplicate-version warnings for crates that are KNOWN to have
# legitimate multi-version transitive roots (the Rust ecosystem's
# long-tail of rand/syn/windows-sys migrations). Kept empty initially;
# fill in after the first `cargo deny check bans` run.
skip = []
skip-tree = []

# ============================================================================
# Sources — only crates.io + the sibling talos-workflow-engine workspace.
# ============================================================================
[sources]
# Unknown registries are blocked — a poisoned fork published to a custom
# registry can't sneak in even if someone accidentally adds it.
unknown-registry = "deny"
# Local paths / git sources must be explicitly listed below.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# `path = "../talos-workflow-engine/..."` deps are in-tree sibling
# workspace members; cargo-deny categorizes them as "unknown-git"
# when they resolve via path. Allow them explicitly so we don't have
# to blanket `unknown-git = "allow"`.
[sources.allow-org]
# No GitHub orgs whitelisted — if we ever need `git = "https://github.com/foo/bar"`
# deps, add the org here and explain why.
github = []
gitlab = []
bitbucket = []
