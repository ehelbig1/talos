[package]
name = "talos-rate-limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
axum = { workspace = true, features = ["json"] }
governor.workspace = true
ipnetwork.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
talos-redis = { path = "../talos-redis" }
talos-config = { path = "../talos-config" }
talos-metrics = { path = "../talos-metrics" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# F4: the production governor layer keys on the trusted-proxy-resolved client
# IP via `governor_key::TrustedProxyClientIpKeyExtractor`. `tracing` is forced
# on so the `KeyExtractor::{name,key_name}` impls are unconditional — cargo
# unifies features workspace-wide, so this cannot flip underneath the impl.
tower_governor = { workspace = true, features = ["tracing"] }

[lints]
workspace = true
