# Talos — crypto-invariant alert rules.
#
# Designed for Prometheus / Alertmanager. Alerts in this file MUST page
# operator attention — every one of them means either:
#   (a) encrypted-at-rest data is currently unreadable, or
#   (b) encrypted-at-rest data will be unreadable on the next restart.
#
# Series come from:
#   - talos-controller /metrics/prometheus (bearer PROMETHEUS_SCRAPE_TOKEN)
#   - vault /v1/sys/metrics?format=prometheus
#
# Apply to Prometheus via:
#   prometheus --config.file=... --rules.file=alerts.yaml
# or (kube-prometheus-stack):
#   kubectl -n monitoring create configmap talos-alerts --from-file=alerts.yaml
#   then reference it from a PrometheusRule CRD.
#
# ===========================================================================
# ABSENCE AUDIT, 2026-08-02 — every rule in this file was re-examined
# ===========================================================================
#
# In PromQL an ABSENT series and a series reading 0 are different, and every
# idiom used here (`== 0`, `< N`, `> N`, `rate(...) == 0`, `a / b`) treats
# absence as "no match". A detector can therefore be silenced by exactly the
# condition it detects. ONE rule in this file had that shape and is fixed:
# `TalosBackupRestoreDrillFailed`, where a drill that had NEVER run made "no
# successful drill in 14+ days" unfireable. Its sibling in the dev rules is
# `NoWASMExecutions` (observability/rules/alerts.yml); read that file's header for
# the full statement of the class.
#
# Every other rule here was left alone deliberately. Three categorical
# reasons, so they are not restated per rule:
#
#   1. THE SERIES CANNOT BE ABSENT. A non-`Vec` prometheus `Counter` or
#      `IntGauge` is exported from the moment it is registered, so the
#      orphan gauges, pool gauges, DEK-cache gauge, build-skew gauge and the
#      plain start-row/TOFU counters always have a sample. `up` is
#      synthesised for every configured target.
#   2. THE SERIES CAN BE ABSENT AND THAT IS THE HEALTHY STATE. The alerted
#      `CounterVec`s (`talos_kek_decrypt_failures_total`,
#      `talos_memory_write_failures_total`,
#      `talos_module_payload_encryption_failures_total`,
#      `talos_auth_*`) are all `> threshold` shapes: no failures, no series,
#      no alert — correct. These are additionally pre-seeded at 0 in
#      talos-metrics as of this change, so a dashboard can now distinguish
#      "detector present and quiet" from "detector deleted" — but note that
#      the seed proves REGISTRATION, not that the incrementing call site
#      still exists. Check 58 and the per-metric unit tests are what guard
#      the call site.
#   3. THE SERIES ISN'T OURS. `vault_*` and `kube_*` come from Vault and
#      kube-state-metrics; their absence means "not deployed / not
#      installed", a topology fact rather than an outage. An `absent()` arm
#      on those would page `critical` forever on every cluster that
#      legitimately does not run them. Marked at each site.
#
# The rule of thumb this leaves: add an `absent()` arm when the missing
# series is one TALOS ITSELF is supposed to produce, and never when its
# absence is a legitimate deployment choice. Keep the severity the arm
# stands in for.
groups:
  # ────────────────────────────────────────────────────────────────────
  - name: talos.crypto.invariants
    interval: 30s
    rules:

      # ── DEK orphan gauges — value > 0 means data loss already occurred.
      # These gauges are computed by a 60s background loop in controller
      # main.rs (SELECT COUNT(*) with NOT EXISTS) so we scrape the DB
      # only indirectly. Paging threshold: ANY non-zero value for 5m.
      - alert: TalosActorMemoryDEKOrphaned
        expr: talos_actor_memory_orphaned_rows > 0
        for: 5m
        labels:
          severity: critical
          category: data-loss
          runbook: https://github.com/OWNER/talos/blob/main/docs/security/operational-runbook.md#dek-orphan
        annotations:
          summary: "{{ $value }} actor_memory row(s) reference a missing DEK"
          description: |
            actor_memory.value_key_id points at an encryption_keys row that
            no longer exists. This should be structurally impossible under
            the ON DELETE RESTRICT FK — investigate for:
              - partial DB restore (pg_restore without encryption_keys)
              - manual DEK deletion with FK triggers disabled
              - Vault master-key rotation without DEK rewrap
            Affected rows are UNRECOVERABLE. Do not delete them without
            a decision to abandon their payloads.
          action: |
            1. kubectl -n talos exec deploy/talos-controller -- \
                 psql $DATABASE_URL -c "SELECT id, actor_id, key, created_at \
                   FROM actor_memory am \
                   WHERE NOT EXISTS ( \
                     SELECT 1 FROM encryption_keys ek WHERE ek.id = am.value_key_id \
                   );"
            2. Decide: delete orphans, or hold for forensic dump before delete.
            3. Follow docs/security/operational-runbook.md § DEK orphan.

      - alert: TalosModuleExecutionPayloadOrphaned
        expr: talos_module_execution_orphaned_rows > 0
        for: 5m
        labels:
          severity: critical
          category: data-loss
        annotations:
          summary: "{{ $value }} module_executions row(s) reference a missing DEK"
          description: |
            module_executions.payload_enc_key_id FK broken. Execution
            metadata survives; input/output/trigger_metadata_enc are
            unrecoverable. NULL the _enc columns once a decision is
            made — see 2026-04-24 cleanup precedent.

      - alert: TalosWorkflowOutputPayloadOrphaned
        expr: talos_workflow_execution_orphaned_rows > 0
        for: 5m
        labels:
          severity: critical
          category: data-loss
        annotations:
          summary: "{{ $value }} workflow_executions row(s) reference a missing DEK"
          description: |
            workflow_executions.output_enc_key_id FK broken. Output data
            unrecoverable.

      # ── KEK decrypt failures — rate > 0 means current write path is
      # broken. "both" means EVERY CONFIGURED provider failed, so the read
      # is terminally broken; it is emitted when active+legacy both fail AND
      # (since 2026-07-31) when the active provider fails with no legacy
      # wired at all. That second arm is the difference between this alert
      # being fireable and being decorative on the two supported no-legacy
      # postures — KEK_PROVIDER=env (legacy hardcoded None) and
      # KEK_PROVIDER=vault + KEK_DISABLE_LEGACY=true, the documented Phase-5
      # end state. Before it, a total KEK outage on those postures surfaced
      # ONLY on the warning-level Active alert below, whose own summary
      # claims a legacy fallback is carrying the load that does not exist.
      - alert: TalosKEKDecryptFailuresBoth
        expr: rate(talos_kek_decrypt_failures_total{provider="both"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "KEK decrypt failing on EVERY configured provider"
          description: |
            No configured KEK provider could unwrap a DEK — the active one
            (Vault transit or env) failed and either the legacy fallback
            failed too or no legacy is wired. Encrypted-at-rest reads are
            currently failing. Most common cause: Vault's transit key was
            rotated/deleted without rewrapping DEKs, and the env KEK master
            key doesn't match either (or there is no env KEK to fall back
            to, because KEK_DISABLE_LEGACY=true).
          action: |
            1. Check Vault transit key version: `vault read transit/keys/talos-kek`
            2. Check controller KEK_PROVIDER env: matches Vault or env?
            3. Review `docs/security/kek-to-kms-plan.md` § recovery.
            4. If Vault is unreachable, failing over to KEK_PROVIDER=env
               works iff TALOS_MASTER_KEY is the key the DEKs were
               originally wrapped with.

      - alert: TalosKEKDecryptFailuresActive
        expr: rate(talos_kek_decrypt_failures_total{provider="active"}[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          category: crypto-degraded
        annotations:
          summary: "KEK active-provider decrypt failing"
          description: |
            The active KEK provider is failing decryption. If a legacy
            provider is wired it is carrying the load — survivable short
            term, critical once legacy goes too. If no legacy is wired
            (KEK_PROVIDER=env, or vault with KEK_DISABLE_LEGACY=true) then
            reads are ALREADY failing and TalosKEKDecryptFailuresBoth is
            firing alongside this one; treat that pair as the critical case.
            Often means a misconfigured Vault token or network partition.

      # ── memory-write failures — node outputs are being lost.
      - alert: TalosMemoryWriteFailuresCrypto
        expr: rate(talos_memory_write_failures_total{reason="crypto"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "__memory_write__ persist failing due to crypto errors"
          description: |
            Node outputs returning `__memory_write__` are being silently
            dropped because the encryption path is broken. Every dropped
            write loses actor state. Historically this fires when the
            Vault KEK can't be reached — see the 2026-04-24 `-dev` mode
            persistence bug for the canonical pattern.

      - alert: TalosMemoryWriteFailuresDB
        expr: rate(talos_memory_write_failures_total{reason="db"}[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: persistence-degraded
        annotations:
          summary: "__memory_write__ DB errors sustained"
          description: |
            Memory writes failing at the DB layer at {{ $value }} per second.
            Common causes: pool saturation, statement timeout, migration
            lock. Check controller DB pool metrics and Postgres load.

      # ── Module-execution payload encryption failures.
      - alert: TalosModulePayloadEncryptionFailures
        expr: rate(talos_module_payload_encryption_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "module_executions payload encryption/decryption failing"
          description: |
            op={{ $labels.op }} stage={{ $labels.stage }} rate={{ $value }}/s.
            Input/output/trigger_metadata payloads are either not being
            encrypted on write or not being decrypted on read.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.reliability
    interval: 30s
    rules:

      # ── Workflow-execution failure rate — closes the detect→NOTIFY loop.
      # get_health_dashboard / the operator digest already SHOW
      # failure_rate_24h_pct, but nothing PUSHED an alert; a sustained
      # outage (e.g. the 2026-07-23 worker-DNS incident that failed ~125
      # scheduled runs) went unpaged. Fires on the ratio of terminal
      # failures to all terminal executions over 15m. Both series are
      # pre-seeded at 0 (talos_metrics::TalosMetrics::new) so the ratio is
      # well-defined in steady state; the >0.05 denominator guard avoids
      # dividing a handful of executions into a scary percentage on a quiet
      # cluster.
      - alert: TalosWorkflowFailureRateHigh
        expr: |
          (
            sum(rate(talos_workflow_executions_total{status="failure"}[15m]))
            /
            clamp_min(sum(rate(talos_workflow_executions_total[15m])), 0.001)
          ) > 0.25
          and
          sum(rate(talos_workflow_executions_total[15m])) > 0.005
        for: 10m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Workflow failure rate above 25% (sustained 10m)"
          description: |
            {{ $value | humanizePercentage }} of terminal workflow executions
            are failing over the last 15m. This is the push-alert companion to
            the get_health_dashboard `failure_rate_24h_pct` / operator-digest
            `reliability` signals. Common causes: a sustained upstream/egress
            outage (worker DNS or a third-party API down — the per-host circuit
            breaker should be fast-failing those), a bad deploy, or a
            provider-credential expiry. Check top_failures_24h via
            get_error_report (no workflow_id → platform-wide rollup) and
            tail_worker_logs on a recent failed execution for the node-level
            cause.

      # ── The boot herd: every deploy failing every due schedule.
      # Grounded 2026-08-10. The controller starts, its scheduler's first
      # poll fires ~1.7s later, and EVERY schedule that came due while the
      # process was down is dispatched at once. That boot released 15
      # executions within 20ms; their WASM jobs opened ~16 simultaneous TLS
      # connects to gmail.googleapis.com / www.googleapis.com, the connects
      # started failing, five consecutive failures tripped the WORKER's
      # per-host circuit breaker, and the remaining workflows then failed
      # instantly against an OPEN breaker. 8 of 19 runs failed; three more
      # were refused by the actor-budget backstop the burst had exhausted,
      # two of them DAILY crons (so "the next occurrence will retry" meant
      # tomorrow). Gmail itself was healthy throughout — it returned HTTP 200
      # sixteen seconds before the first failure. Everything recovered on its
      # own within a minute and NOTHING ALERTED, which is why it survived
      # repeated deploys: the platform looks fine by the time anyone looks.
      #
      # Why phase= exists at all: a startup-window failure and a steady-state
      # failure have completely different causes, and pooling them buries a
      # defect that fires on EVERY deploy inside TalosWorkflowFailureRateHigh's
      # background rate — 8 failures against a day of traffic never reaches a
      # 25% ratio over 15m. This alert is deliberately absolute (`> 0`) rather
      # than a rate, because the correct number of startup-phase failures is
      # zero: the backlog now drains under a tighter concurrency ceiling
      # (SCHEDULER_STARTUP_MAX_CONCURRENT, default 4) behind a fleet-readiness
      # barrier. If this fires, that ceiling was NOT enough — which is a real
      # possibility worth stating, since capping concurrent *executions* does
      # not hard-cap concurrent outbound *connections* (one execution can fan
      # out across loop iterations and pipeline steps). This alert is how that
      # is discovered, rather than the ceiling being assumed sufficient.
      #
      # outcome="skipped" is included on purpose: a run refused by the actor
      # budget is not a soft outcome, it is a lost run. Split by outcome so
      # "the herd still fails" and "the herd still starves the budget" arrive
      # as distinguishable alerts.
      #
      # All six talos_scheduler_dispatches_total series are pre-seeded to 0 at
      # registration, so `increase(...) > 0` is well-defined from the first
      # scrape. Without that seeding this detector would be silenced by
      # exactly the condition it detects — an absent counter matches nothing,
      # so a controller whose scheduler never dispatched anything would look
      # identical to one dispatching cleanly (#625).
      - alert: TalosSchedulerStartupHerdNotAbsorbed
        expr: |
          sum by (outcome) (
            increase(talos_scheduler_dispatches_total{phase="startup",outcome=~"failed|skipped"}[30m])
          ) > 0
        for: 0m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Startup schedule backlog not absorbed ({{ $value }} {{ $labels.outcome }})"
          description: |
            {{ $value }} scheduled workflow run(s) from the STARTUP BACKLOG —
            the schedules that came due while the controller was restarting —
            ended `{{ $labels.outcome }}`. The startup concurrency ceiling and
            the fleet-readiness barrier are supposed to make this zero on every
            deploy.

            outcome="failed": the backlog still overwhelmed something. The
            signature to look for is the worker's per-host circuit breaker
            opening — grep the worker log for "Circuit breaker opened" and
            "outbound HTTP request failed (sanitized transport detail)". Note
            the breaker lives in the WORKER process and is invisible to the
            controller, so the controller-side error text ("circuit open for
            host X") is a CONSEQUENCE reported minutes into the incident, not
            its cause.

            outcome="skipped": the burst exhausted an actor's per-minute
            execution budget and runs were refused outright. For a daily cron
            that means the run is lost until tomorrow, not retried shortly.
          action: |
            1. Correlate: `talos_scheduler_dispatches_total{phase="startup"}`
               against the controller log line
               `event_kind="scheduler_startup_backlog"`, which records how many
               schedules the boot backlog contained.
            2. If the backlog is large, lower SCHEDULER_STARTUP_MAX_CONCURRENT
               (default 4). Do NOT raise SCHEDULER_MAX_CONCURRENT_EXECUTIONS —
               that is the steady-state ceiling and raising it makes the burst
               worse.
            3. If outcome="skipped" dominates, the actor's per-minute budget is
               the binding constraint rather than egress; raise the budget or
               stagger the cron expressions so fewer schedules share a boot.

      # ── The scheduler is running but dispatching NOTHING.
      # The fleet-readiness barrier refuses to dispatch while the controller's
      # NATS heartbeat view contains no live worker — dispatching into an
      # invisible fleet is what produced the herd above. A hold is safe and
      # lossless (no schedule state is advanced, so everything still fires
      # once a worker appears) and a couple of holds at boot are NORMAL: a
      # worker that booted before the controller subscribed loses its first
      # heartbeat outright, because NATS core delivery is not retained.
      #
      # SUSTAINED holding is a different thing entirely: it means no scheduled
      # work is running at all, silently, while the controller is up and
      # healthy by every other measure. TalosWorkerDown covers the worker's own
      # absence; this covers the consequence that actually costs the user
      # something. Threshold ~10 holds ≈ 2.5 minutes of continuous holding at
      # the 15s poll interval, so a normal boot cannot reach it.
      - alert: TalosSchedulerDispatchHeldNoFleet
        expr: increase(talos_scheduler_readiness_holds_total[15m]) > 10
        for: 0m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Scheduler is holding all dispatch — no worker visible in the fleet view"
          description: |
            The scheduler has held {{ $value }} poll iterations in the last 15m
            because `talos_worker_fleet::WorkerManager` reports zero live
            workers. No scheduled workflow is running right now.

            Nothing is being LOST — a held poll never opens its transaction, so
            `next_trigger_at` is not advanced and every due schedule fires as
            soon as a worker becomes visible. But nothing is running either.

            This alert is deliberately tuned to fire BEFORE the barrier gives
            up (10 holds ≈ 2.5m, give-up at 20 ≈ 5m), so an operator hears
            about it while the guarantee is still in force rather than after it
            has been dropped. If it is ignored, TalosSchedulerReadinessDegraded
            follows.

            Note this reads the in-process heartbeat view, not the
            `talos_worker_fleet_live_workers` gauge, which is republished on a
            60s sweep and therefore lags. A disagreement between the two for
            under a minute is expected.
          action: |
            1. Are worker pods running at all? Check TalosWorkerDown.
            2. If workers ARE running, they are not reaching
               `talos.workers.heartbeat.>` — check NATS connectivity from the
               worker and whether TALOS_WORKER_HEARTBEAT_INTERVAL_SECS is 0,
               which disables heartbeat publishing entirely (a supported
               configuration, but one this barrier cannot see through).

      # ── The barrier gave up. Schedules run, the guarantee does not.
      # A zero fleet view is AMBIGUOUS — empty fleet, a build too old to
      # publish heartbeats, a broken subscription, or heartbeats disabled via
      # TALOS_WORKER_HEARTBEAT_INTERVAL_SECS=0 all read identically. So the
      # barrier degrades after a bounded number of holds instead of refusing
      # forever: refusing forever would silently stop every scheduled workflow
      # on a healthy fleet, which is a worse failure than the herd the barrier
      # prevents. This alert is the price of that safety valve being honest —
      # it says the valve opened.
      #
      # Level alert on a pre-seeded gauge (0 at registration), so `== 1` is
      # well-defined from the first scrape rather than depending on a
      # transition being observed.
      - alert: TalosSchedulerReadinessDegraded
        expr: talos_scheduler_readiness_degraded == 1
        for: 5m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Scheduler is dispatching without fleet-readiness evidence"
          description: |
            The scheduler waited for a worker heartbeat, never saw one, and has
            given up waiting. Scheduled workflows ARE running — nothing is
            blocked and nothing was lost — but they are being dispatched
            without any evidence that a worker is there to run them, which is
            the condition that produced the 2026-08-10 boot herd.

            The latch does not clear on its own; it is reset by a controller
            restart once heartbeats are actually flowing.
          action: |
            1. Confirm whether heartbeats are disabled on purpose
               (TALOS_WORKER_HEARTBEAT_INTERVAL_SECS=0 on the worker). If they
               are, this alert is expected for this deployment and the startup
               ceiling is the only herd protection in force.
            2. Otherwise treat it as TalosSchedulerDispatchHeldNoFleet that was
               not acted on: the worker is not reaching
               `talos.workers.heartbeat.>`.

      # ── WASM log lines that reached no execution row.
      # Reachability: this series is produced by the controller's `wasm.log.*`
      # NATS subscriber, which is only spawned when a NATS client exists. NATS
      # is mandatory for job dispatch, so on any functioning deployment it is
      # live; on a NATS-less one there are no WASM executions to log either.
      # #618 added the `wasm_log_orphaned` WARN as the detector for a whole bug
      # family (a dispatch path minting an execution id without recording a
      # row, so every log line it publishes is silently discarded and
      # get_execution_logs returns [] — byte-identical to an execution that
      # genuinely logged nothing). #619 closed the family's live instances. But
      # the detector was a LOG LINE, and every alert in this file is
      # metric-based, so nothing could page on it. This is that alert.
      #
      # `kind` is a closed set of two values, both emitted by
      # controller/src/bootstrap/background.rs::handle_wasm_log_message:
      #   no_execution_row — the id parsed but names neither a
      #                      workflow_executions nor a module_executions row.
      #   unparseable_id   — the published line carried no usable execution id.
      # Deliberately unfiltered here so a NEW kind (should one ever be added)
      # cannot slip past the alert by not matching a selector.
      #
      # WARNING, not critical, and `for: 0m`. Expected rate is zero on routine
      # traffic (#619 verified zero over a live deploy window), so any hit is
      # worth a look immediately. At least one deliberate residual producer is
      # KNOWN — `record_started` failing is non-fatal by design, so a DB blip
      # during a node dispatch legitimately orphans that node's lines — and that
      # is a known-causes list, not a proof of completeness: the same list in the
      # code has gone stale twice already, which is why the alert stays `> 0`
      # rather than being tuned around an assumed floor. Volume is bounded by the
      # worker's per-execution log budget
      # (MAX_LOG_MESSAGES_PER_EXECUTION / HOST_DIAG_CAP), not unbounded.
      - alert: TalosWasmLogsOrphaned
        expr: increase(talos_wasm_log_orphaned_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "WASM log lines discarded (kind={{ $labels.kind }})"
          description: |
            {{ $value }} WASM log line(s) in the last 15m could not be routed to
            any execution row and were DISCARDED — get_execution_logs will
            return [] for those executions, indistinguishable from an execution
            that logged nothing.
            kind=no_execution_row: a dispatch path published under an id with no
            execution row. First check whether
            talos_module_execution_record_started_failures_total moved in the
            same window — that is the one KNOWN benign cause (a DB blip on a
            non-fatal start-row write). If it did not, assume a NEW dispatch path
            is minting ids without recording rows: grep the controller log for
            event_kind="wasm_log_orphaned" and fix the producer. Treat "the one
            known cause" as a SNAPSHOT, not an inventory — the equivalent list in
            the code has already gone stale twice; the live enumeration is the
            comment at the warn site in
            controller/src/bootstrap/background.rs, and the warn itself outranks
            both.
            kind=unparseable_id: a publisher is emitting malformed
            execution_ids; grep event_kind="wasm_log_unparseable_execution_id".

      # ── module_executions start rows that never landed.
      # The upstream CAUSE of the orphan alert above, and independently a
      # correctness problem of its own: record_started's Err is non-fatal at
      # every caller (the engine logs and dispatches anyway), so the execution
      # runs while its row is missing and get_execution_logs / get_node_io /
      # cost attribution all quietly under-report.
      #
      # WHAT `for: 5m` ACTUALLY DOES HERE — say it precisely, because the
      # obvious reading is wrong. It does NOT mean "one transient failure will
      # not page". `increase(...[15m])` stays positive for the whole 15m window
      # after a SINGLE increment, which trivially outlasts a 5m `for`, so one
      # transient acquire timeout still fires — just 5 minutes later. A `for`
      # shorter than the range window can only delay a page, never suppress a
      # one-off; suppressing one-offs needs a THRESHOLD on the value (compare
      # TalosMemoryWriteFailuresDB's `rate(...) > 0.1` in this file), not a
      # `for`. That is deliberate here: one lost start row is silent data loss
      # worth knowing about, and its downstream twin TalosWasmLogsOrphaned pages
      # at `for: 0m` on the same event anyway — a threshold here would only make
      # the pair disagree. The 5m buys exactly one thing: the series must stay
      # positive across ~10 evaluations, which rides out a counter reset or a
      # single-scrape gap that briefly lifts increase() off zero.
      - alert: TalosModuleExecutionStartRowFailures
        expr: increase(talos_module_execution_record_started_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "module_executions start rows failing to persist"
          description: |
            {{ $value }} module_executions start-row write(s) failed in the last
            15m at PostgresModuleExecutionStore::record_started. The affected
            executions still RAN — they just have no row, so their WASM logs
            orphan (expect TalosWasmLogsOrphaned alongside this) and their
            input payloads, timings and cost attribution are missing.
            Two failure edges: DEK/payload encryption (check the KEK alerts and
            Vault) and the INSERT itself (check the DB-pool saturation alerts).
            The per-failure detail is in the controller log at the calling site.

  # ────────────────────────────────────────────────────────────────────
  # WORM audit-ledger integrity. Two independent verification layers, one
  # series: `stage=event` is the inline per-message check at ingest (the
  # message is quarantined and never persisted); `stage=chain` is the offline
  # hash-chain sweep over a completed execution's full ordered record set.
  # Both were ERROR logs with no metric.
  - name: talos.audit
    interval: 30s
    rules:
      # CRITICAL with `for: 0m` because the expected steady-state background is
      # ZERO: the ledger REJECTS a failing event rather than persisting it, so a
      # non-zero value is evidence of a real integrity break, not a threshold
      # judgement. A week unnoticed means the compliance artifact is void for the
      # affected executions AND the correlation window (who had access, what else
      # happened) has closed.
      #
      # "Expected zero" is NOT the same as "can only mean tampering", and the
      # runbook below must be read before anyone declares an incident. The event
      # hash is recomputed from the deserialized AuditEvent, so a controller and
      # worker on DIFFERENT BUILDS whose AuditEvent shape or hash input changed
      # produce stage="event" hash_mismatch (or event_deserialize_failed) on
      # EVERY event for the duration of the skew — a deploy-ordering fault
      # presenting as a fleet-wide tamper alarm. Check TalosWorkerBuildSkew and
      # the controller/worker image shas FIRST.
      #
      # Unfiltered on `stage` on purpose — both values are emitted
      # (talos-audit-ledger: verify_audit_message → stage="event",
      # record_chain_verification_outcome → stage="chain") and a future third
      # layer must not be able to hide behind a selector.
      #
      # NOTE what this does NOT cover: an execution whose chain cannot be READ
      # (S3/IO error) counts as `errored`, not a verification failure —
      # unreadable is not the same as tampered (#578). That population surfaces
      # in the audit_chain_sweep_summary log line, not here. Nor does the
      # operator's on-demand `verify_execution_chain_from_env` path count, so
      # re-checking a known-broken chain cannot re-page.
      #
      # stage="chain" is structurally silent on two postures — no S3/WORM
      # endpoint configured (the sweep self-disables) and
      # AUDIT_CHAIN_SWEEP_INTERVAL_SECS=0 (explicitly disabled). A flat 0 on
      # either means "never looked", not "verified clean". stage="event" has no
      # such gate: the ingest subscriber runs wherever NATS does.
      - alert: TalosAuditVerificationFailures
        expr: increase(talos_audit_verification_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          category: audit-integrity
        annotations:
          summary: "Audit ledger verification FAILED (stage={{ $labels.stage }})"
          description: |
            {{ $value }} audit verification failure(s) in the last 15m against
            the WORM audit ledger. Expected steady state is 0. Read the runbook
            below BEFORE calling it tampering — a fleet-wide burst is far more
            often a key-rotation or controller/worker build-skew fault, and both
            look identical to tampering from this number alone.
            stage=event: an inbound audit event failed its hash or HMAC check at
            ingest and was QUARANTINED (not persisted). Grep the controller log
            for event_kind="audit_event_verification_failed" — the `reason`
            field distinguishes hash_mismatch / bad_signature /
            event_deserialize_failed.
            stage=chain: a completed execution's full chain failed offline
            verification — a sequence gap (deleted or never-persisted events),
            broken previous_hash linkage (reorder/substitution), or a per-event
            HMAC failure. Grep event_kind="audit_chain_verification_failed" for
            the execution_id and the structured `breaks` list.
          action: |
            1. Treat the affected execution's audit record as UNTRUSTED; do not
               delete anything (the quarantined bytes are the evidence).
            2. Rule out the two MISCONFIGURATION shapes before treating this as
               tampering — both present as a broad, simultaneous burst rather
               than an isolated event:
               a. audit signing keys rotated without a matching verify-key roll
                  → bad_signature across many executions at once;
               b. controller and workers on different builds → hash_mismatch or
                  event_deserialize_failed on essentially every event. Check
                  TalosWorkerBuildSkew / get_platform_info.fleet.
               Tampering is the residual after both are excluded; a scattered
               handful of failures against a same-build fleet is the real shape.
            3. Check S3/MinIO Object Lock is still enforced on the audit bucket.

  # ────────────────────────────────────────────────────────────────────
  # Worker fleet identity + build agreement. Both series existed only as
  # controller log lines before 2026-08.
  #
  # POSTURE CAVEAT, stated because a flat 0 here is otherwise easy to misread
  # as "checked and clean": BOTH series are about REGISTERED workers, i.e. the
  # `worker_identities` table. A deployment that pins its fleet purely through
  # the controller's static `TALOS_WORKER_PUBLIC_KEYS` ring has no registration
  # endpoint at all (it is only mounted when TALOS_WORKER_REGISTRATION_TOKEN or
  # TALOS_WORKER_REG_REQUIRE_BOUND_TOKEN is set) and no rows, so both series sit
  # at 0 permanently — quiet because there is nothing to observe, not because
  # the fleet was verified. `get_platform_info.fleet` is the surface that shows
  # static-env workers; it does not merge them with registered ones, and neither
  # does this.
  - name: talos.fleet
    interval: 30s
    rules:
      # A worker_id presented a key that is NOT its bound trust-on-first-use
      # identity. Legitimate rotation goes through the register-worker-identity
      # operator CLI or a worker_id-bound provisioning token — neither of which
      # reaches this path — so a non-zero value is either in-fleet
      # impersonation or an operator working off the managed path. Both want a
      # human, hence `> 0` over a 1h window with no `for`.
      #
      # The counter is UNLABELLED and must stay that way: worker_id and the
      # submitted key are caller-supplied at a network endpoint, so labelling
      # by either would hand an attacker control of series cardinality. The
      # identifying detail is in the controller's talos_security log.
      - alert: TalosWorkerKeyTofuConflicts
        expr: increase(talos_worker_key_tofu_conflicts_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "Worker key registration refused — TOFU identity conflict"
          description: |
            {{ $value }} worker-key registration(s) in the last hour were
            refused because the presented key is not that worker_id's bound
            identity. The registration was REFUSED (409), so nothing was
            granted — but someone with a valid registration bearer token tried
            to bind a key they should not have.
            Grep the controller log for event_kind="worker_key_tofu_conflict"
            to get worker_id, the submitted public key, and the auth path. If
            it is a legitimate rotation, do it via the operator CLI. If it is
            not, the registration bearer token is compromised: rotate it and
            revoke outstanding provisioning tokens.

      # Controller↔worker build skew. A GAUGE, not a counter: the underlying
      # `worker_build_skew` WARN fires exactly once per worker at registration,
      # so `increase()` over it would page on EVERY rolling deploy and then go
      # SILENT while a fleet sat skewed — wrong at both ends. The gauge is
      # recomputed from a query each sweep, so it falls to 0 once the counted
      # population converges.
      #
      # READ "ACTIVE" NARROWLY — this is the one thing about this alert that is
      # easy to get wrong. The base population is rows in `worker_identities`
      # that have not been deactivated. It is NOT "processes currently running".
      # Two exclusions narrow it toward workers that plausibly ARE:
      #   * rows the worker-identity reaper has deactivated (they stop being
      #     active) — which is what finally lets this gauge DRAIN, and
      #   * rows that PROVED liveness and then went silent past
      #     TALOS_WORKER_IDENTITY_REAP_HOURS, so the gauge does not lag the
      #     reaper's sweep interval on a scale-down.
      #
      # Rows with NO liveness evidence (`last_liveness_at IS NULL` — every row
      # registered by a pre-liveness worker) STAY COUNTED, and the asymmetry is
      # deliberate: the reaper refuses to act on unknown liveness because
      # absence of evidence is not evidence of departure, but a DETECTOR must
      # not go quiet on that same uncertainty or a fleet running an entirely
      # pre-liveness build would silence the alert that exists to catch it.
      #
      # So on a pod-name-keyed fleet whose workers predate the liveness
      # protocol, this gauge STILL counts the ghosts each roll and scale-down
      # leaves behind, and still needs draining — either by rolling those
      # workers onto a build that pings (after which they reap normally) or by
      # an operator, via `deactivate-worker-identity` per key or by setting
      # TALOS_WORKER_IDENTITY_REAP_PRE_PROTOCOL_HOURS. Stable ids
      # (TALOS_WORKER_ID per replica) avoid accumulating them in the first
      # place. `last_seen_at` remains boot-registration-only and is NOT a
      # liveness signal — do not build an age filter on it.
      #
      # `for: 30m` outlasts any rolling deploy (workers re-register within
      # seconds of their pod starting) and catches the case the WARN cannot
      # express: a worker that is STILL skewed long after the deploy settled.
      #
      # Counts PROVEN skew only, per distinct worker_id (a worker mid-rotation
      # holds two rows). A worker that reports no usable commit sha is
      # "unverifiable" and is NOT counted — absence of evidence is not evidence
      # of skew (#578) — so a clean 0 here is not "everything checked out". Use
      # get_platform_info.fleet for the unverifiable population.
      # THE NATS FLEET HEARTBEAT CAN NARROW THIS, BUT ONLY ON AN OPERATOR'S
      # ASSERTION — and by default it does not, so nothing below changed for an
      # existing deployment.
      #
      # Since 2026-08 workers publish a signed heartbeat on
      # `talos.workers.heartbeat.<worker_id>`, giving the controller a live view
      # of which worker PROCESSES are running. It is tempting to intersect that
      # against this gauge's population and let a ghost row drop out
      # automatically. That is exactly what
      # TALOS_WORKER_FLEET_HEARTBEAT_AUTHORITATIVE does, and it is DEFAULT OFF
      # because the inference is not sound in general:
      #
      #   a worker on a build too old to publish heartbeats, and a worker that
      #   has departed, are INDISTINGUISHABLE from here.
      #
      # That is a property of the evidence, not a gap in the implementation, and
      # the case it gets wrong — a live worker on an older build — is precisely
      # the case this alert exists to catch, during precisely the rolling deploy
      # when it matters. Setting the flag is the operator asserting a fact the
      # controller cannot check (the same shape as
      # TALOS_WORKER_IDENTITY_REAP_PRE_PROTOCOL_HOURS): that every worker here
      # runs a heartbeat-publishing build. With it unset this gauge counts
      # exactly what it counted before.
      #
      # The heartbeat's OWN gauges (talos_worker_fleet_*, below) are
      # unconditional and unaffected — they report positive observations only,
      # so they can silence nothing.
      - alert: TalosWorkerBuildSkew
        expr: talos_worker_build_skew_workers > 0
        for: 30m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} registered worker id(s) on a different build than the controller"
          description: |
            At least one worker_id with an ACTIVE worker_identities row has
            reported a provably different build than this controller for 30m —
            longer than any rolling deploy should take. Signed wire formats (job
            dispatch, memory RPC, envelope sealing) are version-coupled, so this
            breaks jobs in ways that look like signature bugs; it cost several
            turns of misdiagnosis during the 2026-07-27 signing outage.
            Run get_platform_info and read the `fleet` section for the
            per-worker build_status and last_seen_at, or grep the controller log
            for event_kind="worker_build_skew". Then verify the controller and
            worker images were published from the same tree.
          action: |
            1. get_platform_info → `fleet`. Cross-check last_seen_at against
               the pods that actually exist.
            1b. Faster: compare this gauge with talos_worker_fleet_live_workers
               and talos_worker_fleet_build_skew_workers. The pair separates the
               two causes — a REGISTERED row with no running process (ghost) vs
               a PROCESS that just spoke and is on the wrong build. If the
               live-skew gauge is 0 while this one is not, you are looking at
               ghost rows. Read a 0 on the live gauge carefully though: it also
               reads 0 when nothing publishes heartbeats at all.
            2. If the offending worker_id has no running pod, this is a GHOST
               ROW, not a live skew: the registry has no reaper, so a retired
               pod's identity stays ACTIVE forever. Find it with the controller
               CLI `list-worker-identities` and clear it with
               `deactivate-worker-identity --worker-id <id> --public-key <hex>`;
               the gauge drops on the next 60s sweep. Once the WHOLE fleet runs
               a heartbeat-publishing build you may instead set
               TALOS_WORKER_FLEET_HEARTBEAT_AUTHORITATIVE=1 so silent rows drop
               out automatically — but read the caveat above first: that flag
               also silences a live worker on a pre-heartbeat build.
            3. If the pod IS running, it is genuinely on another image — roll it
               onto the controller's build. Do NOT silence this one: a skewed
               live worker fails signature verification in ways that read as
               crypto bugs.

      # ── The LIVE-PROCESS view of build skew (NATS fleet heartbeat) ──────
      #
      # Every series above is about REGISTERED ROWS. This one is about
      # PROCESSES THAT JUST SPOKE, and neither subsumes the other:
      #   * a ghost row appears only above (registered, no process);
      #   * a worker on a fleet pinned purely through the static
      #     TALOS_WORKER_PUBLIC_KEYS ring appears only here — such a deployment
      #     has no registration endpoint and NO worker_identities rows at all,
      #     so every registry-backed series sits at 0 permanently. This is the
      #     first fleet signal that works in that posture, and in the chart
      #     default where the liveness ping is blocked at the network layer
      #     (networkPolicy.workerControllerEgress is opt-in, default false).
      #
      # WHAT THE EVIDENCE IS WORTH: a heartbeat is HMAC-signed under the
      # FLEET-SHARED WORKER_SHARED_KEY, so any process holding that key can
      # mint one naming any worker_id. It proves a process is running and
      # claims an identity — a liveness HINT. It is NOT a proof of possession
      # (that is the Ed25519 liveness ping) and nothing here gates trust: a
      # heartbeat never writes last_liveness_at and never satisfies the reaper.
      #
      # NO absent() ARM, for the same reason as the participation pair: these
      # are plain IntGauges seeded at 0 at registration, so a running
      # controller always exports them. Missing ⇒ the controller is down
      # (TalosControllerDown owns it) or predates this build.
      #
      # NO ALERT ON talos_worker_fleet_live_workers == 0, deliberately. Zero is
      # ambiguous — empty fleet, pre-heartbeat build, or broken subscription —
      # and an alert that cannot tell those apart would fire loudest on the
      # deployments where it means least. TalosWorkerDown owns "the worker is
      # gone" (it selects on the worker scrape job); this gauge is the
      # denominator you read beside the skew count, and the annotation says so.
      #
      # Structural check 65(a) scans this file TEXTUALLY, not just `expr:`
      # blocks, so spelling a job selector out in prose here would make that
      # job REQUIRED in prometheus.yml. Naming the rule instead of quoting its
      # selector is deliberate — the first draft of this comment quoted a job
      # name that does not exist and failed the lint, which is the check
      # working as documented.
      - alert: TalosWorkerFleetBuildSkew
        expr: talos_worker_fleet_build_skew_workers > 0
        for: 30m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} RUNNING worker process(es) on a different build than the controller"
          description: |
            At least one worker process has published a fleet heartbeat
            recently — up to ~150s ago, being 60s of staleness plus a 30s prune
            tick plus one 60s gauge sweep — reporting a build that provably
            differs from this controller's, and has done so for 30m. Unlike
            TalosWorkerBuildSkew this cannot be a ghost registry row: a process
            spoke. Signed wire formats are version-coupled, so a live skew
            breaks jobs in ways that read as signature bugs.
            Read it beside talos_worker_fleet_live_workers (the denominator)
            and talos_worker_fleet_unverifiable_builds, which counts every
            heartbeating worker whose build could not be compared — either it
            reported no usable commit sha, or THIS CONTROLLER has none, in
            which case nothing is comparable. Uncomparable workers are not
            counted here, so a 0 is not "the fleet agrees".
          action: |
            1. Compare the controller and worker image digests — they must come
               from the same published tree.
            2. get_platform_info → `fleet` for the per-worker detail; the
               heartbeat gauges are counts only (worker_id is caller-supplied on
               the bus and is deliberately never a metric label).
            3. Roll the worker onto the controller's build. Do NOT silence: this
               one names running processes, not stale rows.

      # ══════════════════════════════════════════════════════════════════
      # THE DETECTOR THAT MAKES THE WORKER-IDENTITY REAPER SAFE TO ENABLE
      # ══════════════════════════════════════════════════════════════════
      #
      # The reaper (TALOS_WORKER_IDENTITY_REAP_ENABLED, default OFF)
      # deactivates the Ed25519 signing key of any worker that PROVED liveness
      # and then went silent past TALOS_WORKER_IDENTITY_REAP_HOURS. Its worst
      # failure is reaping a LIVE worker, and that failure has a shape worth
      # stating exactly, because it is why this alert exists rather than a
      # post-hoc one:
      #
      #   * It is SILENT for the whole trust window — 24h by default.
      #   * It then presents as fleet-wide signature-verification failure,
      #     which reads as a crypto or wire-format bug. It cost several turns
      #     of misdiagnosis in the 2026-07-27 signing outage when the cause was
      #     merely build skew.
      #   * The worker CANNOT recover on its own: `register_tofu` refuses to
      #     re-activate a deactivated key (the rule that stops a shared-token
      #     holder undoing a revocation). Every falsely reaped key needs an
      #     operator `register-worker-identity`.
      #
      # But it is not silent in its CAUSE. A false reap is always preceded by
      # workers that were pinging and stopped — an image rollback to a
      # pre-liveness build, TALOS_CONTROLLER_URL dropped from the worker env,
      # TALOS_WORKER_LIVENESS_INTERVAL_SECS set to 0, or a one-way
      # worker→controller network block (a MUTUAL outage self-heals; a one-way
      # one does not). Those all show up here immediately, and the reaper does
      # not act for another ~22h. THAT GAP IS THE ENTIRE VALUE OF THIS ALERT.
      #
      # WHY THE DIFFERENCE OF TWO GAUGES, and not a single "silent workers"
      # series: because the operator reading this during an incident is
      # deciding whether to disable the reaper, and "3 keys have stopped
      # pinging" means something completely different at 3 participants than
      # at 300. Both numbers are exported so the annotation can state the
      # denominator; the expression does the subtraction.
      #
      # WHY IT CANNOT FIRE ON A FLEET THAT NEVER PARTICIPATED — the property
      # that keeps this from being permanently red on a default install.
      # `talos_worker_liveness_participants` counts only rows that have proved
      # liveness AT LEAST ONCE (last_liveness_at IS NOT NULL). A fleet that has
      # never pinged has 0 participants and 0 recent participants, and 0-0 is
      # not > 0. This is not a hypothetical population: on a default chart
      # install the ping is blocked at the NETWORK layer in both directions
      # (networkPolicy.workerRegistrationIngress AND
      # networkPolicy.workerControllerEgress are both opt-in, default false),
      # so every row stays NULL and this alert stays silent — correctly, since
      # the automatic reaper cannot act on a NULL row either. Contrast
      # TalosWorkerBuildSkew, which deliberately DOES count NULL rows: that
      # detector's safe direction is over-reporting, this one's is silence.
      #
      # NO absent() ARM, and the reason is not the usual one. Both series are
      # plain IntGauges, exported from registration, so on any running
      # controller they always have a sample (reason 1 in this file's absence
      # audit). If they are missing, the controller is DOWN — which
      # TalosControllerDown owns — or it PREDATES this build, which NO alert
      # owns and none should: an absent() arm here would page on every
      # controller during every upgrade that crosses this version, i.e. it
      # would fire loudest exactly when nothing is wrong. Runbook step 0
      # ("confirm the observability exists") is the deliberate manual
      # substitute, and it is a step precisely because a rule cannot tell
      # "old controller" from "gauge stopped publishing".
      #
      # AGGREGATION: the subtraction matches on ALL labels, so it is evaluated
      # PER CONTROLLER REPLICA (default replicaCount: 2) against that replica's
      # own pair — both of which it computed from ONE database snapshot in one
      # sweep, so they always describe the same instant. `max()` then takes the
      # worst replica. Do NOT rewrite this as sum(a) - sum(b): replicas scrape
      # at different times, so that form subtracts numbers from different
      # instants and can go transiently negative or positive on a healthy
      # fleet. A replica that exports only one of the two (mid-upgrade) drops
      # out of the vector match entirely — the safe direction, and build skew
      # is TalosWorkerBuildSkew's job.
      #
      # WHAT IT ALSO CATCHES, stated because it is not noise and a reviewer
      # who mistakes it for noise will weaken the rule. A worker pod that is
      # legitimately GONE (scale-down, retired replica) also stops pinging, so
      # it lands in this count too. With the reaper ON that self-resolves: the
      # row is deactivated one window later and drops out of both gauges. With
      # the reaper OFF — the default — it does NOT resolve, and a fleet with
      # pod churn will sit here permanently.
      #
      # That persistent-red state is a true finding, not a false positive: it
      # is exactly the unbounded-trust gap the reaper exists to close, read as
      # "N signing keys are still trusted by workers that no longer exist".
      # The response is to close it (enable the reaper, or
      # `deactivate-worker-identity` per key), not to silence the rule. But it
      # IS a state an operator can sit in indefinitely, and a permanently-red
      # alert trains people to ignore red — so if you have opened the network
      # path for liveness and do not intend to enable the reaper, either drain
      # the ghost rows or accept that this alert is a standing backlog counter
      # rather than an incident signal.
      #
      # `for: 1h` is chosen against the horizon, not plucked: a worker is only
      # counted as silent after 2h without a ping, so this alert needs 3h of
      # real silence to fire. That outlasts any rolling deploy, node drain or
      # controller restart, and still leaves ~21h of the default window.
      # LEAD TIME IS `window - horizon - for`. An operator who shortens
      # TALOS_WORKER_IDENTITY_REAP_HOURS below ~4 has almost none, and one who
      # sets it to 2 or less has none at all — shorten the ping interval with
      # it, and do not enable the reaper on a short window without one.
      - alert: TalosWorkerLivenessParticipationDropped
        expr: |
          max(
            talos_worker_liveness_participants
            - talos_worker_liveness_recent_participants
          ) > 0
        for: 1h
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} worker signing key(s) stopped proving liveness and are heading for a reap"
          description: |
            {{ $value }} worker_id(s) with an ACTIVE worker_identities row have
            proved liveness in the past and have not pinged for over 2 hours.
            Read the denominator alongside this number:
            talos_worker_liveness_participants is the total population that has
            ever pinged, talos_worker_liveness_recent_participants the subset
            still pinging. If the two have converged to (N, 0) the WHOLE fleet
            stopped, which is a configuration change, not N simultaneous
            departures.

            This is a WARNING and not yet damage. Nothing has been deactivated:
            with TALOS_WORKER_IDENTITY_REAP_ENABLED set, the first key is
            reaped one full TALOS_WORKER_IDENTITY_REAP_HOURS (default 24h)
            after its last ping. You have roughly that window minus 3 hours to
            act. With the reaper unset (the default) nothing will ever be
            deactivated and this is purely informational — but it still means
            the liveness signal you would need before enabling it is broken.

            Two causes, and they need opposite responses:
              * THE WORKERS ARE GONE (scale-down, retired pods). Expected —
                but whether it CLEARS depends on the reaper, see action 1.
              * THE WORKERS ARE ALIVE AND STOPPED PINGING. This is the
                dangerous one and it is a configuration fault every time —
                see the action below.
          action: |
            1. Are the workers running? `kubectl get pods -l
               app.kubernetes.io/component=worker`. If the pods are gone this
               is an expected scale-down, and what happens next depends on the
               reaper: WITH it enabled the rows are deactivated one window
               later and this alert clears itself, no action. With it DISABLED
               — the default, and the state throughout every step of the
               enablement runbook before the last one — nothing ever clears
               them and this alert STAYS FIRING. That is a true finding, not a
               false positive: it is reading "N signing keys are still trusted
               by workers that no longer exist". Drain them
               (`deactivate-worker-identity` per key) or enable the reaper. Do
               not silence the rule, and do not wait for a self-resolution
               that is not coming. See docs/security/operational-runbook.md
               § 2.8.
            2. If they ARE running, DISABLE THE REAPER FIRST
               (TALOS_WORKER_IDENTITY_REAP_ENABLED unset, restart controller)
               and only then diagnose. Disabling costs nothing — it restores
               the pre-feature behaviour of keys never expiring. Not disabling
               costs a fleet-wide, non-self-recoverable outage in ~21h.
            3. Then find why they stopped. In order of observed likelihood:
               a rollback to a pre-liveness worker image; TALOS_CONTROLLER_URL
               missing from the worker env; TALOS_WORKER_LIVENESS_INTERVAL_SECS
               set to 0; a NetworkPolicy or ingress change that broke
               worker→controller HTTP one-way; or WORKER CLOCK SKEW, the only
               cause with no configuration change behind it — a worker drifting
               more than 60s AHEAD of the controller fails the freshness check
               on every ping while running perfectly, so auditing recent
               changes will never find it.
            4. Read talos_worker_liveness_pings_total on the controller. All
               five outcomes matter and they separate the causes above:
                 * every outcome flat, including accepted → nothing reached the
                   handler. Either the pings are not ARRIVING (network path, or
                   the worker is not pinging) or they are arriving and being
                   refused by the extractor before the handler — wrong body
                   shape, oversized body, wrong content-type — which this label
                   set does not cover and which looks identical from here.
                 * error climbing → they ARE arriving and the controller is
                   failing to record them (a database fault). The workers are
                   innocent and MUST NOT be reaped — disable the reaper.
                 * rejected_request climbing → arriving and refused before the
                   database: freshness (clock skew, in both directions) or a
                   malformed field. This is the clock-skew fingerprint.
                 * rejected_proof climbing → arriving with a signature that
                   does not verify: a key rotated outside the registration
                   path, or a worker signing with a key it never registered.
                 * inactive_identity climbing → the key is already deactivated
                   (revoked or previously reaped). Re-register it; the damage
                   has already happened for that worker.
            5. Grep the worker logs for event_kind="worker_liveness_rejected",
               "worker_liveness_not_found" or
               "worker_liveness_interval_unparseable".

      # A key was deactivated. This is the after-the-fact counterpart to the
      # alert above, and its job is to be the thing that POINTS AT THE CAUSE
      # when the fleet's signed results stop verifying — the diagnostic that
      # did not exist and whose absence is why the reaper could not be turned
      # on. Every count here is a trust-boundary write that a live worker
      # cannot undo by itself.
      #
      # `sum by (arm)` ADDS across the controller replicas — it does not
      # deduplicate them, and the distinction matters. It is correct here only
      # because a reap is ONE guarded UPDATE: whichever replica's sweep wins
      # gets `rows_affected = n` and every other replica gets 0, so the sum is
      # the fleet total rather than a multiple of it. (Verified live against a
      # two-replica scrape: forcing BOTH replicas to export 3 makes this rule
      # report 6, which is what the arithmetic does, and is a state the reap
      # path cannot produce.) It keeps the two arms apart because they mean
      # different things: `departed` is the automatic
      # window firing, `pre_protocol` is the opt-in arm an operator explicitly
      # enabled. The counter is pre-seeded at 0 for both arms in talos-metrics,
      # so `increase()` has a series to reference before the first reap —
      # without that seed an absent counter would match nothing and this alert
      # could not fire on the very first reap, the one it exists for.
      - alert: TalosWorkerIdentityReaped
        expr: sum by (arm) (increase(talos_worker_identity_reaps_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} worker signing key(s) deactivated by the {{ $labels.arm }} reaper arm"
          description: |
            The worker-identity reaper deactivated {{ $value }} signing key(s)
            in the last hour on the `{{ $labels.arm }}` arm. Those keys are out
            of the controller's trusted verify ring: any results those workers
            sign from now on will FAIL verification, and they cannot re-register
            themselves — trust-on-first-use refuses to re-activate a
            deactivated key.

            If those workers are genuinely gone, this is the feature working
            and needs no action.

            If any of them is still running, this is the failure this whole
            subsystem is built to survive, and you are seeing it at the moment
            it happened rather than inferring it from signature errors later.
            arm="departed" means the worker stopped proving liveness for a full
            window; arm="pre_protocol" means an operator enabled
            TALOS_WORKER_IDENTITY_REAP_PRE_PROTOCOL_HOURS, which reaps on
            registration AGE and cannot tell a departed pod from a healthy
            long-lived one on an old build.
          action: |
            1. `list-worker-identities` on the controller CLI; compare the
               inactive rows against the pods that actually exist.
            2. For any worker that is still running:
               `register-worker-identity --worker-id <id> --public-key <hex>`.
               Nothing else restores it.
            3. Then disable the reaper (TALOS_WORKER_IDENTITY_REAP_ENABLED)
               until the cause of the missed pings is fixed, or it will reap
               the same worker again one window later.
            4. This alert should be preceded by
               TalosWorkerLivenessParticipationDropped by ~21h. If it was not,
               the participation gauges are not being published — check that
               talos_worker_liveness_participants is present on
               /metrics/prometheus at all.

      # THE DETECTOR AND THE ACTOR MUST SEE THE SAME POPULATION, and this is
      # the alert for the state where they cannot.
      #
      # The two participation gauges above are computed from a BOUNDED query
      # (`list_active_builds`, ORDER BY worker_id, public_key LIMIT 200). The
      # reap UPDATE is UNBOUNDED. Above 200 active rows those two populations
      # diverge, and a worker whose row sorts past the 200th is invisible to
      # TalosWorkerLivenessParticipationDropped while still being fully
      # reapable — i.e. the silent false reap this entire subsystem exists to
      # prevent, reintroduced above a fleet size nothing announces. Runbook
      # step 4's gate ("participants must equal your worker count") silently
      # becomes uncheckable in that state, and its `participants < worker
      # count` branch sends the operator after a phantom.
      #
      # It is not a hypothetical size: the feature's own premise is that every
      # registration leaves a permanently ACTIVE row, so a pod-name-keyed
      # fleet doing daily rolls reaches 200 in weeks.
      #
      # THE CONTROLLER ALREADY FAILED SAFE BY THE TIME YOU SEE THIS. While
      # this gauge is 1 the reaper skips its sweep entirely and deactivates
      # nothing (event_kind="worker_identity_reap_skipped_unobservable"), so
      # this is not an outage — it is the security feature switched off by its
      # own precondition, which is a state you must not sit in silently.
      # Severity is warning for that reason, and it is deliberately NOT
      # dependent on whether the reaper is enabled: an operator working
      # through the enablement runbook needs to know the gate is uncheckable
      # BEFORE they turn it on, not after.
      #
      # No absent() arm, same reason as the pair above: plain IntGauge,
      # exported from registration on every controller carrying this build.
      - alert: TalosWorkerIdentityReapBlinded
        expr: max(talos_worker_liveness_population_truncated) > 0
        for: 15m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "worker-identity liveness detector is truncated; the reaper has stopped acting"
          description: |
            The ACTIVE worker_identities population is at or past the bound on
            the query the liveness participation gauges are computed from (200
            rows). Above that bound the detector and the reaper no longer
            describe the same set of rows, so
            TalosWorkerLivenessParticipationDropped can no longer promise to
            warn before a key is deactivated.

            The controller has therefore STOPPED REAPING — nothing is being
            deactivated while this fires. The trust-bounding property is off,
            which is the pre-#631 status quo, not a regression in progress.

            talos_worker_liveness_participants and
            talos_worker_liveness_recent_participants are both UNDERSTATED
            while this fires. Do not read them as a fleet census, and do not
            use them for the runbook's step-4 gate until this clears.
          action: |
            1. `list-worker-identities` and count ACTIVE rows. The overwhelming
               likely cause is accumulated ghosts — every retired pod that ever
               registered leaves an active row behind, which is the backlog the
               reaper exists to drain and cannot drain while blinded.
            2. Drain them: `deactivate-worker-identity` for every worker_id
               with no corresponding running pod. This is safe for a departed
               worker and recoverable (`register-worker-identity`) if you
               retire one by mistake.
            3. Confirm talos_worker_liveness_population_truncated returns to 0
               and that talos_worker_liveness_participants now matches your
               real worker count before relying on either gauge again.
            4. If your fleet is LEGITIMATELY larger than 200 active identities,
               this is not drainable and the cap must be raised in code
               (MAX_FLEET_BUILD_ROWS in talos-worker-identity-repository, which
               bounds the gauge query) — do not work around it by removing the
               reaper's precondition, which is the only thing keeping the
               detector and the reaper honest with each other.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.vault
    interval: 30s
    rules:

      # Vault's own metric: 1 = sealed, 0 = unsealed. Paging on sealed.
      #
      # DELIBERATELY NO `absent()` ARM (2026-08-02 absence audit). Every
      # other `== 0` in this file was re-examined for the self-silencing
      # shape; this one is a genuine "absence means not applicable":
      # `vault_core_unsealed` is Vault's OWN series, and a Talos cluster
      # running `KEK_PROVIDER=env` (or any posture without Vault) neither
      # deploys Vault nor scrapes it. An absent arm here would page
      # `critical` forever on every such cluster for a component it does
      # not run. "Vault is missing when it should be present" is a
      # deployment-topology assertion, not a metric one — it belongs to the
      # chart, not to an alert expression.
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "Vault is SEALED — all encrypted-at-rest ops will fail"
          description: |
            The Talos KEK backend is sealed. Every DEK wrap/unwrap will
            error until unseal completes. The vault-init Job unseals on
            pod restart — if it's not running, run:
              kubectl -n talos create job --from=cronjob/vault-init vault-init-manual
            Otherwise: `kubectl -n talos exec statefulset/talos-vault-0 -- \
              vault operator unseal <key-from-bootstrap.json>`.

      - alert: VaultHighLatency
        expr: histogram_quantile(0.99, rate(vault_core_handle_request_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Vault p99 request latency > 500ms for 10m"
          description: |
            Vault is slow. Every DEK decrypt goes through Vault transit,
            so controller-side DB reads will show elevated p99 too.
            Common causes: Vault PVC disk pressure, Vault CPU throttling.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.controller.health
    interval: 30s
    rules:
      # DELIBERATELY NO `absent()` ARM — and this is the one `== 0` in the
      # file where absence is structurally impossible rather than merely
      # inapplicable. Prometheus synthesises an `up` sample for every
      # CONFIGURED target on every scrape, so `up{job="talos-controller"}`
      # cannot be absent while the job exists; it can only be absent if
      # nothing scrapes the controller at all, which is a CONFIG defect,
      # not a runtime one. That defect has its own gate: structural lint
      # check 65(a) fails the build when an alert selects `up` for a job
      # name prometheus.yml does not declare. Same reasoning applies to
      # TalosWorkerDown below.
      #
      # (Do not write that selector out literally in a comment here: 65(a)
      # scans the whole rule file, not just `expr:` blocks, so a job name
      # mentioned in prose reads as selected. Discovered by tripping over
      # it while writing this very comment. Loud/false-positive direction,
      # so it is documented in the check rather than "fixed".)
      - alert: TalosControllerDown
        expr: up{job="talos-controller"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Talos controller is not responding to Prometheus scrapes"
          description: |
            All N controller replicas have failed scrapes for 2m. Platform
            is down. Check: `kubectl -n talos get pods -l app.kubernetes.io/component=controller`.

      # Interactive-login failure rate. Population is method="password"
      # (talos_auth::AuthService::login) + method="oauth" (the controller's
      # oauth_callback_handler) — every attempt counted once, on success and
      # failure alike, so the ratio is well-defined. API-key validation is
      # deliberately NOT in these series: it runs on every GraphQL request
      # and would swamp the denominator, leaving a credential-stuffing burst
      # unable to move the ratio past the threshold.
      #
      # Both series were registered but never incremented until 2026-07-31,
      # so this alert could not fire at all — which is why its description
      # used to send the operator to `grep auth_failure` in the logs.
      #
      # KNOWN, DELIBERATE ASYMMETRY between the two methods, because an
      # operator reading a firing instance needs it. method="password" runs
      # behind CSRF + the distributed per-IP auth limiter, so its population
      # is hard to author from outside. method="oauth" is a plain
      # unauthenticated GET on `/auth/oauth/{provider}/callback`, proxied
      # publicly by the chart nginx with no per-IP limit — so anyone on the
      # internet can hold this ratio at 1.0 with ~1 req/min of
      # `?error=access_denied`, on a deployment whose real interactive login
      # volume is well under one per day. The drive direction is toward
      # FIRING, never toward suppressing (each such request counts as both an
      # attempt and a failure), so it is noise, not a blind spot — but the
      # first time this alert ever fires here, check `method`/`reason` before
      # concluding "credential stuffing". The break-down below is the first
      # step for exactly that reason.
      #
      # DELIBERATELY NO `absent()` ARM (2026-08-02 absence audit). Both legs
      # can be absent, and in both directions absence is the correct
      # non-alerting answer:
      #   - denominator absent  ⇒ no interactive logins were attempted. A
      #     ratio over an empty population is undefined, not high.
      #   - numerator absent    ⇒ zero failures. `sum(rate(...))` over an
      #     absent series yields an empty vector, the division yields empty,
      #     and nothing fires — which is exactly right.
      # What absence DOES hide here is a broken numerator: if
      # `inc_auth_failure` were deleted, this alert would fall silent and
      # look identical to a healthy stack. That is not fixable from the
      # expression side (an `absent(failures)` arm would fire on every
      # healthy deployment), so it is covered from the metric side instead:
      # `talos_auth_attempts_total{method}` is pre-seeded at 0 for both
      # emitted methods in talos-metrics, so the DENOMINATOR is always
      # present and an operator can tell "instrumented and quiet" from
      # "instrumentation gone". Note precisely what that does and does not
      # prove: a present denominator shows the auth counters were registered
      # in this process, NOT that the failure leg is still wired. The guard
      # for the failure leg is the unit test in talos-auth that drives the
      # production path and asserts the counter moved.
      - alert: TalosControllerHighErrorRate
        expr: |
          sum(rate(talos_auth_failures_total[5m]))
          / sum(rate(talos_auth_attempts_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          category: abuse-or-broken
        annotations:
          summary: "Auth failure rate > 20% for 10m"
          description: |
            Either credential stuffing in progress, or an auth bug.
            Break down by cause first:
            `sum by (method, reason) (rate(talos_auth_failures_total[5m]))`.
            reason=invalid_password/lockout_triggered concentrated on one
            method is abuse; reason=error is the platform failing (DB down,
            token minting broken) and pairs with the DB-pool alerts.
            method=oauth,reason=provider_error alone — with password traffic
            quiet — is almost always an internet scanner hitting the public
            /auth/oauth/{provider}/callback redirect, not a login problem.
            Per-account detail (email, IP) is in `auth_audit_log` and the
            controller logs — deliberately not in the metric labels.

      # DEK cache unbounded growth (leak).
      - alert: TalosDEKCacheOverflow
        expr: talos_dek_cache_size > 10000
        for: 15m
        labels:
          severity: warning
          category: leak
        annotations:
          summary: "DEK cache has > 10k entries for 15m"
          description: |
            TTL eviction and write-path invalidation should bound this.
            Unbounded growth = a cache-invalidation bug or many distinct
            DEKs in flight (shouldn't normally happen).

  # ────────────────────────────────────────────────────────────────────
  - name: talos.backups
    interval: 1m
    rules:
      # Scraped from the drill script's metric output. The producer is
      # scripts/drills/backup-restore.sh; the collection path and the
      # per-deployment "can this alert ever clear here?" analysis are in
      # scripts/drills/README.md § Wiring the metric into Prometheus.
      # (This used to point at deploy/observability/drill-textfile-exporter.md,
      # which has never existed — a dangling reference on the one line an
      # operator reads when the alert fires.)
      #
      # WHERE THIS CAN BE SATISFIED, stated because "run the drill" was not
      # true everywhere until 2026-08-03:
      #   * docker-compose dev stack — YES. A textfile-only node-exporter
      #     (docker-compose.yml) mounts the drill's output directory and the
      #     `node-exporter` scrape job in observability/prometheus/prometheus.yml
      #     collects it. `make drill` clears this alert.
      #   * a VM / bare-metal host running the stack — YES, with a system
      #     node_exporter: point TALOS_DRILL_TEXTFILE_DIR at its textfile
      #     directory and schedule the drill (systemd timer in the README).
      #   * Kubernetes / the Helm chart — NOT YET. The drill drives the docker
      #     socket directly, which a pod does not have, so nothing publishes
      #     this series in-cluster and the alert fires permanently. That is
      #     ACCURATE (nobody has verified those backups) but it is not
      #     actionable in-cluster today. Operators who accept the risk should
      #     drop this rule from their PrometheusRule rather than let a
      #     permanently-red alert train them to ignore red; porting the drill
      #     to a CronJob is tracked in scripts/drills/README.md.
      #
      # allow-unobserved-metric: talos_backup_drill_* is a node_exporter
      # TEXTFILE series written by scripts/drills/backup-restore.sh, not a
      # metric registered in Rust — so structural check 65(c), which
      # requires every alerted talos_* series to be registered in a .rs
      # file, cannot see its producer. The producer is real; only its
      # language is different.
      # ABSENCE IS NOT ZERO — and here absence is the WORST case.
      #
      # Pre-2026-08-02 this was the bare `< (time() - 14*86400)` comparison.
      # A comparison against an ABSENT series matches nothing, so the alert
      # whose own description says the drill "has either not run or is
      # failing" was silenced by the drill never having run: the textfile
      # never written, the series never created, the selector matching
      # nothing, no alert. It could only fire for a drill that had once
      # succeeded and then went stale — never for a cluster where backup
      # verification was never wired up at all, which is the case an
      # operator most needs told. Same shape as `NoWASMExecutions` in
      # observability/rules/alerts.yml; see that file's header.
      #
      # The `absent()` arm does NOT change the severity semantics: both arms
      # are the same warning / ops-hygiene pair, and both mean exactly what
      # the summary says — there is no evidence of a successful drill in the
      # last 14 days. `for: 1h` (new; there was no `for` at all) keeps a
      # cluster that is mid-bring-up from paging before its textfile
      # collector has published once. An hour is immaterial against a
      # 14-day threshold and it is not a grace period for the stale arm in
      # any meaningful sense.
      #
      # This WILL fire, permanently, on a cluster that has never run the
      # drill. That is not a false positive — it is the alert's literal
      # subject, and it is a `warning` in the ops-hygiene category, not a
      # page. Silence it by running the drill (or by removing this rule if
      # the deployment's backups are verified some other way), not by
      # reverting to an expression that cannot see its own condition.
      - alert: TalosBackupRestoreDrillFailed
        expr: |
          absent(talos_backup_drill_last_success_timestamp_seconds)
          or
          talos_backup_drill_last_success_timestamp_seconds < (time() - 14*86400)
        for: 1h
        labels:
          severity: warning
          category: ops-hygiene
        annotations:
          summary: "No successful backup→restore drill in 14+ days"
          description: |
            scripts/drills/backup-restore.sh has either not run or is
            failing. A backup you have not restored is a hypothesis —
            run the drill now. If this fired via the absent() arm the
            series has NEVER been published: check that the drill script
            is scheduled at all and that its node_exporter textfile
            directory is being collected.

  # ────────────────────────────────────────────────────────────────────
  # Capacity / saturation. Series come from talos-controller
  # /metrics/prometheus — the DB-pool gauges are sampled every 15s by a
  # background task in controller main.rs. These fire BEFORE the failure
  # is user-visible (pool saturation → acquire-timeout → 503s), which the
  # crypto-invariant alerts above do not cover.
  - name: talos.capacity
    interval: 30s
    rules:
      # Postgres pool saturation. Each controller replica samples its own
      # process-local pool; the alert is per-replica (no aggregation) so a
      # single saturated replica pages even when others are healthy.
      - alert: TalosDBPoolSaturated
        expr: |
          talos_db_pool_in_use_connections
          / clamp_min(talos_db_pool_max_connections, 1) > 0.9
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "Postgres pool > 90% in-use on {{ $labels.instance }} for 5m"
          description: |
            In-use connections have exceeded 90% of DB_MAX_CONNECTIONS for
            5m. New acquisitions queue on the 10s acquire timeout, so this
            precedes a latency cliff / 503 cascade. Either raise
            DB_MAX_CONNECTIONS (and the backend's server-side limit), scale
            down controller replicas (the sum of per-replica pools must
            stay under the backend ceiling), or find the query holding
            connections (pg_stat_activity, state='active').

      - alert: TalosDBPoolExhausted
        expr: |
          talos_db_pool_in_use_connections
          >= clamp_min(talos_db_pool_max_connections, 1)
        for: 1m
        labels:
          severity: critical
          category: saturation
        annotations:
          summary: "Postgres pool fully exhausted on {{ $labels.instance }}"
          description: |
            Every pooled connection is checked out — new work blocks on the
            acquire timeout and requests are failing. See the runbook's
            pool-exhaustion section.

      # DELIBERATELY NO `absent()` ARM — see TalosControllerDown above for
      # the full reasoning. `up` exists for every configured target, so it
      # cannot go absent while the job is declared, and "no worker job is
      # configured" is caught at build time by structural lint check 65(a).
      #
      # What this alert does NOT cover, and what this cycle added a separate
      # detector for: a worker whose scrape SUCCEEDS but whose metrics
      # pipeline produces nothing. `up == 1` certifies reachability, not
      # production. That is `WASMMetricsPipelineDead` in
      # observability/rules/alerts.yml.
      - alert: TalosWorkerDown
        expr: up{job="talos-worker"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "A Talos worker is not responding to Prometheus scrapes"
          description: |
            Worker scrape failing for 2m — WASM execution capacity reduced
            or zero. Check: `kubectl -n talos get pods -l app.kubernetes.io/component=worker`.

  # ────────────────────────────────────────────────────────────────────
  # Infrastructure availability. These series come from kube-state-metrics
  # (bundled with kube-prometheus-stack — the same operator the
  # ServiceMonitors assume). If you don't run kube-state-metrics, these
  # alerts simply never fire; they are not a hard dependency. Tune the
  # `namespace` / `statefulset` matchers to your release name.
  #
  # RE-CONFIRMED in the 2026-08-02 absence audit and DELIBERATELY left
  # without `absent()` arms: all three expressions below (`== 0`, `< 2`,
  # `increase(...) > 5`) are silenced by an absent series, and here that is
  # correct. These series belong to kube-state-metrics, not to Talos, and
  # their absence means "this cluster does not run kube-state-metrics" or
  # "this component is not deployed in-cluster" (managed Postgres, no
  # Vault, no MinIO) — a deployment-topology fact, not an outage. An
  # absent() arm would page `critical` forever on every such cluster.
  # Contrast `NoWASMExecutions` / `TalosBackupRestoreDrillFailed`, where the
  # absent series is one Talos itself is supposed to produce.
  - name: talos.infra.availability
    interval: 30s
    rules:
      # The four single-replica stateful components are SPOFs in the
      # in-cluster topology (postgres/neo4j/vault/minio). "0 ready" = down.
      # Production should prefer external-managed Postgres/Redis (see
      # docs/deployment.md) — these alerts cover the homelab/single-region
      # in-cluster path.
      - alert: TalosSingleReplicaInfraDown
        expr: |
          kube_statefulset_status_replicas_ready{statefulset=~".*(postgres|neo4j|vault|minio).*"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Stateful component {{ $labels.statefulset }} has 0 ready replicas"
          description: |
            A single-replica in-cluster datastore is down. For postgres
            this stops the platform; neo4j degrades graph-RAG only; vault
            blocks DEK unwrap (controller CrashLoops); minio blocks the
            WORM audit sink. Restore the pod, then check its PVC.

      # NATS is the only HA stateful component (3-replica quorum). Below
      # quorum (<2 ready) JetStream loses write availability.
      - alert: TalosNatsBelowQuorum
        expr: |
          kube_statefulset_status_replicas_ready{statefulset=~".*nats.*"} < 2
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "NATS cluster below quorum ({{ $value }} ready)"
          description: |
            Fewer than 2 of 3 NATS replicas are ready — the job queue and
            signed-RPC transport lose write availability. Check the NATS
            StatefulSet and PVCs.

      # Crash-looping pods anywhere in the release.
      - alert: TalosPodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~".*talos.*"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Pod {{ $labels.pod }} restarted > 5x in the last hour"
          description: |
            Container {{ $labels.container }} in pod {{ $labels.pod }} is
            crash-looping. Check logs and recent config/secret changes.
