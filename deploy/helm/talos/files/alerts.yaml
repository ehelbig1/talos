# Talos — crypto-invariant alert rules.
#
# Designed for Prometheus / Alertmanager. Alerts in this file MUST page
# operator attention — every one of them means either:
#   (a) encrypted-at-rest data is currently unreadable, or
#   (b) encrypted-at-rest data will be unreadable on the next restart.
#
# Series come from:
#   - talos-controller /metrics/prometheus (bearer PROMETHEUS_SCRAPE_TOKEN)
#   - vault /v1/sys/metrics?format=prometheus
#
# Apply to Prometheus via:
#   prometheus --config.file=... --rules.file=alerts.yaml
# or (kube-prometheus-stack):
#   kubectl -n monitoring create configmap talos-alerts --from-file=alerts.yaml
#   then reference it from a PrometheusRule CRD.
groups:
  # ────────────────────────────────────────────────────────────────────
  - name: talos.crypto.invariants
    interval: 30s
    rules:

      # ── DEK orphan gauges — value > 0 means data loss already occurred.
      # These gauges are computed by a 60s background loop in controller
      # main.rs (SELECT COUNT(*) with NOT EXISTS) so we scrape the DB
      # only indirectly. Paging threshold: ANY non-zero value for 5m.
      - alert: TalosActorMemoryDEKOrphaned
        expr: talos_actor_memory_orphaned_rows > 0
        for: 5m
        labels:
          severity: critical
          category: data-loss
          runbook: https://github.com/OWNER/talos/blob/main/docs/security/operational-runbook.md#dek-orphan
        annotations:
          summary: "{{ $value }} actor_memory row(s) reference a missing DEK"
          description: |
            actor_memory.value_key_id points at an encryption_keys row that
            no longer exists. This should be structurally impossible under
            the ON DELETE RESTRICT FK — investigate for:
              - partial DB restore (pg_restore without encryption_keys)
              - manual DEK deletion with FK triggers disabled
              - Vault master-key rotation without DEK rewrap
            Affected rows are UNRECOVERABLE. Do not delete them without
            a decision to abandon their payloads.
          action: |
            1. kubectl -n talos exec deploy/talos-controller -- \
                 psql $DATABASE_URL -c "SELECT id, actor_id, key, created_at \
                   FROM actor_memory am \
                   WHERE NOT EXISTS ( \
                     SELECT 1 FROM encryption_keys ek WHERE ek.id = am.value_key_id \
                   );"
            2. Decide: delete orphans, or hold for forensic dump before delete.
            3. Follow docs/security/operational-runbook.md § DEK orphan.

      - alert: TalosModuleExecutionPayloadOrphaned
        expr: talos_module_execution_orphaned_rows > 0
        for: 5m
        labels:
          severity: critical
          category: data-loss
        annotations:
          summary: "{{ $value }} module_executions row(s) reference a missing DEK"
          description: |
            module_executions.payload_enc_key_id FK broken. Execution
            metadata survives; input/output/trigger_metadata_enc are
            unrecoverable. NULL the _enc columns once a decision is
            made — see 2026-04-24 cleanup precedent.

      - alert: TalosWorkflowOutputPayloadOrphaned
        expr: talos_workflow_execution_orphaned_rows > 0
        for: 5m
        labels:
          severity: critical
          category: data-loss
        annotations:
          summary: "{{ $value }} workflow_executions row(s) reference a missing DEK"
          description: |
            workflow_executions.output_enc_key_id FK broken. Output data
            unrecoverable.

      # ── KEK decrypt failures — rate > 0 means current write path is
      # broken. "both" means EVERY CONFIGURED provider failed, so the read
      # is terminally broken; it is emitted when active+legacy both fail AND
      # (since 2026-07-31) when the active provider fails with no legacy
      # wired at all. That second arm is the difference between this alert
      # being fireable and being decorative on the two supported no-legacy
      # postures — KEK_PROVIDER=env (legacy hardcoded None) and
      # KEK_PROVIDER=vault + KEK_DISABLE_LEGACY=true, the documented Phase-5
      # end state. Before it, a total KEK outage on those postures surfaced
      # ONLY on the warning-level Active alert below, whose own summary
      # claims a legacy fallback is carrying the load that does not exist.
      - alert: TalosKEKDecryptFailuresBoth
        expr: rate(talos_kek_decrypt_failures_total{provider="both"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "KEK decrypt failing on EVERY configured provider"
          description: |
            No configured KEK provider could unwrap a DEK — the active one
            (Vault transit or env) failed and either the legacy fallback
            failed too or no legacy is wired. Encrypted-at-rest reads are
            currently failing. Most common cause: Vault's transit key was
            rotated/deleted without rewrapping DEKs, and the env KEK master
            key doesn't match either (or there is no env KEK to fall back
            to, because KEK_DISABLE_LEGACY=true).
          action: |
            1. Check Vault transit key version: `vault read transit/keys/talos-kek`
            2. Check controller KEK_PROVIDER env: matches Vault or env?
            3. Review `docs/security/kek-to-kms-plan.md` § recovery.
            4. If Vault is unreachable, failing over to KEK_PROVIDER=env
               works iff TALOS_MASTER_KEY is the key the DEKs were
               originally wrapped with.

      - alert: TalosKEKDecryptFailuresActive
        expr: rate(talos_kek_decrypt_failures_total{provider="active"}[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          category: crypto-degraded
        annotations:
          summary: "KEK active-provider decrypt failing"
          description: |
            The active KEK provider is failing decryption. If a legacy
            provider is wired it is carrying the load — survivable short
            term, critical once legacy goes too. If no legacy is wired
            (KEK_PROVIDER=env, or vault with KEK_DISABLE_LEGACY=true) then
            reads are ALREADY failing and TalosKEKDecryptFailuresBoth is
            firing alongside this one; treat that pair as the critical case.
            Often means a misconfigured Vault token or network partition.

      # ── memory-write failures — node outputs are being lost.
      - alert: TalosMemoryWriteFailuresCrypto
        expr: rate(talos_memory_write_failures_total{reason="crypto"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "__memory_write__ persist failing due to crypto errors"
          description: |
            Node outputs returning `__memory_write__` are being silently
            dropped because the encryption path is broken. Every dropped
            write loses actor state. Historically this fires when the
            Vault KEK can't be reached — see the 2026-04-24 `-dev` mode
            persistence bug for the canonical pattern.

      - alert: TalosMemoryWriteFailuresDB
        expr: rate(talos_memory_write_failures_total{reason="db"}[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: persistence-degraded
        annotations:
          summary: "__memory_write__ DB errors sustained"
          description: |
            Memory writes failing at the DB layer at {{ $value }} per second.
            Common causes: pool saturation, statement timeout, migration
            lock. Check controller DB pool metrics and Postgres load.

      # ── Module-execution payload encryption failures.
      - alert: TalosModulePayloadEncryptionFailures
        expr: rate(talos_module_payload_encryption_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "module_executions payload encryption/decryption failing"
          description: |
            op={{ $labels.op }} stage={{ $labels.stage }} rate={{ $value }}/s.
            Input/output/trigger_metadata payloads are either not being
            encrypted on write or not being decrypted on read.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.reliability
    interval: 30s
    rules:

      # ── Workflow-execution failure rate — closes the detect→NOTIFY loop.
      # get_health_dashboard / the operator digest already SHOW
      # failure_rate_24h_pct, but nothing PUSHED an alert; a sustained
      # outage (e.g. the 2026-07-23 worker-DNS incident that failed ~125
      # scheduled runs) went unpaged. Fires on the ratio of terminal
      # failures to all terminal executions over 15m. Both series are
      # pre-seeded at 0 (talos_metrics::TalosMetrics::new) so the ratio is
      # well-defined in steady state; the >0.05 denominator guard avoids
      # dividing a handful of executions into a scary percentage on a quiet
      # cluster.
      - alert: TalosWorkflowFailureRateHigh
        expr: |
          (
            sum(rate(talos_workflow_executions_total{status="failure"}[15m]))
            /
            clamp_min(sum(rate(talos_workflow_executions_total[15m])), 0.001)
          ) > 0.25
          and
          sum(rate(talos_workflow_executions_total[15m])) > 0.005
        for: 10m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Workflow failure rate above 25% (sustained 10m)"
          description: |
            {{ $value | humanizePercentage }} of terminal workflow executions
            are failing over the last 15m. This is the push-alert companion to
            the get_health_dashboard `failure_rate_24h_pct` / operator-digest
            `reliability` signals. Common causes: a sustained upstream/egress
            outage (worker DNS or a third-party API down — the per-host circuit
            breaker should be fast-failing those), a bad deploy, or a
            provider-credential expiry. Check top_failures_24h via
            get_error_report (no workflow_id → platform-wide rollup) and
            tail_worker_logs on a recent failed execution for the node-level
            cause.

      # ── WASM log lines that reached no execution row.
      # Reachability: this series is produced by the controller's `wasm.log.*`
      # NATS subscriber, which is only spawned when a NATS client exists. NATS
      # is mandatory for job dispatch, so on any functioning deployment it is
      # live; on a NATS-less one there are no WASM executions to log either.
      # #618 added the `wasm_log_orphaned` WARN as the detector for a whole bug
      # family (a dispatch path minting an execution id without recording a
      # row, so every log line it publishes is silently discarded and
      # get_execution_logs returns [] — byte-identical to an execution that
      # genuinely logged nothing). #619 closed the family's live instances. But
      # the detector was a LOG LINE, and every alert in this file is
      # metric-based, so nothing could page on it. This is that alert.
      #
      # `kind` is a closed set of two values, both emitted by
      # controller/src/bootstrap/background.rs::handle_wasm_log_message:
      #   no_execution_row — the id parsed but names neither a
      #                      workflow_executions nor a module_executions row.
      #   unparseable_id   — the published line carried no usable execution id.
      # Deliberately unfiltered here so a NEW kind (should one ever be added)
      # cannot slip past the alert by not matching a selector.
      #
      # WARNING, not critical, and `for: 0m`. Expected rate is zero on routine
      # traffic (#619 verified zero over a live deploy window), so any hit is
      # worth a look immediately. At least one deliberate residual producer is
      # KNOWN — `record_started` failing is non-fatal by design, so a DB blip
      # during a node dispatch legitimately orphans that node's lines — and that
      # is a known-causes list, not a proof of completeness: the same list in the
      # code has gone stale twice already, which is why the alert stays `> 0`
      # rather than being tuned around an assumed floor. Volume is bounded by the
      # worker's per-execution log budget
      # (MAX_LOG_MESSAGES_PER_EXECUTION / HOST_DIAG_CAP), not unbounded.
      - alert: TalosWasmLogsOrphaned
        expr: increase(talos_wasm_log_orphaned_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "WASM log lines discarded (kind={{ $labels.kind }})"
          description: |
            {{ $value }} WASM log line(s) in the last 15m could not be routed to
            any execution row and were DISCARDED — get_execution_logs will
            return [] for those executions, indistinguishable from an execution
            that logged nothing.
            kind=no_execution_row: a dispatch path published under an id with no
            execution row. First check whether
            talos_module_execution_record_started_failures_total moved in the
            same window — that is the one KNOWN benign cause (a DB blip on a
            non-fatal start-row write). If it did not, assume a NEW dispatch path
            is minting ids without recording rows: grep the controller log for
            event_kind="wasm_log_orphaned" and fix the producer. Treat "the one
            known cause" as a SNAPSHOT, not an inventory — the equivalent list in
            the code has already gone stale twice; the live enumeration is the
            comment at the warn site in
            controller/src/bootstrap/background.rs, and the warn itself outranks
            both.
            kind=unparseable_id: a publisher is emitting malformed
            execution_ids; grep event_kind="wasm_log_unparseable_execution_id".

      # ── module_executions start rows that never landed.
      # The upstream CAUSE of the orphan alert above, and independently a
      # correctness problem of its own: record_started's Err is non-fatal at
      # every caller (the engine logs and dispatches anyway), so the execution
      # runs while its row is missing and get_execution_logs / get_node_io /
      # cost attribution all quietly under-report.
      #
      # WHAT `for: 5m` ACTUALLY DOES HERE — say it precisely, because the
      # obvious reading is wrong. It does NOT mean "one transient failure will
      # not page". `increase(...[15m])` stays positive for the whole 15m window
      # after a SINGLE increment, which trivially outlasts a 5m `for`, so one
      # transient acquire timeout still fires — just 5 minutes later. A `for`
      # shorter than the range window can only delay a page, never suppress a
      # one-off; suppressing one-offs needs a THRESHOLD on the value (compare
      # TalosMemoryWriteFailuresDB's `rate(...) > 0.1` in this file), not a
      # `for`. That is deliberate here: one lost start row is silent data loss
      # worth knowing about, and its downstream twin TalosWasmLogsOrphaned pages
      # at `for: 0m` on the same event anyway — a threshold here would only make
      # the pair disagree. The 5m buys exactly one thing: the series must stay
      # positive across ~10 evaluations, which rides out a counter reset or a
      # single-scrape gap that briefly lifts increase() off zero.
      - alert: TalosModuleExecutionStartRowFailures
        expr: increase(talos_module_execution_record_started_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "module_executions start rows failing to persist"
          description: |
            {{ $value }} module_executions start-row write(s) failed in the last
            15m at PostgresModuleExecutionStore::record_started. The affected
            executions still RAN — they just have no row, so their WASM logs
            orphan (expect TalosWasmLogsOrphaned alongside this) and their
            input payloads, timings and cost attribution are missing.
            Two failure edges: DEK/payload encryption (check the KEK alerts and
            Vault) and the INSERT itself (check the DB-pool saturation alerts).
            The per-failure detail is in the controller log at the calling site.

  # ────────────────────────────────────────────────────────────────────
  # WORM audit-ledger integrity. Two independent verification layers, one
  # series: `stage=event` is the inline per-message check at ingest (the
  # message is quarantined and never persisted); `stage=chain` is the offline
  # hash-chain sweep over a completed execution's full ordered record set.
  # Both were ERROR logs with no metric.
  - name: talos.audit
    interval: 30s
    rules:
      # CRITICAL with `for: 0m` because the expected steady-state background is
      # ZERO: the ledger REJECTS a failing event rather than persisting it, so a
      # non-zero value is evidence of a real integrity break, not a threshold
      # judgement. A week unnoticed means the compliance artifact is void for the
      # affected executions AND the correlation window (who had access, what else
      # happened) has closed.
      #
      # "Expected zero" is NOT the same as "can only mean tampering", and the
      # runbook below must be read before anyone declares an incident. The event
      # hash is recomputed from the deserialized AuditEvent, so a controller and
      # worker on DIFFERENT BUILDS whose AuditEvent shape or hash input changed
      # produce stage="event" hash_mismatch (or event_deserialize_failed) on
      # EVERY event for the duration of the skew — a deploy-ordering fault
      # presenting as a fleet-wide tamper alarm. Check TalosWorkerBuildSkew and
      # the controller/worker image shas FIRST.
      #
      # Unfiltered on `stage` on purpose — both values are emitted
      # (talos-audit-ledger: verify_audit_message → stage="event",
      # record_chain_verification_outcome → stage="chain") and a future third
      # layer must not be able to hide behind a selector.
      #
      # NOTE what this does NOT cover: an execution whose chain cannot be READ
      # (S3/IO error) counts as `errored`, not a verification failure —
      # unreadable is not the same as tampered (#578). That population surfaces
      # in the audit_chain_sweep_summary log line, not here. Nor does the
      # operator's on-demand `verify_execution_chain_from_env` path count, so
      # re-checking a known-broken chain cannot re-page.
      #
      # stage="chain" is structurally silent on two postures — no S3/WORM
      # endpoint configured (the sweep self-disables) and
      # AUDIT_CHAIN_SWEEP_INTERVAL_SECS=0 (explicitly disabled). A flat 0 on
      # either means "never looked", not "verified clean". stage="event" has no
      # such gate: the ingest subscriber runs wherever NATS does.
      - alert: TalosAuditVerificationFailures
        expr: increase(talos_audit_verification_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          category: audit-integrity
        annotations:
          summary: "Audit ledger verification FAILED (stage={{ $labels.stage }})"
          description: |
            {{ $value }} audit verification failure(s) in the last 15m against
            the WORM audit ledger. Expected steady state is 0. Read the runbook
            below BEFORE calling it tampering — a fleet-wide burst is far more
            often a key-rotation or controller/worker build-skew fault, and both
            look identical to tampering from this number alone.
            stage=event: an inbound audit event failed its hash or HMAC check at
            ingest and was QUARANTINED (not persisted). Grep the controller log
            for event_kind="audit_event_verification_failed" — the `reason`
            field distinguishes hash_mismatch / bad_signature /
            event_deserialize_failed.
            stage=chain: a completed execution's full chain failed offline
            verification — a sequence gap (deleted or never-persisted events),
            broken previous_hash linkage (reorder/substitution), or a per-event
            HMAC failure. Grep event_kind="audit_chain_verification_failed" for
            the execution_id and the structured `breaks` list.
          action: |
            1. Treat the affected execution's audit record as UNTRUSTED; do not
               delete anything (the quarantined bytes are the evidence).
            2. Rule out the two MISCONFIGURATION shapes before treating this as
               tampering — both present as a broad, simultaneous burst rather
               than an isolated event:
               a. audit signing keys rotated without a matching verify-key roll
                  → bad_signature across many executions at once;
               b. controller and workers on different builds → hash_mismatch or
                  event_deserialize_failed on essentially every event. Check
                  TalosWorkerBuildSkew / get_platform_info.fleet.
               Tampering is the residual after both are excluded; a scattered
               handful of failures against a same-build fleet is the real shape.
            3. Check S3/MinIO Object Lock is still enforced on the audit bucket.

  # ────────────────────────────────────────────────────────────────────
  # Worker fleet identity + build agreement. Both series existed only as
  # controller log lines before 2026-08.
  #
  # POSTURE CAVEAT, stated because a flat 0 here is otherwise easy to misread
  # as "checked and clean": BOTH series are about REGISTERED workers, i.e. the
  # `worker_identities` table. A deployment that pins its fleet purely through
  # the controller's static `TALOS_WORKER_PUBLIC_KEYS` ring has no registration
  # endpoint at all (it is only mounted when TALOS_WORKER_REGISTRATION_TOKEN or
  # TALOS_WORKER_REG_REQUIRE_BOUND_TOKEN is set) and no rows, so both series sit
  # at 0 permanently — quiet because there is nothing to observe, not because
  # the fleet was verified. `get_platform_info.fleet` is the surface that shows
  # static-env workers; it does not merge them with registered ones, and neither
  # does this.
  - name: talos.fleet
    interval: 30s
    rules:
      # A worker_id presented a key that is NOT its bound trust-on-first-use
      # identity. Legitimate rotation goes through the register-worker-identity
      # operator CLI or a worker_id-bound provisioning token — neither of which
      # reaches this path — so a non-zero value is either in-fleet
      # impersonation or an operator working off the managed path. Both want a
      # human, hence `> 0` over a 1h window with no `for`.
      #
      # The counter is UNLABELLED and must stay that way: worker_id and the
      # submitted key are caller-supplied at a network endpoint, so labelling
      # by either would hand an attacker control of series cardinality. The
      # identifying detail is in the controller's talos_security log.
      - alert: TalosWorkerKeyTofuConflicts
        expr: increase(talos_worker_key_tofu_conflicts_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "Worker key registration refused — TOFU identity conflict"
          description: |
            {{ $value }} worker-key registration(s) in the last hour were
            refused because the presented key is not that worker_id's bound
            identity. The registration was REFUSED (409), so nothing was
            granted — but someone with a valid registration bearer token tried
            to bind a key they should not have.
            Grep the controller log for event_kind="worker_key_tofu_conflict"
            to get worker_id, the submitted public key, and the auth path. If
            it is a legitimate rotation, do it via the operator CLI. If it is
            not, the registration bearer token is compromised: rotate it and
            revoke outstanding provisioning tokens.

      # Controller↔worker build skew. A GAUGE, not a counter: the underlying
      # `worker_build_skew` WARN fires exactly once per worker at registration,
      # so `increase()` over it would page on EVERY rolling deploy and then go
      # SILENT while a fleet sat skewed — wrong at both ends. The gauge is
      # recomputed from a query each sweep, so it falls to 0 once the counted
      # population converges.
      #
      # READ "ACTIVE" NARROWLY — this is the one thing about this alert that is
      # easy to get wrong. The population is rows in `worker_identities` that
      # have not been explicitly deactivated. It is NOT "processes currently
      # running". Nothing reaps the row of a pod that is gone, and
      # `last_seen_at` is written only at boot registration (there is no
      # periodic re-register and the NATS fleet heartbeat does not touch this
      # table), so no age filter can distinguish a departed pod from a healthy
      # long-lived one and none is applied. With the chart's default worker
      # `Deployment` + HPA, `worker_id` is the pod name, so every roll and
      # scale-down leaves rows behind: after the FIRST controller upgrade that
      # follows, this gauge counts those ghosts and STAYS above zero until an
      # operator deactivates their keys. It does not self-drain on that posture.
      # Give workers stable ids (TALOS_WORKER_ID per replica) if you want it to.
      #
      # `for: 30m` outlasts any rolling deploy (workers re-register within
      # seconds of their pod starting) and catches the case the WARN cannot
      # express: a worker that is STILL skewed long after the deploy settled.
      #
      # Counts PROVEN skew only, per distinct worker_id (a worker mid-rotation
      # holds two rows). A worker that reports no usable commit sha is
      # "unverifiable" and is NOT counted — absence of evidence is not evidence
      # of skew (#578) — so a clean 0 here is not "everything checked out". Use
      # get_platform_info.fleet for the unverifiable population.
      - alert: TalosWorkerBuildSkew
        expr: talos_worker_build_skew_workers > 0
        for: 30m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} registered worker id(s) on a different build than the controller"
          description: |
            At least one worker_id with an ACTIVE worker_identities row has
            reported a provably different build than this controller for 30m —
            longer than any rolling deploy should take. Signed wire formats (job
            dispatch, memory RPC, envelope sealing) are version-coupled, so this
            breaks jobs in ways that look like signature bugs; it cost several
            turns of misdiagnosis during the 2026-07-27 signing outage.
            Run get_platform_info and read the `fleet` section for the
            per-worker build_status and last_seen_at, or grep the controller log
            for event_kind="worker_build_skew". Then verify the controller and
            worker images were published from the same tree.
          action: |
            1. get_platform_info → `fleet`. Cross-check last_seen_at against
               the pods that actually exist.
            2. If the offending worker_id has no running pod, this is a GHOST
               ROW, not a live skew: the registry has no reaper, so a retired
               pod's identity stays ACTIVE forever. Find it with the controller
               CLI `list-worker-identities` and clear it with
               `deactivate-worker-identity --worker-id <id> --public-key <hex>`;
               the gauge drops on the next 60s sweep.
            3. If the pod IS running, it is genuinely on another image — roll it
               onto the controller's build. Do NOT silence this one: a skewed
               live worker fails signature verification in ways that read as
               crypto bugs.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.vault
    interval: 30s
    rules:

      # Vault's own metric: 1 = sealed, 0 = unsealed. Paging on sealed.
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "Vault is SEALED — all encrypted-at-rest ops will fail"
          description: |
            The Talos KEK backend is sealed. Every DEK wrap/unwrap will
            error until unseal completes. The vault-init Job unseals on
            pod restart — if it's not running, run:
              kubectl -n talos create job --from=cronjob/vault-init vault-init-manual
            Otherwise: `kubectl -n talos exec statefulset/talos-vault-0 -- \
              vault operator unseal <key-from-bootstrap.json>`.

      - alert: VaultHighLatency
        expr: histogram_quantile(0.99, rate(vault_core_handle_request_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Vault p99 request latency > 500ms for 10m"
          description: |
            Vault is slow. Every DEK decrypt goes through Vault transit,
            so controller-side DB reads will show elevated p99 too.
            Common causes: Vault PVC disk pressure, Vault CPU throttling.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.controller.health
    interval: 30s
    rules:
      - alert: TalosControllerDown
        expr: up{job="talos-controller"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Talos controller is not responding to Prometheus scrapes"
          description: |
            All N controller replicas have failed scrapes for 2m. Platform
            is down. Check: `kubectl -n talos get pods -l app.kubernetes.io/component=controller`.

      # Interactive-login failure rate. Population is method="password"
      # (talos_auth::AuthService::login) + method="oauth" (the controller's
      # oauth_callback_handler) — every attempt counted once, on success and
      # failure alike, so the ratio is well-defined. API-key validation is
      # deliberately NOT in these series: it runs on every GraphQL request
      # and would swamp the denominator, leaving a credential-stuffing burst
      # unable to move the ratio past the threshold.
      #
      # Both series were registered but never incremented until 2026-07-31,
      # so this alert could not fire at all — which is why its description
      # used to send the operator to `grep auth_failure` in the logs.
      #
      # KNOWN, DELIBERATE ASYMMETRY between the two methods, because an
      # operator reading a firing instance needs it. method="password" runs
      # behind CSRF + the distributed per-IP auth limiter, so its population
      # is hard to author from outside. method="oauth" is a plain
      # unauthenticated GET on `/auth/oauth/{provider}/callback`, proxied
      # publicly by the chart nginx with no per-IP limit — so anyone on the
      # internet can hold this ratio at 1.0 with ~1 req/min of
      # `?error=access_denied`, on a deployment whose real interactive login
      # volume is well under one per day. The drive direction is toward
      # FIRING, never toward suppressing (each such request counts as both an
      # attempt and a failure), so it is noise, not a blind spot — but the
      # first time this alert ever fires here, check `method`/`reason` before
      # concluding "credential stuffing". The break-down below is the first
      # step for exactly that reason.
      - alert: TalosControllerHighErrorRate
        expr: |
          sum(rate(talos_auth_failures_total[5m]))
          / sum(rate(talos_auth_attempts_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          category: abuse-or-broken
        annotations:
          summary: "Auth failure rate > 20% for 10m"
          description: |
            Either credential stuffing in progress, or an auth bug.
            Break down by cause first:
            `sum by (method, reason) (rate(talos_auth_failures_total[5m]))`.
            reason=invalid_password/lockout_triggered concentrated on one
            method is abuse; reason=error is the platform failing (DB down,
            token minting broken) and pairs with the DB-pool alerts.
            method=oauth,reason=provider_error alone — with password traffic
            quiet — is almost always an internet scanner hitting the public
            /auth/oauth/{provider}/callback redirect, not a login problem.
            Per-account detail (email, IP) is in `auth_audit_log` and the
            controller logs — deliberately not in the metric labels.

      # DEK cache unbounded growth (leak).
      - alert: TalosDEKCacheOverflow
        expr: talos_dek_cache_size > 10000
        for: 15m
        labels:
          severity: warning
          category: leak
        annotations:
          summary: "DEK cache has > 10k entries for 15m"
          description: |
            TTL eviction and write-path invalidation should bound this.
            Unbounded growth = a cache-invalidation bug or many distinct
            DEKs in flight (shouldn't normally happen).

  # ────────────────────────────────────────────────────────────────────
  - name: talos.backups
    interval: 1m
    rules:
      # Scraped from the drill script's metric output (see
      # deploy/observability/drill-textfile-exporter.md).
      #
      # allow-unobserved-metric: talos_backup_drill_* is a node_exporter
      # TEXTFILE series written by scripts/drills/backup-restore.sh, not a
      # metric registered in Rust — so structural check 65(c), which
      # requires every alerted talos_* series to be registered in a .rs
      # file, cannot see its producer. The producer is real; only its
      # language is different.
      - alert: TalosBackupRestoreDrillFailed
        expr: talos_backup_drill_last_success_timestamp_seconds < (time() - 14*86400)
        labels:
          severity: warning
          category: ops-hygiene
        annotations:
          summary: "No successful backup→restore drill in 14+ days"
          description: |
            scripts/drills/backup-restore.sh has either not run or is
            failing. A backup you have not restored is a hypothesis —
            run the drill now.

  # ────────────────────────────────────────────────────────────────────
  # Capacity / saturation. Series come from talos-controller
  # /metrics/prometheus — the DB-pool gauges are sampled every 15s by a
  # background task in controller main.rs. These fire BEFORE the failure
  # is user-visible (pool saturation → acquire-timeout → 503s), which the
  # crypto-invariant alerts above do not cover.
  - name: talos.capacity
    interval: 30s
    rules:
      # Postgres pool saturation. Each controller replica samples its own
      # process-local pool; the alert is per-replica (no aggregation) so a
      # single saturated replica pages even when others are healthy.
      - alert: TalosDBPoolSaturated
        expr: |
          talos_db_pool_in_use_connections
          / clamp_min(talos_db_pool_max_connections, 1) > 0.9
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "Postgres pool > 90% in-use on {{ $labels.instance }} for 5m"
          description: |
            In-use connections have exceeded 90% of DB_MAX_CONNECTIONS for
            5m. New acquisitions queue on the 10s acquire timeout, so this
            precedes a latency cliff / 503 cascade. Either raise
            DB_MAX_CONNECTIONS (and the backend's server-side limit), scale
            down controller replicas (the sum of per-replica pools must
            stay under the backend ceiling), or find the query holding
            connections (pg_stat_activity, state='active').

      - alert: TalosDBPoolExhausted
        expr: |
          talos_db_pool_in_use_connections
          >= clamp_min(talos_db_pool_max_connections, 1)
        for: 1m
        labels:
          severity: critical
          category: saturation
        annotations:
          summary: "Postgres pool fully exhausted on {{ $labels.instance }}"
          description: |
            Every pooled connection is checked out — new work blocks on the
            acquire timeout and requests are failing. See the runbook's
            pool-exhaustion section.

      - alert: TalosWorkerDown
        expr: up{job="talos-worker"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "A Talos worker is not responding to Prometheus scrapes"
          description: |
            Worker scrape failing for 2m — WASM execution capacity reduced
            or zero. Check: `kubectl -n talos get pods -l app.kubernetes.io/component=worker`.

  # ────────────────────────────────────────────────────────────────────
  # Infrastructure availability. These series come from kube-state-metrics
  # (bundled with kube-prometheus-stack — the same operator the
  # ServiceMonitors assume). If you don't run kube-state-metrics, these
  # alerts simply never fire; they are not a hard dependency. Tune the
  # `namespace` / `statefulset` matchers to your release name.
  - name: talos.infra.availability
    interval: 30s
    rules:
      # The four single-replica stateful components are SPOFs in the
      # in-cluster topology (postgres/neo4j/vault/minio). "0 ready" = down.
      # Production should prefer external-managed Postgres/Redis (see
      # docs/deployment.md) — these alerts cover the homelab/single-region
      # in-cluster path.
      - alert: TalosSingleReplicaInfraDown
        expr: |
          kube_statefulset_status_replicas_ready{statefulset=~".*(postgres|neo4j|vault|minio).*"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Stateful component {{ $labels.statefulset }} has 0 ready replicas"
          description: |
            A single-replica in-cluster datastore is down. For postgres
            this stops the platform; neo4j degrades graph-RAG only; vault
            blocks DEK unwrap (controller CrashLoops); minio blocks the
            WORM audit sink. Restore the pod, then check its PVC.

      # NATS is the only HA stateful component (3-replica quorum). Below
      # quorum (<2 ready) JetStream loses write availability.
      - alert: TalosNatsBelowQuorum
        expr: |
          kube_statefulset_status_replicas_ready{statefulset=~".*nats.*"} < 2
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "NATS cluster below quorum ({{ $value }} ready)"
          description: |
            Fewer than 2 of 3 NATS replicas are ready — the job queue and
            signed-RPC transport lose write availability. Check the NATS
            StatefulSet and PVCs.

      # Crash-looping pods anywhere in the release.
      - alert: TalosPodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~".*talos.*"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Pod {{ $labels.pod }} restarted > 5x in the last hour"
          description: |
            Container {{ $labels.container }} in pod {{ $labels.pod }} is
            crash-looping. Check logs and recent config/secret changes.
