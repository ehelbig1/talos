# Talos — crypto-invariant alert rules.
#
# Designed for Prometheus / Alertmanager. Alerts in this file MUST page
# operator attention — every one of them means either:
#   (a) encrypted-at-rest data is currently unreadable, or
#   (b) encrypted-at-rest data will be unreadable on the next restart.
#
# Series come from:
#   - talos-controller /metrics/prometheus (bearer PROMETHEUS_SCRAPE_TOKEN)
#   - vault /v1/sys/metrics?format=prometheus
#
# Apply to Prometheus via:
#   prometheus --config.file=... --rules.file=alerts.yaml
# or (kube-prometheus-stack):
#   kubectl -n monitoring create configmap talos-alerts --from-file=alerts.yaml
#   then reference it from a PrometheusRule CRD.
#
# ===========================================================================
# ABSENCE AUDIT, 2026-08-02 — every rule in this file was re-examined
# ===========================================================================
#
# In PromQL an ABSENT series and a series reading 0 are different, and every
# idiom used here (`== 0`, `< N`, `> N`, `rate(...) == 0`, `a / b`) treats
# absence as "no match". A detector can therefore be silenced by exactly the
# condition it detects. ONE rule in this file had that shape and is fixed:
# `TalosBackupRestoreDrillFailed`, where a drill that had NEVER run made "no
# successful drill in 14+ days" unfireable. Its sibling in the dev rules is
# `NoWASMExecutions` (observability/rules/alerts.yml); read that file's header for
# the full statement of the class.
#
# Every other rule here was left alone deliberately. Three categorical
# reasons, so they are not restated per rule:
#
#   1. THE SERIES CANNOT BE ABSENT. A non-`Vec` prometheus `Counter` or
#      `IntGauge` is exported from the moment it is registered, so the
#      orphan gauges, pool gauges, DEK-cache gauge, build-skew gauge and the
#      plain start-row/TOFU counters always have a sample. `up` is
#      synthesised for every configured target.
#   2. THE SERIES CAN BE ABSENT AND THAT IS THE HEALTHY STATE. The alerted
#      `CounterVec`s (`talos_kek_decrypt_failures_total`,
#      `talos_memory_write_failures_total`,
#      `talos_module_payload_encryption_failures_total`,
#      `talos_auth_*`) are all `> threshold` shapes: no failures, no series,
#      no alert — correct. These are additionally pre-seeded at 0 in
#      talos-metrics as of this change, so a dashboard can now distinguish
#      "detector present and quiet" from "detector deleted" — but note that
#      the seed proves REGISTRATION, not that the incrementing call site
#      still exists. Check 58 and the per-metric unit tests are what guard
#      the call site.
#   3. THE SERIES ISN'T OURS. `vault_*` and `kube_*` come from Vault and
#      kube-state-metrics; their absence means "not deployed / not
#      installed", a topology fact rather than an outage. An `absent()` arm
#      on those would page `critical` forever on every cluster that
#      legitimately does not run them. Marked at each site.
#
# The rule of thumb this leaves: add an `absent()` arm when the missing
# series is one TALOS ITSELF is supposed to produce, and never when its
# absence is a legitimate deployment choice. Keep the severity the arm
# stands in for.
groups:
  # ────────────────────────────────────────────────────────────────────
  - name: talos.crypto.invariants
    interval: 30s
    rules:

      # ── DEK orphan gauges — value > 0 means data loss already occurred.
      # These gauges are computed by a 60s background loop in controller
      # main.rs (SELECT COUNT(*) with NOT EXISTS) so we scrape the DB
      # only indirectly. Paging threshold: ANY non-zero value for 5m.
      - alert: TalosActorMemoryDEKOrphaned
        expr: talos_actor_memory_orphaned_rows > 0
        for: 5m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # The three crypto-invariant gauges are republished by the 60s orphan scan at
        # background.rs:913-963, whose first tick is skipped, so for ~60s after every
        # controller start they serve their registration-time 0. `for: 5m` means a
        # restart RESOLVES this critical data-loss alert and re-arms the full five
        # minutes; a controller restarting faster than that can never fire it. 5m
        # comfortably exceeds the 60s window. The cost is that genuinely-repaired
        # orphans keep this firing for up to 5 extra minutes, which for a data-loss
        # alert is the right side to err on.
        keep_firing_for: 5m
        labels:
          severity: critical
          category: data-loss
        # NO `runbook:` LABEL, AND ITS ABSENCE IS THE FIX. This alert carried
        # the only one in the file — 1 of 45 — and it was broken twice over:
        # a literal unsubstituted `OWNER` in the URL (this repo is `ehelbig1`),
        # and a `#dek-orphan` anchor that has never existed in
        # docs/security/operational-runbook.md. So it pointed nowhere, on the
        # one alert whose payloads are UNRECOVERABLE.
        #
        # Fixing the URL would have left a worse problem than it solved: an
        # operator who learns "read the runbook label" gets nothing on the
        # other 44, which is a coverage claim the file cannot honour. Those 44
        # put remediation in an `action:` ANNOTATION, which is also the correct
        # home — a label is part of an alert's IDENTITY (it participates in
        # grouping, inhibition and dedup in alertmanager.yml), not a place for
        # a human-readable pointer. This alert's own `action:` below already
        # carries the full procedure, so nothing was lost with the label.
        #
        # observability/alerts_chart_test.yml PINNED the broken URL as an
        # expected label, so the promtool suite was green the whole time it
        # pointed nowhere — a pin over a wrong value certifies nothing. That
        # expectation is removed in the same commit.
        annotations:
          summary: "{{ $value }} actor_memory row(s) reference a missing DEK"
          description: |
            actor_memory.value_key_id points at an encryption_keys row that
            no longer exists. This should be structurally impossible under
            the ON DELETE RESTRICT FK — investigate for:
              - partial DB restore (pg_restore without encryption_keys)
              - manual DEK deletion with FK triggers disabled
              - Vault master-key rotation without DEK rewrap
            Affected rows are UNRECOVERABLE. Do not delete them without
            a decision to abandon their payloads.
          action: |
            1. kubectl -n talos exec deploy/talos-controller -- \
                 psql $DATABASE_URL -c "SELECT id, actor_id, key, created_at \
                   FROM actor_memory am \
                   WHERE NOT EXISTS ( \
                     SELECT 1 FROM encryption_keys ek WHERE ek.id = am.value_key_id \
                   );"
            2. Decide: delete orphans, or hold for forensic dump before delete.
            3. There is deliberately no further pointer here. This step used to
               read "Follow docs/security/operational-runbook.md § DEK orphan"
               and that section has never existed, so the two steps above ARE
               the procedure. Nothing recovers the rows; the only decision is
               whether to dump them first.

      - alert: TalosModuleExecutionPayloadOrphaned
        expr: talos_module_execution_orphaned_rows > 0
        for: 5m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # Same 60s scan, same 60s unmeasured-zero window as
        # TalosActorMemoryDEKOrphaned above.
        keep_firing_for: 5m
        labels:
          severity: critical
          category: data-loss
        annotations:
          summary: "{{ $value }} module_executions row(s) reference a missing DEK"
          description: |
            module_executions.payload_enc_key_id FK broken. Execution
            metadata survives; input/output/trigger_metadata_enc are
            unrecoverable. NULL the _enc columns once a decision is
            made — see 2026-04-24 cleanup precedent.

      - alert: TalosWorkflowOutputPayloadOrphaned
        expr: talos_workflow_execution_orphaned_rows > 0
        for: 5m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # Same 60s scan, same 60s unmeasured-zero window as
        # TalosActorMemoryDEKOrphaned above.
        keep_firing_for: 5m
        labels:
          severity: critical
          category: data-loss
        annotations:
          summary: "{{ $value }} workflow_executions row(s) reference a missing DEK"
          description: |
            workflow_executions.output_enc_key_id FK broken. Output data
            unrecoverable.

      # ── THE META-DETECTOR for the three alerts above.
      #
      # All three read `> 0`, and a registered prometheus IntGauge exports
      # its initial 0 the moment /metrics is scraped. So `== 0` covers two
      # states that are the same number and opposite in meaning: "measured,
      # no orphans" and "the SELECT errored, nothing was ever measured".
      # Until 2026-08-20 the producer was three
      # `if let Ok(row) = …{ gauge.set(row) }` blocks with no `else` and no
      # log, so a failing query — a permissions change, a column rename, a
      # `statement_timeout`, a partial restore that dropped a table — turned
      # all three CRITICAL data-loss detectors off silently and left them
      # reading "all clear". These alerts are the only automated notice that
      # at-rest ciphertext has become unrecoverable; nothing else in the
      # platform reports that condition.
      #
      # `talos_crypto_orphan_scan_last_success_timestamp_seconds` advances
      # only on a sweep in which ALL THREE probes returned. A held gauge is
      # then distinguishable from a measured one, which is the whole point —
      # the counts themselves were deliberately NOT changed (they hold their
      # last value rather than zeroing, and no sentinel is folded into them,
      # because every other consumer reads them as row counts).
      #
      # WHY A FRESHNESS STAMP AND NOT A `blind == 1` GAUGE. A boolean blind
      # flag is itself an unmeasured zero: a sweep task that never spawns or
      # panics leaves it at 0 forever, reading "not blind" — this defect one
      # level up, which is precisely the mistake this rule exists to stop
      # repeating. A timestamp degrades correctly in all four cases: query
      # error, task death, task never spawned, and a controller build that
      # predates the sweep (0 from registration = maximally stale). Same
      # form as TalosBackupRestoreDrillFailed below.
      #
      # NO absent() ARM, same reasoning as TalosWorkerBuildSkew and
      # TalosWorkerIdentityReapBlinded: this is a plain registered Gauge,
      # exported from registration on every controller carrying this build,
      # so absence means the controller is down (TalosControllerDown owns
      # that) or is running a build older than 2026-08-20. An absent() arm
      # would page permanently through any staged rollout of an older
      # controller image, and a permanently-red alert trains operators to
      # ignore red.
      #
      # THRESHOLDS. The sweep runs every 60s, so 600s is ten consecutive
      # missed sweeps and `for: 15m` requires the condition to hold across
      # another fifteen — a total of ~25 minutes of continuous blindness
      # before this fires. That is deliberately far outside any single DB
      # blip, a rolling controller restart, or the ~60s post-boot window in
      # which the stamp still reads 0 because the first tick is skipped.
      # Chosen over a tighter bound because this is a detector-health alert,
      # not the data-loss alert itself: the cost of being 25 minutes late is
      # 25 minutes, and the cost of flapping is that the next real one is
      # ignored.
      #
      # PER-INSTANCE, NOT `max()`. The subtraction keeps the source series'
      # labels, so a two-replica controller deployment produces one alert per
      # replica. That is deliberate and differs from
      # TalosWorkerIdentityReapBlinded: each controller runs its OWN sweep
      # against its OWN pool, so one blind replica is a real fault on that
      # replica, and collapsing with max() would fire without saying which
      # one to look at. Alertmanager groups them (group_by is
      # [alertname, category]), so this is one notification either way.
      #
      # SEVERITY IS `warning`, MATCHING THE OTHER TWO BLIND DETECTORS
      # (TalosFuelHeadroomDetectorBlind, TalosWorkerIdentityReapBlinded) —
      # stated rather than implied, because the alerts it guards are
      # `critical`. Being unable to measure is not the same event as data
      # loss, and routing this at `critical` would page on a DB hiccup with
      # the same urgency as unrecoverable ciphertext. An operator who wants
      # it louder should raise it here rather than assume it is already.
      - alert: TalosCryptoOrphanDetectorBlind
        expr: |
          time() - talos_crypto_orphan_scan_last_success_timestamp_seconds > 600
        for: 15m
        # ANTI-FLAP, same convention as the rest of this file but for a
        # DIFFERENT mechanism, stated rather than implied. The neighbours
        # carry keep_firing_for because a restart makes their gauge read an
        # unmeasured 0, which RESOLVES them. A restart cannot resolve this one
        # by value — it resets the stamp to 0, which is maximally stale, i.e.
        # more firing, not less. What a restart does do is break the SERIES
        # (the instance disappears and returns), and a gap drops the alert
        # back to inactive and re-arms the full 15m. keep_firing_for holds it
        # across that gap so a controller that is both blind AND restarting
        # cannot ride out the detector indefinitely.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: observability
        annotations:
          summary: "Crypto-orphan detector has not completed a sweep in 10+ minutes"
          description: |
            No crypto-orphan sweep has measured all three tables for over ten
            minutes, so `talos_actor_memory_orphaned_rows`,
            `talos_module_execution_orphaned_rows` and
            `talos_workflow_execution_orphaned_rows` are holding values
            nothing measured — and their three `critical` data-loss alerts
            cannot fire. If unrecoverable ciphertext appears while this is
            firing, you will not be told.

            A value of 0 for the stamp means the sweep has NEVER completed on
            this controller: either it has just started (it clears within
            ~60s) or the sweep task is not running at all.
          action: |
            1. Controller log, target=talos_crypto,
               event_kind=crypto_orphan_probe_failed — it names the failing
               table and carries the driver error. No line at all means the
               sweep task itself is not running.
            2. Run the three counts by hand; the actor_memory one is in
               TalosActorMemoryDEKOrphaned's action block above. If they
               return, the fault is in the controller, not the data.
            3. Until this clears, treat the three orphan gauges as unknown,
               not as zero.

      # ── KEK decrypt failures — rate > 0 means current write path is
      # broken. "both" means EVERY CONFIGURED provider failed, so the read
      # is terminally broken; it is emitted when active+legacy both fail AND
      # (since 2026-07-31) when the active provider fails with no legacy
      # wired at all. That second arm is the difference between this alert
      # being fireable and being decorative on the two supported no-legacy
      # postures — KEK_PROVIDER=env (legacy hardcoded None) and
      # KEK_PROVIDER=vault + KEK_DISABLE_LEGACY=true, the documented Phase-5
      # end state. Before it, a total KEK outage on those postures surfaced
      # ONLY on the warning-level Active alert below, whose own summary
      # claims a legacy fallback is carrying the load that does not exist.
      - alert: TalosKEKDecryptFailuresBoth
        expr: rate(talos_kek_decrypt_failures_total{provider="both"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "KEK decrypt failing on EVERY configured provider"
          description: |
            No configured KEK provider could unwrap a DEK — the active one
            (Vault transit or env) failed and either the legacy fallback
            failed too or no legacy is wired. Encrypted-at-rest reads are
            currently failing. Most common cause: Vault's transit key was
            rotated/deleted without rewrapping DEKs, and the env KEK master
            key doesn't match either (or there is no env KEK to fall back
            to, because KEK_DISABLE_LEGACY=true).
          action: |
            1. Check Vault transit key version: `vault read transit/keys/talos-kek`
            2. Check controller KEK_PROVIDER env: matches Vault or env?
            3. Review `docs/security/operational-runbook.md` § 1.4 (Lost-KEK
               disaster). This step used to name `docs/security/kek-to-kms-plan.md`,
               which has never existed in this repo — retargeted, not invented:
               § 1.4 is the recovery content it was reaching for.
            4. If Vault is unreachable, failing over to KEK_PROVIDER=env
               works iff TALOS_MASTER_KEY is the key the DEKs were
               originally wrapped with.

      - alert: TalosKEKDecryptFailuresActive
        expr: rate(talos_kek_decrypt_failures_total{provider="active"}[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          category: crypto-degraded
        annotations:
          summary: "KEK active-provider decrypt failing"
          description: |
            The active KEK provider is failing decryption. If a legacy
            provider is wired it is carrying the load — survivable short
            term, critical once legacy goes too. If no legacy is wired
            (KEK_PROVIDER=env, or vault with KEK_DISABLE_LEGACY=true) then
            reads are ALREADY failing and TalosKEKDecryptFailuresBoth is
            firing alongside this one; treat that pair as the critical case.
            Often means a misconfigured Vault token or network partition.

      # ── memory-write failures — node outputs are being lost.
      - alert: TalosMemoryWriteFailuresCrypto
        expr: rate(talos_memory_write_failures_total{reason="crypto"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "__memory_write__ persist failing due to crypto errors"
          description: |
            Node outputs returning `__memory_write__` are being silently
            dropped because the encryption path is broken. Every dropped
            write loses actor state. Historically this fires when the
            Vault KEK can't be reached — see the 2026-04-24 `-dev` mode
            persistence bug for the canonical pattern.

      - alert: TalosMemoryWriteFailuresDB
        expr: rate(talos_memory_write_failures_total{reason="db"}[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: persistence-degraded
        annotations:
          summary: "__memory_write__ DB errors sustained"
          description: |
            Memory writes failing at the DB layer at {{ $value }} per second.
            Common causes: pool saturation, statement timeout, migration
            lock. Check controller DB pool metrics and Postgres load.

      # ── Module-execution payload encryption failures.
      - alert: TalosModulePayloadEncryptionFailures
        expr: rate(talos_module_payload_encryption_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "module_executions payload encryption/decryption failing"
          description: |
            op={{ $labels.op }} stage={{ $labels.stage }} rate={{ $value }}/s.
            Input/output/trigger_metadata payloads are either not being
            encrypted on write or not being decrypted on read.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.reliability
    interval: 30s
    rules:

      # ── Workflow-execution failure rate — closes the detect→NOTIFY loop.
      # get_health_dashboard / the operator digest already SHOW
      # failure_rate_24h_pct, but nothing PUSHED an alert; a sustained
      # outage (e.g. the 2026-07-23 worker-DNS incident that failed ~125
      # scheduled runs) went unpaged. Fires on the ratio of terminal
      # failures to all terminal executions over 15m. Both series are
      # pre-seeded at 0 (talos_metrics::TalosMetrics::new) so the ratio is
      # well-defined in steady state; the >0.05 denominator guard avoids
      # dividing a handful of executions into a scary percentage on a quiet
      # cluster.
      - alert: TalosWorkflowFailureRateHigh
        expr: |
          (
            sum(rate(talos_workflow_executions_total{status="failure"}[15m]))
            /
            clamp_min(sum(rate(talos_workflow_executions_total[15m])), 0.001)
          ) > 0.25
          and
          sum(rate(talos_workflow_executions_total[15m])) > 0.005
        for: 10m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Workflow failure rate above 25% (sustained 10m)"
          description: |
            {{ $value | humanizePercentage }} of terminal workflow executions
            are failing over the last 15m. This is the push-alert companion to
            the get_health_dashboard `failure_rate_24h_pct` / operator-digest
            `reliability` signals. Common causes: a sustained upstream/egress
            outage (worker DNS or a third-party API down — the per-host circuit
            breaker should be fast-failing those), a bad deploy, or a
            provider-credential expiry. Check top_failures_24h via
            get_error_report (no workflow_id → platform-wide rollup) and
            tail_worker_logs on a recent failed execution for the node-level
            cause.

      # ── The boot herd: every deploy failing every due schedule.
      # Grounded 2026-08-10. The controller starts, its scheduler's first
      # poll fires ~1.7s later, and EVERY schedule that came due while the
      # process was down is dispatched at once. That boot released 15
      # executions within 20ms; their WASM jobs opened ~16 simultaneous TLS
      # connects to gmail.googleapis.com / www.googleapis.com, the connects
      # started failing, five consecutive failures tripped the WORKER's
      # per-host circuit breaker, and the remaining workflows then failed
      # instantly against an OPEN breaker. 8 of 19 runs failed; three more
      # were refused by the actor-budget backstop the burst had exhausted,
      # two of them DAILY crons (so "the next occurrence will retry" meant
      # tomorrow). Gmail itself was healthy throughout — it returned HTTP 200
      # sixteen seconds before the first failure. Everything recovered on its
      # own within a minute and NOTHING ALERTED, which is why it survived
      # repeated deploys: the platform looks fine by the time anyone looks.
      #
      # Why phase= exists at all: a startup-window failure and a steady-state
      # failure have completely different causes, and pooling them buries a
      # defect that fires on EVERY deploy inside TalosWorkflowFailureRateHigh's
      # background rate — 8 failures against a day of traffic never reaches a
      # 25% ratio over 15m.
      #
      # WHAT THE CONDITION CAN AND CANNOT SUPPORT. This was `> 0` on
      # failed|skipped, i.e. ANY engine error on ANY workflow in the boot
      # backlog, while the text told operators "the backlog still overwhelmed
      # something" and "that ceiling was NOT enough". A single expired OAuth
      # token trips that, and on a fleet with 15 boot schedules it would fire
      # on most deploys with a wrong cause — the misleading-report-field class
      # this whole arc has been mining. Two arms now, and neither alone is
      # sufficient:
      #   * more than ONE run — a lone chronically-broken workflow is not a
      #     herd, and it fires every deploy. The threshold is 1.5, not 1,
      #     because increase() EXTRAPOLATES to the window edges: a single
      #     event over a 30m window commonly reads as ~1.03 on real scrape
      #     alignment, so `> 1` would fire on exactly the case being excluded.
      #     1.5 is how you say "more than one" to an extrapolating estimator;
      #   * a MAJORITY of the startup backlog — herd damage is broad by
      #     construction (5 consecutive connect failures open a per-host
      #     breaker and every later workflow declaring that host dies against
      #     it), whereas chronic per-workflow breakage is a small fixed
      #     fraction of a growing backlog.
      # On the 2026-08-10 sample: 15 dispatched, 8 failed + 3 skipped = 0.73.
      # Both arms clear comfortably. The description no longer asserts a cause;
      # the herd signature is offered as the first hypothesis to check.
      #
      # outcome="skipped" is included on purpose: a run refused for CAPACITY
      # (concurrency cap or actor budget) is not a soft outcome, it is a lost
      # run. outcome="denied" (actor archived, capability ceiling) is NOT —
      # those are chronic configuration states, unchanged by how many schedules
      # came due at once, so folding them in would reintroduce the fire-on-every
      # -deploy defect through the other door. "fenced" (superseded by a
      # crash-recovery reclaim) is excluded for the same reason.
      #
      # All ten talos_scheduler_dispatches_total series are pre-seeded to 0 at
      # registration, so `increase(...)` is well-defined from the first scrape.
      # Without that seeding this detector would be silenced by exactly the
      # condition it detects — an absent counter matches nothing, so a
      # controller whose scheduler never dispatched anything would look
      # identical to one dispatching cleanly (#625). The seeding also makes the
      # ratio arm safe on a cold controller: numerator and denominator are both
      # 0, 0/0 is NaN, and NaN > 0.5 is false, so the alert stays silent rather
      # than dividing by an absent series.
      - alert: TalosSchedulerStartupHerdNotAbsorbed
        expr: |
          (
            sum by (outcome) (
              increase(talos_scheduler_dispatches_total{phase="startup",outcome=~"failed|skipped"}[30m])
            ) > 1.5
          )
          and on()
          (
            sum(increase(talos_scheduler_dispatches_total{phase="startup",outcome=~"failed|skipped"}[30m]))
            /
            sum(increase(talos_scheduler_dispatches_total{phase="startup"}[30m]))
            > 0.5
          )
        for: 0m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Startup schedule backlog not absorbed ({{ $value }} {{ $labels.outcome }})"
          description: |
            {{ $value }} scheduled workflow run(s) from the STARTUP BACKLOG —
            the schedules that came due while the controller was restarting —
            ended `{{ $labels.outcome }}`, and the failed+skipped runs are a
            MAJORITY of that backlog.

            What this number knows: the outcome of each startup-phase dispatch.
            What it does NOT know: why. A broad failure across the boot backlog
            is the SIGNATURE of the 2026-08-10 herd, and the majority arm is
            what distinguishes it from a couple of individually-broken
            workflows — but a shared upstream outage, an expired credential
            common to several workflows, or a bad deploy produce the same shape.
            Confirm the cause below rather than assuming the ceiling failed.

            outcome="failed": first hypothesis is the worker's per-host circuit
            breaker opening. Check it directly:
            `sum(increase(talos_circuit_breaker_opens_total[30m]))` and
            `sum by (reason) (increase(talos_circuit_breaker_blocks_total[30m]))`.
            Those series are produced by the WORKER (`job="talos-worker"`) —
            the breaker is a per-process singleton there and the controller
            cannot see it, so the controller-side error text ("circuit open for
            host X") is a CONSEQUENCE reported minutes into the incident, not
            its cause. `blocks{reason="cooldown"}` = HTTP requests rejected
            without being sent; `blocks{reason="retry_gate"}` = a job or step
            that failed while one of its declared hosts had an open circuit,
            which is the arm that produces that controller-side text.
            The counters deliberately carry NO host label, so for WHICH host
            grep the worker log for "Circuit breaker open - rejecting HTTP
            request" (fires on every refused request, both block arms, and
            carries host=) and "outbound HTTP request failed (sanitized
            transport detail)". Do NOT grep only for "Circuit breaker opened":
            that line is emitted on the STATE TRANSITION, which may be many
            hours before the failure you are reading — in the 2026-08-11
            incident the last one was 22 hours earlier — and the
            half_open_exhausted arm emits no line of its own at all.
            If opens and blocks are both flat and the worker log shows no
            transport errors, this is not a herd — read the individual
            error_messages. THE LIMIT ON THAT LAST SENTENCE, and it is wider
            than it looks: `wit_http::fetch` is the ONLY egress surface the
            breaker instruments. Webhook sends, GraphQL, HTTP streaming, S3,
            the LLM and embedding clients, transactional email and batch
            `wit_http::fetch_all` all leave the worker without touching it, so
            flat counters neither exonerate nor implicate the breaker for a
            module built on any of those. The LLM path in particular is on the
            hot path of most workflows here.

            outcome="skipped": runs were refused for CAPACITY — the
            per-workflow concurrency cap, or an actor's per-minute execution
            budget the burst exhausted. For a daily cron that means the run is
            lost until tomorrow, not retried shortly.
          action: |
            1. Correlate: `talos_scheduler_dispatches_total{phase="startup"}`
               (all five outcomes; they partition the backlog) against the
               controller log line `event_kind="scheduler_startup_backlog"`,
               which records how many schedules the boot backlog contained. The
               two should agree — every terminal path is counted.
            2. Check `talos_circuit_breaker_opens_total` /
               `talos_circuit_breaker_blocks_total` (and the worker log for the
               host). If both are flat, treat this as N individual workflow
               failures and read their error_messages; the ceiling is not
               implicated — unless the workflows egress by any route other than
               `wit_http::fetch` (LLM, webhook, GraphQL, stream, S3, email,
               batch `fetch_all`), none of which the breaker instruments.
            3. If the herd signature IS present, lower
               SCHEDULER_STARTUP_MAX_CONCURRENT (default 4). Do NOT raise
               SCHEDULER_MAX_CONCURRENT_EXECUTIONS — that is the steady-state
               ceiling and raising it makes the burst worse.
            4. If outcome="skipped" dominates, the actor's per-minute budget is
               the binding constraint rather than egress; raise the budget or
               stagger the cron expressions so fewer schedules share a boot.

      # ── The worker's per-host circuit breaker is refusing work.
      #
      # The alert above, and the failure-rate alert above THAT, both name this
      # breaker as the first hypothesis. Until 2026-08-11 there was nothing to
      # check it with: `talos_circuit_breaker_opens_total` and
      # `talos_circuit_breaker_blocks_total` were declared and registered in
      # the CONTROLLER's registry and had zero increment sites anywhere in the
      # workspace, because the breaker they name is a per-process singleton
      # inside the WORKER. Both exported a flat 0 forever — an operator who
      # followed the runbook, queried the obvious name, and read `0` would have
      # ruled the breaker OUT of an incident it had caused. They are now
      # produced by the worker, under the same names.
      #
      # WHAT THIS FIRES ON: work actually REFUSED, not merely a state change.
      # An open circuit that nothing subsequently calls costs nothing; a block
      # is a request or a retry that did not happen, which on this platform's
      # scheduled workload is a lost run (a daily cron's "it will retry" means
      # tomorrow). Opens are the leading indicator and are cited in the
      # description rather than alerted on separately — `opens > 0` with
      # `blocks == 0` is a breaker doing its job silently and well.
      #
      # WHY `> 0` AND NOT A RATE THRESHOLD: the observed incidents produced ONE
      # or TWO blocks each (pa-meeting-prep, 2026-08-10 and 2026-08-11 — one
      # per reason arm), each costing a whole scheduled run. A rate threshold
      # calibrated to survive those would be calibrated to miss them.
      #
      # WHY `sum by (reason)` AND NOT A BARE `sum`: the three arms are three
      # different operator situations and the label is the only thing that
      # distinguishes them — see the description. Summing across INSTANCES is
      # deliberate (a fleet-level view); summing across reasons would not be.
      #
      # The series are pre-seeded at 0 by the worker at startup
      # (circuit_breaker.rs::seed_circuit_breaker_series), so `increase() > 0`
      # is well-defined on a worker that has never tripped the breaker rather
      # than evaluating over an absent series. No absent() arm: absence here
      # means the worker is not being scraped at all, which is TalosWorkerDown's
      # job, not this rule's.
      #
      # WHAT THIS RULE IS BLIND TO, stated because the description tells an
      # operator to reason from it: `wit_http::fetch` is the ONLY outbound-HTTP
      # surface in the worker that the breaker instruments. `wit_webhook::send`,
      # `wit_graphql::execute`, HTTP streaming, the four S3 operations, the LLM
      # tool-call / completion / embedding clients and transactional email all
      # egress without consulting it or recording an outcome, as does batch
      # `wit_http::fetch_all`. A module using any of them can neither trip the
      # breaker nor be refused by it, so both counters stay flat no matter how
      # badly that module's upstream is failing.
      #
      # This was previously written as a `fetch_all`-only exception, with the
      # mitigation that no shipped template calls `fetch_all`. That is still
      # true of `fetch_all` and understated the rest: the LLM path is on the hot
      # path of most workflows on this platform TODAY, so the blindness is live
      # rather than latent. Extending the breaker is argued at `fetch_all`'s
      # `send()` in `talos-worker-runtime/src/host/http.rs`, including why it is
      # a design change (a batch of N to one host is not N independent trials)
      # rather than a line.
      #
      # `{{ $value }}` is rendered through `printf "%.0f"` everywhere it
      # appears. `increase()` over a counter extrapolates and returns a FLOAT:
      # a single block in a 15m window renders as
      # "refused 1.6666666666666667 request(s)" un-formatted, which reads as a
      # broken page rather than an incident. The extrapolation is also why the
      # rounded number is an ESTIMATE of the count, not the count — the
      # description says so.
      - alert: TalosWorkerCircuitBreakerBlocking
        expr: sum by (reason) (increase(talos_circuit_breaker_blocks_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Worker circuit breaker refused ~{{ $value | printf \"%.0f\" }} request(s) ({{ $labels.reason }})"
          description: |
            The worker's per-host outbound-HTTP circuit breaker refused about
            {{ $value | printf "%.0f" }} unit(s) of work in the last 15m with
            reason="{{ $labels.reason }}". ("About": `increase()` extrapolates
            to the window edges, so treat the number as a magnitude and the
            alert firing at all as the fact.) Every unit is a request that was
            never sent or a job that failed with the breaker as its stated
            reason — see the per-arm meanings below, which differ in whether
            work was actually lost.

            What the reason arm means:
              cooldown            — the circuit for some host is OPEN and still
                                    inside its cooldown; the HTTP call was
                                    rejected without leaving the box. Lost work,
                                    unambiguously.
              half_open_exhausted — the circuit is under trial and its trial
                                    tokens are spent, so this call was refused
                                    to protect the trial. Expected in small
                                    numbers during recovery; sustained means the
                                    trials keep failing. It does NOT imply
                                    concurrent traffic: a trial that CONCLUDES
                                    does not return its token, so two failed
                                    trials plus one still in flight is enough
                                    to refuse the next caller. It no longer
                                    means the circuit is STRANDED — see the end
                                    of this description.
              retry_gate          — a job or pipeline step failed while one of
                                    its DECLARED hosts had an open circuit, so
                                    the breaker supplied the failure reason and
                                    skipped any remaining in-worker retries.
                                    This is the arm behind the controller-side
                                    text "circuit open for host X".

            Do NOT read retry_gate as "a retry was lost". The gate is evaluated
            BEFORE the retry-budget test on both of its paths, so it also counts
            jobs and steps that had NO retries configured — and zero retries is
            the platform's documented default for state-changing and
            governance-world modules, including both calendar nodes in the
            2026-08-11 incident. For those the outcome was identical with and
            without the gate; only the error TEXT changed. What the arm reliably
            means is "this failure happened with the breaker already open for a
            host it declared", which is what you want for attribution.

            The two request-refusing arms are NOT distinguishable from the
            execution record. `cooldown` and `half_open_exhausted` share one
            emit site in the worker (`host/http.rs`), so both surface to the
            guest as `networkerror` and both stamp the execution error with
            `[reason_class=circuit-open]`. Only this metric's `reason` label
            separates them — which is the whole reason the label exists. Do not
            infer the arm from an execution's error text.

            What this number does NOT know: WHICH host, and WHY it was failing.
            The counters carry no host label on purpose — the host reaching the
            breaker derives from a guest-supplied URL bounded only by a module's
            own `allowed_hosts` (which may be `*`), so it is not a bounded label
            source. The host is in the worker log, on every refused request.

            Also NOT knowable from here: whether the upstream is genuinely down.
            OPENING a circuit still requires reqwest TRANSPORT errors — an HTTP
            401, 429 or 500 cannot open one — so a first trip means
            connect/DNS/TLS/reset failures, OR the worker's own client timeout
            (30s default), which a slow-but-alive upstream can produce. That
            restriction is a TENANCY boundary, not an oversight: the breaker is
            keyed by host alone and there is one instance per worker process,
            shared by every user on the platform, so letting a 401 (one user's
            expired token) or a 429 (one user's quota) open a circuit would take
            that host away from every other user.

            A 5xx DOES decide a recovery trial, as of 2026-08-12. Once a
            circuit is already open, a half-open trial answered with 5xx counts
            as a FAILED trial and the circuit stays open — where it previously
            counted as a success and could CLOSE the circuit against a host
            serving nothing but 503. So a `reopened` transition can now mean
            "the host answered, badly", not only "the host was unreachable".
            EVERY 4xx, INCLUDING 429, still counts as a SUCCESSFUL trial: the
            host is alive and serving, which is the only question a trial is
            entitled to ask, and the credential behind a 401 or the quota
            behind a 429 belongs to one user rather than to the host this
            breaker is keyed by. (429 briefly failed a trial during development
            and was reversed before release — a per-user quota error would have
            re-opened the circuit for every other tenant.) The accepted cost,
            stated so it is not discovered during an incident: with the shipped
            defaults of 3 trial requests and a 0.8 success rate, ONE 5xx
            anywhere in a trial period re-opens it. So if one tenant's payload
            draws a 500 from a host that serves everyone else perfectly, and
            that request takes a trial token, the others stay blocked for
            another cooldown. It can prolong an outage; it cannot start one.

            How to read a SUSTAINED half_open_exhausted, and what changed on
            2026-08-12: it used to be the signature of a STRANDED circuit. The
            half-open state has no time bound, and paths existed that spent a
            trial token without ever recording an outcome (an unresolvable
            `vault://` header was the deterministic one; task cancellation the
            other), so a host that leaked all three tokens refused every later
            request for the life of the worker process — this is what took
            www.googleapis.com out from 2026-08-11 11:35 until a container
            recreate at 23:06. Fixed: admission is now an RAII permit whose
            `Drop` repays an unused trial token, so an unsettled request — early
            return, `?`, panic, or a cancelled future — costs nothing. Sustained
            half_open_exhausted now means what it says: trials are being taken
            and concluding badly. Do NOT go hunting for three concurrent
            requests — a trial that concludes does not repay its token, so two
            sequential failed trials leave one, and a single caller arriving
            while that last trial is in flight is refused. Two-way is enough,
            and this change made it MORE likely rather than less, because a 5xx
            now CONCLUDES a trial as a failure where it previously counted as a
            success. Against a host you have independently confirmed is
            HEALTHY it is a NEW defect rather than the old one — capture the
            worker log BEFORE restarting anything, since a restart destroys the
            evidence and used to be the only remedy.
          action: |
            1. `sum(increase(talos_circuit_breaker_opens_total[30m])) by (transition)`
               — `opened` is a first trip, `reopened` means a host came back and
               immediately failed its trial again, i.e. a longer outage than the
               first open suggested.
            2. Worker log, same window. The line that fires on EVERY refused
               request, in both request-refusing arms, and carries the host is
               "Circuit breaker open - rejecting HTTP request". Use that one.
               "Circuit breaker opened" marks the STATE TRANSITION, which can
               predate the failure you are investigating by hours — on
               2026-08-11 the circuit had been half-open for 22 of them — and
               the half_open_exhausted arm logs nothing of its own at all. For
               the transport cause, "outbound HTTP request failed (sanitized
               transport detail)". Container logs are lost on recreate — pull
               them before restarting anything.
            3. Confirm the upstream independently before tuning the breaker. Do
               NOT raise CIRCUIT_BREAKER_FAILURE_THRESHOLD to make the alert
               stop; that removes the protection, not the outage.
            4. If the trips cluster at controller boot, this is the startup herd
               — see TalosSchedulerStartupHerdNotAbsorbed and lower
               SCHEDULER_STARTUP_MAX_CONCURRENT rather than touching the breaker.

      # ── The scheduler is running but dispatching NOTHING.
      # The fleet-readiness barrier refuses to dispatch while the controller's
      # NATS heartbeat view contains no live worker — dispatching into an
      # invisible fleet is what produced the herd above. A hold is safe and
      # lossless (no schedule state is advanced, so everything still fires
      # once a worker appears) and a couple of holds at boot are NORMAL: a
      # worker that booted before the controller subscribed loses its first
      # heartbeat outright, because NATS core delivery is not retained.
      #
      # SUSTAINED holding is a different thing entirely: it means no scheduled
      # work is running at all, silently, while the controller is up and
      # healthy by every other measure. TalosWorkerDown covers the worker's own
      # absence; this covers the consequence that actually costs the user
      # something. Threshold ~10 holds ≈ 2.5 minutes of continuous holding at
      # the 15s poll interval, so a normal boot cannot reach it.
      - alert: TalosSchedulerDispatchHeldNoFleet
        expr: increase(talos_scheduler_readiness_holds_total[15m]) > 10
        for: 0m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Scheduler is holding all dispatch — no worker visible in the fleet view"
          description: |
            The scheduler has held {{ $value }} poll iterations in the last 15m
            because `talos_worker_fleet::WorkerManager` reports zero live
            workers. No scheduled workflow is running right now.

            Nothing is being LOST — a held poll never opens its transaction, so
            `next_trigger_at` is not advanced and every due schedule fires as
            soon as a worker becomes visible. But nothing is running either.

            This alert is deliberately tuned to fire BEFORE the barrier gives
            up (10 holds ≈ 2.5m, give-up at 20 ≈ 5m), so an operator hears
            about it while the guarantee is still in force rather than after it
            has been dropped. If it is ignored, TalosSchedulerReadinessDegraded
            follows.

            Note this reads the in-process heartbeat view, not the
            `talos_worker_fleet_live_workers` gauge, which is republished on a
            60s sweep and therefore lags. A disagreement between the two for
            under a minute is expected.
          action: |
            1. Are worker pods running at all? Check TalosWorkerDown.
            2. If workers ARE running, they are not reaching
               `talos.workers.heartbeat.>` — check NATS connectivity from the
               worker and whether TALOS_WORKER_HEARTBEAT_INTERVAL_SECS is 0,
               which disables heartbeat publishing entirely (a supported
               configuration, but one this barrier cannot see through).

      # ── The barrier gave up. Schedules run, the guarantee does not.
      # A zero fleet view is AMBIGUOUS — empty fleet, a build too old to
      # publish heartbeats, a broken subscription, or heartbeats disabled via
      # TALOS_WORKER_HEARTBEAT_INTERVAL_SECS=0 all read identically. So the
      # barrier degrades after a bounded number of holds instead of refusing
      # forever: refusing forever would silently stop every scheduled workflow
      # on a healthy fleet, which is a worse failure than the herd the barrier
      # prevents. This alert is the price of that safety valve being honest —
      # it says the valve opened.
      #
      # Level alert on a pre-seeded gauge (0 at registration), so `== 1` is
      # well-defined from the first scrape rather than depending on a
      # transition being observed.
      #
      # THE GAUGE IS A LEVEL, NOT A LATCH. It returns to 0 the moment any
      # heartbeat is seen. As a one-way latch it pinned at 1 on a healthy
      # fleet — a slow worker image pull outlasts the give-up bound, the
      # worker then arrives, and this fired until the controller restarted.
      # And on a deployment with heartbeats disabled outright it fired
      # forever, which the runbook below used to describe as "expected". An
      # alert that is documented as expected-to-fire is an alert nobody reads
      # in any configuration; that deployment now disables the barrier
      # instead (SCHEDULER_FLEET_READINESS_BARRIER=false on the controller),
      # so the gauge stays 0 and this stays silent.
      - alert: TalosSchedulerReadinessDegraded
        expr: talos_scheduler_readiness_degraded == 1
        for: 5m
        labels:
          severity: warning
          category: reliability-degraded
        annotations:
          summary: "Scheduler is dispatching without fleet-readiness evidence"
          description: |
            The scheduler waited for a worker heartbeat, never saw one, and has
            given up waiting. Scheduled workflows ARE running — nothing is
            blocked and nothing was lost — but they are being dispatched
            without any evidence that a worker is there to run them, which is
            the condition that produced the 2026-08-10 boot herd.

            This clears ITSELF the moment a heartbeat is seen — the barrier
            re-arms and the gauge returns to 0. So a firing alert means the
            fleet is invisible RIGHT NOW, not that it once was.
          action: |
            1. Confirm whether heartbeats are disabled on purpose
               (TALOS_WORKER_HEARTBEAT_INTERVAL_SECS=0 on the worker). If they
               are, this deployment can never satisfy the barrier and must
               switch it off: set SCHEDULER_FLEET_READINESS_BARRIER=false on
               the CONTROLLER. The controller cannot detect the worker-side
               setting, which is why this is an explicit switch. The startup
               concurrency ceiling — the load-bearing herd protection — stays
               in force either way. Do NOT simply tolerate this firing.
            2. Otherwise treat it as TalosSchedulerDispatchHeldNoFleet that was
               not acted on: the worker is not reaching
               `talos.workers.heartbeat.>`.

      # ── WASM log lines that reached no execution row.
      # Reachability: this series is produced by the controller's `wasm.log.*`
      # NATS subscriber, which is only spawned when a NATS client exists. NATS
      # is mandatory for job dispatch, so on any functioning deployment it is
      # live; on a NATS-less one there are no WASM executions to log either.
      # #618 added the `wasm_log_orphaned` WARN as the detector for a whole bug
      # family (a dispatch path minting an execution id without recording a
      # row, so every log line it publishes is silently discarded and
      # get_execution_logs returns [] — byte-identical to an execution that
      # genuinely logged nothing). #619 closed the family's live instances. But
      # the detector was a LOG LINE, and every alert in this file is
      # metric-based, so nothing could page on it. This is that alert.
      #
      # `kind` is a closed set of two values, both emitted by
      # controller/src/bootstrap/background.rs::handle_wasm_log_message:
      #   no_execution_row — the id parsed but names neither a
      #                      workflow_executions nor a module_executions row.
      #   unparseable_id   — the published line carried no usable execution id.
      # Deliberately unfiltered here so a NEW kind (should one ever be added)
      # cannot slip past the alert by not matching a selector.
      #
      # WARNING, not critical, and `for: 0m`. Expected rate is zero on routine
      # traffic (#619 verified zero over a live deploy window), so any hit is
      # worth a look immediately. At least one deliberate residual producer is
      # KNOWN — `record_started` failing is non-fatal by design, so a DB blip
      # during a node dispatch legitimately orphans that node's lines — and that
      # is a known-causes list, not a proof of completeness: the same list in the
      # code has gone stale twice already, which is why the alert stays `> 0`
      # rather than being tuned around an assumed floor. Volume is bounded by the
      # worker's per-execution log budget
      # (MAX_LOG_MESSAGES_PER_EXECUTION / HOST_DIAG_CAP), not unbounded.
      - alert: TalosWasmLogsOrphaned
        expr: increase(talos_wasm_log_orphaned_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "WASM log lines discarded (kind={{ $labels.kind }})"
          description: |
            {{ $value }} WASM log line(s) in the last 15m could not be routed to
            any execution row and were DISCARDED — get_execution_logs will
            return [] for those executions, indistinguishable from an execution
            that logged nothing.
            kind=no_execution_row: a dispatch path published under an id with no
            execution row. First check whether
            talos_module_execution_record_started_failures_total moved in the
            same window — that is the one KNOWN benign cause (a DB blip on a
            non-fatal start-row write). If it did not, assume a NEW dispatch path
            is minting ids without recording rows: grep the controller log for
            event_kind="wasm_log_orphaned" and fix the producer. Treat "the one
            known cause" as a SNAPSHOT, not an inventory — the equivalent list in
            the code has already gone stale twice; the live enumeration is the
            comment at the warn site in
            controller/src/bootstrap/background.rs, and the warn itself outranks
            both.
            kind=unparseable_id: a publisher is emitting malformed
            execution_ids; grep event_kind="wasm_log_unparseable_execution_id".

      # ── module_executions start rows that never landed.
      # The upstream CAUSE of the orphan alert above, and independently a
      # correctness problem of its own: record_started's Err is non-fatal at
      # every caller (the engine logs and dispatches anyway), so the execution
      # runs while its row is missing and get_execution_logs / get_node_io /
      # cost attribution all quietly under-report.
      #
      # WHAT `for: 5m` ACTUALLY DOES HERE — say it precisely, because the
      # obvious reading is wrong. It does NOT mean "one transient failure will
      # not page". `increase(...[15m])` stays positive for the whole 15m window
      # after a SINGLE increment, which trivially outlasts a 5m `for`, so one
      # transient acquire timeout still fires — just 5 minutes later. A `for`
      # shorter than the range window can only delay a page, never suppress a
      # one-off; suppressing one-offs needs a THRESHOLD on the value (compare
      # TalosMemoryWriteFailuresDB's `rate(...) > 0.1` in this file), not a
      # `for`. That is deliberate here: one lost start row is silent data loss
      # worth knowing about, and its downstream twin TalosWasmLogsOrphaned pages
      # at `for: 0m` on the same event anyway — a threshold here would only make
      # the pair disagree. The 5m buys exactly one thing: the series must stay
      # positive across ~10 evaluations, which rides out a counter reset or a
      # single-scrape gap that briefly lifts increase() off zero.
      - alert: TalosModuleExecutionStartRowFailures
        expr: increase(talos_module_execution_record_started_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "module_executions start rows failing to persist"
          description: |
            {{ $value }} module_executions start-row write(s) failed in the last
            15m at PostgresModuleExecutionStore::record_started. The affected
            executions still RAN — they just have no row, so their WASM logs
            orphan (expect TalosWasmLogsOrphaned alongside this) and their
            input payloads, timings and cost attribution are missing.
            Two failure edges: DEK/payload encryption (check the KEK alerts and
            Vault) and the INSERT itself (check the DB-pool saturation alerts).
            The per-failure detail is in the controller log at the calling site.

      # ── module_executions rows nothing ever finalized.
      # The CLOSING half of the pair above. `record_started` opens a row;
      # something must close it. Until 2026-08-12 the engine's single-node
      # dispatch path — by volume nearly every row in the table — never did,
      # so the 30-minute stuck-execution sweep rewrote all of them to
      # 'timeout'/'stuck'. Measured the day of the fix: 21,065 timeout rows,
      # ZERO 'completed' rows in the table's entire history, and 20,252 of the
      # timeouts had a parent workflow_executions row whose status was
      # 'completed'. Their duration_ms recorded time until the sweep noticed
      # (minimum 1,800,301 ms = the 30-minute threshold plus 301 ms), not work
      # time. `replay_module_regression`'s corpus selects WHERE
      # status='completed', so that shipped feature was a silent no-op from the
      # day it landed.
      #
      # It hid for over a month because the sweep's return value had exactly
      # one consumer: a WARN log in the controller's background loop. Every
      # alert this platform ships is metric-based, so a fleet in which EVERY
      # node reached the sweep looked identical to a healthy one. This alert is
      # the check the ledger never had — and it is deliberately on the SYMPTOM
      # (rows reaching the sweep) rather than on the specific 2026-08-12 cause,
      # because the failure mode to defend against is a FUTURE change
      # redirecting results somewhere nobody is looking.
      #
      # WARNING, not critical, and NOT `> 0`: a genuinely dead worker or a
      # controller killed mid-execution legitimately strands its in-flight
      # rows here, so a non-zero reading is not by itself a defect.
      #
      # SEPARATING THE TWO POPULATIONS — and why `for:` alone cannot do it.
      # `increase(...[1h])` stays positive for a full hour after ONE increment,
      # so any `for:` shorter than the range window only DELAYS the page, never
      # suppresses it (the same trap spelled out on
      # TalosModuleExecutionStartRowFailures above). Suppressing a one-off
      # needs a THRESHOLD on the value, and separating "one burst" from
      # "sustained" needs `for:` LONGER than the range window so a decaying
      # burst cannot hold the condition true across it. Hence `> 10` for `2h`
      # over `[1h]`: a single burst — even a large one — falls out of the 1h
      # window and breaks the 2h `for` before it can page; a ledger that is
      # actually broken never stops feeding the window. Both directions are
      # driven at synthetic time in observability/alerts_chart_test.yml rather
      # than asserted here.
      # Sizing: the pathology ran at ~710 rows/day (~30/h) on the fleet that
      # motivated this, comfortably over 10/h, and a FULLY broken ledger is
      # bounded below by the workflow-node rate rather than by anything about
      # the sweep.
      #
      # WHAT IT DELIBERATELY DOES NOT CATCH, stated rather than implied:
      #  * a LOW-VOLUME leak — one rarely-run dispatch path that opens rows
      #    nobody closes stays under 10/h forever and is invisible here. The
      #    PR-time guard for that class is the unit test in
      #    talos-workflow-engine (engine_dispatch_single.rs), not this alert.
      #  * the sweep TASK dying, which freezes the counter rather than
      #    removing it — the ledger then breaks silently again with this alert
      #    quiet. Nothing in this file covers that today.
      #
      # ABSENT vs ZERO: `talos_module_executions_swept_stuck_total` is an
      # UNLABELLED Counter, so registration alone exports it at 0 from
      # controller start — this expression is never silenced by the series
      # simply not existing.
      - alert: TalosModuleExecutionsNeverFinalize
        expr: increase(talos_module_executions_swept_stuck_total[1h]) > 10
        for: 2h
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "module_executions rows are being swept, not finalized"
          description: |
            {{ $value | printf "%.0f" }} module_executions row(s) in the last hour were
            converted to status='timeout' / error_type='stuck' by the
            stuck-execution sweep because nothing finalized them within 30
            minutes, sustained for 2h. This is a broken LEDGER rather than a
            broken fleet.
            First: is it a broken fleet? Check TalosWorkerDown and the worker's
            own metrics. A dead worker mid-execution legitimately lands rows
            here — but a one-off burst cannot hold this alert for 2h.
            If the fleet is healthy, some dispatch path is opening rows it
            never closes. Confirm with
            `SELECT status, count(*) FROM module_executions WHERE started_at >
            NOW() - INTERVAL '1 day' GROUP BY 1` — a population with no
            'completed' rows at all is the signature. Every engine dispatch
            path closes its row through
            ParallelWorkflowEngine::finalize_module_execution_row; a new path
            that dispatches without routing through it is the first thing to
            look for.
            Blast radius while this is firing: `replay_module_regression` and
            `find_latest_completed_execution_io` both select WHERE
            status='completed' and will return NOTHING, silently. Per-node
            duration_ms is fabricated (it measures the sweep, not the module),
            so latency archaeology over this table is invalid for the window.

      # ────────────────────────────────────────────────────────────────
      # A job result that arrives on `talos.results.*` and does not
      # deserialize is DISCARDED — and that subscriber is the only finalizer
      # for the FOUR dispatch paths that publish with no reply inbox: Gmail
      # push, Google Calendar push, GCP Monitoring Pub/Sub, and the webhook
      # DLQ replay. (The LIVE webhook path uses `nats.request()`, so its
      # result goes to a wire reply inbox and never reaches this subscriber —
      # count the set from the publish call, not from `reply_topic: None`.)
      # So one dropped message loses that execution's
      # terminal status write, its `output_data`, and the `__ops_alert__`
      # ingest — after which TalosModuleExecutionsNeverFinalize above will
      # eventually fire on the SYMPTOM (a swept row) while this alert names
      # the CAUSE.
      #
      # Until 2026-08 the drop was a `tracing::debug!` — a level not enabled
      # by default — so it produced no signal of any kind. The engine
      # dispatcher, handling the identical condition on the identical signed
      # message type, fails the node outright. Two handlers, opposite
      # treatment; this alert closes the observability half.
      #
      # THRESHOLD: `> 0`, not a rate. There is no benign background rate to
      # tolerate. That subject is single-producer (only the worker's
      # no-reply-topic branch publishes there), single-type (pipeline results
      # use `talos.pipeline.results.*`, which this wildcard cannot match —
      # NATS `*` is one token) and guest WASM is denied the entire `talos.`
      # prefix. An unparseable message there is an anomaly by construction,
      # and each one is a lost ledger row.
      #
      # `for: 15m` only so a single drop during a rolling deploy does not page
      # instantly; the `increase(...[1h])` window means the alert still fires
      # on ONE event and stays up for an hour after it.
      #
      # ABSENT vs ZERO: `talos_job_results_dropped_unparseable_total` is an
      # UNLABELLED Counter, so registration alone exports it at 0 from
      # controller start — this expression can never be silenced by the series
      # not existing (a CounterVec would emit nothing until a label set were
      # touched, which is why this one has no labels). Note the counter is
      # deliberately unlabelled for a second reason too: the only available
      # discriminator is the serde error text, which is derived from the
      # payload and therefore both unbounded-cardinality and secret-bearing.
      - alert: TalosJobResultsDropped
        expr: increase(talos_job_results_dropped_unparseable_total[1h]) > 0
        for: 15m
        labels:
          severity: warning
          category: observability-loss
        annotations:
          summary: "Job results are being discarded before they can finalize an execution"
          description: |
            {{ $value | printf "%.0f" }} job result message(s) on talos.results.*
            in the last hour could not be deserialized into a JobResult and were
            discarded. That subscriber is the ONLY finalizer for the four
            no-reply-inbox dispatch paths (Gmail push, Google Calendar push,
            GCP Monitoring Pub/Sub, webhook DLQ replay), so each drop loses a
            terminal
            module_executions status write, its output_data, and its
            __ops_alert__ ingest; the stuck-execution sweep will convert the row
            to status='timeout' 30 minutes later.
            Find the cause in the controller log: `event_kind=job_result_unparseable`
            carries a `classify` field. `classify="eof_empty_or_truncated"` means
            an EMPTY body — nothing should ever publish one to this subject, so
            suspect a rogue publisher or a truncated NATS message. `classify=
            "schema_mismatch"` means a worker is emitting a JobResult shape this
            controller does not understand — check TalosWorkerBuildSkew, this is
            what a half-rolled deploy looks like on the result path.
            The error text is deliberately NOT logged: it is derived from worker
            output and can quote secrets.
            Blast radius: any execution whose result was dropped is
            indistinguishable, in the database, from one whose worker never
            answered.

  # ────────────────────────────────────────────────────────────────────
  # WORM audit-ledger integrity. Two independent verification layers, one
  # series: `stage=event` is the inline per-message check at ingest (the
  # message is quarantined and never persisted); `stage=chain` is the offline
  # hash-chain sweep over a completed execution's full ordered record set.
  # Both were ERROR logs with no metric.
  - name: talos.audit
    interval: 30s
    rules:
      # CRITICAL with `for: 0m` because the expected steady-state background is
      # ZERO: the ledger REJECTS a failing event rather than persisting it, so a
      # non-zero value is evidence of a real integrity break, not a threshold
      # judgement. A week unnoticed means the compliance artifact is void for the
      # affected executions AND the correlation window (who had access, what else
      # happened) has closed.
      #
      # "Expected zero" is NOT the same as "can only mean tampering", and the
      # runbook below must be read before anyone declares an incident. The event
      # hash is recomputed from the deserialized AuditEvent, so a controller and
      # worker on DIFFERENT BUILDS whose AuditEvent shape or hash input changed
      # produce stage="event" hash_mismatch (or event_deserialize_failed) on
      # EVERY event for the duration of the skew — a deploy-ordering fault
      # presenting as a fleet-wide tamper alarm. Check TalosWorkerBuildSkew and
      # the controller/worker image shas FIRST.
      #
      # Unfiltered on `stage` on purpose — both values are emitted
      # (talos-audit-ledger: verify_audit_message → stage="event",
      # record_chain_verification_outcome → stage="chain") and a future third
      # layer must not be able to hide behind a selector.
      #
      # NOTE what this does NOT cover: an execution whose chain cannot be READ
      # (S3/IO error) counts as `errored`, not a verification failure —
      # unreadable is not the same as tampered (#578). That population surfaces
      # in the audit_chain_sweep_summary log line, not here. Nor does the
      # operator's on-demand `verify_execution_chain_from_env` path count, so
      # re-checking a known-broken chain cannot re-page.
      #
      # stage="chain" is structurally silent on two postures — no S3/WORM
      # endpoint configured (the sweep self-disables) and
      # AUDIT_CHAIN_SWEEP_INTERVAL_SECS=0 (explicitly disabled). A flat 0 on
      # either means "never looked", not "verified clean". stage="event" has no
      # such gate: the ingest subscriber runs wherever NATS does.
      - alert: TalosAuditVerificationFailures
        expr: increase(talos_audit_verification_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          category: audit-integrity
        annotations:
          summary: "Audit ledger verification FAILED (stage={{ $labels.stage }})"
          description: |
            {{ $value }} audit verification failure(s) in the last 15m against
            the WORM audit ledger. Expected steady state is 0. Read the runbook
            below BEFORE calling it tampering — a fleet-wide burst is far more
            often a key-rotation or controller/worker build-skew fault, and both
            look identical to tampering from this number alone.
            stage=event: an inbound audit event failed its hash or HMAC check at
            ingest and was QUARANTINED (not persisted). Grep the controller log
            for event_kind="audit_event_verification_failed" — the `reason`
            field distinguishes hash_mismatch / bad_signature /
            event_deserialize_failed.
            stage=chain: a completed execution's full chain failed offline
            verification — a sequence gap (deleted or never-persisted events),
            broken previous_hash linkage (reorder/substitution), or a per-event
            HMAC failure. Grep event_kind="audit_chain_verification_failed" for
            the execution_id and the structured `breaks` list.
          action: |
            1. Treat the affected execution's audit record as UNTRUSTED; do not
               delete anything (the quarantined bytes are the evidence).
            2. Rule out the two MISCONFIGURATION shapes before treating this as
               tampering — both present as a broad, simultaneous burst rather
               than an isolated event:
               a. audit signing keys rotated without a matching verify-key roll
                  → bad_signature across many executions at once;
               b. controller and workers on different builds → hash_mismatch or
                  event_deserialize_failed on essentially every event. Check
                  TalosWorkerBuildSkew / get_platform_info.fleet.
               Tampering is the residual after both are excluded; a scattered
               handful of failures against a same-build fleet is the real shape.
            3. Check S3/MinIO Object Lock is still enforced on the audit bucket.

  # ────────────────────────────────────────────────────────────────────
  # Worker fleet identity + build agreement. Both series existed only as
  # controller log lines before 2026-08.
  #
  # POSTURE CAVEAT, stated because a flat 0 here is otherwise easy to misread
  # as "checked and clean": BOTH series are about REGISTERED workers, i.e. the
  # `worker_identities` table. A deployment that pins its fleet purely through
  # the controller's static `TALOS_WORKER_PUBLIC_KEYS` ring has no registration
  # endpoint at all (it is only mounted when TALOS_WORKER_REGISTRATION_TOKEN or
  # TALOS_WORKER_REG_REQUIRE_BOUND_TOKEN is set) and no rows, so both series sit
  # at 0 permanently — quiet because there is nothing to observe, not because
  # the fleet was verified. `get_platform_info.fleet` is the surface that shows
  # static-env workers; it does not merge them with registered ones, and neither
  # does this.
  - name: talos.fleet
    interval: 30s
    rules:
      # A worker_id presented a key that is NOT its bound trust-on-first-use
      # identity. Legitimate rotation goes through the register-worker-identity
      # operator CLI or a worker_id-bound provisioning token — neither of which
      # reaches this path — so a non-zero value is either in-fleet
      # impersonation or an operator working off the managed path. Both want a
      # human, hence `> 0` over a 1h window with no `for`.
      #
      # The counter is UNLABELLED and must stay that way: worker_id and the
      # submitted key are caller-supplied at a network endpoint, so labelling
      # by either would hand an attacker control of series cardinality. The
      # identifying detail is in the controller's talos_security log.
      - alert: TalosWorkerKeyTofuConflicts
        expr: increase(talos_worker_key_tofu_conflicts_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "Worker key registration refused — TOFU identity conflict"
          description: |
            {{ $value }} worker-key registration(s) in the last hour were
            refused because the presented key is not that worker_id's bound
            identity. The registration was REFUSED (409), so nothing was
            granted — but someone with a valid registration bearer token tried
            to bind a key they should not have.
            Grep the controller log for event_kind="worker_key_tofu_conflict"
            to get worker_id, the submitted public key, and the auth path. If
            it is a legitimate rotation, do it via the operator CLI. If it is
            not, the registration bearer token is compromised: rotate it and
            revoke outstanding provisioning tokens.

      # Controller↔worker build skew. A GAUGE, not a counter: the underlying
      # `worker_build_skew` WARN fires exactly once per worker at registration,
      # so `increase()` over it would page on EVERY rolling deploy and then go
      # SILENT while a fleet sat skewed — wrong at both ends. The gauge is
      # recomputed from a query each sweep, so it falls to 0 once the counted
      # population converges.
      #
      # READ "ACTIVE" NARROWLY — this is the one thing about this alert that is
      # easy to get wrong. The base population is rows in `worker_identities`
      # that have not been deactivated. It is NOT "processes currently running".
      # Two exclusions narrow it toward workers that plausibly ARE:
      #   * rows the worker-identity reaper has deactivated (they stop being
      #     active) — which is what finally lets this gauge DRAIN, and
      #   * rows that PROVED liveness and then went silent past
      #     TALOS_WORKER_IDENTITY_REAP_HOURS, so the gauge does not lag the
      #     reaper's sweep interval on a scale-down.
      #
      # Rows with NO liveness evidence (`last_liveness_at IS NULL` — every row
      # registered by a pre-liveness worker) STAY COUNTED, and the asymmetry is
      # deliberate: the reaper refuses to act on unknown liveness because
      # absence of evidence is not evidence of departure, but a DETECTOR must
      # not go quiet on that same uncertainty or a fleet running an entirely
      # pre-liveness build would silence the alert that exists to catch it.
      #
      # So on a pod-name-keyed fleet whose workers predate the liveness
      # protocol, this gauge STILL counts the ghosts each roll and scale-down
      # leaves behind, and still needs draining — either by rolling those
      # workers onto a build that pings (after which they reap normally) or by
      # an operator, via `deactivate-worker-identity` per key or by setting
      # TALOS_WORKER_IDENTITY_REAP_PRE_PROTOCOL_HOURS. Stable ids
      # (TALOS_WORKER_ID per replica) avoid accumulating them in the first
      # place. `last_seen_at` remains boot-registration-only and is NOT a
      # liveness signal — do not build an age filter on it.
      #
      # `for: 30m` outlasts any rolling deploy (workers re-register within
      # seconds of their pod starting) and catches the case the WARN cannot
      # express: a worker that is STILL skewed long after the deploy settled.
      #
      # Counts PROVEN skew only, per distinct worker_id (a worker mid-rotation
      # holds two rows). A worker that reports no usable commit sha is
      # "unverifiable" and is NOT counted — absence of evidence is not evidence
      # of skew (#578) — so a clean 0 here is not "everything checked out". Use
      # get_platform_info.fleet for the unverifiable population.
      # THE NATS FLEET HEARTBEAT CAN NARROW THIS, BUT ONLY ON AN OPERATOR'S
      # ASSERTION — and by default it does not, so nothing below changed for an
      # existing deployment.
      #
      # Since 2026-08 workers publish a signed heartbeat on
      # `talos.workers.heartbeat.<worker_id>`, giving the controller a live view
      # of which worker PROCESSES are running. It is tempting to intersect that
      # against this gauge's population and let a ghost row drop out
      # automatically. That is exactly what
      # TALOS_WORKER_FLEET_HEARTBEAT_AUTHORITATIVE does, and it is DEFAULT OFF
      # because the inference is not sound in general:
      #
      #   a worker on a build too old to publish heartbeats, and a worker that
      #   has departed, are INDISTINGUISHABLE from here.
      #
      # That is a property of the evidence, not a gap in the implementation, and
      # the case it gets wrong — a live worker on an older build — is precisely
      # the case this alert exists to catch, during precisely the rolling deploy
      # when it matters. Setting the flag is the operator asserting a fact the
      # controller cannot check (the same shape as
      # TALOS_WORKER_IDENTITY_REAP_PRE_PROTOCOL_HOURS): that every worker here
      # runs a heartbeat-publishing build. With it unset this gauge counts
      # exactly what it counted before.
      #
      # The heartbeat's OWN gauges (talos_worker_fleet_*, below) are
      # unconditional and unaffected — they report positive observations only,
      # so they can silence nothing.
      - alert: TalosWorkerBuildSkew
        expr: talos_worker_build_skew_workers > 0
        for: 30m
        # A CONTROLLER RESTART MUST NOT RESOLVE THIS. The gauge is republished
        # by a 60s background task in controller/src/bootstrap/background.rs
        # whose FIRST tick is deliberately skipped, so for ~60s after every
        # controller start this gauge reads 0 — and that 0 is EXPORTED, not
        # absent: a registered prometheus IntGauge serves its initial value the
        # moment /metrics is scraped, before anything has measured it. (The
        # explicit `.set(0)` pre-seeds elsewhere in talos-metrics are
        # belt-and-braces for the same reason; the CounterVec caveat in
        # CLAUDE.md is about VECs, which really do export nothing until a label
        # set is touched.) Verified on the live stack at 30s resolution across
        # the 01:26:15Z restart of 2026-08-19: 1.0, 1.0, 0.0, 0.0, 1.0, 1.0 —
        # present throughout, never a gap.
        #
        # An unmeasured 0 is indistinguishable from a measured healthy one, so
        # `> 0` stops matching, the alert RESOLVES, and when the gauge
        # repopulates it must serve the full `for: 30m` again before re-firing.
        #
        # MEASURED on the dev stack 2026-08-19, 24h of ALERTS{alertstate="firing"}
        # at 60s resolution: 19 separate firing EPISODES of this one alert,
        # against a condition that was continuously true. With
        # send_resolved: true that is 38 notifications for one unchanging fact.
        # The mechanism was forced, not inferred: the zero windows line up with
        # drops in talos_workflow_executions_total (a COUNTER, so it can only
        # fall on a process restart) and with talos_worker_fleet_live_workers
        # going 1->0->1, and their LENGTH matches the task interval exactly
        # (1 min here, 5 min for the 300s fuel task).
        #
        # A restarting controller therefore cannot fire a fleet alert — which
        # is the case you most want it to. Same family as `absent is not zero`:
        # the detector is disabled by a condition adjacent to the one it
        # reports on.
        #
        # keep_firing_for, not max_over_time(): it leaves the expression and
        # `{{ $value }}` meaning exactly what they meant (the CURRENT count,
        # not a window peak), so no annotation becomes a number that no longer
        # says what its name says. Cost: a genuinely-fixed skew stays firing
        # for up to 5 extra minutes.
        #
        # VERSION FLOOR, stated with what was and was not checked: verified
        # working on Prometheus 2.48.0, which is what the dev stack runs and
        # what promtool drove these tests with. `keep_firing_for` is a
        # relatively recent addition, so a Prometheus older than the dev stack's
        # would reject this file at load — and for the chart path, the
        # PrometheusRule CRD must be new enough to carry the field through to
        # the operator's Prometheus. NEITHER of those floors was tested here
        # (there is no cluster to test them on); if you run this chart against
        # an older stack, check that first.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} registered worker id(s) on a different build than the controller"
          description: |
            At least one worker_id with an ACTIVE worker_identities row has
            reported a provably different build than this controller for 30m —
            longer than any rolling deploy should take. Signed wire formats (job
            dispatch, memory RPC, envelope sealing) are version-coupled, so this
            breaks jobs in ways that look like signature bugs; it cost several
            turns of misdiagnosis during the 2026-07-27 signing outage.
            Run get_platform_info and read the `fleet` section for the
            per-worker build_status and last_seen_at, or grep the controller log
            for event_kind="worker_build_skew". Then verify the controller and
            worker images were published from the same tree.
          action: |
            1. get_platform_info → `fleet`. Cross-check last_seen_at against
               the pods that actually exist.
            1b. Faster: compare this gauge with talos_worker_fleet_live_builds
               and talos_worker_fleet_build_skew_builds. The pair separates the
               two causes — a REGISTERED row with no running process (ghost) vs
               a BUILD that just spoke and differs from the controller's. If the
               live-skew gauge is 0 while this one is not, you are looking at
               ghost rows. Read a 0 on the live gauge carefully though: it also
               reads 0 when nothing publishes heartbeats at all, and the live
               pair counts BUILDS while this one counts ROWS — so their
               magnitudes are not comparable, only their zero/non-zero.
            2. If the offending worker_id has no running pod, this is a GHOST
               ROW, not a live skew: the registry has no reaper, so a retired
               pod's identity stays ACTIVE forever. Find it with the controller
               CLI `list-worker-identities` and clear it with
               `deactivate-worker-identity --worker-id <id> --public-key <hex>`;
               the gauge drops on the next 60s sweep. Once the WHOLE fleet runs
               a heartbeat-publishing build you may instead set
               TALOS_WORKER_FLEET_HEARTBEAT_AUTHORITATIVE=1 so silent rows drop
               out automatically — but read the caveat above first: that flag
               also silences a live worker on a pre-heartbeat build.
            3. If the pod IS running, it is genuinely on another image — roll it
               onto the controller's build. Do NOT silence this one: a skewed
               live worker fails signature verification in ways that read as
               crypto bugs.

      # ── The LIVE-PROCESS view of build skew (NATS fleet heartbeat) ──────
      #
      # Every series above is about REGISTERED ROWS. This one is about
      # PROCESSES THAT JUST SPOKE, and neither subsumes the other:
      #   * a ghost row appears only above (registered, no process);
      #   * a worker on a fleet pinned purely through the static
      #     TALOS_WORKER_PUBLIC_KEYS ring appears only here — such a deployment
      #     has no registration endpoint and NO worker_identities rows at all,
      #     so every registry-backed series sits at 0 permanently. This is the
      #     first fleet signal that works in that posture, and in the chart
      #     default where the liveness ping is blocked at the network layer
      #     (networkPolicy.workerControllerEgress is opt-in, default false).
      #
      # WHAT THE EVIDENCE IS WORTH: a heartbeat is HMAC-signed under the
      # FLEET-SHARED WORKER_SHARED_KEY, so any process holding that key can
      # mint one naming any worker_id. It proves a process is running and
      # claims an identity — a liveness HINT. It is NOT a proof of possession
      # (that is the Ed25519 liveness ping) and nothing here gates trust: a
      # heartbeat never writes last_liveness_at and never satisfies the reaper.
      #
      # NO absent() ARM, for the same reason as the participation pair: these
      # are plain IntGauges seeded at 0 at registration, so a running
      # controller always exports them. Missing ⇒ the controller is down
      # (TalosControllerDown owns it) or predates this build.
      #
      # NO ALERT ON talos_worker_fleet_live_workers == 0, deliberately. Zero is
      # ambiguous — empty fleet, pre-heartbeat build, or broken subscription —
      # and an alert that cannot tell those apart would fire loudest on the
      # deployments where it means least. TalosWorkerDown owns "the worker is
      # gone" (it selects on the worker scrape job). The same reasoning applies
      # to talos_worker_fleet_live_builds == 0.
      #
      # WHY THE ALERT IS ON A BUILD COUNT AND NOT A WORKER COUNT (2026-08).
      # talos_worker_fleet_build_skew_workers is derived per-worker_id from a
      # last-write-wins map. Where replicas SHARE one worker_id every replica
      # overwrites the same map entry, so on a MIXED-build fleet the gauge
      # alternates between 1 and 0 as first one replica and then the other
      # wrote last. `for: 30m` needs its condition to hold CONTINUOUSLY, so the
      # timer resets forever and a stuck rolling deploy could not raise this.
      #
      # NAME THE POSTURE, because the chart's DEFAULT is not the affected one.
      # This chart renders TALOS_WORKER_ID nowhere — the values.yaml line
      # offering it under worker.env is commented out inside the opt-in
      # RFC-0010 worker-trust block — so a default install falls back to
      # HOSTNAME and every replica carries its own id. The shared-id postures
      # are the dev compose stack and an install that has uncommented that
      # block (or set one fleet-wide id via worker.extraEnv).
      #
      # BE PRECISE ABOUT THE DEFECT, because the overstated version of it is
      # wrong twice over: a UNIFORMLY skewed shared-id fleet (every replica on
      # one non-controller build) retains one steady entry and DID alert
      # correctly, and under DISTINCT ids the per-worker gauge is steady in
      # every case. What could not fire was the MIXED SHARED-ID case — which is
      # the one a version-coupled signing incident actually looks like, and the
      # one that cost several turns of misdiagnosis on 2026-07-27.
      #
      # talos_worker_fleet_build_skew_workers is therefore still exported, as
      # an INFORMATIONAL MAGNITUDE with no alert on it: it answers "how many
      # PODS", which the build count structurally cannot, and it is correct on
      # the default posture. Removing it would have been an information loss
      # for every default install to fix a defect only shared-id installs have.
      #
      # Smoothing the flap in PromQL was evaluated and rejected: the gauge is
      # non-zero only on sweeps where a skewed replica happened to write last,
      # so a max_over_time window would have to grow as the skewed fraction
      # shrinks — least reliable on a single straggler pod, which is exactly
      # the case worth catching. The fix is retention (a build-keyed map in the
      # controller), not an expression.
      #
      # Structural check 65(a) scans this file TEXTUALLY, not just `expr:`
      # blocks, so spelling a job selector out in prose here would make that
      # job REQUIRED in prometheus.yml. Naming the rule instead of quoting its
      # selector is deliberate — the first draft of this comment quoted a job
      # name that does not exist and failed the lint, which is the check
      # working as documented.
      - alert: TalosWorkerFleetBuildSkew
        expr: talos_worker_fleet_build_skew_builds > 0
        for: 30m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # The exact twin of TalosWorkerBuildSkew: the same 60s task
        # (background.rs:721-725 -> publish_worker_fleet_gauges) with its first tick
        # skipped, so a restart serves an unmeasured 0 for ~60s, resolves this and
        # re-arms the whole 30m `for:`.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} RUNNING build(s) differ from the controller's — NOT a count of workers"
          description: |
            At least one build that provably differs from this controller's has
            published a fleet heartbeat recently — up to ~150s ago, being 60s
            of staleness plus a 30s prune tick plus one 60s gauge sweep — and
            has done so for 30m. Unlike TalosWorkerBuildSkew this cannot be a
            ghost registry row: a process spoke. Signed wire formats are
            version-coupled, so a live skew breaks jobs in ways that read as
            signature bugs.

            THE VALUE COUNTS BUILDS, NOT PROCESSES. Five workers stuck on one
            old build report 1, not 5, so this number tells you a skew exists
            and NOT how much of the fleet it covers. For the magnitude read
            talos_worker_fleet_build_skew_workers — which is correct on a
            DEFAULT install (this chart renders no TALOS_WORKER_ID, so each pod
            is its own identity) and is 0-or-1 and flapping only where you have
            deliberately given every replica ONE id. The alert lives on the
            build count because that one is steady in both postures. Use
            get_platform_info → `fleet` for per-worker detail either way.

            The denominator is talos_worker_fleet_live_builds — NOT
            talos_worker_fleet_live_workers, which counts heartbeating
            IDENTITIES and is a different population. The three build series
            decompose exactly: live == this + unverifiable + agreeing.

            READ talos_worker_fleet_unverifiable_builds BEFORE CONCLUDING
            ANYTHING FROM A LOW NUMBER HERE. It counts observed builds that
            could not be compared at all — the worker reported no usable commit
            sha, or THIS CONTROLLER has none, in which case nothing is
            comparable and every observed build lands there. Those sit in the
            denominator but are never counted as skew, so "1 skewed of 3 live
            builds" over an unverifiable count of 1 means one build was never
            checked. A 0 here is not "the fleet agrees"; it is "nothing was
            proven to differ".
          action: |
            1. Compare the controller and worker image digests — they must come
               from the same published tree.
            2. get_platform_info → `fleet` for the per-worker detail, including
               HOW MANY workers are on the offending build; the heartbeat gauges
               are counts only (worker_id is caller-supplied on the bus and is
               deliberately never a metric label, and neither is build_version).
            3. Roll the workers onto the controller's build. Do NOT silence:
               this one names running processes, not stale rows.
            4. If talos_worker_fleet_capacity_dropped_builds is non-zero, the
               build view is saturated and these counts include fabricated
               values — only a holder of the fleet-shared WORKER_SHARED_KEY can
               produce that, so treat it as a key-handling question first and a
               build question second.

      # ── THE SKEW ALERT ABOVE, SILENCED: two ways, three rules ───────────
      #
      # TalosWorkerFleetBuildSkew is a `> 0` on a derived count, so anything
      # that pins that count at 0 makes it unfireable while every published
      # number still looks healthy. Both known ways to pin it are alerted on
      # below — the first through two rules, because it reaches the count
      # through two separate maps. They exist because a mitigation delivered
      # only in the ANNOTATION of the alert it protects is delivered in every
      # state except the one it warns about — an absence rendered as a
      # negative result, this arc's own top damage category, one level down.

      # (1) THE FLEET VIEW IS SATURATED, so a straggler's build is REFUSED.
      #
      # Both maps are capped and both caps suppress in the same direction:
      #   * BUILD map at MAX_TRACKED_BUILDS (64). builds_match compares only
      #     the +sha suffix, so 64 agreeing-but-distinct build strings fill the
      #     map without ever registering as skew; a genuinely straggling
      #     worker's build is then a NEW key, is refused, and is invisible.
      #   * WORKER map at MAX_TRACKED_WORKERS (4096). handle_heartbeat returns
      #     at the cap BEFORE recording the build, so a heartbeat dropped there
      #     never reaches the build map either.
      # Only a holder of the fleet-shared WORKER_SHARED_KEY can produce either
      # — signing bounds WHO can inflate these maps, never HOW MUCH, which is
      # what the caps are for.
      #
      # BOTH counters have COUNTER SEMANTICS ON A GAUGE TYPE (republished from
      # a running total each sweep, monotonic within a process, reset to 0 on
      # controller restart, no _total suffix). Alerting on the LEVEL is
      # therefore correct and a rate()/increase() would be wrong. The level
      # never falls within a process, so `for:` cannot be defeated by flapping;
      # it is short deliberately, and exists only so a single anomalous scrape
      # during controller startup cannot page.
      #
      # TWO ALERTS RATHER THAN ONE `or`, for a reason MEASURED with promtool
      # rather than assumed. `a > 0 or b > 0` over these two same-labelled
      # series does NOT error and does NOT produce two alerts: `or` matches on
      # the label set IGNORING __name__, so the right-hand sample has the same
      # signature as the left-hand one and is DROPPED. With both counters
      # non-zero the expression yields exactly ONE sample — the LEFT arm's,
      # carrying the build-map value — and the fact that the worker map is
      # ALSO saturated is rendered as absence. That is this arc's own damage
      # category, in the one state where both maps are failing at once.
      # (Measured: both>0 -> one sample, value = the builds counter; only the
      # right non-zero -> the heartbeats sample, so an `or` would have fired
      # correctly, just uninformatively.) Two rules also let each summary and
      # each runbook name its own map, which they need to: the build map's
      # question is about build strings, the worker map's is about id churn.
      - alert: TalosWorkerFleetBuildViewSaturated
        expr: talos_worker_fleet_capacity_dropped_builds > 0
        for: 5m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # publish_worker_fleet_gauges, 60s, first tick skipped. Note this one is a
        # DETECTOR-BLIND alert: resolving it on a restart says the build view is no
        # longer saturated when nothing has looked.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "fleet BUILD view hit its cap — {{ $value }} observation(s) refused; build-skew detection is SUPPRESSED"
          description: |
            The controller's NATS fleet view refused build observations
            because its BUILD map was at the hard cap (MAX_TRACKED_BUILDS =
            64). The bound held — this is not a memory incident — but while
            this is non-zero the view is INCOMPLETE IN THE DIRECTION THAT
            MATTERS: a build not already tracked cannot enter, so
            TalosWorkerFleetBuildSkew can read 0 on a fleet that is genuinely
            skewed.

            Read this as a FALSE-NEGATIVE risk on that alert, not as noise.
            The other direction — fabricated builds inflating the skew and
            unverifiable counts before the cap is reached — is also possible
            and is the milder one, because it is loud.

            A real fleet publishes one build, or two mid-roll. Reaching 64
            distinct build strings does not happen organically, and
            build_version is carried on a signed heartbeat, so whatever
            produced this holds WORKER_SHARED_KEY. Note builds_match compares
            only the +sha suffix, so 64 mutually-distinct strings can all
            classify as AGREEING while filling the map — the flood need not
            look like skew to cause this.
          action: |
            1. Which map: talos_worker_fleet_capacity_dropped_builds is the
               BUILD map (64), talos_worker_fleet_capacity_dropped_heartbeats
               the worker-id map (4096). They are separate counters on purpose.
            2. Treat it as a key-handling question FIRST. Only a holder of the
               fleet-shared WORKER_SHARED_KEY can publish a verifying
               heartbeat, so enumerate what holds that key today and rotate it
               if the list is longer than it should be.
            3. get_platform_info → `fleet` for what is actually being reported.
               The build strings and worker ids are deliberately NOT metric
               labels (caller-supplied, unbounded cardinality), so the queried
               surface is the only place to see them.
            4. Until this clears, do not read a 0 on
               talos_worker_fleet_build_skew_builds as "the fleet agrees".
               Compare controller and worker image digests by hand instead.
            5. Restarting the controller clears both counters and both maps.
               That is a way to confirm a diagnosis, NOT a fix: if the source
               is still publishing, it refills.

      # The worker-map twin. Same suppression, reached one step earlier:
      # handle_heartbeat refuses an untracked id at MAX_TRACKED_WORKERS and
      # returns BEFORE record_build_observation, so the refused heartbeat never
      # reaches the build map either. Same counter-on-a-gauge semantics and
      # same `for:`; a separate rule rather than an `or` arm so that a
      # saturated worker map is still visible when the build map is saturated
      # too — see the measurement above — and so this runbook can be about id
      # churn rather than about build strings.
      - alert: TalosWorkerFleetWorkerViewSaturated
        expr: talos_worker_fleet_capacity_dropped_heartbeats > 0
        for: 5m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # publish_worker_fleet_gauges, 60s, first tick skipped. Same detector-blind
        # argument as TalosWorkerFleetBuildViewSaturated above.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "fleet WORKER-ID view hit its cap — {{ $value }} heartbeat(s) refused; build-skew detection is SUPPRESSED"
          description: |
            The controller's NATS fleet view refused heartbeats from worker ids
            it was not already tracking, because the worker-id map was at its
            hard cap (MAX_TRACKED_WORKERS = 4096). The bound held — this is not
            a memory incident — but the view is now INCOMPLETE in the direction
            that matters.

            A refused heartbeat is refused ENTIRELY: it never reaches the
            build-keyed map either. So a worker that boots, is renamed or is
            rescheduled while this is non-zero is invisible to
            talos_worker_fleet_live_workers AND to
            talos_worker_fleet_build_skew_builds. Already-tracked workers keep
            refreshing, which is why a flood degrades to "no NEW worker is
            visible" rather than to churn of the real fleet.

            No real fleet has 4096 distinct worker ids. Heartbeats are signed,
            so whatever produced this holds WORKER_SHARED_KEY.
          action: |
            1. Treat it as a key-handling question FIRST: enumerate what holds
               WORKER_SHARED_KEY today and rotate it if that list is longer
               than it should be.
            2. get_platform_info → `fleet` for the ids actually being
               reported. worker_id is caller-supplied and is deliberately
               never a metric label, so the queried surface is the only place
               to see them.
            3. If this is NOT an attack, something is generating a fresh
               worker_id per process far more often than the fleet rolls —
               check whether TALOS_WORKER_ID is being set from a value that
               changes every restart.
            4. Until it clears, do not read a 0 on
               talos_worker_fleet_build_skew_builds as "the fleet agrees".
            5. Restarting the controller clears the counter and the map. That
               confirms a diagnosis; it does not fix the source.

      # (2) NOTHING IS COMPARABLE, so the skew count is pinned at 0.
      #
      # A build is comparable only when BOTH sides carry a usable +sha. If this
      # CONTROLLER's own build has none — a Docker build without
      # GIT_SHA_OVERRIDE stamps `unknown` — then every observed build lands in
      # unverifiable and talos_worker_fleet_build_skew_builds is 0 BY
      # CONSTRUCTION, forever. The same state arises if every worker reports an
      # unstamped build.
      #
      # "Read talos_worker_fleet_unverifiable_builds before concluding
      # anything" is already written in the skew alert's annotation — where it
      # is only ever rendered when skew > 0, i.e. never in this state. This
      # alert is that mitigation delivered when it is needed.
      #
      # IT CANNOT FLAP ON A HEALTHY FLEET: one comparable build gives
      # unverifiable=0, live=1, and 0 >= 1 is false. A fleet mid-roll with one
      # unstamped build gives 1 >= 2, also false. It fires only when the
      # unverifiable bucket is the WHOLE population. The live_builds > 0 arm
      # keeps it silent before the first heartbeat, where both series are 0 and
      # `>=` would otherwise hold vacuously — absent-is-not-zero applies to
      # 0-is-not-observed just as much (#625).
      #
      # `for: 1h` because this is a standing configuration fact (how the images
      # were built), never a transient: no rollout leaves the fleet entirely
      # unstamped for an hour, and an hour of a detector being dark is not an
      # emergency, so it is warning rather than critical.
      - alert: TalosWorkerFleetBuildSkewUndetectable
        expr: talos_worker_fleet_unverifiable_builds >= talos_worker_fleet_live_builds and talos_worker_fleet_live_builds > 0
        for: 1h
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # Both operands come from publish_worker_fleet_gauges (60s, first tick
        # skipped). On a restart they are 0 and 0, so `0 >= 0 and 0 > 0` matches
        # nothing and the alert resolves — then re-arms a full HOUR, the worst
        # window-to-`for:` ratio of the set.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "no observed build can be compared with the controller's — TalosWorkerFleetBuildSkew cannot fire"
          description: |
            Every build observed in the fleet heartbeat is UNVERIFIABLE: it
            carries no usable commit sha, or THIS CONTROLLER's build carries
            none, in which case nothing is comparable regardless of what the
            workers report.

            So talos_worker_fleet_build_skew_builds is 0 because no comparison
            was possible, NOT because the fleet agrees. Its alert is dark for
            as long as this fires. A live build skew — which breaks signed,
            version-coupled wire formats in ways that read as crypto bugs —
            would produce no signal at all right now.

            This is a build-provenance defect, not a fleet defect. The most
            common cause by far is a controller image built outside the
            publish path, where GIT_SHA is unavailable and the version string
            is stamped `unknown`.
          action: |
            1. Establish WHICH side is unstamped: get_platform_info shows the
               controller's own build string and, under `fleet`, what the
               workers reported. If the controller's has no `+<sha>` suffix,
               it is the controller.
            2. Controller unstamped: rebuild through the published path
               (main-publish.yml, or scripts/publish-images.sh) so build.rs
               stamps GIT_SHA. A hand `docker build` from a context without
               git metadata is the usual way to land here.
            3. Workers unstamped: the same applies to the worker image; the
               two build.rs copies must stamp identically (structural check
               62), so a drift there presents as this.
            4. Do NOT silence this to quieten a dev stack. Set the policy at
               the source instead — an unstamped build is exactly the state in
               which a fleet-wide version skew is undetectable.

      # ══════════════════════════════════════════════════════════════════
      # THE DETECTOR THAT MAKES THE WORKER-IDENTITY REAPER SAFE TO ENABLE
      # ══════════════════════════════════════════════════════════════════
      #
      # The reaper (TALOS_WORKER_IDENTITY_REAP_ENABLED, default OFF)
      # deactivates the Ed25519 signing key of any worker that PROVED liveness
      # and then went silent past TALOS_WORKER_IDENTITY_REAP_HOURS. Its worst
      # failure is reaping a LIVE worker, and that failure has a shape worth
      # stating exactly, because it is why this alert exists rather than a
      # post-hoc one:
      #
      #   * It is SILENT for the whole trust window — 24h by default.
      #   * It then presents as fleet-wide signature-verification failure,
      #     which reads as a crypto or wire-format bug. It cost several turns
      #     of misdiagnosis in the 2026-07-27 signing outage when the cause was
      #     merely build skew.
      #   * The worker CANNOT recover on its own: `register_tofu` refuses to
      #     re-activate a deactivated key (the rule that stops a shared-token
      #     holder undoing a revocation). Every falsely reaped key needs an
      #     operator `register-worker-identity`.
      #
      # But it is not silent in its CAUSE. A false reap is always preceded by
      # workers that were pinging and stopped — an image rollback to a
      # pre-liveness build, TALOS_CONTROLLER_URL dropped from the worker env,
      # TALOS_WORKER_LIVENESS_INTERVAL_SECS set to 0, or a one-way
      # worker→controller network block (a MUTUAL outage self-heals; a one-way
      # one does not). Those all show up here immediately, and the reaper does
      # not act for another ~22h. THAT GAP IS THE ENTIRE VALUE OF THIS ALERT.
      #
      # WHY THE DIFFERENCE OF TWO GAUGES, and not a single "silent workers"
      # series: because the operator reading this during an incident is
      # deciding whether to disable the reaper, and "3 keys have stopped
      # pinging" means something completely different at 3 participants than
      # at 300. Both numbers are exported so the annotation can state the
      # denominator; the expression does the subtraction.
      #
      # WHY IT CANNOT FIRE ON A FLEET THAT NEVER PARTICIPATED — the property
      # that keeps this from being permanently red on a default install.
      # `talos_worker_liveness_participants` counts only rows that have proved
      # liveness AT LEAST ONCE (last_liveness_at IS NOT NULL). A fleet that has
      # never pinged has 0 participants and 0 recent participants, and 0-0 is
      # not > 0. This is not a hypothetical population: on a default chart
      # install the ping is blocked at the NETWORK layer in both directions
      # (networkPolicy.workerRegistrationIngress AND
      # networkPolicy.workerControllerEgress are both opt-in, default false),
      # so every row stays NULL and this alert stays silent — correctly, since
      # the automatic reaper cannot act on a NULL row either. Contrast
      # TalosWorkerBuildSkew, which deliberately DOES count NULL rows: that
      # detector's safe direction is over-reporting, this one's is silence.
      #
      # NO absent() ARM, and the reason is not the usual one. Both series are
      # plain IntGauges, exported from registration, so on any running
      # controller they always have a sample (reason 1 in this file's absence
      # audit). If they are missing, the controller is DOWN — which
      # TalosControllerDown owns — or it PREDATES this build, which NO alert
      # owns and none should: an absent() arm here would page on every
      # controller during every upgrade that crosses this version, i.e. it
      # would fire loudest exactly when nothing is wrong. Runbook step 0
      # ("confirm the observability exists") is the deliberate manual
      # substitute, and it is a step precisely because a rule cannot tell
      # "old controller" from "gauge stopped publishing".
      #
      # AGGREGATION: the subtraction matches on ALL labels, so it is evaluated
      # PER CONTROLLER REPLICA (default replicaCount: 2) against that replica's
      # own pair — both of which it computed from ONE database snapshot in one
      # sweep, so they always describe the same instant. `max()` then takes the
      # worst replica. Do NOT rewrite this as sum(a) - sum(b): replicas scrape
      # at different times, so that form subtracts numbers from different
      # instants and can go transiently negative or positive on a healthy
      # fleet. A replica that exports only one of the two (mid-upgrade) drops
      # out of the vector match entirely — the safe direction, and build skew
      # is TalosWorkerBuildSkew's job.
      #
      # WHAT IT ALSO CATCHES, stated because it is not noise and a reviewer
      # who mistakes it for noise will weaken the rule. A worker pod that is
      # legitimately GONE (scale-down, retired replica) also stops pinging, so
      # it lands in this count too. With the reaper ON that self-resolves: the
      # row is deactivated one window later and drops out of both gauges. With
      # the reaper OFF — the default — it does NOT resolve, and a fleet with
      # pod churn will sit here permanently.
      #
      # That persistent-red state is a true finding, not a false positive: it
      # is exactly the unbounded-trust gap the reaper exists to close, read as
      # "N signing keys are still trusted by workers that no longer exist".
      # The response is to close it (enable the reaper, or
      # `deactivate-worker-identity` per key), not to silence the rule. But it
      # IS a state an operator can sit in indefinitely, and a permanently-red
      # alert trains people to ignore red — so if you have opened the network
      # path for liveness and do not intend to enable the reaper, either drain
      # the ghost rows or accept that this alert is a standing backlog counter
      # rather than an incident signal.
      #
      # `for: 1h` is chosen against the horizon, not plucked: a worker is only
      # counted as silent after 2h without a ping, so this alert needs 3h of
      # real silence to fire. That outlasts any rolling deploy, node drain or
      # controller restart, and still leaves ~21h of the default window.
      # LEAD TIME IS `window - horizon - for`. An operator who shortens
      # TALOS_WORKER_IDENTITY_REAP_HOURS below ~4 has almost none, and one who
      # sets it to 2 or less has none at all — shorten the ping interval with
      # it, and do not enable the reaper on a short window without one.
      - alert: TalosWorkerLivenessParticipationDropped
        expr: |
          max(
            talos_worker_liveness_participants
            - talos_worker_liveness_recent_participants
          ) > 0
        for: 1h
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # Both operands come from publish_worker_liveness_participation (60s, first
        # tick skipped, background.rs:1077-1117). On a restart both read 0, their
        # difference is 0, and a 1h `for:` re-arms from scratch.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} worker signing key(s) stopped proving liveness and are heading for a reap"
          description: |
            {{ $value }} worker_id(s) with an ACTIVE worker_identities row have
            proved liveness in the past and have not pinged for over 2 hours.
            Read the denominator alongside this number:
            talos_worker_liveness_participants is the total population that has
            ever pinged, talos_worker_liveness_recent_participants the subset
            still pinging. If the two have converged to (N, 0) the WHOLE fleet
            stopped, which is a configuration change, not N simultaneous
            departures.

            This is a WARNING and not yet damage. Nothing has been deactivated:
            with TALOS_WORKER_IDENTITY_REAP_ENABLED set, the first key is
            reaped one full TALOS_WORKER_IDENTITY_REAP_HOURS (default 24h)
            after its last ping. You have roughly that window minus 3 hours to
            act. With the reaper unset (the default) nothing will ever be
            deactivated and this is purely informational — but it still means
            the liveness signal you would need before enabling it is broken.

            Two causes, and they need opposite responses:
              * THE WORKERS ARE GONE (scale-down, retired pods). Expected —
                but whether it CLEARS depends on the reaper, see action 1.
              * THE WORKERS ARE ALIVE AND STOPPED PINGING. This is the
                dangerous one and it is a configuration fault every time —
                see the action below.
          action: |
            1. Are the workers running? `kubectl get pods -l
               app.kubernetes.io/component=worker`. If the pods are gone this
               is an expected scale-down, and what happens next depends on the
               reaper: WITH it enabled the rows are deactivated one window
               later and this alert clears itself, no action. With it DISABLED
               — the default, and the state throughout every step of the
               enablement runbook before the last one — nothing ever clears
               them and this alert STAYS FIRING. That is a true finding, not a
               false positive: it is reading "N signing keys are still trusted
               by workers that no longer exist". Drain them
               (`deactivate-worker-identity` per key) or enable the reaper. Do
               not silence the rule, and do not wait for a self-resolution
               that is not coming. See docs/security/operational-runbook.md
               § 2.8.
            2. If they ARE running, DISABLE THE REAPER FIRST
               (TALOS_WORKER_IDENTITY_REAP_ENABLED unset, restart controller)
               and only then diagnose. Disabling costs nothing — it restores
               the pre-feature behaviour of keys never expiring. Not disabling
               costs a fleet-wide, non-self-recoverable outage in ~21h.
            3. Then find why they stopped. In order of observed likelihood:
               a rollback to a pre-liveness worker image; TALOS_CONTROLLER_URL
               missing from the worker env; TALOS_WORKER_LIVENESS_INTERVAL_SECS
               set to 0; a NetworkPolicy or ingress change that broke
               worker→controller HTTP one-way; or WORKER CLOCK SKEW, the only
               cause with no configuration change behind it — a worker drifting
               more than 60s AHEAD of the controller fails the freshness check
               on every ping while running perfectly, so auditing recent
               changes will never find it.
            4. Read talos_worker_liveness_pings_total on the controller. All
               five outcomes matter and they separate the causes above:
                 * every outcome flat, including accepted → nothing reached the
                   handler. Either the pings are not ARRIVING (network path, or
                   the worker is not pinging) or they are arriving and being
                   refused by the extractor before the handler — wrong body
                   shape, oversized body, wrong content-type — which this label
                   set does not cover and which looks identical from here.
                 * error climbing → they ARE arriving and the controller is
                   failing to record them (a database fault). The workers are
                   innocent and MUST NOT be reaped — disable the reaper.
                 * rejected_request climbing → arriving and refused before the
                   database: freshness (clock skew, in both directions) or a
                   malformed field. This is the clock-skew fingerprint.
                 * rejected_proof climbing → arriving with a signature that
                   does not verify: a key rotated outside the registration
                   path, or a worker signing with a key it never registered.
                 * inactive_identity climbing → the key is already deactivated
                   (revoked or previously reaped). Re-register it; the damage
                   has already happened for that worker.
            5. Grep the worker logs for event_kind="worker_liveness_rejected",
               "worker_liveness_not_found" or
               "worker_liveness_interval_unparseable".

      # A key was deactivated. This is the after-the-fact counterpart to the
      # alert above, and its job is to be the thing that POINTS AT THE CAUSE
      # when the fleet's signed results stop verifying — the diagnostic that
      # did not exist and whose absence is why the reaper could not be turned
      # on. Every count here is a trust-boundary write that a live worker
      # cannot undo by itself.
      #
      # `sum by (arm)` ADDS across the controller replicas — it does not
      # deduplicate them, and the distinction matters. It is correct here only
      # because a reap is ONE guarded UPDATE: whichever replica's sweep wins
      # gets `rows_affected = n` and every other replica gets 0, so the sum is
      # the fleet total rather than a multiple of it. (Verified live against a
      # two-replica scrape: forcing BOTH replicas to export 3 makes this rule
      # report 6, which is what the arithmetic does, and is a state the reap
      # path cannot produce.) It keeps the two arms apart because they mean
      # different things: `departed` is the automatic
      # window firing, `pre_protocol` is the opt-in arm an operator explicitly
      # enabled. The counter is pre-seeded at 0 for both arms in talos-metrics,
      # so `increase()` has a series to reference before the first reap —
      # without that seed an absent counter would match nothing and this alert
      # could not fire on the very first reap, the one it exists for.
      - alert: TalosWorkerIdentityReaped
        expr: sum by (arm) (increase(talos_worker_identity_reaps_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "{{ $value }} worker signing key(s) deactivated by the {{ $labels.arm }} reaper arm"
          description: |
            The worker-identity reaper deactivated {{ $value }} signing key(s)
            in the last hour on the `{{ $labels.arm }}` arm. Those keys are out
            of the controller's trusted verify ring: any results those workers
            sign from now on will FAIL verification, and they cannot re-register
            themselves — trust-on-first-use refuses to re-activate a
            deactivated key.

            If those workers are genuinely gone, this is the feature working
            and needs no action.

            If any of them is still running, this is the failure this whole
            subsystem is built to survive, and you are seeing it at the moment
            it happened rather than inferring it from signature errors later.
            arm="departed" means the worker stopped proving liveness for a full
            window; arm="pre_protocol" means an operator enabled
            TALOS_WORKER_IDENTITY_REAP_PRE_PROTOCOL_HOURS, which reaps on
            registration AGE and cannot tell a departed pod from a healthy
            long-lived one on an old build.
          action: |
            1. `list-worker-identities` on the controller CLI; compare the
               inactive rows against the pods that actually exist.
            2. For any worker that is still running:
               `register-worker-identity --worker-id <id> --public-key <hex>`.
               Nothing else restores it.
            3. Then disable the reaper (TALOS_WORKER_IDENTITY_REAP_ENABLED)
               until the cause of the missed pings is fixed, or it will reap
               the same worker again one window later.
            4. This alert should be preceded by
               TalosWorkerLivenessParticipationDropped by ~21h. If it was not,
               the participation gauges are not being published — check that
               talos_worker_liveness_participants is present on
               /metrics/prometheus at all.

      # THE DETECTOR AND THE ACTOR MUST SEE THE SAME POPULATION, and this is
      # the alert for the state where they cannot.
      #
      # The two participation gauges above are computed from a BOUNDED query
      # (`list_active_builds`, ORDER BY worker_id, public_key LIMIT 200). The
      # reap UPDATE is UNBOUNDED. Above 200 active rows those two populations
      # diverge, and a worker whose row sorts past the 200th is invisible to
      # TalosWorkerLivenessParticipationDropped while still being fully
      # reapable — i.e. the silent false reap this entire subsystem exists to
      # prevent, reintroduced above a fleet size nothing announces. Runbook
      # step 4's gate ("participants must equal your worker count") silently
      # becomes uncheckable in that state, and its `participants < worker
      # count` branch sends the operator after a phantom.
      #
      # It is not a hypothetical size: the feature's own premise is that every
      # registration leaves a permanently ACTIVE row, so a pod-name-keyed
      # fleet doing daily rolls reaches 200 in weeks.
      #
      # THE CONTROLLER ALREADY FAILED SAFE BY THE TIME YOU SEE THIS. While
      # this gauge is 1 the reaper skips its sweep entirely and deactivates
      # nothing (event_kind="worker_identity_reap_skipped_unobservable"), so
      # this is not an outage — it is the security feature switched off by its
      # own precondition, which is a state you must not sit in silently.
      # Severity is warning for that reason, and it is deliberately NOT
      # dependent on whether the reaper is enabled: an operator working
      # through the enablement runbook needs to know the gate is uncheckable
      # BEFORE they turn it on, not after.
      #
      # No absent() arm, same reason as the pair above: plain IntGauge,
      # exported from registration on every controller carrying this build.
      - alert: TalosWorkerIdentityReapBlinded
        expr: max(talos_worker_liveness_population_truncated) > 0
        for: 15m
        # ANTI-FLAP (a registered gauge exports its initial 0 before anything
        # measures it) — see TalosWorkerBuildSkew for the full mechanism, the
        # 24h episode measurements, the keep_firing_for-vs-max_over_time
        # reasoning and the Prometheus/CRD version floor.
        # publish_worker_liveness_participation, 60s, first tick skipped. Resolving
        # this on a restart asserts the reaper can see the population again when
        # nothing has measured it.
        keep_firing_for: 5m
        labels:
          severity: warning
          category: fleet-identity
        annotations:
          summary: "worker-identity liveness detector is truncated; the reaper has stopped acting"
          description: |
            The ACTIVE worker_identities population is at or past the bound on
            the query the liveness participation gauges are computed from (200
            rows). Above that bound the detector and the reaper no longer
            describe the same set of rows, so
            TalosWorkerLivenessParticipationDropped can no longer promise to
            warn before a key is deactivated.

            The controller has therefore STOPPED REAPING — nothing is being
            deactivated while this fires. The trust-bounding property is off,
            which is the pre-#631 status quo, not a regression in progress.

            talos_worker_liveness_participants and
            talos_worker_liveness_recent_participants are both UNDERSTATED
            while this fires. Do not read them as a fleet census, and do not
            use them for the runbook's step-4 gate until this clears.
          action: |
            1. `list-worker-identities` and count ACTIVE rows. The overwhelming
               likely cause is accumulated ghosts — every retired pod that ever
               registered leaves an active row behind, which is the backlog the
               reaper exists to drain and cannot drain while blinded.
            2. Drain them: `deactivate-worker-identity` for every worker_id
               with no corresponding running pod. This is safe for a departed
               worker and recoverable (`register-worker-identity`) if you
               retire one by mistake.
            3. Confirm talos_worker_liveness_population_truncated returns to 0
               and that talos_worker_liveness_participants now matches your
               real worker count before relying on either gauge again.
            4. If your fleet is LEGITIMATELY larger than 200 active identities,
               this is not drainable and the cap must be raised in code
               (MAX_FLEET_BUILD_ROWS in talos-worker-identity-repository, which
               bounds the gauge query) — do not work around it by removing the
               reaper's precondition, which is the only thing keeping the
               detector and the reaper honest with each other.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.integrations
    interval: 30s
    rules:

      # An OAuth integration's grant is dead: the token endpoint REFUSED a
      # refresh that was attempted only because a running job had already been
      # rejected by the provider with a 401. For Google and Atlassian that
      # response is `HTTP 400 invalid_grant`, i.e. the refresh token was
      # revoked or has expired.
      #
      # THIS ARM IS THE ONE THAT NEEDS A PERSON, which is why it is alerted and
      # its siblings are not. `outcome="repaired"` means the platform healed
      # itself and the node was retried; `outcome="not_refreshed"` means the
      # provider has no refresh endpoint at all. Only `refresh_failed` is a
      # state that persists until a human re-consents — every scheduled run of
      # every workflow bound to that credential will keep failing until then,
      # and nothing else in the system will say so.
      #
      # All three arms are pre-seeded at 0 in talos-metrics, so `increase()`
      # has a series to reference before the first occurrence. Without that
      # seed the counter would be ABSENT in the healthy steady state and this
      # alert could not fire on the very first revocation — the one it exists
      # for. (Absent is not zero: `increase(absent[6h]) > 0` matches nothing.)
      #
      # UNLABELLED BY PROVIDER OR ACCOUNT ON PURPOSE. The vault path's
      # provider_key segment IS the user's e-mail address for gmail and
      # google_calendar, and the provider segment is workflow-authored. The
      # identifying detail lives in the controller's `talos_oauth_refresh`
      # log target, with the provider_key hashed.
      - alert: TalosOAuthCredentialNeedsReauth
        expr: increase(talos_oauth_reactive_refresh_total{outcome="refresh_failed"}[6h]) > 0
        for: 0m
        labels:
          severity: warning
          category: integrations
        annotations:
          summary: "An OAuth integration's grant was refused on refresh — re-authorisation required"
          description: |
            A workflow node failed with an authentication error on a
            Talos-held OAuth credential. The platform forced a token refresh
            in response, and the provider REFUSED it — which is what a revoked
            or expired grant looks like.

            The node was NOT retried (retrying a dead grant is worse than
            failing once), and it will keep failing on every scheduled run
            until the integration is re-authorised by a human. Nothing in the
            platform can fix this on its own: Talos can refresh a token, it
            cannot re-consent on a user's behalf.
          action: |
            1. Find the credential: grep the controller log for
               `target=talos_oauth_refresh outcome=refresh_failed`. The
               vault_path field names the provider and a sha256 prefix of the
               account (the raw provider_key is the user's e-mail and is
               deliberately not logged).
            2. Confirm it is the grant and not the client config —
               `refresh_oauth_token` on that path reproduces the failure. An
               `invalid_client` response means the CLIENT_ID/SECRET env vars
               are wrong (a deploy problem, all accounts of that provider
               affected); `invalid_grant` means the grant itself is dead (one
               account affected).
            3. For `invalid_grant` the only fix is re-consent in the frontend
               Integrations page. Check the OAuth app's publishing status
               first: a Google app left in "Testing" expires every refresh
               token after 7 days, which is what caused the 2026-07-16 estate
               outage.
            4. Expect `talos_oauth_reactive_refresh_total{outcome="repaired"}`
               to be the arm that moves in normal operation. If THAT one is
               climbing, the predictive refresh is losing races and each
               occurrence costs a doubled dispatch — worth investigating even
               though nothing is failing.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.vault
    interval: 30s
    rules:

      # Vault's own metric: 1 = sealed, 0 = unsealed. Paging on sealed.
      #
      # DELIBERATELY NO `absent()` ARM (2026-08-02 absence audit). Every
      # other `== 0` in this file was re-examined for the self-silencing
      # shape; this one is a genuine "absence means not applicable":
      # `vault_core_unsealed` is Vault's OWN series, and a Talos cluster
      # running `KEK_PROVIDER=env` (or any posture without Vault) neither
      # deploys Vault nor scrapes it. An absent arm here would page
      # `critical` forever on every such cluster for a component it does
      # not run. "Vault is missing when it should be present" is a
      # deployment-topology assertion, not a metric one — it belongs to the
      # chart, not to an alert expression.
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 2m
        labels:
          severity: critical
          category: crypto-broken
        annotations:
          summary: "Vault is SEALED — all encrypted-at-rest ops will fail"
          description: |
            The Talos KEK backend is sealed. Every DEK wrap/unwrap will
            error until unseal completes. The vault-init Job unseals on
            pod restart — if it's not running, run:
              kubectl -n talos create job --from=cronjob/vault-init vault-init-manual
            Otherwise: `kubectl -n talos exec statefulset/talos-vault-0 -- \
              vault operator unseal <key-from-bootstrap.json>`.

      - alert: VaultHighLatency
        expr: histogram_quantile(0.99, rate(vault_core_handle_request_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Vault p99 request latency > 500ms for 10m"
          description: |
            Vault is slow. Every DEK decrypt goes through Vault transit,
            so controller-side DB reads will show elevated p99 too.
            Common causes: Vault PVC disk pressure, Vault CPU throttling.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.controller.health
    interval: 30s
    rules:
      # DELIBERATELY NO `absent()` ARM — and this is the one `== 0` in the
      # file where absence is structurally impossible rather than merely
      # inapplicable. Prometheus synthesises an `up` sample for every
      # CONFIGURED target on every scrape, so `up{job="talos-controller"}`
      # cannot be absent while the job exists; it can only be absent if
      # nothing scrapes the controller at all, which is a CONFIG defect,
      # not a runtime one. That defect has its own gate: structural lint
      # check 65(a) fails the build when an alert selects `up` for a job
      # name prometheus.yml does not declare. Same reasoning applies to
      # TalosWorkerDown below.
      #
      # (Do not write that selector out literally in a comment here: 65(a)
      # scans the whole rule file, not just `expr:` blocks, so a job name
      # mentioned in prose reads as selected. Discovered by tripping over
      # it while writing this very comment. Loud/false-positive direction,
      # so it is documented in the check rather than "fixed".)
      - alert: TalosControllerDown
        expr: up{job="talos-controller"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Talos controller is not responding to Prometheus scrapes"
          description: |
            All N controller replicas have failed scrapes for 2m. Platform
            is down. Check: `kubectl -n talos get pods -l app.kubernetes.io/component=controller`.

      # Interactive-login failure rate. Population is method="password"
      # (talos_auth::AuthService::login) + method="oauth" (the controller's
      # oauth_callback_handler) — every attempt counted once, on success and
      # failure alike, so the ratio is well-defined. API-key validation is
      # deliberately NOT in these series: it runs on every GraphQL request
      # and would swamp the denominator, leaving a credential-stuffing burst
      # unable to move the ratio past the threshold.
      #
      # Both series were registered but never incremented until 2026-07-31,
      # so this alert could not fire at all — which is why its description
      # used to send the operator to `grep auth_failure` in the logs.
      #
      # KNOWN, DELIBERATE ASYMMETRY between the two methods, because an
      # operator reading a firing instance needs it. method="password" runs
      # behind CSRF + the distributed per-IP auth limiter, so its population
      # is hard to author from outside. method="oauth" is a plain
      # unauthenticated GET on `/auth/oauth/{provider}/callback`, proxied
      # publicly by the chart nginx with no per-IP limit — so anyone on the
      # internet can hold this ratio at 1.0 with ~1 req/min of
      # `?error=access_denied`, on a deployment whose real interactive login
      # volume is well under one per day. The drive direction is toward
      # FIRING, never toward suppressing (each such request counts as both an
      # attempt and a failure), so it is noise, not a blind spot — but the
      # first time this alert ever fires here, check `method`/`reason` before
      # concluding "credential stuffing". The break-down below is the first
      # step for exactly that reason.
      #
      # DELIBERATELY NO `absent()` ARM (2026-08-02 absence audit). Both legs
      # can be absent, and in both directions absence is the correct
      # non-alerting answer:
      #   - denominator absent  ⇒ no interactive logins were attempted. A
      #     ratio over an empty population is undefined, not high.
      #   - numerator absent    ⇒ zero failures. `sum(rate(...))` over an
      #     absent series yields an empty vector, the division yields empty,
      #     and nothing fires — which is exactly right.
      # What absence DOES hide here is a broken numerator: if
      # `inc_auth_failure` were deleted, this alert would fall silent and
      # look identical to a healthy stack. That is not fixable from the
      # expression side (an `absent(failures)` arm would fire on every
      # healthy deployment), so it is covered from the metric side instead:
      # `talos_auth_attempts_total{method}` is pre-seeded at 0 for both
      # emitted methods in talos-metrics, so the DENOMINATOR is always
      # present and an operator can tell "instrumented and quiet" from
      # "instrumentation gone". Note precisely what that does and does not
      # prove: a present denominator shows the auth counters were registered
      # in this process, NOT that the failure leg is still wired. The guard
      # for the failure leg is the unit test in talos-auth that drives the
      # production path and asserts the counter moved.
      - alert: TalosControllerHighErrorRate
        expr: |
          sum(rate(talos_auth_failures_total[5m]))
          / sum(rate(talos_auth_attempts_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          category: abuse-or-broken
        annotations:
          summary: "Auth failure rate > 20% for 10m"
          description: |
            Either credential stuffing in progress, or an auth bug.
            Break down by cause first:
            `sum by (method, reason) (rate(talos_auth_failures_total[5m]))`.
            reason=invalid_password/lockout_triggered concentrated on one
            method is abuse; reason=error is the platform failing (DB down,
            token minting broken) and pairs with the DB-pool alerts.
            method=oauth,reason=provider_error alone — with password traffic
            quiet — is almost always an internet scanner hitting the public
            /auth/oauth/{provider}/callback redirect, not a login problem.
            Per-account detail (email, IP) is in `auth_audit_log` and the
            controller logs — deliberately not in the metric labels.

      # DEK cache unbounded growth (leak).
      - alert: TalosDEKCacheOverflow
        expr: talos_dek_cache_size > 10000
        for: 15m
        labels:
          severity: warning
          category: leak
        annotations:
          summary: "DEK cache has > 10k entries for 15m"
          description: |
            TTL eviction and write-path invalidation should bound this.
            Unbounded growth = a cache-invalidation bug or many distinct
            DEKs in flight (shouldn't normally happen).

      # A catalog template that failed to compile serves NOTHING.
      #
      # DELIBERATELY NO `absent()` ARM, and the reason is the opposite of
      # the usual one: this gauge is published from ONE function
      # (`spawn_catalog_missing_wasm_gauge`) which every exit of the boot
      # seeding pass calls — the disk-seeding path, the OCI-mode early
      # return, and the no-`module-templates/` early return — so it is
      # published on EVERY boot in EVERY supported mode, including the
      # healthy zero case. (It was NOT, until 2026-08-11: both early returns
      # sat above the publish, so in OCI mode this alert was structurally
      # unfireable — a detector silent in one supported mode and, before the
      # matching `oci_url` predicate went into the query, fabricating an
      # alarm on every healthy row in that same mode.)
      #
      # So `absent()` here would not mean "no broken templates" — it would
      # mean "the controller has not finished (or has not reached) template
      # seeding", which `TalosControllerDown` and the readiness probe
      # already own. Adding an arm would fire on every cold start for the
      # seconds before the compiles settle, i.e. train operators to ignore
      # it. If seeding stops publishing this entirely that is a code defect,
      # and structural lint check 58 is its gate.
      #
      # `> 0` rather than a threshold: one uncompilable template is one
      # workflow node with nothing to dispatch. `for: 15m` only so a
      # controller whose background compiles are still running on a cold
      # start does not page — the compiles take well under a minute.
      #
      # OCI-mode scope: rows carrying an `oci_url` are EXCLUDED from the
      # count. In OCI mode the registry sync loop inserts every catalog row
      # with empty source and no `wasm_bytes` by design (the worker pulls the
      # bytes at execution time), so counting them would page on a perfectly
      # healthy cluster. What remains counted in OCI mode is a row with
      # neither bytes nor a registry reference — genuinely unrunnable.
      - alert: TalosCatalogTemplateNeverCompiled
        expr: talos_catalog_templates_missing_wasm > 0
        for: 15m
        labels:
          severity: warning
          category: catalog
        annotations:
          summary: "{{ $value }} catalog template(s) have no compiled WASM and cannot run"
          description: |
            A catalog template row exists (it appears in list_templates and in
            the dynamic `Name-v1` tool surface) but its wasm_bytes is NULL or
            empty — the seeder's background compile failed for it, at every
            controller boot, and nothing downstream can execute it.

            This is worse than a missing template: it is advertised and then
            fails only when something tries to run it. Three shipped templates
            were in this state indefinitely before 2026-08-11, visible only as
            a boot WARN whose own text ("keeping existing wasm_bytes") implied
            there were bytes to keep.
          action: |
            1. get_catalog_status → `db_catalog.never_compiled` names them.
            2. Controller log, "Background compilation failed", carries the
               compiler diagnostic for each.
            3. The usual cause is a crate used in the template's source that
               its `talos.json` `dependencies` field does not declare —
               talos.json is the ONLY dependency declaration production reads
               (talos_compilation::CatalogTemplate). A crate declared in the
               template's own Cargo.toml does not count; `make check-catalog`
               fails on exactly that divergence.
            4. Fix the manifest, rebuild the controller image, restart. The
               gauge is recomputed after each boot's compiles settle, so it
               drops to 0 on the next healthy start — it is NOT continuously
               refreshed, so do not expect it to clear without a restart.
            5. In OCI mode (`TALOS_REGISTRY_URL` set) steps 2-4 do not apply:
               there is no disk seeder and no local compile. A counted row is
               one the registry sync wrote WITHOUT an `oci_url`, so start at
               the sync loop's logs and the published `_index` artifact.
               Because the sync loop rewrites catalog rows every 5 minutes
               while this gauge is only recomputed at boot, an OCI cluster's
               value can lag reality by a whole controller lifetime — treat a
               firing alert as real and a quiet one as weaker evidence there.

  # ────────────────────────────────────────────────────────────────────
  - name: talos.backups
    interval: 1m
    rules:
      # Scraped from the drill script's metric output. The producer is
      # scripts/drills/backup-restore.sh; the collection path and the
      # per-deployment "can this alert ever clear here?" analysis are in
      # scripts/drills/README.md § Wiring the metric into Prometheus.
      # (This used to point at deploy/observability/drill-textfile-exporter.md,
      # which has never existed — a dangling reference on the one line an
      # operator reads when the alert fires.)
      #
      # WHERE THIS CAN BE SATISFIED, stated because "run the drill" was not
      # true everywhere until 2026-08-03:
      #   * docker-compose dev stack — YES. A textfile-only node-exporter
      #     (docker-compose.yml) mounts the drill's output directory and the
      #     `node-exporter` scrape job in observability/prometheus/prometheus.yml
      #     collects it. `make drill` clears this alert.
      #   * a VM / bare-metal host running the stack — YES, with a system
      #     node_exporter: point TALOS_DRILL_TEXTFILE_DIR at its textfile
      #     directory and schedule the drill (systemd timer in the README).
      #   * Kubernetes / the Helm chart — NOT YET. The drill drives the docker
      #     socket directly, which a pod does not have, so nothing publishes
      #     this series in-cluster and the alert fires permanently. That is
      #     ACCURATE (nobody has verified those backups) but it is not
      #     actionable in-cluster today. Operators who accept the risk should
      #     drop this rule from their PrometheusRule rather than let a
      #     permanently-red alert train them to ignore red; porting the drill
      #     to a CronJob is tracked in scripts/drills/README.md.
      #
      # allow-unobserved-metric: talos_backup_drill_* is a node_exporter
      # TEXTFILE series written by scripts/drills/backup-restore.sh, not a
      # metric registered in Rust — so structural check 65(c), which
      # requires every alerted talos_* series to be registered in a .rs
      # file, cannot see its producer. The producer is real; only its
      # language is different.
      # ABSENCE IS NOT ZERO — and here absence is the WORST case.
      #
      # Pre-2026-08-02 this was the bare `< (time() - 14*86400)` comparison.
      # A comparison against an ABSENT series matches nothing, so the alert
      # whose own description says the drill "has either not run or is
      # failing" was silenced by the drill never having run: the textfile
      # never written, the series never created, the selector matching
      # nothing, no alert. It could only fire for a drill that had once
      # succeeded and then went stale — never for a cluster where backup
      # verification was never wired up at all, which is the case an
      # operator most needs told. Same shape as `NoWASMExecutions` in
      # observability/rules/alerts.yml; see that file's header.
      #
      # The `absent()` arm does NOT change the severity semantics: both arms
      # are the same warning / ops-hygiene pair, and both mean exactly what
      # the summary says — there is no evidence of a successful drill in the
      # last 14 days. `for: 1h` (new; there was no `for` at all) keeps a
      # cluster that is mid-bring-up from paging before its textfile
      # collector has published once. An hour is immaterial against a
      # 14-day threshold and it is not a grace period for the stale arm in
      # any meaningful sense.
      #
      # This WILL fire, permanently, on a cluster that has never run the
      # drill. That is not a false positive — it is the alert's literal
      # subject, and it is a `warning` in the ops-hygiene category, not a
      # page. Silence it by running the drill (or by removing this rule if
      # the deployment's backups are verified some other way), not by
      # reverting to an expression that cannot see its own condition.
      - alert: TalosBackupRestoreDrillFailed
        expr: |
          absent(talos_backup_drill_last_success_timestamp_seconds)
          or
          talos_backup_drill_last_success_timestamp_seconds < (time() - 14*86400)
        for: 1h
        labels:
          severity: warning
          category: ops-hygiene
        annotations:
          summary: "No successful backup→restore drill in 14+ days"
          description: |
            scripts/drills/backup-restore.sh has either not run or is
            failing. A backup you have not restored is a hypothesis —
            run the drill now. If this fired via the absent() arm the
            series has NEVER been published: check that the drill script
            is scheduled at all and that its node_exporter textfile
            directory is being collected.

      # ──────────────────────────────────────────────────────────────
      # THE OTHER FAULT. The alert above answers "has a drill SUCCEEDED
      # recently?". It cannot answer "did the last drill RUN AND FAIL?",
      # and those are different faults with different fixes: staleness
      # means the drill stopped happening (schedule it), failure means it
      # happened and the backups did not come back (fix the cause, which
      # is a different investigation entirely).
      #
      # THIS GAP WAS LIVE AND MEASURED, 2026-08-25. The producer has
      # written `talos_backup_drill_last_status` since 2026-08-03 and NO
      # rule anywhere read it. On this host the gauge had been sitting at
      # 0 — the last drill RAN AND FAILED — for EIGHT DAYS, visible in
      # Prometheus the whole time, and the only notice was the 14-day
      # staleness timer above, which had not yet tripped (last success was
      # 12.2 days old). A correctly-written metric with no consumer is
      # structural check 58's shape, and it was sitting on the safeguard
      # that underwrites every other backup claim in this file.
      #
      # NO absent() ARM, DELIBERATELY, and this is the one design decision
      # worth arguing. `x == 0` over an absent series matches NOTHING, so
      # on a host that has never run the drill this alert is silent. That
      # is correct here and it is NOT the absent-is-not-zero defect:
      #   * "never ran" is ALREADY covered, by the absent() arm of
      #     TalosBackupRestoreDrillFailed above, whose own comment says it
      #     fires permanently on a cluster that has never drilled.
      #   * a second permanently-firing alert for that same condition adds
      #     no information and dilutes both — the exact "permanently-red
      #     trains you to ignore red" failure this file argues against
      #     elsewhere.
      #   * and there is no honest producer-side pre-seed. This gauge has
      #     two values and both are claims: seeding 0 would assert a
      #     failure that never happened, seeding 1 a success. Absence is
      #     the truthful encoding of "no drill has reported yet".
      # So: absence means NOT APPLICABLE here, it is covered one rule up,
      # and it is stated rather than left for a reader to wonder about.
      #
      # BOTH CAN FIRE AT ONCE and that is not double-reporting: a drill
      # that failed today AND has not succeeded in three weeks is two true
      # statements. They differ in alertname, so Alertmanager's
      # `group_by: [alertname, category]` keeps them separate.
      #
      # `for: 15m` — the gauge is DURABLE, not sampled: it is whatever the
      # last run wrote and it does not flap, so a `for:` buys no debouncing
      # of a real signal and only delays it. Its single job is to not
      # notify while a remediation run is already in flight — during a
      # drill the PREVIOUS (failed) metric is still the one on disk, and
      # 15m comfortably covers a full restore of this deployment's ~236 MB
      # dump. It is deliberately NOT the 1h used above, which is long
      # enough that an operator drilling twice in a morning would never see
      # this transition at all.
      #
      # LABELS, AND WHAT THEY ACTUALLY DO. `severity: warning` because a
      # failed drill does not mean data IS lost — it means readability is
      # now UNPROVEN — and because every other rule in this backup family
      # is a warning.
      #
      # READ THE ROUTE BEFORE READING `warning` AS "quiet". Routing in
      # deploy/observability/alertmanager-route.yaml keys on CATEGORY, not
      # severity: `category =~ "data-loss|crypto-broken"` matches
      # UNCONDITIONALLY into talos-pagerduty-critical (`continue: true`,
      # repeat_interval 1h) and falls through to talos-slack-oncall. So
      # this alert PAGES, exactly as TalosOffhostBackupStale and
      # TalosOffhostBackupUploadFailing — same severity, same category —
      # already do. A `severity: warning` label in this file does not mean
      # "will not page", and an earlier draft of this comment claimed it
      # did.
      #
      # THAT ROUTING SPLIT IS THE POINT, not an oversight. The staleness
      # alert above is `category: ops-hygiene`, which routes to the Jira
      # lane at group_wait 10m / repeat 168h — the right lane for "we have
      # not checked lately". A drill that RAN AND FAILED is not overdue
      # housekeeping: the recovery path is broken right now, and 168h is
      # how this deployment's failure went eight days unnoticed. Same
      # subject, different fault, different lane, deliberately.
      - alert: TalosBackupRestoreDrillLastRunFailed
        expr: |
          talos_backup_drill_last_status == 0
        for: 15m
        labels:
          severity: warning
          category: data-loss
        annotations:
          summary: "The last backup→restore drill RAN AND FAILED"
          description: |
            scripts/drills/backup-restore.sh completed and reported
            failure — this is not "the drill is overdue", it is "the drill
            ran and the backups did not come back". Until it passes, the
            readability of every artifact in $BACKUP_DIR is unproven.
            The metric records only the outcome, never which step failed,
            so read the run's own output: ~/.talos/logs/backup-drill.log
            for a scheduled run, or re-run it by hand with `make drill`.
            Common causes, in the order they are checked: no escrowed KEK
            source (TALOS_DRILL_ESCROW_KEY_CMD / _FILE — the drill refuses
            to read the key from the live stack, by design), a missing or
            stale artifact in $BACKUP_DIR, and a restore or decrypt that
            failed on real rows. Clears on the next successful run.

      # ══════════════════════════════════════════════════════════════
      # OFF-HOST EGRESS (Tier 2). Producer: the `talos-offhost-backup`
      # binary, driven by scripts/offhost-backup/upload.sh. Unlike the
      # drill's series these ARE registered in Rust
      # (talos-offhost-backup/src/metrics.rs, as bare consts precisely so
      # structural check 65(c) can see them), so they need no
      # allow-unobserved-metric marker.
      #
      # WHY THESE EXIST AT ALL. The upload deliberately does NOT fail the
      # local dump — a dump taken while the network is down is still worth
      # having, and the two run as separate processes on separate
      # schedules so that is structural rather than a promise. The cost of
      # that decoupling is that a PERSISTENT upload failure is otherwise
      # completely invisible: nothing goes red, the dump keeps succeeding,
      # and the off-host copy quietly stops. A silently-failing upload is
      # worse than no upload, because it manufactures confidence in the
      # one thing you would reach for after losing the disk. These two
      # alerts are the whole of that visibility.
      #
      # NO absent() ARM ON EITHER, and that is a deliberate departure from
      # TalosBackupRestoreDrillFailed above. Absence here means "Tier 2 is
      # not configured on this deployment", which is a legitimate choice —
      # a cluster may replicate its Postgres some other way entirely. Per
      # this file's header rule, an absent() arm belongs on a series Talos
      # itself is supposed to produce, not on one whose absence is a
      # deployment decision; adding one would fire permanently on every
      # cluster that does not use B2, and a permanently-red alert trains
      # operators to ignore red.
      #
      # THE GAP THAT LEAVES, STATED RATHER THAN IMPLIED. If an operator
      # configures the bucket but never schedules the uploader, no .prom
      # file is ever written, talos_offhost_backup_enabled does not exist,
      # and NEITHER of these alerts can fire — the detector is silenced by
      # a version of its own condition. That case is covered one layer
      # out, by the restore drill: `make drill ARGS="--source b2"` FAILS
      # when the bucket holds no archive or holds only a stale one, and
      # TalosBackupRestoreDrillFailed then fires. The drill is the gate
      # for "no off-host copy at all"; these alerts are the gate for "the
      # off-host copy stopped advancing". Neither substitutes for the
      # other.
      #
      # WHY `> 1.5` OVER 50h AND NOT `> 0` OVER 6h, which was the first
      # shape here. The uploader runs ONCE A DAY, so a single failure is
      # what one offline night looks like — a plane, a hotel, a laptop
      # awake but unrouted. `> 0` over 6h would fire on every one of those
      # for six hours at a time, and an alert that fires during healthy
      # operation is the exact defect this whole area of the repo exists
      # to remove: it trains an operator to ignore red. Two failures
      # inside 50 h spans two daily cycles, which is a pipeline that has
      # STOPPED rather than a night without a network.
      #
      # ON THE 1.5, AND WHAT WAS ACTUALLY MEASURED. It means "at least
      # two". The first version of this comment justified the non-integer
      # by claiming `increase()`'s edge extrapolation can push a single
      # step above 1.0, so that `> 1` would fire on one failure. THAT WAS
      # NOT DEMONSTRATED: measured with promtool v2.48.0 via a
      # `promql_expr_test` on a 50 h window lying entirely inside a
      # densely-sampled series with one step in the middle — the shape
      # most likely to extrapolate — the value is exactly 1, and mutating
      # this rule to `> 1` leaves the whole suite green. So `> 1` would be
      # sufficient today and 1.5 is a MARGIN, not a fix for an observed
      # bug: extrapolation is a real Prometheus code path and is
      # scrape-interval dependent, and this fixture could not be made to
      # exhibit it. Recorded this way round because a threshold defended
      # by a mechanism nobody checked is how a number outlives its reason.
      #
      # WHAT "TWO RUNS" DEPENDS ON, which is a producer property and not
      # a PromQL one. `failures_total{reason}` counts RUNS, at most one
      # per reason per run (MetricState::count_reason_once). It did not
      # at first: do_upload recorded a failure per ARTIFACT and then
      # returned the first error, which cmd_upload recorded AGAIN as the
      # run's outcome, so one bad night scored 2-3 on the encrypt/head/put
      # paths and this threshold fired on a single flaky tether — the
      # tightening below defeated by the thing it was measuring. The
      # promtool fixture could not see it because a fixture supplies
      # counter values directly instead of driving the producer; the guard
      # is metrics.rs's `one_failed_run_counts_exactly_one_per_reason` and
      # main.rs's `one_failed_run_moves_the_failure_counter_by_exactly_one`
      # (which drives cmd_upload end to end). Anything that starts
      # counting per artifact here again makes this description false
      # without touching this file.
      #
      # The cost, stated: a revoked B2 key takes up to two days to alert
      # here instead of one. That is accepted because the LOCAL dump is
      # untouched throughout, and because TalosOffhostBackupStale is the
      # backstop for any sustained outage this misses.
      - alert: TalosOffhostBackupUploadFailing
        expr: |
          sum by (reason) (increase(talos_offhost_backup_failures_total[50h])) > 1.5
        for: 15m
        labels:
          severity: warning
          category: data-loss
        annotations:
          summary: "Off-host backup upload failing (reason={{ $labels.reason }})"
          description: |
            The encrypted off-host push has failed on at least two of the
            last two daily runs. The LOCAL dump is unaffected and still
            being taken — this is about the copy that survives losing the
            disk. reason="auth" most often means the B2 application key
            was rotated or revoked; reason="config" means the destination
            or the age passphrase source is not set; reason="network"
            means two nights without egress, not one.
            Logs: ~/.talos/logs/offhost-backup.log.
      # Every counter in this family is PRE-SEEDED at 0 by the producer on
      # every run, including before the first upload ever happens, so
      # `increase(...) > 0` above is well-defined rather than evaluated
      # over an absent series. That is the producer half of the
      # absent-is-not-zero rule; see talos-offhost-backup/src/metrics.rs.
      #
      # 168h, not a tighter number, and the reason is consistency rather
      # than taste: it is the SAME threshold as the drill's local
      # artifact-age gate (TALOS_DRILL_MAX_ARTIFACT_AGE_HOURS, default
      # 168h) and the same default as the drill's own --source b2
      # freshness check. All three describe one laptop whose backup
      # sidecars only tick while it is awake, and whose artifact history
      # shows a real two-day gap from a closed lid. A threshold here that
      # disagreed with the gate that fails the drill would mean one signal
      # saying "fine" while the other says "stale".
      - alert: TalosOffhostBackupStale
        expr: |
          (time() - talos_offhost_backup_last_success_timestamp_seconds > 168*3600)
          and on (job, instance) (talos_offhost_backup_enabled == 1)
        for: 1h
        labels:
          severity: warning
          category: data-loss
        annotations:
          summary: "No successful off-host backup upload in 7+ days (kind={{ $labels.kind }})"
          description: |
            An off-host destination IS configured on this host, but no
            archive of this kind has been uploaded successfully for more
            than 7 days. Everything since then exists only on the disk it
            insures. Check ~/.talos/logs/offhost-backup.log and
            talos_offhost_backup_failures_total for the classified reason,
            then run scripts/offhost-backup/upload.sh by hand.

  # ────────────────────────────────────────────────────────────────────
  # Capacity / saturation. Series come from talos-controller
  # /metrics/prometheus — the DB-pool gauges are sampled every 15s by a
  # background task in controller main.rs. These fire BEFORE the failure
  # is user-visible (pool saturation → acquire-timeout → 503s), which the
  # crypto-invariant alerts above do not cover.
  - name: talos.capacity
    interval: 30s
    rules:
      # Postgres pool saturation. Each controller replica samples its own
      # process-local pool; the alert is per-replica (no aggregation) so a
      # single saturated replica pages even when others are healthy.
      - alert: TalosDBPoolSaturated
        expr: |
          talos_db_pool_in_use_connections
          / clamp_min(talos_db_pool_max_connections, 1) > 0.9
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "Postgres pool > 90% in-use on {{ $labels.instance }} for 5m"
          description: |
            In-use connections have exceeded 90% of DB_MAX_CONNECTIONS for
            5m. New acquisitions queue on the 10s acquire timeout, so this
            precedes a latency cliff / 503 cascade. Either raise
            DB_MAX_CONNECTIONS (and the backend's server-side limit), scale
            down controller replicas (the sum of per-replica pools must
            stay under the backend ceiling), or find the query holding
            connections (pg_stat_activity, state='active').

      - alert: TalosDBPoolExhausted
        expr: |
          talos_db_pool_in_use_connections
          >= clamp_min(talos_db_pool_max_connections, 1)
        for: 1m
        labels:
          severity: critical
          category: saturation
        annotations:
          summary: "Postgres pool fully exhausted on {{ $labels.instance }}"
          description: |
            Every pooled connection is checked out — new work blocks on the
            acquire timeout and requests are failing. See the runbook's
            pool-exhaustion section.

      # DELIBERATELY NO `absent()` ARM — see TalosControllerDown above for
      # the full reasoning. `up` exists for every configured target, so it
      # cannot go absent while the job is declared, and "no worker job is
      # configured" is caught at build time by structural lint check 65(a).
      #
      # What this alert does NOT cover, and what this cycle added a separate
      # detector for: a worker whose scrape SUCCEEDS but whose metrics
      # pipeline produces nothing. `up == 1` certifies reachability, not
      # production. That is `WASMMetricsPipelineDead` in
      # observability/rules/alerts.yml.
      - alert: TalosWorkerDown
        expr: up{job="talos-worker"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "A Talos worker is not responding to Prometheus scrapes"
          description: |
            Worker scrape failing for 2m — WASM execution capacity reduced
            or zero. Check: `kubectl -n talos get pods -l app.kubernetes.io/component=worker`.

  # ────────────────────────────────────────────────────────────────────
  # Fuel headroom.
  #
  # WHY THIS GROUP EXISTS. `pa-read-later-digest/digest` ran at 96.9% of its
  # fuel budget for 16 days — across a SUCCESSFUL run — and then failed two
  # of its four scheduled runs. The number that says so
  # (peak `fuel_consumed` against the ceiling a worker actually enforced) was
  # in `execution_cost_rollup` the whole time and was never compared to
  # anything. Nothing here learns; it just reads a fact that already existed.
  #
  # AND WHY IT IS NOT GATED ON A SAMPLE COUNT. The node had TWO runs. The
  # adaptive-fuel learner needs five, and `get_fuel_usage_report` defaults to
  # three, so both were structurally blind to it. Every fuel surface this
  # platform had was hidden behind a sample floor, which is exactly why the
  # detector without one is worth adding.
  - name: talos.fuel
    interval: 30s
    rules:
      # DELIBERATELY NO `absent()` ARM. `talos_fuel_high_utilisation_nodes` is
      # an unlabelled IntGauge SEEDED AT 0 at registration, so it exists from
      # controller start and cannot go absent while the controller is up;
      # while it is down, `TalosControllerDown` is the alert that fires and a
      # second page adds nothing. The absence case that DOES matter here is
      # different and is not absence at all — a gauge stuck at a stale 0
      # because the sweep died — and that is what the second rule catches.
      - alert: TalosFuelHeadroomLow
        expr: talos_fuel_high_utilisation_nodes > 0
        for: 30m
        # Same defect as TalosWorkerBuildSkew above, read that comment first.
        # This gauge's task ticks every 300s and skips its first tick, so a
        # controller restart leaves it at its registration-time `.set(0)`
        # pre-seed for a full FIVE minutes — an unmeasured 0 published as a
        # measured healthy one, which resolves this alert every time.
        # MEASURED: 11 firing episodes in 24h against a continuously-true
        # condition (22 notifications for one unchanging fact).
        #
        # 10m rather than the 5m above because the window must exceed the
        # refresh interval with margin. It does NOT reintroduce the
        # permanently-red behaviour the clearing test guards against: that test
        # is about maxing the UTILISATION RATIO over a 30-day window, which
        # would hold the alert up for a month after a budget fix. This holds it
        # for ten minutes, and the clearing test still drives the alert to
        # inactive after the budget is raised.
        keep_firing_for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $value }} workflow node(s) running with no fuel headroom"
          description: |
            One or more (workflow, node) pairs consumed at least 80% of the
            fuel ceiling last enforced for them, at peak, over the past 30
            days. A node at that level fails on its next larger payload —
            and it fails AFTER paying for the whole LLM call, because
            WASM_MAX_INPUT_BYTES is ~100x looser than a typical LLM node's
            fuel budget, so payload growth surfaces as fuel exhaustion in
            post-processing rather than as a clean input rejection.

            THE SAMPLE COUNT IS NOT A REASON TO DISCOUNT THIS. The node this
            detector was built for had two runs.

            Which node: the controller logs it at WARN
            (target=talos_fuel, event_kind=fuel_headroom_low), and
            `get_fuel_usage_report` returns it under high_utilisation_nodes.
            The names are deliberately not metric labels — node labels are
            author-supplied and unbounded.

            Fix by SIZING FROM THE NODE'S CONFIGURED MAXIMUM (MAX_TOKENS,
            item caps) per docs/fuel-budget-sizing.md — not from the last
            observed run, and not from the number in the exhaustion error,
            which equals the limit by construction. Prefer a node-scoped
            `data.max_fuel` over `modules.max_fuel`, which is shared by every
            override-less consumer of that module.

            Raising the budget does NOT clear this immediately: the ceiling
            read here is the limit a worker ENFORCED, so the change lands
            only after the node next runs. For a weekly workflow that is up
            to a week.

      # The meta-detector. `talos_fuel_high_utilisation_nodes` reads 0 both
      # on a healthy fleet and on a fleet whose sweep never ran, because an
      # IntGauge exports 0 from registration — so a dead detector is
      # indistinguishable from a clean bill of health. That is the exact
      # defect the whole group exists to remove, one level up.
      #
      # The denominator resolves it: 0 observed pairs while workflows are
      # demonstrably executing means the sweep, the query, or the rollup
      # writer is broken. The execution arm is what keeps this off a
      # permanently-red state — a dev stack or a fresh install that has run
      # nothing has no rollup rows and legitimately observes 0, and
      # `talos_workflow_executions_total` is a CounterVec that is absent
      # until a terminal execution touches it, so `sum(increase(...)) > 0`
      # is empty and this cannot match. A permanently-firing alert trains
      # operators to ignore red.
      #
      # 6h, not the 30d detector window: rollup rows are written by
      # `ControllerNodeHook::on_node_completed` within a run, so if anything
      # completed in the last 6h the sweep had something to see. `sum()`
      # collapses the status fan-out — a per-series `increase(...) > 0`
      # would match once per status label.
      - alert: TalosFuelHeadroomDetectorBlind
        expr: |
          talos_fuel_utilisation_observed_nodes == 0
          and on() (sum(increase(talos_workflow_executions_total[6h])) > 0)
        for: 1h
        labels:
          severity: warning
          category: observability
        annotations:
          summary: "Fuel-headroom detector is observing no nodes despite live executions"
          description: |
            `talos_fuel_utilisation_observed_nodes` has been 0 for an hour
            while workflow executions completed in the last 6h. The
            fuel-headroom detector is therefore reporting a clean fleet it
            has not measured, and `TalosFuelHeadroomLow` cannot fire.

            Check, in order: the controller WARN log
            (target=talos_fuel — a failed sweep logs and leaves both gauges
            at their previous values rather than zeroing them); whether
            `execution_cost_rollup` is receiving rows at all (its writer is
            `ControllerNodeHook::on_node_completed`, and only COMPLETED runs
            produce a row); and whether the executions that completed were
            all test runs, which the detector excludes by design.

  # ────────────────────────────────────────────────────────────────────
  # Infrastructure availability. These series come from kube-state-metrics
  # (bundled with kube-prometheus-stack — the same operator the
  # ServiceMonitors assume). If you don't run kube-state-metrics, these
  # alerts simply never fire; they are not a hard dependency. Tune the
  # `namespace` / `statefulset` matchers to your release name.
  #
  # RE-CONFIRMED in the 2026-08-02 absence audit and DELIBERATELY left
  # without `absent()` arms: all three expressions below (`== 0`, `< 2`,
  # `increase(...) > 5`) are silenced by an absent series, and here that is
  # correct. These series belong to kube-state-metrics, not to Talos, and
  # their absence means "this cluster does not run kube-state-metrics" or
  # "this component is not deployed in-cluster" (managed Postgres, no
  # Vault, no MinIO) — a deployment-topology fact, not an outage. An
  # absent() arm would page `critical` forever on every such cluster.
  # Contrast `NoWASMExecutions` / `TalosBackupRestoreDrillFailed`, where the
  # absent series is one Talos itself is supposed to produce.
  - name: talos.infra.availability
    interval: 30s
    rules:
      # The four single-replica stateful components are SPOFs in the
      # in-cluster topology (postgres/neo4j/vault/minio). "0 ready" = down.
      # Production should prefer external-managed Postgres/Redis (see
      # docs/deployment.md) — these alerts cover the homelab/single-region
      # in-cluster path.
      - alert: TalosSingleReplicaInfraDown
        expr: |
          kube_statefulset_status_replicas_ready{statefulset=~".*(postgres|neo4j|vault|minio).*"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Stateful component {{ $labels.statefulset }} has 0 ready replicas"
          description: |
            A single-replica in-cluster datastore is down. For postgres
            this stops the platform; neo4j degrades graph-RAG only; vault
            blocks DEK unwrap (controller CrashLoops); minio blocks the
            WORM audit sink. Restore the pod, then check its PVC.

      # NATS is the only HA stateful component (3-replica quorum). Below
      # quorum (<2 ready) JetStream loses write availability.
      - alert: TalosNatsBelowQuorum
        expr: |
          kube_statefulset_status_replicas_ready{statefulset=~".*nats.*"} < 2
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "NATS cluster below quorum ({{ $value }} ready)"
          description: |
            Fewer than 2 of 3 NATS replicas are ready — the job queue and
            signed-RPC transport lose write availability. Check the NATS
            StatefulSet and PVCs.

      # Crash-looping pods anywhere in the release.
      - alert: TalosPodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~".*talos.*"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Pod {{ $labels.pod }} restarted > 5x in the last hour"
          description: |
            Container {{ $labels.container }} in pod {{ $labels.pod }} is
            crash-looping. Check logs and recent config/secret changes.
