{{- if .Values.frontend.enabled -}}
# Chart-rendered nginx config for the frontend pod. The frontend image
# bakes in frontend/nginx.conf with an `upstream talos_controller` of
# `controller:8000` (the docker-compose service name); in Kubernetes the
# controller Service is named via talos.componentName so the upstream
# resolves to a different DNS name. Mount this ConfigMap over
# /etc/nginx/conf.d/default.conf in the deployment to override the image
# default for K8s deploys.
#
# KEEP THE LOCATION SET IN LOCKSTEP WITH frontend/nginx.conf. Structural
# lint check 2 reconciles the controller's top-level routes against BOTH
# files (2026-09-10; before that the image config had drifted to proxying
# /graphql alone, so the compose-prod deploy 404'd /ws, /api, /auth/csrf,
# /webhooks, /mcp and every one-click email link).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talos.componentName" (list . "frontend-nginx") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talos.componentLabels" (list . "frontend") | nindent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.service.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP allows Google Fonts (style-src + font-src) because index.html
        # links to fonts.googleapis.com / fonts.gstatic.com. If you self-host
        # the fonts later, tighten these back to 'self'.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
        # HSTS unconditional — browsers ignore over HTTP per RFC 6797 §8.1.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Cross-origin isolation + clickjacking — parity with the controller's
        # talos-security-headers middleware. COOP isolates the SPA's browsing
        # context (XS-Leaks / cross-window); CORP same-origin blocks other
        # origins from no-cors loading our resources; X-Frame-Options is the
        # legacy clickjacking belt to CSP's frame-ancestors 'none' braces.
        # COEP is intentionally omitted — require-corp would break the
        # cross-origin Google Fonts / `img-src https:` the CSP above permits.
        #
        # COOP is `same-origin-allow-popups`, NOT `same-origin`. The SPA opens
        # TWO OAuth flows in a popup and reads the result back through
        # `window.opener` (integrations/useConnectHandlers.ts and
        # builder/SlackAppSelector.tsx both `window.open(...)` and poll the
        # popup). Under plain `same-origin` the browser severs the opener
        # relationship the moment the popup navigates cross-origin to the
        # provider, so `popup.closed` / postMessage back to the opener never
        # work and the flow hangs "waiting". `same-origin-allow-popups` keeps
        # the SPA's own browsing-context group isolated from documents that
        # OPEN it, while letting documents it opens keep their opener — the
        # documented COOP value for exactly this popup-OAuth shape.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        # Permissions-Policy: deny invasive hardware/sensor/tracking APIs the
        # workflow editor never uses. `clipboard-write` is deliberately NOT
        # denied — the UI's copy buttons (navigator.clipboard.writeText) rely on
        # it. If XSS ever landed, it still couldn't reach camera/mic/geolocation/
        # serial/etc. The controller sets its own; the SPA had none until now.
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=(), interest-cohort=()" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # /graphql — GraphQL HTTP. POST only in production (GET is 405); the
        # CSRF cookie is seeded by `= /auth/csrf` below, not here.
        location /graphql {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /ws — GraphQL subscriptions over WebSocket. Apollo / graphql-ws
        # client opens wss://<host>/ws on login. Without this route nginx
        # 404s the upgrade and the client retries forever.
        #
        # Origin pass-through is REQUIRED — controller's ws_auth middleware
        # rejects connections with missing Origin in production with
        # "WebSocket connection rejected: missing Origin header". The browser
        # sends Origin on every WS handshake, but nginx does not forward
        # request headers it doesn't recognize without an explicit
        # proxy_set_header. Long timeouts let subscriptions stay open
        # across idle periods.
        location /ws {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # /api/* — REST endpoints (OAuth callbacks, webhooks, etc.) routed
        # to the controller alongside GraphQL. Same handling as /graphql.
        location /api/ {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /auth/oauth/* — OAuth flow login + callback URIs configured in the
        # controller (`/auth/oauth/{provider}/{login,callback}`: Google, Okta,
        # Snyk redirect_uri values).
        #
        # DELIBERATELY NOT `location /auth/`. The controller owns exactly TWO
        # things under /auth — `/auth/oauth/…` and `/auth/csrf` — while the SPA
        # owns `/auth/callback` (App.tsx renders it for the Okta / Snyk /
        # Atlassian / Gmail popup flows). A `/auth/` prefix proxied that SPA
        # route to the controller, which 404s it, so every popup OAuth flow
        # landed on a controller 404 instead of the SPA's OAuthCallback view.
        # Mirrors frontend/vite.config.ts's dev proxy list exactly.
        location /auth/oauth/ {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /auth/csrf — the CSRF cookie seed (graphqlClient.seedCsrfCookie and
        # authedFetch both GET it before the first POST). Exact match: it is a
        # single endpoint, and an exact `=` location cannot be widened by a
        # later sibling into swallowing the SPA's /auth/callback again.
        location = /auth/csrf {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /webhooks/* — inbound webhook handler (controller route
        # `/webhooks/{id}`). External services (GitHub, Stripe, custom
        # signers) POST here. HMAC verification + replay-cache live in
        # the controller, not here. Same long-lived/streaming flags as
        # /graphql in case a sender ships a large body.
        location /webhooks/ {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /corrections — public one-click ops-alert severity-correction
        # links embedded in digest/report emails. Token-authenticated on
        # the controller; must reach it from the frontend host too, not
        # fall through to the SPA shell.
        location /corrections/ {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /approvals — the approval-GATE one-click links (`/approvals/{token}/
        # {approve,reject}`, PR #217: GET renders a confirmation page, POST acts;
        # token looked up by hash, constant-time compared). A DIFFERENT route
        # from /approval-actions below (confidence-gate suspensions). Neither
        # nginx config proxied it until 2026-09-10 — check 2's single-line grep
        # never saw the multi-line `.route(` that registers it, so every
        # approval-gate email link fell through to the SPA shell.
        location /approvals/ {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /approval-actions — public one-click approve/reject links embedded
        # in approval-request emails for suspended confidence-gate
        # executions. Token-authenticated on the controller; must reach it
        # from the frontend host too, not fall through to the SPA shell.
        location /approval-actions/ {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /mcp — Model Context Protocol endpoint on the controller. Used
        # by remote MCP clients (Claude Code, Claude Desktop, etc.) to
        # invoke the controller's tool surface. Bearer-token auth is
        # enforced inside the controller, not here. Without this route
        # nginx serves the SPA shell on GET /mcp and 405 on POST /mcp,
        # so the MCP client gets HTML/405 instead of a JSON-RPC reply
        # and reports "Failed to reconnect to talos".
        location /mcp {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # MCP uses streamable-HTTP / SSE; allow long-lived responses.
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # /health — controller health probe (also what scripts/smoke.sh GETs).
        # NOT the CSRF seed — that is `= /auth/csrf` above; /health sits in a
        # router branch with no CSRF middleware and sets no cookie.
        location /health {
            proxy_pass http://{{ include "talos.componentName" (list . "controller") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stop browser favicon probes from filling logs with 404s.
        # Replace with a real /favicon.ico in frontend/public/ when designed.
        # no-controller-route: served directly by nginx, no controller proxy.
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";

            # MCP-798 (2026-05-14): repeat the server-block security
            # headers. Per nginx docs, `add_header` directives are
            # inherited from the parent level ONLY when no `add_header`
            # exists at the current level. The Cache-Control directive
            # above disables inheritance, so the server-block
            # X-Content-Type-Options / Referrer-Policy / CSP / HSTS
            # would otherwise be DROPPED on every JS/CSS/image/font
            # response. Missing nosniff on .js is the highest-impact
            # gap — without it a misconfigured Content-Type would let
            # the browser MIME-sniff a static asset and execute it as
            # a different type (the classic XSS-via-mime-confusion).
            # CSP/HSTS missing on assets is minor (CSP applies to the
            # HTML response that loads them; HSTS is host-scoped after
            # first set), but inclusion is uniform with the parent
            # server block and harmless.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # Re-stated for the same non-inheritance reason. CORP same-origin is
            # the meaningful one here — it stops other origins from no-cors
            # hotlinking/embedding our JS/CSS/image assets; COOP / X-Frame-Options
            # are document-scoped and harmless-but-uniform on sub-resources.
            # Same COOP value as the server block (popup OAuth needs the opener).
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=(), interest-cohort=()" always;
        }
    }
{{- end }}
