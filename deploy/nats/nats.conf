# nats-server configuration for the compose stacks (docker-compose.yml and
# docker-compose.prod.yml bind-mount this DIRECTORY at /etc/nats — a directory,
# never the file, per structural lint check 66). The Helm chart renders the
# equivalent from templates/nats/configmap.yaml; both include the SAME
# generated worker permission fragment (worker-permissions.conf here,
# files/nats-worker-permissions.conf in the chart), which
# `talos-workflow-job-protocol`'s `nats_permissions` tests pin byte-for-byte
# to the Rust sets. JetStream and the monitoring port come from the command
# line (`--jetstream --store_dir=/data -m 8222`), so this file carries no
# `jetstream {}` block — passing both is a "Duplicate 'store_dir'" parse error.

# 8 MiB payload cap — matches the controller's RPC upper bound.
max_payload: 8388608

# Defines WORKER_PERMISSIONS (subscribe allow-list, publish deny-list).
include "worker-permissions.conf"

# Two credentials, resolved from the container environment at server start
# (a missing variable is a config-parse failure, so the server refuses to
# start rather than admitting an unrestricted anonymous worker):
#   NATS_USER / NATS_PASSWORD               — the CONTROLLER; no permissions
#                                             block (it is the trusted party and
#                                             replies into `_WINBOX.>`).
#   NATS_WORKER_USER / NATS_WORKER_PASSWORD — every WORKER; WORKER_PERMISSIONS.
authorization {
  users = [
    { user: $NATS_USER, password: $NATS_PASSWORD }
    { user: $NATS_WORKER_USER, password: $NATS_WORKER_PASSWORD, permissions: $WORKER_PERMISSIONS }
  ]
}
