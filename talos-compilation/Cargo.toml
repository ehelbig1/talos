[package]
name = "talos-compilation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
dirs-next = "2.0"
handlebars.workspace = true
hex.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
talos-capability-world = { path = "../talos-capability-world" }
talos-config = { path = "../talos-config" }
talos-engine-events = { path = "../talos-engine-events" }
# The advisory-database age sampler publishes through the controller's registry
# (a leaf: prometheus + talos-workflow-liveness, no cycle back to here).
talos-metrics = { path = "../talos-metrics" }
talos-text-util = { path = "../talos-text-util" }
talos-wit-inspector = { path = "../talos-wit-inspector" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "process", "time", "io-util", "fs"] }
tracing.workspace = true
uuid.workspace = true

# `killpg(SIGKILL)` of a timed-out host-mode sandbox child's process group
# (see `sandbox_run`); tokio exposes `process_group` but no group kill.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
