[package]
name = "talos-auth"
description = "Authentication service for Talos: signup, login, JWT issue/verify, refresh-token rotation, lockout, sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
talos-auth-types = { path = "../talos-auth-types" }
talos-config = { path = "../talos-config" }
# MCP-1012: DLP-redact user_agent before persisting to auth_audit_log,
# matching the sibling parity with oauth_audit_log + admin_event_log.
talos-dlp-provider = { path = "../talos-dlp-provider" }
# Feeds talos_auth_attempts_total / talos_auth_failures_total, the two
# series behind the TalosControllerHighErrorRate alert.
talos-metrics = { path = "../talos-metrics" }
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
bcrypt.workspace = true
talos-unusable-password = { path = "../talos-unusable-password" }
# One writer for admin_event_log (check 94): the first-user grant is recorded.
talos-admin-event-log = { path = "../talos-admin-event-log" }
serde_json.workspace = true
zeroize.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
regex.workspace = true
sha2.workspace = true
hex.workspace = true
rand = { workspace = true, features = ["default", "std"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }

[lints]
workspace = true
