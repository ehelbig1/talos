[package]
name = "talos-module-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono"] }
talos-db = { path = "../talos-db" }
talos-module-payload-encryption = { path = "../talos-module-payload-encryption" }
talos-secrets-manager = { path = "../talos-secrets-manager" }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# `preview_action_scope` is an async integration binary against a live Postgres —
# the predicates it pins (per-user scoping on the wasm write, the age filter on
# the cleanup DELETE) are properties of SQL, so only the database can evaluate them.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
