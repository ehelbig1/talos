[package]
name = "talos-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
dotenvy.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "json", "chrono", "migrate"] }
talos-config = { path = "../talos-config" }
talos-tenancy = { path = "../talos-tenancy" }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Live-Postgres integration test for the RLS mechanism (gated on
# TALOS_TEST_DATABASE_URL).
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
