# `promtool test rules` unit tests for observability/rules/alerts.yml.
#
# Run:
#   docker run --rm -v "$PWD/observability:/o:ro" --entrypoint promtool \
#     prom/prometheus:v2.48.0 test rules /o/alerts_test.yml
#
# WHY THESE EXIST. Every alert here was, until 2026-08-02, silenced by
# exactly the condition it was written to detect: `rate(x[30m]) == 0` over an
# ABSENT series yields an empty vector, and `empty == 0` matches nothing. A
# live stack cannot demonstrate the FIRING transition inside a review (the
# flagship has `for: 30m`) and cannot demonstrate the negative cases at all
# without generating real traffic. These tests drive synthetic series through
# the real rule file and assert the transitions directly.
#
# NOT WIRED INTO CI. `promtool` is not available on the CI runners and this
# repo has no Prometheus toolchain step; naming that plainly is better than
# implying a gate that does not exist (a sweep is not a gate — see structural
# lint check 64). What IS gated at build time is the complementary half:
# structural check 65(c) fails if a rule here names a series nothing
# registers, and 65(a)/(b)/(d) cover the scrape jobs, rule-file resolution and
# duplicate names.

rule_files:
  - rules/alerts.yml

evaluation_interval: 1m

tests:
  # ══════════════════════════════════════════════════════════════════════
  # THE FLAGSHIP: a worker that has NEVER executed anything.
  # No wasm_* series is fed at all — this is the exact state of an idle dev
  # stack, and the state in which the pre-fix expression matched nothing.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: cold-dead worker; wasm_executions_total never existed
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x60"
    alert_rule_test:
      # Before `for: 30m` elapses it is pending, not firing.
      - eval_time: 20m
        alertname: NoWASMExecutions
        exp_alerts: []
      - eval_time: 31m
        alertname: NoWASMExecutions
        exp_alerts:
          - exp_labels:
              severity: warning
              component: wasm-runtime
            exp_annotations:
              summary: "No WASM executions detected"
              description: >-
                No executions in the last 30 minutes — the worker is idle, or
                its execution pipeline is broken. If WASMMetricsPipelineDead
                is also firing, the worker is reachable but exporting nothing
                and this is NOT mere idleness.
      # The meta-detector fires too, and its `for: 15m` makes it fire FIRST —
      # which is the point: it tells the operator that the flagship's "idle or
      # broken" is the broken one.
      - eval_time: 16m
        alertname: WASMMetricsPipelineDead
        exp_alerts:
          - exp_labels:
              severity: warning
              component: monitoring
            exp_annotations:
              summary: "Worker target is UP but exports no WASM metrics"
              description: >-
                Prometheus is scraping a worker successfully and receiving no
                wasm_executions_total series. Every wasm_* alert is blind
                while this is true. Check, in order: OTEL_METRICS_ENABLED is
                set for the worker (it defaults to FALSE, and the runtime
                skips building RuntimeMetrics entirely when unset); the
                worker's /metrics body is non-empty; and the instrument name
                has not drifted from the one these rules select on
                (talos-worker-runtime's exported-name pinning test is the
                arbiter).

  # ══════════════════════════════════════════════════════════════════════
  # Idle BUT SEEDED: the producer-side fix. The series exists and is flat at
  # 0, which is the state a worker built from this tree is in before its
  # first execution.
  #   - NoWASMExecutions must still fire (no work is happening).
  #   - WASMMetricsPipelineDead must NOT — the pipeline is alive. This is the
  #     case that keeps the meta-detector off a permanently-red state on an
  #     idle-but-healthy stack.
  #
  # THIS CASE FEEDS ONE STATUS. A real seeded worker exports THREE — see the
  # dedicated fan-out case immediately below, which is what actually pins the
  # `sum()`. Both are kept: this one is the minimal idle-but-alive shape, that
  # one is the shape the producer really emits.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: idle but instrumented; seeded series flat at zero
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+0x60"
    alert_rule_test:
      # Both arms now yield the same bare `{}` label set — the `sum()` in the
      # rate arm drops `job`/`instance`/`status` exactly as `absent()` does.
      # So this expectation is label-identical to the cold-dead case above,
      # and an operator cannot (and no longer needs to) tell the arms apart
      # from the label set: `WASMMetricsPipelineDead` is what distinguishes
      # "idle" from "broken".
      - eval_time: 31m
        alertname: NoWASMExecutions
        exp_alerts:
          - exp_labels:
              severity: warning
              component: wasm-runtime
            exp_annotations:
              summary: "No WASM executions detected"
              description: >-
                No executions in the last 30 minutes — the worker is idle, or
                its execution pipeline is broken. If WASMMetricsPipelineDead
                is also firing, the worker is reachable but exporting nothing
                and this is NOT mere idleness.
      - eval_time: 31m
        alertname: WASMMetricsPipelineDead
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # THE PRODUCER'S REAL IDLE SHAPE: `seed_zero_series` writes THREE status
  # values, so an idle worker exports three `wasm_executions_total` series.
  #
  # This case exists because the producer-side fix in this same change made
  # the consumer side WRONG for a while: `rate(...) == 0` preserves the
  # source series' labels, so three seeded series became three simultaneous
  # NoWASMExecutions alerts differing only by a `status` label that means
  # nothing on this alert (`status="error"` does not say errors occurred, it
  # says the error-status counter is flat). One condition, three pages —
  # measured with promtool, not reasoned about. The `sum()` in the rule is
  # what collapses them, and this case is what stops it being removed.
  #
  # Exactly ONE alert, and its label set must be the bare `{}` pair.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: seeded worker exports THREE status series; exactly ONE alert
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="error"}'
        values: "0+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="retry_exhausted"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 31m
        alertname: NoWASMExecutions
        exp_alerts:
          - exp_labels:
              severity: warning
              component: wasm-runtime
            exp_annotations:
              summary: "No WASM executions detected"
              description: >-
                No executions in the last 30 minutes — the worker is idle, or
                its execution pipeline is broken. If WASMMetricsPipelineDead
                is also firing, the worker is reachable but exporting nothing
                and this is NOT mere idleness.

  # ══════════════════════════════════════════════════════════════════════
  # The `sum()` must AGGREGATE, not merely deduplicate: traffic on ONE status
  # while the other seeded statuses stay flat has to silence the alert. A
  # `sum without(status)` variant would pass this too; a per-series arm would
  # keep firing for `status="error"` on a perfectly healthy worker.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: one status flowing while the other seeds stay flat; silent
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+60x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="error"}'
        values: "0+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="retry_exhausted"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: NoWASMExecutions
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # Work flowing: neither detector may fire. Guards against the absent() arm
  # being written in a way that is unconditionally true.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: executions flowing; nothing fires
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x60"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: NoWASMExecutions
        exp_alerts: []
      - eval_time: 45m
        alertname: WASMMetricsPipelineDead
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # No worker target at all (controller-only stack). The meta-detector is
  # gated on `up{job="talos-worker"}`, so it must be inert rather than
  # permanently red.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: no worker scraped; meta-detector is inert
    input_series:
      - series: 'up{job="talos-controller", instance="controller:8000"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 31m
        alertname: WASMMetricsPipelineDead
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # Worker down: the meta-detector must stay quiet and leave the outage to
  # TalosWorkerDown. "Unreachable" and "reachable but silent" are different
  # incidents with different first steps.
  #
  # NOTE WHAT IS AND IS NOT ASSERTED: only the meta-detector's silence.
  # TalosWorkerDown lives in deploy/helm/talos/files/alerts.yaml, which
  # `rule_files:` above does NOT load (check 65(d) forbids a second copy
  # here), so this case cannot and does not verify that the outage is still
  # caught by something. It verifies only that this rule is not the thing
  # that catches it.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: worker down; meta-detector defers to TalosWorkerDown
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 31m
        alertname: WASMMetricsPipelineDead
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # LowCacheHitRate one-sided absence, closed on the producer side.
  # hits seeded at 0 while misses flow = a genuine 0% hit rate. Pre-fix the
  # hits series did not exist (nothing had touched the counter), the binary
  # operator found no match, and the worst case this alert exists for was the
  # one case it could not see.
  #
  # `otel_scope_name` is NOT decoration. Scraped from a real worker (verified
  # 2026-08-02 over authenticated HTTP against a running process), every
  # series the OTEL exporter emits carries
  # `otel_scope_name="talos-wasm-runtime"` — the meter name. This is the only
  # remaining case whose `exp_labels` inherit the source series' labels, so it
  # is the only one where feeding a synthetic series without that label would
  # assert a label set production never produces. It also matters to the rule
  # itself: `a / (a + b)` matches on IDENTICAL label sets, so both cache legs
  # having the SAME scope is load-bearing — if one leg were ever moved to a
  # different meter the division would silently drop to an empty vector, which
  # is the one-sided-absence bug this case exists for, wearing a new hat.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: zero percent cache hit rate is visible once both legs are seeded
    input_series:
      - series: 'wasm_cache_hits_total{job="talos-worker", instance="worker:9090", otel_scope_name="talos-wasm-runtime"}'
        values: "0+0x60"
      - series: 'wasm_cache_misses_total{job="talos-worker", instance="worker:9090", otel_scope_name="talos-wasm-runtime"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: LowCacheHitRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: wasm-runtime
              job: talos-worker
              instance: worker:9090
              otel_scope_name: talos-wasm-runtime
            exp_annotations:
              summary: "Low WASM cache hit rate"
              description: "Cache hit rate is 0% (threshold: 70%)"

  # ══════════════════════════════════════════════════════════════════════
  # …and the other half of that seeding change: an IDLE worker must stay
  # SILENT here. Seeding altered the MECHANISM of that silence without
  # altering the outcome, and the new mechanism was untested. Pre-seeding,
  # both legs were absent and the division produced an empty vector.
  # Post-seeding both legs exist and are flat, so the expression is
  # 0 / (0 + 0) = NaN — and every PromQL comparison against NaN is false, so
  # the element is dropped. Same silence, different reason.
  #
  # This case exists so a future "fix" for the NaN cannot land quietly: a
  # `clamp_min(denominator, 1)`-style guard turns the undefined idle ratio
  # into a hard 0 and makes this alert fire permanently on every idle stack —
  # the exact permanently-red failure this change exists to remove. If you
  # are here because you changed the denominator, this test is the objection.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: idle worker with both cache legs seeded; LowCacheHitRate silent
    input_series:
      - series: 'wasm_cache_hits_total{job="talos-worker", instance="worker:9090", otel_scope_name="talos-wasm-runtime"}'
        values: "0+0x60"
      - series: 'wasm_cache_misses_total{job="talos-worker", instance="worker:9090", otel_scope_name="talos-wasm-runtime"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 31m
        alertname: LowCacheHitRate
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # LATENCY: the slow-FRACTION rules that replaced the p95 quantile on
  # 2026-08-04. Eleven cases, and the PAIRING is the point — a rule that only
  # proves it stays SILENT has proved it might be blind.
  #
  # The expression they replaced fired 31 times in 13.75 h of healthy dev
  # traffic (23 VerySlow + 8 Slow, from Prometheus's own ALERTS series) and
  # never once on a real problem, because histogram_quantile(0.95, …) over the
  # median 4.14 executions this worker completes per 5 m window is not a
  # quantile, it is the maximum. See the block comment above the rules for the
  # full measurement.
  #
  # Cases (1)-(7) landed with the rules. Cases (8)-(11) were added in review
  # after mutation testing found three properties the first seven did not
  # pin — the critical tier's `for:`, the bucket guard's volume gate and its
  # own `for:` — plus the low-volume gap, which is pinned so it cannot be
  # mistaken for coverage.
  # ══════════════════════════════════════════════════════════════════════

  # ── (1) SILENT across a bounded transient ────────────────────────────
  # Models the real shape: healthy 1 execution/min, then a 5-minute stretch
  # where every execution is slower than 2.5 s, then recovery. Peak 15 m
  # slow-fraction is 5/15 = 0.33, close to the 0.357 actually measured as the
  # gated peak on the live stack over 13.75 h spanning three container
  # restarts (the peaks are not at the restarts). Nothing fires.
  #
  # le=10000 tracks the count exactly here: the executions are slow but not
  # past 10 s, so the critical tier must stay silent for a second, independent
  # reason. If a future edit makes the two tiers share a boundary, this case
  # stops distinguishing them and should be re-read.
  - interval: 1m
    name: bounded slow transient; neither latency rule fires
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+1x10 10+0x4 11+1x45"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: SlowWASMExecution
        exp_alerts: []
      - eval_time: 25m
        alertname: SlowWASMExecution
        exp_alerts: []
      - eval_time: 45m
        alertname: SlowWASMExecution
        exp_alerts: []
      - eval_time: 25m
        alertname: VerySlowWASMExecution
        exp_alerts: []

  # ── (2) SILENT across a burst that DOES cross the threshold ──────────
  # This is the case that proves `for: 10m` is load-bearing rather than
  # decorative. A 9-minute stall pushes the 15 m slow-fraction to 0.60 —
  # well past the 0.5 threshold — but not for the 10 minutes the rule
  # requires, so it never fires.
  #
  # THE EVAL TIMES ARE THE WHOLE POINT and were wrong on the first attempt:
  # the breach runs from ~19m to ~27m (measured: 0.60 at 19m and 25m, 0.40 by
  # 28m), so assertions at 30m/60m sat entirely AFTER it and passed happily
  # with `for:` shortened to 2m — a case that proved nothing while claiming to
  # prove the `for:`. Silence has to be asserted DURING the breach. 24m and
  # 26m are inside it; with `for: 2m` the rule is firing at both, so the
  # mutation is caught here rather than only in case (3).
  - interval: 1m
    name: threshold-crossing burst shorter than for:; still silent
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+1x10 10+0x8 11+1x41"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+1x60"
    alert_rule_test:
      # Inside the breach: the expression is over 0.5 at both of these, and
      # only `for: 10m` is holding the alert back.
      - eval_time: 24m
        alertname: SlowWASMExecution
        exp_alerts: []
      - eval_time: 26m
        alertname: SlowWASMExecution
        exp_alerts: []
      # …and after it has passed, with the pending state discarded.
      - eval_time: 30m
        alertname: SlowWASMExecution
        exp_alerts: []
      - eval_time: 60m
        alertname: SlowWASMExecution
        exp_alerts: []

  # ── (3) FIRES on a sustained steady-state regression, at a PINNED time ─
  # The other half, and the one that keeps case (1) honest. Healthy for
  # 20 minutes, then every execution goes over 2.5 s and stays there.
  #
  # This case exists to MEASURE the detection latency, not to assert it. The
  # 15 m rate window must ramp the slow-fraction past 0.5 (it crosses at
  # t=28m, 8 min after onset) and then `for: 10m` must elapse — so the alert
  # fires at t=38m, 18 MINUTES after the regression began, against ~3 min for
  # the p95 expression it replaced. The 37m/38m pair below is what makes that
  # number a measurement; if you retune the window or `for:`, these two
  # eval_times move and the figure quoted in alerts.yml must move with them.
  - interval: 1m
    name: sustained regression fires; detection latency pinned at 18m
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+1x20 20+0x40"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+1x60"
    alert_rule_test:
      # Onset is t=20m. Still not firing one minute short of the pinned time.
      - eval_time: 37m
        alertname: SlowWASMExecution
        exp_alerts: []
      - eval_time: 38m
        alertname: SlowWASMExecution
        exp_alerts:
          - exp_labels:
              severity: warning
              component: wasm-runtime
              job: talos-worker
              instance: worker:9090
            exp_annotations:
              summary: "Sustained slow WASM executions"
              description: "100% of WASM executions on worker:9090 took longer than 2.5s over the last 15m, sustained for 10m (threshold: 50%). LLM inference time is included in execution duration — check wasm_llm_duration_ms before suspecting the WASM runtime itself."
      # The critical tier stays silent: nothing crossed 10 s.
      - eval_time: 38m
        alertname: VerySlowWASMExecution
        exp_alerts: []

  # ── (4) The critical tier fires when executions really do exceed 10 s ──
  # Same shape as (3) but the 10 s boundary stalls too. Both tiers fire; the
  # description must say the 10 s figure is a FLOOR, because 10000 is the
  # histogram's highest finite bucket bound and the real latency is not
  # recoverable from this metric (that saturation is why the previous
  # expression reported a flat 10000.0 every time it fired).
  - interval: 1m
    name: sustained over-10s regression fires the critical tier
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+1x20 20+0x40"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+1x20 20+0x40"
    alert_rule_test:
      - eval_time: 38m
        alertname: VerySlowWASMExecution
        exp_alerts:
          - exp_labels:
              severity: critical
              component: wasm-runtime
              job: talos-worker
              instance: worker:9090
            exp_annotations:
              summary: "Sustained very slow WASM executions"
              description: "100% of WASM executions on worker:9090 exceeded 10s over the last 15m, sustained for 10m (threshold: 50%). 10s is the histogram's highest finite bucket bound, so these executions are only known to be SLOWER than 10s — the exact latency is not recoverable from this metric."

  # ── (5) The boundary guard ───────────────────────────────────────────
  # Rules (1)-(4) all select fixed `le` values, so they are exactly as alive
  # as those bucket bounds. Executions are flowing here but the le=2500 and
  # le=10000 series do not exist — the state a change to the histogram's
  # boundaries would produce. Without this guard both latency rules would go
  # silent forever and nothing would say so.
  #
  # Both arms match, so TWO alerts fire, one per missing boundary. That is
  # intended: it names which boundary went. Since 2026-08-04 they also name
  # the INSTANCE — the guard matches per (job, instance) rather than
  # fleet-globally, so an alert is scoped to the replica that lost its
  # buckets.
  - interval: 1m
    name: bucket boundaries changed; guard fires
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: WASMLatencyBucketMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: wasm-runtime
              job: talos-worker
              instance: worker:9090
              le: "2500"
            exp_annotations:
              summary: "WASM latency alerts have lost their bucket boundaries"
              description: "The wasm_execution_duration_ms histogram is live on worker:9090 but its le=2500 bucket is absent, so SlowWASMExecution and VerySlowWASMExecution cannot fire for that instance. The histogram's bucket boundaries have most likely changed; update the le= selectors in observability/rules/alerts.yml to match."
          - exp_labels:
              severity: warning
              component: wasm-runtime
              job: talos-worker
              instance: worker:9090
              le: "10000"
            exp_annotations:
              summary: "WASM latency alerts have lost their bucket boundaries"
              description: "The wasm_execution_duration_ms histogram is live on worker:9090 but its le=10000 bucket is absent, so SlowWASMExecution and VerySlowWASMExecution cannot fire for that instance. The histogram's bucket boundaries have most likely changed; update the le= selectors in observability/rules/alerts.yml to match."

  # ── (6) …and the guard must NOT fire on a healthy stack ──────────────
  # The buckets are present, so the guard is silent even though the worker is
  # completely idle in the second half. An idle stack has no bucket series at
  # all, which is why the guard is gated on executions being observed rather
  # than on absence alone — otherwise it would page on every quiet stack,
  # the permanently-red failure this file exists to remove.
  - interval: 1m
    name: healthy buckets present; guard silent
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: WASMLatencyBucketMissing
        exp_alerts: []

  # ── (7) The volume floor: 100 % slow, but too few executions to mean it ─
  # A dying container trails a handful of executions into the 15 m window as
  # it is replaced. Here EVERY one of them is slow — the fraction is a clean
  # 1.0, the strongest possible signal the ratio can produce — and the rules
  # must still stay silent, because 6 executions per 15 m cannot support a
  # claim about the fleet. Without the `>= 10` floor this exact shape fired
  # once in the 13.5 h of live data the rules were calibrated against, on a
  # container that had already stopped existing.
  #
  # 0.4/min = 6 per 15 m window, comfortably under the floor.
  - interval: 1m
    name: entirely slow but below the volume floor; still silent
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+0.4x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+0x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+0x60"
    alert_rule_test:
      - {eval_time: 30m, alertname: SlowWASMExecution, exp_alerts: []}
      - {eval_time: 45m, alertname: SlowWASMExecution, exp_alerts: []}
      - {eval_time: 30m, alertname: VerySlowWASMExecution, exp_alerts: []}
      - {eval_time: 45m, alertname: VerySlowWASMExecution, exp_alerts: []}

  # ── (8) `for:` on the CRITICAL tier is load-bearing too ───────────────
  # Case (2) proves it for the warning tier only. Without this one,
  # `VerySlowWASMExecution`'s `for: 10m` can be shortened to 2m and the whole
  # suite still passes — verified by mutation 2026-08-04. That tier is the one
  # that fired 23 times in 13.75 h before this change, so its sustain
  # requirement is exactly the part a future edit must not quietly undo.
  #
  # A 9-minute stall where every execution exceeds 10 s: the 15 m fraction
  # reaches 0.60, past the threshold, but not for the 10 minutes required.
  # Executions over 10 s are also over 2.5 s, so the warning tier breaches
  # here as well — deliberately realistic, and it is asserted silent too.
  - interval: 1m
    name: critical tier - threshold-crossing burst shorter than for:; still silent
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+1x10 10+0x8 11+1x41"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+1x10 10+0x8 11+1x41"
    alert_rule_test:
      - {eval_time: 24m, alertname: VerySlowWASMExecution, exp_alerts: []}
      - {eval_time: 26m, alertname: VerySlowWASMExecution, exp_alerts: []}
      - {eval_time: 24m, alertname: SlowWASMExecution,     exp_alerts: []}
      - {eval_time: 26m, alertname: SlowWASMExecution,     exp_alerts: []}
      - {eval_time: 60m, alertname: VerySlowWASMExecution, exp_alerts: []}

  # ── (9) the guard must not page on an idle stack ─────────────────────
  # Its comment claims it is "gated on executions actually being observed, so
  # an idle stack does not trip it". Case (6) does not test that claim — its
  # buckets are present, so both absent() arms are empty whether the gate is
  # there or not. Removing the `and on() (sum(rate(count)) > 0)` gate left the
  # whole suite green (mutation 2026-08-04), which means the one property
  # keeping this rule off a permanently-red state was unpinned.
  #
  # Here NOTHING wasm_* exists at all — the genuinely idle stack. Silent.
  - interval: 1m
    name: idle stack, no wasm series at all; guard silent
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x60"
    alert_rule_test:
      - {eval_time: 30m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 60m, alertname: WASMLatencyBucketMissing, exp_alerts: []}

  # ── (10) the REALISTIC boundary change, and the guard's own `for:` ────
  # Case (5) models the buckets vanishing entirely. That is not what a
  # boundary change looks like: the histogram keeps exporting buckets, they
  # are simply DIFFERENT ones. This is the exact state the recommended
  # saturation fix would produce, so it is the state the guard exists for.
  # The 10m/30m pair also pins `for: 15m` — without the 10m assertion the
  # guard's `for:` can be shortened to 1m unnoticed.
  - interval: 1m
    name: producer re-bucketed the histogram; guard fires, names both boundaries
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2000"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="8000"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="60000"}'
        values: "0+1x60"
    alert_rule_test:
      - {eval_time: 10m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - eval_time: 30m
        alertname: WASMLatencyBucketMissing
        exp_alerts:
          - exp_labels: {severity: warning, component: wasm-runtime, job: talos-worker, instance: worker:9090, le: "2500"}
            exp_annotations:
              summary: "WASM latency alerts have lost their bucket boundaries"
              description: "The wasm_execution_duration_ms histogram is live on worker:9090 but its le=2500 bucket is absent, so SlowWASMExecution and VerySlowWASMExecution cannot fire for that instance. The histogram's bucket boundaries have most likely changed; update the le= selectors in observability/rules/alerts.yml to match."
          - exp_labels: {severity: warning, component: wasm-runtime, job: talos-worker, instance: worker:9090, le: "10000"}
            exp_annotations:
              summary: "WASM latency alerts have lost their bucket boundaries"
              description: "The wasm_execution_duration_ms histogram is live on worker:9090 but its le=10000 bucket is absent, so SlowWASMExecution and VerySlowWASMExecution cannot fire for that instance. The histogram's bucket boundaries have most likely changed; update the le= selectors in observability/rules/alerts.yml to match."
      # …and while that is true both latency rules are blind, which is the
      # point of the guard: every execution here is over 8 s and neither can
      # say so.
      - {eval_time: 45m, alertname: SlowWASMExecution,     exp_alerts: []}
      - {eval_time: 45m, alertname: VerySlowWASMExecution, exp_alerts: []}

  # ── (11) THE KNOWN GAP, pinned so it cannot be mistaken for coverage ──
  # A live, reachable, instrumented worker doing 6 executions per 15 m — under
  # the volume floor — where EVERY execution has exceeded 10 s and stayed
  # there for three hours. Nothing fires. Not the two latency rules (floor),
  # not NoWASMExecutions (executions ARE happening, so its rate is non-zero),
  # not WASMMetricsPipelineDead (the series exists), not the bucket guard.
  #
  # This is asserted, not lamented, because the comment in alerts.yml used to
  # say the low-volume case was covered BY those two rules. It is not: they
  # detect the ABSENCE of executions, and this is a latency defect with
  # executions present. They cover the ZERO-volume case only. Measured on the
  # live stack 2026-08-04: 32 % of recorded 15 m (job, instance) windows sat
  # in this 1-9 executions band. The old p95 expression DID fire on this
  # shape — that is what the floor cost, and it is a real cost.
  #
  # If a future change closes the gap (a low-volume tier, an absolute
  # slow-count arm, per-instance `up` join), this case will fail. That is the
  # intent: closing it should require deleting this case deliberately.
  - interval: 1m
    name: KNOWN GAP - permanent 100% over-10s regression below the volume floor is invisible to every rule
    input_series:
      - series: 'up{job="talos-worker", instance="worker:9090"}'
        values: "1+0x180"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+0.4x180"
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker:9090", status="success"}'
        values: "0+0.4x180"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="2500"}'
        values: "0+0x180"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker:9090", status="success", le="10000"}'
        values: "0+0x180"
    alert_rule_test:
      - {eval_time: 60m,  alertname: SlowWASMExecution,        exp_alerts: []}
      - {eval_time: 60m,  alertname: VerySlowWASMExecution,    exp_alerts: []}
      - {eval_time: 60m,  alertname: NoWASMExecutions,         exp_alerts: []}
      - {eval_time: 60m,  alertname: WASMMetricsPipelineDead,  exp_alerts: []}
      - {eval_time: 60m,  alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 180m, alertname: SlowWASMExecution,        exp_alerts: []}
      - {eval_time: 180m, alertname: VerySlowWASMExecution,    exp_alerts: []}
      - {eval_time: 180m, alertname: NoWASMExecutions,         exp_alerts: []}
      - {eval_time: 180m, alertname: WASMMetricsPipelineDead,  exp_alerts: []}

  # ── (12) THE FLOOR DOES NOT SURVIVE A SCALED FLEET ───────────────────
  # The rules aggregate `by (job, instance)`, so the `>= 10` floor is a
  # PER-REPLICA floor — but it was calibrated against a workload measured on a
  # ONE-replica stack (`make up` forces `--scale worker=1`). docker-compose.yml
  # defaults to `replicas: ${WORKER_REPLICAS:-2}`, and the same rule file is
  # loaded by both compose stacks, so a plain `docker compose up -d` splits the
  # identical total traffic two ways and halves every per-instance window.
  #
  # Replayed against the recorded 13.75 h, dividing the measured per-instance
  # volume by the replica count: 1 replica clears the floor in 66 % of windows,
  # 2 replicas in 3.7 %, 3 or more in 0.0 %. Both latency rules are therefore
  # structurally dead on any fleet larger than one — silently, with no error
  # and nothing else firing, which is this file's whole subject.
  #
  # Modelled here: two replicas, 6 executions per 15 m EACH (12 total, above
  # the floor fleet-wide and below it per-instance), every execution over 10 s,
  # for three hours. Nothing fires. Asserted rather than lamented, so that a
  # future fix — a fleet-wide floor, a replica-aware threshold, an absolute
  # slow-count arm — has to delete this case on purpose.
  - interval: 1m
    name: KNOWN GAP - two replicas halve every window; the per-instance floor is never reached
    input_series:
      - series: 'up{job="talos-worker", instance="worker-a:9090"}'
        values: "1+0x180"
      - series: 'up{job="talos-worker", instance="worker-b:9090"}'
        values: "1+0x180"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker-a:9090", status="success"}'
        values: "0+0.4x180"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker-b:9090", status="success"}'
        values: "0+0.4x180"
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker-a:9090", status="success"}'
        values: "0+0.4x180"
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker-b:9090", status="success"}'
        values: "0+0.4x180"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-a:9090", status="success", le="2500"}'
        values: "0+0x180"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-b:9090", status="success", le="2500"}'
        values: "0+0x180"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-a:9090", status="success", le="10000"}'
        values: "0+0x180"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-b:9090", status="success", le="10000"}'
        values: "0+0x180"
    alert_rule_test:
      - {eval_time: 60m,  alertname: SlowWASMExecution,        exp_alerts: []}
      - {eval_time: 60m,  alertname: VerySlowWASMExecution,    exp_alerts: []}
      - {eval_time: 60m,  alertname: NoWASMExecutions,         exp_alerts: []}
      - {eval_time: 60m,  alertname: WASMMetricsPipelineDead,  exp_alerts: []}
      - {eval_time: 60m,  alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 180m, alertname: SlowWASMExecution,        exp_alerts: []}
      - {eval_time: 180m, alertname: VerySlowWASMExecution,    exp_alerts: []}

  # ── (13) THE INVERSE HOLE, closed 2026-08-04 ─────────────────────────
  # #628 accepted this as stated debt: `absent()` is fleet-global, so ONE
  # replica losing its buckets while another kept them was invisible — the
  # absence arm sees the healthy replica's series and returns empty.
  #
  # That is not a corner case, it is THE SHAPE OF A ROLLING DEPLOY, and a
  # rolling deploy is exactly how the histogram-boundary change this guard
  # exists to protect would land. Modelled here: worker-a still on the old
  # boundaries, worker-b already re-bucketed to le=2000/8000. Half the fleet
  # is blind to SlowWASMExecution and VerySlowWASMExecution.
  #
  # THIS CASE IS DISCRIMINATING at the alert level: against the pre-fix
  # fleet-global expression it yields NO alerts at all (verified by mutation
  # 2026-08-04 — reverting the expr makes exactly this case fail). The
  # per-instance `unless` form names the replica that went blind.
  - interval: 1m
    name: rolling deploy - one replica re-bucketed, one not; guard names only the blind replica
    input_series:
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker-a:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-a:9090", status="success", le="2500"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-a:9090", status="success", le="10000"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker-b:9090", status="success"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-b:9090", status="success", le="2000"}'
        values: "0+1x60"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-b:9090", status="success", le="8000"}'
        values: "0+1x60"
    alert_rule_test:
      # `for: 15m` still respected.
      - {eval_time: 10m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - eval_time: 30m
        alertname: WASMLatencyBucketMissing
        exp_alerts:
          - exp_labels: {severity: warning, component: wasm-runtime, job: talos-worker, instance: worker-b:9090, le: "2500"}
            exp_annotations:
              summary: "WASM latency alerts have lost their bucket boundaries"
              description: "The wasm_execution_duration_ms histogram is live on worker-b:9090 but its le=2500 bucket is absent, so SlowWASMExecution and VerySlowWASMExecution cannot fire for that instance. The histogram's bucket boundaries have most likely changed; update the le= selectors in observability/rules/alerts.yml to match."
          - exp_labels: {severity: warning, component: wasm-runtime, job: talos-worker, instance: worker-b:9090, le: "10000"}
            exp_annotations:
              summary: "WASM latency alerts have lost their bucket boundaries"
              description: "The wasm_execution_duration_ms histogram is live on worker-b:9090 but its le=10000 bucket is absent, so SlowWASMExecution and VerySlowWASMExecution cannot fire for that instance. The histogram's bucket boundaries have most likely changed; update the le= selectors in observability/rules/alerts.yml to match."

  # ── (14) THE RESTART TRANSIENT — the defect this rule shipped with ────
  # Reproduced live on the dev stack 2026-08-04 before it was fixed: worker
  # restarted 11:33:33Z, `WASMLatencyBucketMissing` PENDING at 11:34:04Z, 31
  # seconds later. At that instant the live worker's /metrics exposed zero
  # wasm_execution_duration_ms_bucket lines and `count(…_count)` was EMPTY,
  # while the rule's gate `sum(rate(…_count[15m]))` read 0.0138 — contributed
  # ENTIRELY by 172.19.0.12:9090, a container gone for eight minutes and two
  # restarts. The stack scrapes the worker by `dns_sd_configs` A-record, so
  # `instance` is the container IP and every restart genuinely mints a new
  # instance label; Prometheus stale-marks the departed one on the next
  # scrape, which is what `stale` models below.
  #
  # Modelled: instance A executes for 20 minutes and vanishes; instance B
  # appears with `up` and a seeded executions counter but NO histogram (an
  # OTEL histogram emits no series until its first record(), so a worker that
  # has not executed since boot has no _count and no _bucket at all). The
  # guard must be silent throughout.
  #
  # WHAT EACH ASSERTION BLOCK HERE IS AND IS NOT WORTH. State this plainly,
  # because a case that looks like a regression test and is not one is worse
  # than no case at all:
  #
  #   * THIS CASE DOES NOT GATE A REVERT. Verified by mutation 2026-08-04:
  #     restoring the pre-fix expression in alerts.yml and re-parsing it to
  #     prove the revert landed, this entire case still PASSES. Case (13) is
  #     the one that fails on that revert, and it is therefore the regression
  #     test for the fix itself.
  #
  #   * IT DOES GATE THE OBVIOUS WRONG FIX, which is why it earns its place.
  #     The tempting move is to gate on `wasm_executions_total` instead of the
  #     histogram's own `_count` — it is seeded at 0 at startup, so it is
  #     never absent, so it looks like the more robust gate. Mutated in
  #     2026-08-04 and it fails exactly here: instance B is a healthy, freshly
  #     started, idle worker with `wasm_executions_total` seeded and no
  #     histogram, so that gate stands open against legitimately absent
  #     buckets and the guard fires at 40m and 1h and never stops. Permanently
  #     red on every idle worker — the failure this whole file exists to
  #     remove. The gate MUST be the histogram's own `_count`, because that is
  #     the only series that appears and disappears in lockstep with the
  #     buckets it is vouching for.
  #
  #   * The reason no alert-level assertion can gate it: THE PRE-FIX RULE
  #     COULD NOT ACTUALLY FIRE HERE. promtool reports FIRING alerts only, so
  #     `exp_alerts: []` passes on a PENDING rule too — and measured, not
  #     reasoned about, the pre-fix expression is true from 21m to 34m
  #     inclusive and empty at 20m and 35m. That is FOURTEEN minutes of
  #     continuous truth against `for: 15m`: it pends on every restart and
  #     stops ONE EVALUATION SHORT of firing. The bound is structural, not
  #     accidental — the gate is a `[15m]` rate over a series whose last
  #     sample is the moment the container died, so the truth window can never
  #     exceed the lookback minus one scrape interval (at the real 10s scrape
  #     interval, 14m50s: it misses by ten seconds). The four boundary
  #     assertions below pin that measurement so the claim stays falsifiable.
  #
  #     So the honest severity is: the pre-fix guard sat in PENDING for ~14 of
  #     every 15 minutes after a restart and came within one tick of paging,
  #     rather than paging outright. It is one ordinary edit from doing so —
  #     `for: 10m`, or widening the gate to `[30m]`, or any second source
  #     refreshing the tail, each carries it over. That is a correction to the
  #     premise this change was written against, recorded rather than quietly
  #     dropped.
  #
  #   * The post-fix expression is duplicated into the `promql_expr_test`
  #     below because promtool cannot reference a rule's expr by name. It is a
  #     COPY and can drift from alerts.yml without failing anything. Case (13)
  #     is what notices a revert; this copy documents the property.
  - interval: 1m
    name: restart transient - instance A departs, instance B has no histogram yet; guard silent
    input_series:
      # Instance A: alive and executing for 20m, then the container is gone.
      - series: 'up{job="talos-worker", instance="worker-a:9090"}'
        values: "1+0x20 stale"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker-a:9090", status="success"}'
        values: "0+1x20 stale"
      - series: 'wasm_execution_duration_ms_count{job="talos-worker", instance="worker-a:9090", status="success"}'
        values: "0+1x20 stale"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-a:9090", status="success", le="2500"}'
        values: "0+1x20 stale"
      - series: 'wasm_execution_duration_ms_bucket{job="talos-worker", instance="worker-a:9090", status="success", le="10000"}'
        values: "0+1x20 stale"
      # Instance B: the replacement. Up, metrics subsystem alive (the
      # executions counter IS seeded at 0 at startup), but the histogram has
      # never been recorded into, so none of its series exist.
      - series: 'up{job="talos-worker", instance="worker-b:9090"}'
        values: "_x21 1+0x39"
      - series: 'wasm_executions_total{job="talos-worker", instance="worker-b:9090", status="success"}'
        values: "_x21 0+0x39"
    alert_rule_test:
      - {eval_time: 22m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 25m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 30m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 40m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
      - {eval_time: 60m, alertname: WASMLatencyBucketMissing, exp_alerts: []}
    promql_expr_test:
      # The gate itself: no instance is exporting the histogram, so there is
      # nothing to test for missing buckets on.
      - expr: count by (job, instance) (wasm_execution_duration_ms_count)
        eval_time: 25m
        exp_samples: []
      # …while the PRE-FIX gate is wide open on the departed instance's tail.
      # Pinned so the mechanism cannot be mistaken for a modelling artifact:
      # if this ever returns empty, the scenario has stopped reproducing the
      # defect and the assertions above stop meaning anything.
      - expr: sum(rate(wasm_execution_duration_ms_count[15m])) > 0
        eval_time: 25m
        exp_samples:
          - labels: '{}'
            value: 1.1666666666666667e-2
      # …and the pre-fix absence arm is simultaneously true, which is the
      # desynchronisation in one line.
      - expr: absent(wasm_execution_duration_ms_bucket{le="2500"})
        eval_time: 25m
        exp_samples:
          - labels: '{le="2500"}'
            value: 1
      # THE PRE-FIX EXPRESSION'S TRUTH WINDOW, pinned at both edges. It is
      # true at 21m and still true at 34m — fourteen minutes — and empty on
      # either side. This is the evidence for "pends on every restart, one
      # evaluation short of firing" in the comment above; if a future edit
      # changes the gate window, these four assertions move and the claim has
      # to be rewritten rather than silently inherited.
      - expr: |
          (
            absent(wasm_execution_duration_ms_bucket{le="2500"})
            or
            absent(wasm_execution_duration_ms_bucket{le="10000"})
          )
          and on() (sum(rate(wasm_execution_duration_ms_count[15m])) > 0)
        eval_time: 20m
        exp_samples: []
      - expr: |
          (
            absent(wasm_execution_duration_ms_bucket{le="2500"})
            or
            absent(wasm_execution_duration_ms_bucket{le="10000"})
          )
          and on() (sum(rate(wasm_execution_duration_ms_count[15m])) > 0)
        eval_time: 21m
        exp_samples:
          - labels: '{le="2500"}'
            value: 1
          - labels: '{le="10000"}'
            value: 1
      - expr: |
          (
            absent(wasm_execution_duration_ms_bucket{le="2500"})
            or
            absent(wasm_execution_duration_ms_bucket{le="10000"})
          )
          and on() (sum(rate(wasm_execution_duration_ms_count[15m])) > 0)
        eval_time: 34m
        exp_samples:
          - labels: '{le="2500"}'
            value: 1
          - labels: '{le="10000"}'
