      # the gauge at its `.set(0)` pre-seed for five minutes; then it returns.
      - series: 'talos_fuel_high_utilisation_nodes{job="talos-controller",instance="controller:8080"}'
        values: "1+0x44 0 0 0 0 0 1+0x60"
      - series: 'talos_fuel_utilisation_observed_nodes{job="talos-controller",instance="controller:8080"}'
