                that host away from every other user.

                A 5xx DOES decide a recovery trial, as of 2026-08-12. Once a
                circuit is already open, a half-open trial answered with 5xx counts
                as a FAILED trial and the circuit stays open — where it previously
                counted as a success and could CLOSE the circuit against a host
                serving nothing but 503. So a `reopened` transition can now mean
                "the host answered, badly", not only "the host was unreachable".
                EVERY 4xx, INCLUDING 429, still counts as a SUCCESSFUL trial: the
                host is alive and serving, which is the only question a trial is
                entitled to ask, and the credential behind a 401 or the quota
                behind a 429 belongs to one user rather than to the host this
                breaker is keyed by. (429 briefly failed a trial during development
                and was reversed before release — a per-user quota error would have
                re-opened the circuit for every other tenant.) The accepted cost,
                stated so it is not discovered during an incident: with the shipped
                defaults of 3 trial requests and a 0.8 success rate, ONE 5xx
                anywhere in a trial period re-opens it. So if one tenant's payload
                draws a 500 from a host that serves everyone else perfectly, and
                that request takes a trial token, the others stay blocked for
                another cooldown. It can prolong an outage; it cannot start one.

                How to read a SUSTAINED half_open_exhausted, and what changed on
                2026-08-12: it used to be the signature of a STRANDED circuit. The
                half-open state has no time bound, and paths existed that spent a
                trial token without ever recording an outcome (an unresolvable
