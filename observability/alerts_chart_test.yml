  #   * the last is after the condition genuinely ends. It must CLEAR.
  #     keep_firing_for that outlived the condition would be a
  #     permanently-red alert, which is a defect and not caution.
  - interval: 1m
    name: TalosWorkerFleetWorkerViewSaturated — held across a controller-restart zero window, and still clears
    input_series:
    - series: talos_worker_fleet_capacity_dropped_heartbeats{job="talos-controller",instance="controller:8080"}
      values: 3x14 0x0 3x9 0x19
    alert_rule_test:
    - eval_time: 4m
      alertname: TalosWorkerFleetWorkerViewSaturated
      exp_alerts: []
    - eval_time: 6m
      alertname: TalosWorkerFleetWorkerViewSaturated
      exp_alerts: &talos_worker_fleet_worker_view_saturated_firing
      - exp_labels:
          severity: warning
          category: fleet-identity
          job: talos-controller
          instance: controller:8080
        exp_annotations:
          summary: fleet WORKER-ID view hit its cap — 3 heartbeat(s) refused; build-skew detection is SUPPRESSED
          description: |
            The controller's NATS fleet view refused heartbeats from worker ids
            it was not already tracking, because the worker-id map was at its
            hard cap (MAX_TRACKED_WORKERS = 4096). The bound held — this is not
            a memory incident — but the view is now INCOMPLETE in the direction
            that matters.

            A refused heartbeat is refused ENTIRELY: it never reaches the
            build-keyed map either. So a worker that boots, is renamed or is
            rescheduled while this is non-zero is invisible to
            talos_worker_fleet_live_workers AND to
            talos_worker_fleet_build_skew_builds. Already-tracked workers keep
            refreshing, which is why a flood degrades to "no NEW worker is
            visible" rather than to churn of the real fleet.

            No real fleet has 4096 distinct worker ids. Heartbeats are signed,
            so whatever produced this holds WORKER_SHARED_KEY.
          action: |
            1. Treat it as a key-handling question FIRST: enumerate what holds
               WORKER_SHARED_KEY today and rotate it if that list is longer
               than it should be.
            2. get_platform_info → `fleet` for the ids actually being
               reported. worker_id is caller-supplied and is deliberately
               never a metric label, so the queried surface is the only place
               to see them.
            3. If this is NOT an attack, something is generating a fresh
               worker_id per process far more often than the fleet rolls —
               check whether TALOS_WORKER_ID is being set from a value that
               changes every restart.
            4. Until it clears, do not read a 0 on
               talos_worker_fleet_build_skew_builds as "the fleet agrees".
            5. Restarting the controller clears the counter and the map. That
               confirms a diagnosis; it does not fix the source.
    - eval_time: 15m
      alertname: TalosWorkerFleetWorkerViewSaturated
      exp_alerts: *talos_worker_fleet_worker_view_saturated_firing
    - eval_time: 20m
      alertname: TalosWorkerFleetWorkerViewSaturated
      exp_alerts: *talos_worker_fleet_worker_view_saturated_firing
    - eval_time: 32m
      alertname: TalosWorkerFleetWorkerViewSaturated
      exp_alerts: []
  # ── TalosWorkerFleetBuildSkewUndetectable ─────────────────────────────
  # The four arms below are ordered so that THREE of them go red without
  # `keep_firing_for`, and one goes red if it is too long:
  #   * the first is PENDING, not firing — without it a rule that matched
  #     unconditionally would still pass the firing arms;
  #   * the second is the ordinary firing state;
  #   * the third sits ON the single 0 sample that models the ~60s window
  #     after a controller restart in which the gauge serves its
  #     registration-time 0. Without keep_firing_for this is `[]`;
  #   * the fourth is five minutes AFTER the gauge repopulates. Without
  #     keep_firing_for the alert had already resolved and re-armed its
  #     whole `for:` from scratch, so it would still be pending here —
  #     this is the arm that measures the DAMAGE, not just the dip;
  #   * the last is after the condition genuinely ends. It must CLEAR.
  #     keep_firing_for that outlived the condition would be a
  #     permanently-red alert, which is a defect and not caution.
  - interval: 1m
    name: TalosWorkerFleetBuildSkewUndetectable — held across a controller-restart zero window, and still clears
    input_series:
    - series: talos_worker_fleet_unverifiable_builds{job="talos-controller",instance="controller:8080"}
      values: 2x69 0x0 2x9 0x19
    - series: talos_worker_fleet_live_builds{job="talos-controller",instance="controller:8080"}
      values: 2x69 0x0 2x9 0x19
    alert_rule_test:
    - eval_time: 59m
      alertname: TalosWorkerFleetBuildSkewUndetectable
      exp_alerts: []
    - eval_time: 61m
      alertname: TalosWorkerFleetBuildSkewUndetectable
      exp_alerts: &talos_worker_fleet_build_skew_undetectable_firing
      - exp_labels:
          severity: warning
          category: fleet-identity
          job: talos-controller
          instance: controller:8080
        exp_annotations:
          summary: no observed build can be compared with the controller's — TalosWorkerFleetBuildSkew cannot fire
          description: |
            Every build observed in the fleet heartbeat is UNVERIFIABLE: it
            carries no usable commit sha, or THIS CONTROLLER's build carries
            none, in which case nothing is comparable regardless of what the
            workers report.

            So talos_worker_fleet_build_skew_builds is 0 because no comparison
            was possible, NOT because the fleet agrees. Its alert is dark for
            as long as this fires. A live build skew — which breaks signed,
            version-coupled wire formats in ways that read as crypto bugs —
            would produce no signal at all right now.

            This is a build-provenance defect, not a fleet defect. The most
            common cause by far is a controller image built outside the
            publish path, where GIT_SHA is unavailable and the version string
            is stamped `unknown`.
          action: |
            1. Establish WHICH side is unstamped: get_platform_info shows the
               controller's own build string and, under `fleet`, what the
               workers reported. If the controller's has no `+<sha>` suffix,
               it is the controller.
            2. Controller unstamped: rebuild through the published path
               (main-publish.yml, or scripts/publish-images.sh) so build.rs
               stamps GIT_SHA. A hand `docker build` from a context without
               git metadata is the usual way to land here.
            3. Workers unstamped: the same applies to the worker image; the
               two build.rs copies must stamp identically (structural check
               62), so a drift there presents as this.
            4. Do NOT silence this to quieten a dev stack. Set the policy at
               the source instead — an unstamped build is exactly the state in
               which a fleet-wide version skew is undetectable.
