                The names are deliberately not metric labels — node labels are
                author-supplied and unbounded.

                Fix by SIZING FROM THE NODE'S CONFIGURED MAXIMUM (MAX_TOKENS,
                item caps) per docs/fuel-budget-sizing.md — not from the last
                observed run, and not from the number in the exhaustion error,
                which equals the limit by construction. Prefer a node-scoped
                `data.max_fuel` over `modules.max_fuel`, which is shared by every
                override-less consumer of that module.

                Raising the budget does NOT clear this immediately: the ceiling
                read here is the limit a worker ENFORCED, so the change lands
                only after the node next runs. For a weekly workflow that is up
                to a week.
      # AFTER the gauge returns. Without the hold this would still be `pending`
      # (30m of re-arming from t=50m, i.e. not firing again until t=80m); with
      # it, the alert never stopped firing.
      - eval_time: 55m
