  # ── TalosWorkerFleetBuildSkew ─────────────────────────────
  # The four arms below are ordered so that THREE of them go red without
  # `keep_firing_for`, and one goes red if it is too long:
  #   * the first is PENDING, not firing — without it a rule that matched
  #     unconditionally would still pass the firing arms;
  #   * the second is the ordinary firing state;
  #   * the third sits ON the single 0 sample that models the ~60s window
  #     after a controller restart in which the gauge serves its
  #     registration-time 0. Without keep_firing_for this is `[]`;
  #   * the fourth is five minutes AFTER the gauge repopulates. Without
  #     keep_firing_for the alert had already resolved and re-armed its
  #     whole `for:` from scratch, so it would still be pending here —
  #     this is the arm that measures the DAMAGE, not just the dip;
  #   * the last is after the condition genuinely ends. It must CLEAR.
  #     keep_firing_for that outlived the condition would be a
  #     permanently-red alert, which is a defect and not caution.
  - interval: 1m
    name: TalosWorkerFleetBuildSkew — held across a controller-restart zero window, and still clears
    input_series:
    - series: talos_worker_fleet_build_skew_builds{job="talos-controller",instance="controller:8080"}
      values: 3x39 0x0 3x9 0x19
    alert_rule_test:
    - eval_time: 29m
      alertname: TalosWorkerFleetBuildSkew
      exp_alerts: []
    - eval_time: 31m
      alertname: TalosWorkerFleetBuildSkew
      exp_alerts: &talos_worker_fleet_build_skew_firing
      - exp_labels:
          severity: warning
          category: fleet-identity
          job: talos-controller
          instance: controller:8080
        exp_annotations:
          summary: 3 RUNNING build(s) differ from the controller's — NOT a count of workers
          description: |
            At least one build that provably differs from this controller's has
            published a fleet heartbeat recently — up to ~150s ago, being 60s
            of staleness plus a 30s prune tick plus one 60s gauge sweep — and
            has done so for 30m. Unlike TalosWorkerBuildSkew this cannot be a
            ghost registry row: a process spoke. Signed wire formats are
            version-coupled, so a live skew breaks jobs in ways that read as
            signature bugs.

            THE VALUE COUNTS BUILDS, NOT PROCESSES. Five workers stuck on one
            old build report 1, not 5, so this number tells you a skew exists
            and NOT how much of the fleet it covers. For the magnitude read
            talos_worker_fleet_build_skew_workers — which is correct on a
            DEFAULT install (this chart renders no TALOS_WORKER_ID, so each pod
            is its own identity) and is 0-or-1 and flapping only where you have
            deliberately given every replica ONE id. The alert lives on the
            build count because that one is steady in both postures. Use
            get_platform_info → `fleet` for per-worker detail either way.

            The denominator is talos_worker_fleet_live_builds — NOT
            talos_worker_fleet_live_workers, which counts heartbeating
            IDENTITIES and is a different population. The three build series
            decompose exactly: live == this + unverifiable + agreeing.

            READ talos_worker_fleet_unverifiable_builds BEFORE CONCLUDING
            ANYTHING FROM A LOW NUMBER HERE. It counts observed builds that
            could not be compared at all — the worker reported no usable commit
            sha, or THIS CONTROLLER has none, in which case nothing is
            comparable and every observed build lands there. Those sit in the
            denominator but are never counted as skew, so "1 skewed of 3 live
            builds" over an unverifiable count of 1 means one build was never
            checked. A 0 here is not "the fleet agrees"; it is "nothing was
            proven to differ".
          action: |
            1. Compare the controller and worker image digests — they must come
               from the same published tree.
            2. get_platform_info → `fleet` for the per-worker detail, including
               HOW MANY workers are on the offending build; the heartbeat gauges
               are counts only (worker_id is caller-supplied on the bus and is
               deliberately never a metric label, and neither is build_version).
            3. Roll the workers onto the controller's build. Do NOT silence:
               this one names running processes, not stale rows.
            4. If talos_worker_fleet_capacity_dropped_builds is non-zero, the
               build view is saturated and these counts include fabricated
               values — only a holder of the fleet-shared WORKER_SHARED_KEY can
               produce that, so treat it as a key-handling question first and a
               build question second.
    - eval_time: 40m
      alertname: TalosWorkerFleetBuildSkew
      exp_alerts: *talos_worker_fleet_build_skew_firing
    - eval_time: 45m
      alertname: TalosWorkerFleetBuildSkew
      exp_alerts: *talos_worker_fleet_build_skew_firing
    - eval_time: 57m
      alertname: TalosWorkerFleetBuildSkew
      exp_alerts: []
  # ── TalosWorkerFleetBuildViewSaturated ─────────────────────────────
  # The four arms below are ordered so that THREE of them go red without
  # `keep_firing_for`, and one goes red if it is too long:
  #   * the first is PENDING, not firing — without it a rule that matched
  #     unconditionally would still pass the firing arms;
  #   * the second is the ordinary firing state;
  #   * the third sits ON the single 0 sample that models the ~60s window
  #     after a controller restart in which the gauge serves its
  #     registration-time 0. Without keep_firing_for this is `[]`;
  #   * the fourth is five minutes AFTER the gauge repopulates. Without
  #     keep_firing_for the alert had already resolved and re-armed its
  #     whole `for:` from scratch, so it would still be pending here —
  #     this is the arm that measures the DAMAGE, not just the dip;
  #   * the last is after the condition genuinely ends. It must CLEAR.
  #     keep_firing_for that outlived the condition would be a
  #     permanently-red alert, which is a defect and not caution.
  - interval: 1m
    name: TalosWorkerFleetBuildViewSaturated — held across a controller-restart zero window, and still clears
    input_series:
    - series: talos_worker_fleet_capacity_dropped_builds{job="talos-controller",instance="controller:8080"}
      values: 3x14 0x0 3x9 0x19
    alert_rule_test:
    - eval_time: 4m
      alertname: TalosWorkerFleetBuildViewSaturated
      exp_alerts: []
    - eval_time: 6m
      alertname: TalosWorkerFleetBuildViewSaturated
      exp_alerts: &talos_worker_fleet_build_view_saturated_firing
      - exp_labels:
          severity: warning
          category: fleet-identity
          job: talos-controller
          instance: controller:8080
        exp_annotations:
          summary: fleet BUILD view hit its cap — 3 observation(s) refused; build-skew detection is SUPPRESSED
          description: |
            The controller's NATS fleet view refused build observations
            because its BUILD map was at the hard cap (MAX_TRACKED_BUILDS =
            64). The bound held — this is not a memory incident — but while
            this is non-zero the view is INCOMPLETE IN THE DIRECTION THAT
            MATTERS: a build not already tracked cannot enter, so
            TalosWorkerFleetBuildSkew can read 0 on a fleet that is genuinely
            skewed.

            Read this as a FALSE-NEGATIVE risk on that alert, not as noise.
            The other direction — fabricated builds inflating the skew and
            unverifiable counts before the cap is reached — is also possible
            and is the milder one, because it is loud.

            A real fleet publishes one build, or two mid-roll. Reaching 64
            distinct build strings does not happen organically, and
            build_version is carried on a signed heartbeat, so whatever
            produced this holds WORKER_SHARED_KEY. Note builds_match compares
            only the +sha suffix, so 64 mutually-distinct strings can all
            classify as AGREEING while filling the map — the flood need not
            look like skew to cause this.
          action: |
            1. Which map: talos_worker_fleet_capacity_dropped_builds is the
               BUILD map (64), talos_worker_fleet_capacity_dropped_heartbeats
               the worker-id map (4096). They are separate counters on purpose.
            2. Treat it as a key-handling question FIRST. Only a holder of the
               fleet-shared WORKER_SHARED_KEY can publish a verifying
               heartbeat, so enumerate what holds that key today and rotate it
               if the list is longer than it should be.
            3. get_platform_info → `fleet` for what is actually being reported.
               The build strings and worker ids are deliberately NOT metric
               labels (caller-supplied, unbounded cardinality), so the queried
               surface is the only place to see them.
            4. Until this clears, do not read a 0 on
               talos_worker_fleet_build_skew_builds as "the fleet agrees".
               Compare controller and worker image digests by hand instead.
            5. Restarting the controller clears both counters and both maps.
               That is a way to confirm a diagnosis, NOT a fix: if the source
               is still publishing, it refills.
    - eval_time: 15m
      alertname: TalosWorkerFleetBuildViewSaturated
      exp_alerts: *talos_worker_fleet_build_view_saturated_firing
    - eval_time: 20m
      alertname: TalosWorkerFleetBuildViewSaturated
      exp_alerts: *talos_worker_fleet_build_view_saturated_firing
    - eval_time: 32m
      alertname: TalosWorkerFleetBuildViewSaturated
      exp_alerts: []
  # ── TalosWorkerFleetWorkerViewSaturated ─────────────────────────────
  # The four arms below are ordered so that THREE of them go red without
  # `keep_firing_for`, and one goes red if it is too long:
  #   * the first is PENDING, not firing — without it a rule that matched
  #     unconditionally would still pass the firing arms;
  #   * the second is the ordinary firing state;
  #   * the third sits ON the single 0 sample that models the ~60s window
  #     after a controller restart in which the gauge serves its
  #     registration-time 0. Without keep_firing_for this is `[]`;
  #   * the fourth is five minutes AFTER the gauge repopulates. Without
