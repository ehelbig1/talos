                and concluding badly. Do NOT go hunting for three concurrent
                requests — a trial that concludes does not repay its token, so two
                sequential failed trials leave one, and a single caller arriving
                while that last trial is in flight is refused. Two-way is enough,
                and this change made it MORE likely rather than less, because a 5xx
                now CONCLUDES a trial as a failure where it previously counted as a
                success. Against a host you have independently confirmed is
                HEALTHY it is a NEW defect rather than the old one — capture the
                worker log BEFORE restarting anything, since a restart destroys the
                evidence and used to be the only remedy.
