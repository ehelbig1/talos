# `promtool test rules` unit tests for deploy/helm/talos/files/alerts.yaml —
# the CANONICAL alert file, shipped to clusters as a PrometheusRule and
# bind-mounted into the dev Prometheus. (Its sibling
# observability/alerts_test.yml covers the dev-only rules in
# observability/rules/alerts.yml; two files because the two rule sets live in
# different directories and `rule_files` resolves relative to the test file.)
#
# Run from the repo root:
#   docker run --rm -v "$PWD:/repo:ro" --entrypoint promtool \
#     prom/prometheus:v2.48.0 test rules /repo/observability/alerts_chart_test.yml
#
# WHY THIS FILE EXISTS. `TalosBackupRestoreDrillFailed` had `for: 1h`, which
# makes the firing→inactive transition unobservable inside a review on a live
# stack — you would have to wait an hour to see it fire and another scrape to
# see it clear. That is exactly the situation in which "the alert is
# clearable" gets ASSERTED rather than demonstrated, and this whole area of
# the repo exists because assertions like that turned out to be false: from
# 2026-05-25 to 2026-08-03 the alert could not be cleared by any drill run,
# however green, because nothing collected the metric.
#
# So the transition is driven here, against the real expression, at
# synthetic time.
#
# NOT WIRED INTO CI, for the same reason as alerts_test.yml: promtool is not
# available on the runners. Saying so is better than implying a gate that
# does not exist.
#
# NOTE ON THE STALE-ARM TEST. promtool's clock starts at 0, so `time()` inside
# a test is small (seconds since the test's own t=0) and `time() - 14*86400`
# is a large NEGATIVE number. A realistic unix timestamp can therefore never
# look "stale" here. The stale arm is exercised with a negative gauge value
# instead — arithmetically the same comparison, which is what is under test.

rule_files:
  - ../deploy/helm/talos/files/alerts.yaml

evaluation_interval: 1m

tests:
  # ══════════════════════════════════════════════════════════════════════
  # THE CASE THAT MATTERED: the drill has never run, so the series has never
  # existed — then a drill runs and publishes it.
  #
  # `_x90` = ninety intervals with NO sample, i.e. genuinely absent, not
  # zero. This is the state the repo was in for ten weeks.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: drill never ran, then runs — absent() fires, publication clears it
    input_series:
      - series: 'talos_backup_drill_last_success_timestamp_seconds{job="node-exporter"}'
        values: "_x90 0+0x60"
    alert_rule_test:
      # `for: 1h` — pending, not firing, before the hour is up.
      - eval_time: 30m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts: []
      # FIRING: the series has never been published. Before 2026-08-02 the
      # expression had no absent() arm and this matched nothing, so the alert
      # was silenced by its own subject.
      - eval_time: 70m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              category: ops-hygiene
            exp_annotations:
              summary: "No successful backup→restore drill in 14+ days"
              description: |
                scripts/drills/backup-restore.sh has either not run or is
                failing. A backup you have not restored is a hypothesis —
                run the drill now. If this fired via the absent() arm the
                series has NEVER been published: check that the drill script
                is scheduled at all and that its node_exporter textfile
                directory is being collected.
      # INACTIVE the moment the drill publishes a fresh success timestamp.
      # This is the deliverable: the alert is clearable by running the drill.
      - eval_time: 95m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # The other arm: the drill DID run once, long ago. A stale green run must
  # not read as a healthy one.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: last successful drill is older than the 14-day window
    input_series:
      # See the note in the header: with promtool's clock at ~0, "older than
      # 14 days ago" is a large negative number.
      - series: 'talos_backup_drill_last_success_timestamp_seconds{job="node-exporter"}'
        values: "-2000000+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts: []
      - eval_time: 70m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts:
          # NOTE the extra `job` label, which the absent() case above does
          # NOT carry: `absent()` synthesises a bare sample, while the stale
          # comparison keeps the source series' labels. So the two arms of
          # one alert reach Alertmanager with DIFFERENT label sets and group
          # separately. Discovered by this test failing on its first run —
          # which is the sort of thing a "the alert works" assertion never
          # notices.
          - exp_labels:
              severity: warning
              category: ops-hygiene
              job: node-exporter
            exp_annotations:
              summary: "No successful backup→restore drill in 14+ days"
              description: |
                scripts/drills/backup-restore.sh has either not run or is
                failing. A backup you have not restored is a hypothesis —
                run the drill now. If this fired via the absent() arm the
                series has NEVER been published: check that the drill script
                is scheduled at all and that its node_exporter textfile
                directory is being collected.

  # ══════════════════════════════════════════════════════════════════════
  # A recent green drill is quiet, for the whole timeline. Without this, a
  # rule that fired unconditionally would pass both tests above.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: recent successful drill — no alert at any point
    input_series:
      - series: 'talos_backup_drill_last_success_timestamp_seconds{job="node-exporter"}'
        values: "0+0x180"
    alert_rule_test:
      - eval_time: 30m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts: []
      - eval_time: 90m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts: []
      - eval_time: 180m
        alertname: TalosBackupRestoreDrillFailed
        exp_alerts: []
