  # ══════════════════════════════════════════════════════════════════════
  # ANTI-FLAP: the nine alerts #665 left unprotected in the
  # "a registered gauge exports its initial 0 before anything measures it"
  # class. #665 fixed two of seventeen and named the rest; these are the ones
  # whose producer is a periodic task that SKIPS its first tick, so the window
  # is real and its length is known from the source rather than guessed:
  #
  #   60s  publish_worker_fleet_gauges          background.rs:596 / :721-725
  #   60s  publish_worker_build_skew +
  #        publish_worker_liveness_participation background.rs:122/:390 / :1077
  #   60s  the crypto-invariant orphan scan      background.rs:913-963
  #
  # Six of the seventeen are deliberately NOT here and the reason is recorded
  # per alert in the findings for this change: the db-pool pair (their sampler
  # does NOT skip its first tick, so the window is ~0), TalosDEKCacheOverflow
  # and TalosSchedulerReadinessDegraded (their post-restart 0 is a TRUE
  # reading, not an unmeasured one), TalosCatalogTemplateNeverCompiled (its
  # gauge is published at BOOT ONLY, so no keep_firing_for can be sized), and
  # TalosFuelHeadroomDetectorBlind (its `== 0` reads the unmeasured zero in the
  # OPPOSITE direction — a hold there would EXTEND a false positive).
  #
  # WHAT THESE TESTS CAN AND CANNOT PROVE, in the same terms the fuel suite
  # above states it: they supply the GAUGE VALUES directly, so they prove the
  # alert's firing/holding/clearing transitions and prove nothing about
  # whether the producer computes those values correctly. The producer half is
  # pinned in the Rust unit tests beside each publisher.
  #
  # The expected labels and annotations are anchored once per alert and
  # aliased into the two later firing arms. The alias is deliberate: the
  # annotation is not what these cases test, and three hand-maintained copies
  # of a 40-line blob is how they drift.
  # ══════════════════════════════════════════════════════════════════════
  # ── TalosActorMemoryDEKOrphaned ─────────────────────────────
  # The four arms below are ordered so that THREE of them go red without
  # `keep_firing_for`, and one goes red if it is too long:
  #   * the first is PENDING, not firing — without it a rule that matched
  #     unconditionally would still pass the firing arms;
  #   * the second is the ordinary firing state;
  #   * the third sits ON the single 0 sample that models the ~60s window
  #     after a controller restart in which the gauge serves its
  #     registration-time 0. Without keep_firing_for this is `[]`;
  #   * the fourth is five minutes AFTER the gauge repopulates. Without
  #     keep_firing_for the alert had already resolved and re-armed its
  #     whole `for:` from scratch, so it would still be pending here —
  #     this is the arm that measures the DAMAGE, not just the dip;
  #   * the last is after the condition genuinely ends. It must CLEAR.
  #     keep_firing_for that outlived the condition would be a
  #     permanently-red alert, which is a defect and not caution.
  - interval: 1m
    name: TalosActorMemoryDEKOrphaned — held across a controller-restart zero window, and still clears
    input_series:
    - series: talos_actor_memory_orphaned_rows{job="talos-controller",instance="controller:8080"}
      values: 3x14 0x0 3x9 0x19
    alert_rule_test:
    - eval_time: 4m
      alertname: TalosActorMemoryDEKOrphaned
      exp_alerts: []
    - eval_time: 6m
      alertname: TalosActorMemoryDEKOrphaned
      exp_alerts: &talos_actor_memory_d_e_k_orphaned_firing
      - exp_labels:
          severity: critical
          category: data-loss
          runbook: https://github.com/OWNER/talos/blob/main/docs/security/operational-runbook.md#dek-orphan
          job: talos-controller
          instance: controller:8080
        exp_annotations:
          summary: 3 actor_memory row(s) reference a missing DEK
          description: |
            actor_memory.value_key_id points at an encryption_keys row that
            no longer exists. This should be structurally impossible under
            the ON DELETE RESTRICT FK — investigate for:
              - partial DB restore (pg_restore without encryption_keys)
              - manual DEK deletion with FK triggers disabled
              - Vault master-key rotation without DEK rewrap
            Affected rows are UNRECOVERABLE. Do not delete them without
            a decision to abandon their payloads.
          action: |
            1. kubectl -n talos exec deploy/talos-controller -- \
                 psql $DATABASE_URL -c "SELECT id, actor_id, key, created_at \
                   FROM actor_memory am \
                   WHERE NOT EXISTS ( \
                     SELECT 1 FROM encryption_keys ek WHERE ek.id = am.value_key_id \
                   );"
            2. Decide: delete orphans, or hold for forensic dump before delete.
            3. Follow docs/security/operational-runbook.md § DEK orphan.
    - eval_time: 15m
      alertname: TalosActorMemoryDEKOrphaned
      exp_alerts: *talos_actor_memory_d_e_k_orphaned_firing
    - eval_time: 20m
      alertname: TalosActorMemoryDEKOrphaned
      exp_alerts: *talos_actor_memory_d_e_k_orphaned_firing
    - eval_time: 32m
      alertname: TalosActorMemoryDEKOrphaned
      exp_alerts: []
  # ── TalosModuleExecutionPayloadOrphaned ─────────────────────────────
  # The four arms below are ordered so that THREE of them go red without
  # `keep_firing_for`, and one goes red if it is too long:
  #   * the first is PENDING, not firing — without it a rule that matched
  #     unconditionally would still pass the firing arms;
  #   * the second is the ordinary firing state;
  #   * the third sits ON the single 0 sample that models the ~60s window
  #     after a controller restart in which the gauge serves its
  #     registration-time 0. Without keep_firing_for this is `[]`;
  #   * the fourth is five minutes AFTER the gauge repopulates. Without
  #     keep_firing_for the alert had already resolved and re-armed its
  #     whole `for:` from scratch, so it would still be pending here —
