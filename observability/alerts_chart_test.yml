                other), so a host that leaked all three tokens refused every later
                request for the life of the worker process — this is what took
                www.googleapis.com out from 2026-08-11 11:35 until a container
                recreate at 23:06. Fixed: admission is now an RAII permit whose
                `Drop` repays an unused trial token, so an unsettled request — early
                return, `?`, panic, or a cancelled future — costs nothing. Sustained
                half_open_exhausted now means what it says: trials are being taken
                and concluding badly. Do NOT go hunting for three concurrent
                requests — a trial that concludes does not repay its token, so two
                sequential failed trials leave one, and a single caller arriving
                while that last trial is in flight is refused. Two-way is enough,
                and this change made it MORE likely rather than less, because a 5xx
                now CONCLUDES a trial as a failure where it previously counted as a
                success. Against a host you have independently confirmed is
                HEALTHY it is a NEW defect rather than the old one — capture the
                worker log BEFORE restarting anything, since a restart destroys the
                evidence and used to be the only remedy.
              action: |
                1. `sum(increase(talos_circuit_breaker_opens_total[30m])) by (transition)`
                   — `opened` is a first trip, `reopened` means a host came back and
                   immediately failed its trial again, i.e. a longer outage than the
                   first open suggested.
                2. Worker log, same window. The line that fires on EVERY refused
                   request, in both request-refusing arms, and carries the host is
                   "Circuit breaker open - rejecting HTTP request". Use that one.
                   "Circuit breaker opened" marks the STATE TRANSITION, which can
                   predate the failure you are investigating by hours — on
                   2026-08-11 the circuit had been half-open for 22 of them — and
                   the half_open_exhausted arm logs nothing of its own at all. For
                   the transport cause, "outbound HTTP request failed (sanitized
                   transport detail)". Container logs are lost on recreate — pull
                   them before restarting anything.
                3. Confirm the upstream independently before tuning the breaker. Do
                   NOT raise CIRCUIT_BREAKER_FAILURE_THRESHOLD to make the alert
                   stop; that removes the protection, not the outage.
                4. If the trips cluster at controller boot, this is the startup herd
                   — see TalosSchedulerStartupHerdNotAbsorbed and lower
                   SCHEDULER_STARTUP_MAX_CONCURRENT rather than touching the breaker.

  # Clearing. The breaker stops refusing work at t=20m; once that leaves the
  # 15m window the alert goes inactive on its own, with no `for:` to unwind.
  # An alert that fires on a real incident but never clears is the same
  # defect as one that never fires — it just costs the operator later.
  - interval: 1m
    name: blocking stops — alert clears once the window passes
    input_series:
      - series: 'talos_circuit_breaker_blocks_total{reason="cooldown",job="talos-worker",instance="worker:9090"}'
        values: "0+1x20 20+0x40"
    alert_rule_test:
      - eval_time: 50m
        alertname: TalosWorkerCircuitBreakerBlocking
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # TalosModuleExecutionsNeverFinalize — the 2026-08-12 ledger gap.
  #
  # This alert's whole design rests on one claim: `> 10` for `2h` over a
  # `[1h]` window separates a ONE-OFF burst (a worker died mid-execution and
  # stranded its in-flight rows) from a SUSTAINED leak (a dispatch path that
  # opens rows and never closes them). That claim is not obvious — a `for:`
  # SHORTER than the range window cannot suppress anything, which is exactly
  # the trap TalosModuleExecutionStartRowFailures documents — so it is driven
  # here at synthetic time rather than asserted in a comment.
  # ══════════════════════════════════════════════════════════════════════

  # The pathology. Every workflow node reaches the sweep, forever. Observed
  # rate on the fleet that motivated this was ~30/h; 45/h here.
  #
  # THE PER-SAMPLE STEP IS 0.75 AND THAT IS NOT COSMETIC — see the seam note on
  # the clearing case below. promtool builds a ramp by REPEATED ADDITION, so a
  # step with no exact binary representation accumulates error (0.667 added 300
  # times lands on 200.10000000000042, not 200.1). 0.75 is exact, so the ramp
  # hits a value a later segment can continue from without inventing a counter
  # reset.
  - interval: 1m
    name: broken ledger — sustained sweeping fires after the 2h `for`
    input_series:
      - series: 'talos_module_executions_swept_stuck_total{job="talos-controller",instance="controller:8080"}'
        values: "0+0.75x600"
    alert_rule_test:
      # Not yet: the condition has not held for 2h.
      - eval_time: 1h30m
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts: []
      - eval_time: 4h
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts:
          - exp_labels:
              severity: warning
              category: observability-loss
              job: talos-controller
              instance: controller:8080
            exp_annotations:
              summary: "module_executions rows are being swept, not finalized"
              description: |
                45 module_executions row(s) in the last hour were
                converted to status='timeout' / error_type='stuck' by the
                stuck-execution sweep because nothing finalized them within 30
                minutes, sustained for 2h. This is a broken LEDGER rather than a
                broken fleet.
                First: is it a broken fleet? Check TalosWorkerDown and the worker's
                own metrics. A dead worker mid-execution legitimately lands rows
                here — but a one-off burst cannot hold this alert for 2h.
                If the fleet is healthy, some dispatch path is opening rows it
                never closes. Confirm with
                `SELECT status, count(*) FROM module_executions WHERE started_at >
                NOW() - INTERVAL '1 day' GROUP BY 1` — a population with no
                'completed' rows at all is the signature. Every engine dispatch
                path closes its row through
                ParallelWorkflowEngine::finalize_module_execution_row; a new path
                that dispatches without routing through it is the first thing to
                look for.
                Blast radius while this is firing: `replay_module_regression` and
                `find_latest_completed_execution_io` both select WHERE
                status='completed' and will return NOTHING, silently. Per-node
                duration_ms is fabricated (it measures the sweep, not the module),
                so latency archaeology over this table is invalid for the window.

  # THE CASE THE THRESHOLD-PLUS-LONG-`for` EXISTS FOR. A worker dies and
  # strands 60 rows in one 5-minute sweep tick — well over the `> 10`
  # threshold — then the fleet recovers and nothing sweeps again. The
  # condition is true for the hour the burst sits in the `[1h]` window and
  # then goes false, so it can never satisfy a 2h `for`. With `for: 30m` (the
  # first draft of this alert) this WOULD have paged.
  - interval: 1m
    name: one dead worker — a single 60-row burst never pages
    input_series:
      - series: 'talos_module_executions_swept_stuck_total{job="talos-controller",instance="controller:8080"}'
        values: "0+0x30 60+0x570"
    alert_rule_test:
      - eval_time: 1h30m
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts: []
      - eval_time: 3h
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts: []
      - eval_time: 8h
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts: []

  # Clearing. The ledger is fixed at t=5h and the counter stops moving; once
  # the last increment leaves the 1h window the alert goes inactive. An alert
  # that fires on a real incident but never clears is the same defect as one
  # that never fires.
  #
  # THE SEAM MUST NOT BE A COUNTER RESET, AND GETTING THAT RIGHT TOOK TWO
  # ATTEMPTS. The original series was `0+0.667x300 200+0x400`. The ramp ends at
  # 0.667*300 = 200.1, so a second segment starting at 200 is a DECREASE, which
  # PromQL reads as a COUNTER RESET: `increase()` credits the whole post-reset
  # value across the seam, injecting a ~+200 spike at exactly the instant this
  # case means to show quiescence. It still cleared by 6h30m, so the assertions
  # passed for the wrong reason — a green test over a fabricated transition is
  # the same defect as a green gate over zero assertions.
  #
  # The obvious repair — continue from `200.1` — DOES NOT WORK, and asserting
  # it would have re-shipped the bug. promtool builds a ramp by repeated
  # addition, and 0.667 has no exact binary representation: 300 additions land
  # on 200.10000000000042, so the literal `200.1` is still smaller and still a
  # reset. Measured, not reasoned: `probe - 200.1` at 5h evaluates to 4.26e-13.
  #
  # So the step is 0.75 — exactly representable, 0.75*300 = 225 exactly — and
  # the flat segment continues from 225. `increase[1h]` is then exactly 45 while
  # the ramp runs and exactly 0 once it has left the window, with no seam
  # artefact in either direction.
  - interval: 1m
    name: ledger fixed — alert clears once sweeping stops
    input_series:
      - series: 'talos_module_executions_swept_stuck_total{job="talos-controller",instance="controller:8080"}'
        values: "0+0.75x300 225+0x400"
    alert_rule_test:
      - eval_time: 4h
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts:
          - exp_labels:
              severity: warning
              category: observability-loss
              job: talos-controller
              instance: controller:8080
            exp_annotations:
              summary: "module_executions rows are being swept, not finalized"
              description: |
                45 module_executions row(s) in the last hour were
                converted to status='timeout' / error_type='stuck' by the
                stuck-execution sweep because nothing finalized them within 30
                minutes, sustained for 2h. This is a broken LEDGER rather than a
                broken fleet.
                First: is it a broken fleet? Check TalosWorkerDown and the worker's
                own metrics. A dead worker mid-execution legitimately lands rows
                here — but a one-off burst cannot hold this alert for 2h.
                If the fleet is healthy, some dispatch path is opening rows it
                never closes. Confirm with
                `SELECT status, count(*) FROM module_executions WHERE started_at >
                NOW() - INTERVAL '1 day' GROUP BY 1` — a population with no
                'completed' rows at all is the signature. Every engine dispatch
                path closes its row through
                ParallelWorkflowEngine::finalize_module_execution_row; a new path
                that dispatches without routing through it is the first thing to
                look for.
                Blast radius while this is firing: `replay_module_regression` and
                `find_latest_completed_execution_io` both select WHERE
                status='completed' and will return NOTHING, silently. Per-node
                duration_ms is fabricated (it measures the sweep, not the module),
                so latency archaeology over this table is invalid for the window.
      - eval_time: 6h30m
        alertname: TalosModuleExecutionsNeverFinalize
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # FUEL HEADROOM — the detector, driven in BOTH directions.
  #
  # The values are the real measurement off the live database on 2026-08-17
  # (30-day window, test executions excluded, each node's ceiling taken from
  # its most recent enforced limit): 6 pairs observed, 1 of them —
  # `pa-read-later-digest/digest` at 96.9% on TWO samples — at or above the
  # 80% threshold.
  #
  # WHAT THIS SUITE CAN AND CANNOT PROVE, stated because the last two cycles
  # shipped a defect that a fixture exactly like this one could not see: these
  # tests supply the GAUGE VALUES directly, so they prove the EXPRESSION reads
  # them correctly and prove nothing about whether the sweep computes them
  # correctly. The producer half is pinned separately, in
  # `controller::bootstrap::background::fuel_headroom_tests`, whose fixtures
  # are the same live numbers and which drives the real
  # `publish_fuel_utilisation`. Neither half is sufficient alone.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: a node with no fuel headroom fires, and clears when the budget is raised
    input_series:
      # 1 high-utilisation pair out of 6 observed, then fixed at t=90m
      # (`digest`'s ceiling moves 1,404,000 -> 8,000,000, dropping it to 17%).
      - series: 'talos_fuel_high_utilisation_nodes{job="talos-controller",instance="controller:8080"}'
        values: "1+0x90 0+0x90"
      - series: 'talos_fuel_utilisation_observed_nodes{job="talos-controller",instance="controller:8080"}'
        values: "6+0x180"
    alert_rule_test:
      # `for: 30m` — pending, not firing, before the hold elapses. This arm is
      # what makes the suite non-vacuous in the negative direction: without it
      # an expression that matched unconditionally would still pass the firing
      # arm below.
      - eval_time: 20m
        alertname: TalosFuelHeadroomLow
        exp_alerts: []
      - eval_time: 31m
        alertname: TalosFuelHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: warning
              category: capacity
              job: talos-controller
              instance: controller:8080
            exp_annotations:
              summary: "1 workflow node(s) running with no fuel headroom"
              description: |
                One or more (workflow, node) pairs consumed at least 80% of the
                fuel ceiling last enforced for them, at peak, over the past 30
                days. A node at that level fails on its next larger payload —
                and it fails AFTER paying for the whole LLM call, because
                WASM_MAX_INPUT_BYTES is ~100x looser than a typical LLM node's
                fuel budget, so payload growth surfaces as fuel exhaustion in
                post-processing rather than as a clean input rejection.

                THE SAMPLE COUNT IS NOT A REASON TO DISCOUNT THIS. The node this
                detector was built for had two runs.

                Which node: the controller logs it at WARN
                (target=talos_fuel, event_kind=fuel_headroom_low), and
                `get_fuel_usage_report` returns it under high_utilisation_nodes.
                The names are deliberately not metric labels — node labels are
                author-supplied and unbounded.

                Fix by SIZING FROM THE NODE'S CONFIGURED MAXIMUM (MAX_TOKENS,
                item caps) per docs/fuel-budget-sizing.md — not from the last
                observed run, and not from the number in the exhaustion error,
                which equals the limit by construction. Prefer a node-scoped
                `data.max_fuel` over `modules.max_fuel`, which is shared by every
                override-less consumer of that module.

                Raising the budget does NOT clear this immediately: the ceiling
                read here is the limit a worker ENFORCED, so the change lands
                only after the node next runs. For a weekly workflow that is up
                to a week.
      # keep_firing_for: 10m — the expr stops matching at t=91m, and the alert
      # must STILL be firing four minutes later. This arm is the one that
      # proves the anti-flap hold is actually in effect: without
      # keep_firing_for it was `exp_alerts: []` here, and that is exactly how
      # a controller restart used to resolve this alert and re-arm its 30m
      # `for:` from scratch (19 and 11 firing episodes in 24h for the two
      # affected alerts, against continuously-true conditions).
      - eval_time: 95m
        alertname: TalosFuelHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: warning
              category: capacity
              job: talos-controller
              instance: controller:8080
            exp_annotations:
              summary: "1 workflow node(s) running with no fuel headroom"
              description: |
                One or more (workflow, node) pairs consumed at least 80% of the
                fuel ceiling last enforced for them, at peak, over the past 30
                days. A node at that level fails on its next larger payload —
                and it fails AFTER paying for the whole LLM call, because
                WASM_MAX_INPUT_BYTES is ~100x looser than a typical LLM node's
                fuel budget, so payload growth surfaces as fuel exhaustion in
                post-processing rather than as a clean input rejection.

                THE SAMPLE COUNT IS NOT A REASON TO DISCOUNT THIS. The node this
                detector was built for had two runs.

                Which node: the controller logs it at WARN
                (target=talos_fuel, event_kind=fuel_headroom_low), and
                `get_fuel_usage_report` returns it under high_utilisation_nodes.
                The names are deliberately not metric labels — node labels are
                author-supplied and unbounded.

                Fix by SIZING FROM THE NODE'S CONFIGURED MAXIMUM (MAX_TOKENS,
                item caps) per docs/fuel-budget-sizing.md — not from the last
                observed run, and not from the number in the exhaustion error,
                which equals the limit by construction. Prefer a node-scoped
                `data.max_fuel` over `modules.max_fuel`, which is shared by every
                override-less consumer of that module.

                Raising the budget does NOT clear this immediately: the ceiling
                read here is the limit a worker ENFORCED, so the change lands
                only after the node next runs. For a weekly workflow that is up
                to a week.
      # THE CLEARING DIRECTION. The whole point of taking the ceiling from the
      # node's most recent ENFORCED limit rather than maxing it over the window
      # is that the alert can go quiet when the budget is fixed. A per-row max
      # ratio would keep this firing for the full 30-day window after the fix —
      # a permanently-red alert, which is a defect, not caution. keep_firing_for
      # delays this by TEN MINUTES, not by a month: 91m + 10m = 101m.
      - eval_time: 102m
        alertname: TalosFuelHeadroomLow
        exp_alerts: []

  - interval: 1m
    name: the detector is silent on a healthy fleet it genuinely measured
    input_series:
      - series: 'talos_fuel_high_utilisation_nodes{job="talos-controller",instance="controller:8080"}'
        values: "0+0x120"
      - series: 'talos_fuel_utilisation_observed_nodes{job="talos-controller",instance="controller:8080"}'
        values: "77+0x120"
      - series: 'talos_workflow_executions_total{job="talos-controller",instance="controller:8080",status="success"}'
        values: "0+5x120"
    alert_rule_test:
      - eval_time: 110m
        alertname: TalosFuelHeadroomLow
        exp_alerts: []
      # And the meta-detector stays quiet too: 77 observed is a measurement.
      - eval_time: 110m
        alertname: TalosFuelHeadroomDetectorBlind
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # THE META-DETECTOR: a gauge stuck at a stale 0 is indistinguishable from a
  # clean bill of health, because an IntGauge exports 0 from registration.
  # This is the #625 shape — a detector silenced by exactly the condition it
  # detects — caught one level up.
  # ══════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: detector observing nothing while executions complete
    input_series:
      - series: 'talos_fuel_high_utilisation_nodes{job="talos-controller",instance="controller:8080"}'
        values: "0+0x180"
      - series: 'talos_fuel_utilisation_observed_nodes{job="talos-controller",instance="controller:8080"}'
        values: "0+0x180"
      - series: 'talos_workflow_executions_total{job="talos-controller",instance="controller:8080",status="success"}'
        values: "0+3x180"
    alert_rule_test:
      # `for: 1h`.
      - eval_time: 45m
        alertname: TalosFuelHeadroomDetectorBlind
        exp_alerts: []
      - eval_time: 65m
        alertname: TalosFuelHeadroomDetectorBlind
        exp_alerts:
          # `and on()` keeps the LEFT-hand series' labels, so the alert carries
          # the controller target it was observed on — which is what you want
          # on a multi-replica deploy: one replica's dead sweep stays
          # attributable rather than pooled.
          - exp_labels:
              severity: warning
              category: observability
              job: talos-controller
              instance: controller:8080
            exp_annotations:
              summary: "Fuel-headroom detector is observing no nodes despite live executions"
              description: |
                `talos_fuel_utilisation_observed_nodes` has been 0 for an hour
                while workflow executions completed in the last 6h. The
                fuel-headroom detector is therefore reporting a clean fleet it
                has not measured, and `TalosFuelHeadroomLow` cannot fire.

                Check, in order: the controller WARN log
                (target=talos_fuel — a failed sweep logs and leaves both gauges
                at their previous values rather than zeroing them); whether
                `execution_cost_rollup` is receiving rows at all (its writer is
                `ControllerNodeHook::on_node_completed`, and only COMPLETED runs
                produce a row); and whether the executions that completed were
                all test runs, which the detector excludes by design.

  # THE ARM THAT KEEPS THE META-DETECTOR OFF A PERMANENTLY-RED STATE. A fresh
  # install has no rollup rows and legitimately observes 0. Because
  # `talos_workflow_executions_total` is a CounterVec — ABSENT until a terminal
  # execution first touches a label set — `sum(increase(...))` over it is an
  # EMPTY vector, `empty > 0` matches nothing, and the `and on()` yields
  # nothing. No series is fed for it here, which is exactly that state.
  - interval: 1m
    name: a fleet that has executed nothing does not page
    input_series:
      - series: 'talos_fuel_high_utilisation_nodes{job="talos-controller",instance="controller:8080"}'
        values: "0+0x180"
      - series: 'talos_fuel_utilisation_observed_nodes{job="talos-controller",instance="controller:8080"}'
        values: "0+0x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: TalosFuelHeadroomDetectorBlind
        exp_alerts: []
      - eval_time: 170m
        alertname: TalosFuelHeadroomDetectorBlind
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════
  # THE CONTROLLER-RESTART DIP — the case keep_firing_for was added for.
  #
  # Every talos_* gauge is republished by a background task in
  # controller/src/bootstrap/background.rs whose FIRST tick is deliberately
  # skipped. So for one refresh interval after every controller start the
  # gauge is either ABSENT (never yet set) or sitting at its registration-time
  # `.set(0)` pre-seed — an unmeasured zero indistinguishable from a measured
  # healthy one. A bare `> 0` matches neither, so the alert RESOLVES on every
  # restart and then has to serve its full `for: 30m` again before it can
  # re-fire.
  #
  # This is not theoretical and it is not small. MEASURED on the dev stack
  # 2026-08-19 over 24h of ALERTS{alertstate="firing"} at 60s resolution:
  # TalosWorkerBuildSkew produced 19 separate firing episodes and
  # TalosFuelHeadroomLow 11, against conditions that were CONTINUOUSLY TRUE —
  # 36 episodes across all alerts, ~72 notifications a day with
  # send_resolved: true, on an idle laptop with nothing wrong. The mechanism
  # was forced rather than inferred: the dips coincide with drops in
  # talos_workflow_executions_total (a COUNTER — it can only fall on a process
  # restart), and their LENGTH matches each task's interval exactly (1 min for
  # the 60s skew task, 5 min for the 300s fuel task).
  #
  # The consequence is worse than noise: a controller restarting more often
  # than the `for:` duration can NEVER fire these alerts. A crash-looping
  # controller is precisely when a fleet alert matters most.
  #
  # Both tests below are `exp_alerts: []` WITHOUT keep_firing_for — that is
  # how the fix was proven to have landed (removing the two keep_firing_for
  # lines makes both of these fail, and the pre-existing fuel clearing test at
  # 102m pass at 95m instead).
