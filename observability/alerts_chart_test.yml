                   — `opened` is a first trip, `reopened` means a host came back and
                   immediately failed its trial again, i.e. a longer outage than the
                   first open suggested.
                2. Worker log, same window. The line that fires on EVERY refused
                   request, in both request-refusing arms, and carries the host is
                   "Circuit breaker open - rejecting HTTP request". Use that one.
                   "Circuit breaker opened" marks the STATE TRANSITION, which can
                   predate the failure you are investigating by hours — on
                   2026-08-11 the circuit had been half-open for 22 of them — and
                   the half_open_exhausted arm logs nothing of its own at all. For
                   the transport cause, "outbound HTTP request failed (sanitized
                   transport detail)". Container logs are lost on recreate — pull
                   them before restarting anything.
                3. Confirm the upstream independently before tuning the breaker. Do
                   NOT raise CIRCUIT_BREAKER_FAILURE_THRESHOLD to make the alert
                   stop; that removes the protection, not the outage.
                4. If the trips cluster at controller boot, this is the startup herd
                   — see TalosSchedulerStartupHerdNotAbsorbed and lower
                   SCHEDULER_STARTUP_MAX_CONCURRENT rather than touching the breaker.
          - exp_labels:
              severity: warning
              category: reliability-degraded
              reason: retry_gate
            exp_annotations:
              summary: "Worker circuit breaker refused ~15 request(s) (retry_gate)"
              description: |
                The worker's per-host outbound-HTTP circuit breaker refused about
                15 unit(s) of work in the last 15m with
                reason="retry_gate". ("About": `increase()` extrapolates
                to the window edges, so treat the number as a magnitude and the
                alert firing at all as the fact.) Every unit is a request that was
                never sent or a job that failed with the breaker as its stated
                reason — see the per-arm meanings below, which differ in whether
                work was actually lost.

                What the reason arm means:
                  cooldown            — the circuit for some host is OPEN and still
                                        inside its cooldown; the HTTP call was
                                        rejected without leaving the box. Lost work,
                                        unambiguously.
                  half_open_exhausted — the circuit is under trial and its trial
                                        tokens are spent, so this call was refused
                                        to protect the trial. Expected in small
                                        numbers during recovery; sustained means the
                                        trials keep failing. It does NOT imply
                                        concurrent traffic: a trial that CONCLUDES
                                        does not return its token, so two failed
                                        trials plus one still in flight is enough
                                        to refuse the next caller. It no longer
                                        means the circuit is STRANDED — see the end
                                        of this description.
                  retry_gate          — a job or pipeline step failed while one of
                                        its DECLARED hosts had an open circuit, so
                                        the breaker supplied the failure reason and
                                        skipped any remaining in-worker retries.
                                        This is the arm behind the controller-side
                                        text "circuit open for host X".

                Do NOT read retry_gate as "a retry was lost". The gate is evaluated
                BEFORE the retry-budget test on both of its paths, so it also counts
                jobs and steps that had NO retries configured — and zero retries is
                the platform's documented default for state-changing and
                governance-world modules, including both calendar nodes in the
                2026-08-11 incident. For those the outcome was identical with and
                without the gate; only the error TEXT changed. What the arm reliably
                means is "this failure happened with the breaker already open for a
                host it declared", which is what you want for attribution.

                The two request-refusing arms are NOT distinguishable from the
                execution record. `cooldown` and `half_open_exhausted` share one
                emit site in the worker (`host/http.rs`), so both surface to the
                guest as `networkerror` and both stamp the execution error with
                `[reason_class=circuit-open]`. Only this metric's `reason` label
                separates them — which is the whole reason the label exists. Do not
                infer the arm from an execution's error text.

                What this number does NOT know: WHICH host, and WHY it was failing.
                The counters carry no host label on purpose — the host reaching the
                breaker derives from a guest-supplied URL bounded only by a module's
                own `allowed_hosts` (which may be `*`), so it is not a bounded label
                source. The host is in the worker log, on every refused request.

                Also NOT knowable from here: whether the upstream is genuinely down.
                OPENING a circuit still requires reqwest TRANSPORT errors — an HTTP
