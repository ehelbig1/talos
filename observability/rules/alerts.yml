# Prometheus alert rules for the Talos WASM runtime (DEV STACK ONLY).
#
# Loaded by both compose stacks via the `/etc/prometheus/rules/wasm-alerts.yml`
# bind mount. The canonical, chart-shipped rules live in
# deploy/helm/talos/files/alerts.yaml and cover `talos_*` (controller) and
# infrastructure series; this file covers `wasm_*` (worker) series. No alert
# name may appear in both files — structural lint check 65(d).
#
# ===========================================================================
# ABSENCE IS NOT ZERO  (2026-08-02)
# ===========================================================================
#
# In PromQL an ABSENT series and a series reading 0 are different things, and
# almost every alert idiom below (`== 0`, `< N`, `rate(...) == 0`) treats
# absence as "no match". The sharpest consequence was in this very file:
#
#     - alert: NoWASMExecutions
#       expr: rate(wasm_executions_total[30m]) == 0
#       for: 30m
#
# `rate()` over an absent series returns an EMPTY vector, and `empty == 0`
# matches nothing. The alert built to detect "nothing is executing" was
# silenced by exactly the condition it detects: it could only fire once the
# worker HAD executed something and then stopped — never on the cold-dead
# case, which is the one that matters.
#
# Two things had to change for it to work at all, on two different sides:
#
#   PRODUCER: an OTEL instrument emits no series until its first recorded
#   measurement, so on an idle worker every `wasm_*` series is absent rather
#   than 0. `RuntimeMetrics::seed_zero_series` now records a zero on the
#   closed-label-set instruments at startup. (An idle worker with the metrics
#   subsystem enabled therefore reports `wasm_executions_total 0`, which is
#   both true and alertable.)
#
#   CONSUMER: the `absent()` arm below, which still covers the cases seeding
#   cannot — a worker too old to seed, `OTEL_METRICS_ENABLED` unset, or an
#   exporter that died before the first scrape.
#
# ===========================================================================
# METRIC NAMES: seven of the eleven rules here selected on a series the
# worker cannot emit
# ===========================================================================
#
# These rules were originally written against `worker/src/bin/metrics_demo.rs`
# — a demo binary that fabricates plausible `wasm_*` data on port 9091, which
# is exactly what this stack's Prometheus used to scrape. The REAL worker
# exports through OpenTelemetry on port 9090, and `opentelemetry-prometheus`
# renders instrument names by replacing `.` with `_` and appending `_total` to
# every counter. Two consequences, both fixed 2026-08-02:
#
#   * `wasm.executions.total` was exported as `wasm_executions_total_TOTAL`.
#     The instruments were renamed to drop the redundant component, so the
#     exporter now produces the single-suffixed names these rules use. Pinned
#     by `exported_prometheus_names_are_stable_and_idle_seeds_at_zero` in
#     talos-worker-runtime. (observability/grafana/dashboards/
#     talos-wasm-runtime.json had already been hand-patched to the
#     double-suffixed spelling — two files disagreeing about the name of one
#     series, with the alerts on the losing side. It is corrected here too.)
#   * `wasm_cache_hits` / `wasm_cache_misses` never existed; the counters are
#     `wasm_cache_hits_total` / `wasm_cache_misses_total`. Corrected below.
#   * `wasm_memory_used_bytes` has NO instrument in the worker at all — only
#     in the demo binary. Its alert is deleted rather than left pointing at
#     nothing; see the note where it used to be.
#
# Structural lint check 65(c) now derives the exported name from the OTEL
# declaration and fails the build when a rule here names a series nothing
# registers.

groups:
  # ========================================================================
  # WASM Runtime Performance Alerts
  # ========================================================================
  - name: wasm_performance
    interval: 30s
    rules:
      # ABSENCE AUDIT: no `absent()` arm, deliberately. A `> threshold` shape
      # over an absent series correctly yields no match, and here absence
      # means "no errors have been recorded", which is the healthy state and
      # must not page. The failure mode absence WOULD hide — the error
      # counter's call sites being deleted — is not detectable from this
      # expression at all; `WASMMetricsPipelineDead` below is the detector for
      # a silent producer. Same reasoning for the next three rules.
      - alert: HighWASMErrorRate
        expr: rate(wasm_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "High WASM execution error rate"
          description: "WASM error rate is {{ $value | humanize }} errors/sec (threshold: 0.1/sec)"

      - alert: CriticalWASMErrorRate
        expr: rate(wasm_errors_total[5m]) > 1.0
        for: 1m
        labels:
          severity: critical
          component: wasm-runtime
        annotations:
          summary: "Critical WASM execution error rate"
          description: "WASM error rate is {{ $value | humanize }} errors/sec (threshold: 1.0/sec)"

      # ────────────────────────────────────────────────────────────────────
      # LATENCY: a sustained SLOW FRACTION, not a small-sample quantile.
      #
      # WHAT WAS WRONG. Until 2026-08-04 both rules below were
      #   histogram_quantile(0.95, rate(wasm_execution_duration_ms_bucket[5m]))
      # against 500 ms / 2000 ms. Measured, not reasoned about: over 13.75 h
      # of recorded dev-stack traffic Prometheus's own ALERTS series shows
      # `VerySlowWASMExecution` firing 23 separate times and
      # `SlowWASMExecution` 8 times, and NOT ONCE on a real problem. Three
      # compounding causes, each confirmed in the raw bucket deltas:
      #
      #  1. THE POPULATION IS TINY. Per (job, instance), the MEDIAN 5 m window
      #     holds 4.14 executions; the mean is 3.79 and the max 20.83. (An
      #     earlier draft of this comment said "5-8 per window, measured peak
      #     8.3" — that peak is wrong by ~2.5x in the flattering direction:
      #     12 % of windows exceed it. The argument is unchanged and if
      #     anything stronger, because the number that matters is the MEDIAN.)
      #     `histogram_quantile(0.95, …)` over 4 samples is not a quantile, it
      #     is the MAXIMUM: the expression asks "was any single execution
      #     slow", and one slow execution moved it from 450 ms to the top of
      #     the histogram. No `for:` value changes WHAT that expression
      #     measures — see the rejection note below.
      #
      #  2. LLM TIME IS NESTED INSIDE EXECUTION TIME. 70 of 457 executions
      #     (15 %) made an Ollama call; mean LLM latency 3.2 s, and 7 calls
      #     exceeded 10 s. In the fresh-worker window after the 01:01 restart
      #     the match was 1:1 — every execution over 10 s contained an LLM
      #     call over 10 s. Over the whole 457-execution population it is
      #     WEAKER than that: 7 of 10, with the two counters diverging three
      #     times. The weaker claim still carries the argument. A 2000 ms
      #     ceiling cannot hold over a population that legitimately contains
      #     multi-second local inference. Compilation is NOT the cause and
      #     must not be blamed for it: 15 cold compiles averaged 95 ms and
      #     none exceeded 250 ms.
      #
      #  3. IT WAS NEVER ABOUT DEPLOYS. The firings cluster at :03 past the
      #     hour and :23 past every second hour — the scheduled-workflow
      #     cadence. Only 2 of the 23 recorded episodes fell within 10 min of a
      #     container restart, and one of THOSE was driven entirely by the
      #     OUTGOING worker's final 10 executions still inside the 5 m rate
      #     window: the replacement container had emitted no samples at all
      #     when the alert fired. So a worker-uptime gate would have
      #     suppressed 2 of those 23 firings, and is rejected on that evidence —
      #     it would also silence these rules permanently on a crash-looping
      #     worker, the detector-silenced-by-its-own-condition defect this
      #     file exists to close.
      #
      # ALSO REJECTED, on measurement rather than taste: widening the rate
      # window while keeping the quantile (a 30 m window HELD the transient
      # longer — 12 min of breach instead of 10).
      #
      # RAISING `for:` ALONE was also rejected, and the FIRST version of this
      # paragraph rejected it on a number that is false. It said "the longest
      # healthy breach was 19 min, so no `for:` both suppresses it and stays
      # useful". Re-measured at 15 s resolution over the complete dataset: the
      # longest continuous breach is 15.50 min on BOTH tiers (33 and 24
      # episodes; second-longest 14.75 min; ZERO episodes over 19 min). So the
      # claim is not merely imprecise, it is backwards — `for: 16m` on the
      # UNCHANGED p95 expression yields zero firings across the whole 13.75 h,
      # at ~16.3 min detection latency for a total regression, which is FASTER
      # than the 18 min below and carries neither the volume-floor blind band
      # nor the 500 ms → 2500 ms threshold loss that this rule does.
      #
      # It is still rejected, now for the reasons that are actually true:
      #   * 16 min clears the longest observed burst by 30 SECONDS, against a
      #     sample of one 13.75 h window. That is not a threshold, it is a
      #     coincidence; one heavier scheduled batch breaks it. The volume
      #     bursts in this same data run 14-54 min long, so the headroom is
      #     well inside the natural variation of the workload.
      #   * The n≈4 defect SURVIVES any `for:`. A `for:` gate changes how long
      #     the single slow execution must keep recurring, not what is being
      #     measured — and it recurs on a schedule, so the gate is a bet on
      #     the cron cadence rather than on health.
      #   * The 10 s saturation defect survives any `for:` too. Keeping the
      #     quantile keeps an expression whose VALUE is uninterpretable in
      #     exactly the state that matters (see the note in
      #     VerySlowWASMExecution).
      # If the fraction rules are ever revisited, `for: 16m` on the old
      # expression is the alternative to weigh, with those numbers.
      #
      # THE REPLACEMENT asks the question a small population CAN answer: what
      # FRACTION of executions is slow, sustained long enough that a bounded
      # burst cannot satisfy it. A fraction is well defined at n=5 (it is
      # 1/5); a p95 is not.
      #
      # THE VOLUME FLOOR IS NOT DECORATION. A fraction is meaningful at n=5
      # in a way a p95 is not, but it is still not meaningful at n=4. The
      # first draft of this rule had no floor, and over the same 13.75 h it
      # still produced one firing: the worker being REPLACED during a restart
      # trails 4 executions into the 15 m window, 3 of them slow, and 3/4 =
      # 0.75 clears any fraction threshold worth having. That is the same
      # rate-window carryover described in (3) — the series belongs to a
      # container that no longer exists. `>= 10` is the measured median
      # executions-per-15m-window for this worker, so two thirds of windows
      # remain evaluable while a dying container's tail cannot reach it.
      #
      # `for: 10m` needs that floor CONTINUOUSLY, not just at an instant, so
      # "two thirds of windows" had to be checked against contiguity before it
      # could be believed: 66 % of instants clear the floor, and 65 % of
      # recorded wall-clock time sits inside a contiguous above-floor run of
      # at least 10 min (20 of 21 runs qualify; run lengths 14-54 min). The
      # workload is block-structured — busy scheduled batches, quiet gaps —
      # rather than oscillating around the median, which is the only reason a
      # MEDIAN floor survives a 10-minute sustain requirement at all. On a
      # smoother workload it would not, and this is the first number to
      # re-measure if the cadence changes.
      #
      # THE FLOOR'S COST IS A BLIND BAND, AND IT IS NOT COVERED BY ANOTHER
      # RULE. An earlier draft of this comment said the low-volume case was
      # "tolerable ONLY because the low-volume and zero-volume cases have
      # their own detectors — NoWASMExecutions and WASMMetricsPipelineDead".
      # That sentence was FALSE, and false in precisely the way this whole
      # file exists to eliminate: it claimed coverage that the cited
      # expressions structurally cannot provide. Both are ZERO-ONLY —
      # `absent(x) or sum(rate(x[30m])) == 0` and `up == 1 and on() absent(x)`.
      # Neither can match at ANY non-zero execution rate. So a worker running
      # 1-9 executions per 15 m is below this floor, above their `== 0`, and
      # present for the pipeline check: invisible to all three.
      #
      # Measured on the same 13.75 h: 32.0 % of recorded 15 m (job, instance)
      # windows sit in that 1-9 band (543 of 1696 at a 30 s step), against
      # 1.9 % at true zero — so the two rules cited as covering the low-volume
      # case cover under a sixteenth of the windows they were credited with.
      # Driven
      # through promtool, a worker at 6 executions per 15 m with EVERY
      # execution over 10 s for three hours raises nothing at all — not these
      # two rules, not NoWASMExecutions, not WASMMetricsPipelineDead, not the
      # bucket guard. The old p95 expression DID fire on that shape. This is
      # a real loss, it is pinned by the "KNOWN GAP" case in
      # observability/alerts_test.yml so it cannot be mistaken for coverage,
      # and it is OPEN DEBT rather than something fixed here: a low-volume
      # tier needs its own threshold, and calibrating a second threshold off
      # the same single 13.75 h sample is how the 31 firings this change
      # removes got shipped in the first place.
      #
      # CALIBRATION, over 13.75 h spanning three container restarts, measured
      # per (job, instance) exactly as the rules aggregate. With the floor
      # applied the 15 m slow-fraction peaked at 0.357 (p99 0.357) at the
      # 2.5 s boundary and 0.217 (p99 0.211) at the 10 s boundary, over 1121
      # evaluable 30 s-step windows. The 0.5 thresholds were not crossed once,
      # by either tier, and neither rule would have fired at any point.
      # The 0.75 outlier the floor excludes is a dying container's 4-execution
      # tail; it is the VOLUME FLOOR that excludes it, in either aggregation —
      # an earlier draft credited per-instance aggregation with catching it and
      # then quoted the same 0.36 for both the "flattering" and corrected
      # figures, which was self-contradictory. Ungated, the fleet-wide
      # fraction reaches 0.75 too.
      #
      # WHAT THIS MISSES, stated plainly rather than implied — largest first.
      #
      #   * THE THRESHOLD MOVED 500 ms → 2500 ms, and that is the biggest
      #     loss, larger than the prevalence band below. A UNIFORM slowdown
      #     that stays under 2.5 s is invisible at ANY prevalence: 100 % of
      #     executions at 2400 ms scores a slow-fraction of 0.00 and never
      #     pages, where `p95 > 500` fired at once. The quiet-period floor of
      #     the p95 series is 456 ms (p10 and p25 both sit there; the median
      #     is 875 ms — do NOT quote 450 ms as "the healthy p95", it is the
      #     floor, and over a quarter of windows saturate at the 10 000 ms
      #     ceiling). So the new rule tolerates a ~3-5x slowdown in silence,
      #     and 41 of the 613 executions in the calibration window already sit
      #     between the two thresholds (and 18 exceeded 10 000 ms, i.e. landed
      #     in the overflow bucket where the metric cannot say how slow they
      #     were). The 500 ms boundary was abandoned
      #     because a population containing multi-second local inference
      #     cannot hold it — but nothing replaced it, and nothing here watches
      #     the sub-2.5 s range.
      #   * A PARTIAL regression is invisible at ANY duration up to 50 %
      #     prevalence — measured through promtool at 1 % granularity: 50 %
      #     of executions permanently over 2.5 s NEVER pages, 51 % pages in
      #     24 min. (The healthy peak measured below is 0.357, so the usable
      #     margin is 0.357 → 0.50, not 0 → 0.50.)
      #   * A SHORT regression is invisible however total it is. Measured:
      #     under a constant arrival rate a 9-minute stretch with every
      #     execution over 2.5 s never pages and a 10-minute one pages at
      #     18 min — the condition holds for roughly the outage's own
      #     duration, so `for: 10m` is a hard 10-minute floor. On the real
      #     bursty arrival pattern the floor is worse: a 25-minute total
      #     outage paged at all five onsets tested, 20 min at four, 15 min at
      #     three, 10 min at one. The old expression caught these in ~3 min.
      #   * A regression starting in the 1-9 executions/15 m band is not
      #     detected until volume recovers (above).
      #   * EVERYTHING ABOVE ASSUMES ONE WORKER. The rules aggregate
      #     `by (job, instance)`, so `>= 10` is a PER-REPLICA floor, and it
      #     was calibrated against traffic measured on a one-replica stack
      #     (`make up` forces `--scale worker=1`). docker-compose.yml defaults
      #     to `replicas: ${WORKER_REPLICAS:-2}` and loads this same file, so
      #     a plain `docker compose up -d` splits the identical total traffic
      #     two ways. Dividing the recorded per-instance volume by the replica
      #     count: 1 replica clears the floor in 66 % of windows, 2 in 3.7 %,
      #     3 or more in 0.0 %. Both rules are structurally DEAD on any fleet
      #     larger than one, silently. Pinned by the two-replica "KNOWN GAP"
      #     case in alerts_test.yml. Fixing it properly means choosing between
      #     a fleet-wide floor (which readmits the dying-container tail the
      #     floor exists to exclude) and a replica-aware threshold, and
      #     neither can be calibrated from a one-replica sample — so it is
      #     recorded here rather than guessed at.
      #
      # DETECTION LATENCY, for a TOTAL regression, in a window that clears the
      # floor: 18 min, from ~3 min before. The 15 m rate window has to ramp the
      # fraction past 0.5 (8 min after onset), then `for: 10m` has to elapse.
      # That figure is MEASURED — alerts_test.yml asserts silence at 37 m and
      # firing at 38 m against an onset at 20 m, so if you retune the window or
      # the `for:`, those two eval_times move and this number must move with
      # them. It is also the BEST case, and the number to quote at 3 a.m. is
      # the worse one: 18 min assumes a constant arrival rate. Replayed
      # against this worker's ACTUAL recorded arrival pattern (9.3 h, 418
      # executions, 14 onsets), a permanent total regression was detected at
      # every onset — but in 16 to 60 min, median ~23. Below 51 % prevalence
      # it is never, and inside the blind band it is never.
      #
      # ABSENCE: no absent() arm, deliberately — absence of the series means
      # no executions were observed, which is `NoWASMExecutions`'s job. But
      # the `le=` selectors DO couple these rules to the histogram's bucket
      # boundaries, and a boundary change would make the numerator absent and
      # silence both rules forever. That specific absence gets its own
      # detector, `WASMLatencyBucketMissing`, immediately below.
      - alert: SlowWASMExecution
        expr: |
          (
            1 - (
              sum by (job, instance) (rate(wasm_execution_duration_ms_bucket{le="2500"}[15m]))
              /
              sum by (job, instance) (rate(wasm_execution_duration_ms_count[15m]))
            ) > 0.5
          )
          and
          sum by (job, instance) (increase(wasm_execution_duration_ms_count[15m])) >= 10
        for: 10m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "Sustained slow WASM executions"
          description: >-
            {{ $value | humanizePercentage }} of WASM executions on
            {{ $labels.instance }} took longer than 2.5s over the last 15m,
            sustained for 10m (threshold: 50%). LLM inference time is included
            in execution duration — check wasm_llm_duration_ms before
            suspecting the WASM runtime itself.

      - alert: VerySlowWASMExecution
        expr: |
          (
            1 - (
              sum by (job, instance) (rate(wasm_execution_duration_ms_bucket{le="10000"}[15m]))
              /
              sum by (job, instance) (rate(wasm_execution_duration_ms_count[15m]))
            ) > 0.5
          )
          and
          sum by (job, instance) (increase(wasm_execution_duration_ms_count[15m])) >= 10
        for: 10m
        labels:
          severity: critical
          component: wasm-runtime
        annotations:
          summary: "Sustained very slow WASM executions"
          description: >-
            {{ $value | humanizePercentage }} of WASM executions on
            {{ $labels.instance }} exceeded 10s over the last 15m, sustained
            for 10m (threshold: 50%). 10s is the histogram's highest finite
            bucket bound, so these executions are only known to be SLOWER than
            10s — the exact latency is not recoverable from this metric.

      # The boundary guard for the two rules above. They select fixed `le`
      # values, so they are only as alive as those bucket bounds. If the
      # `wasm.execution.duration_ms` boundaries are ever changed — and there
      # is a live reason to change them, see the note on saturation in
      # VerySlowWASMExecution — the numerator goes absent, the division
      # matches nothing, and BOTH rules above go silent forever with no error
      # anywhere. That is the same shape as a rule_files entry that globs to
      # zero files: configured, plausible-looking, and dead.
      #
      # Gated on executions actually being observed, so an idle stack (where
      # no bucket series exists at all, legitimately) does not trip it.
      - alert: WASMLatencyBucketMissing
        expr: |
          (
            absent(wasm_execution_duration_ms_bucket{le="2500"})
            or
            absent(wasm_execution_duration_ms_bucket{le="10000"})
          )
          and on() (sum(rate(wasm_execution_duration_ms_count[15m])) > 0)
        for: 15m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "WASM latency alerts have lost their bucket boundaries"
          description: >-
            Executions are being recorded but the le=2500 / le=10000 buckets of
            wasm_execution_duration_ms are absent, so SlowWASMExecution and
            VerySlowWASMExecution cannot fire. The histogram's bucket
            boundaries have most likely changed; update the le= selectors in
            observability/rules/alerts.yml to match.

      # Low cache hit rate (< 70%).
      #
      # NAME FIX: was `wasm_cache_hits` / `wasm_cache_misses`; the exporter
      # emits `_total` on both.
      #
      # ONE-SIDED ABSENCE was a real hole here and is closed on the producer
      # side rather than in PromQL. Binary operators match on label sets, so
      # if `wasm_cache_hits_total` had never been touched while misses were
      # flowing — a genuine 0% hit rate, the worst case this alert exists for
      # — the division dropped to an empty vector and nothing fired. Both
      # counters are now seeded at 0 at worker startup, so both series always
      # exist and the ratio is well-formed. No `absent()` arm: when BOTH are
      # absent nothing has been compiled at all, and a hit rate over zero
      # compilations is undefined, not bad.
      #
      # AND WITH SEEDING, THE IDLE CASE IS NOW A NaN, NOT AN EMPTY VECTOR —
      # which is the property this rule actually rests on post-2026-08-02 and
      # is worth naming. On an idle worker both legs are present and flat, so
      # `rate(hits)` and `rate(misses)` are both 0 and the expression is
      # 0/(0+0) = NaN. Every PromQL comparison against NaN is false, so the
      # element is dropped and nothing fires — the same (correct) silence as
      # before, reached by a different mechanism. Do NOT "fix" the division
      # with a `clamp_min(denominator, 1)`-style guard: that would turn the
      # undefined idle ratio into a hard 0 and make this alert fire
      # permanently on every idle stack.
      - alert: LowCacheHitRate
        expr: |
          (
            rate(wasm_cache_hits_total[5m]) /
            (rate(wasm_cache_hits_total[5m]) + rate(wasm_cache_misses_total[5m]))
          ) < 0.7
        for: 10m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "Low WASM cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 70%)"

  # ========================================================================
  # WASM Runtime Resource Alerts
  # ========================================================================
  - name: wasm_resources
    interval: 30s
    rules:
      # `HighWASMMemoryUsage` (wasm_memory_used_bytes > 1GiB) WAS HERE and is
      # deleted, not repaired. The worker registers no memory instrument of
      # any name — `wasm_memory_used_bytes` exists only in
      # worker/src/bin/metrics_demo.rs, which serves its own private registry
      # that no scrape endpoint exposes. The alert had therefore never been
      # capable of firing, in any deployment, since it was written. A rule
      # that cannot fire is worse than no rule: it occupies the slot where a
      # working memory alert would be and reads, on review, as coverage.
      #
      # To bring it back: add an instrument to
      # talos-worker-runtime/src/metrics.rs (an `f64_gauge`/`u64_gauge`
      # sampled from the wasmtime store's memory accounting), extend the
      # exported-name pinning test, and re-add the rule against the name that
      # test asserts.

      # No absent() arm: absence means no instances have ever been created,
      # which cannot be "too many". Note this gauge has no reaper — see the
      # gauge-population caveat in the worker runtime — so it is a
      # process-local UpDownCounter, not a fleet total.
      - alert: TooManyActiveInstances
        expr: wasm_instances_active > 500
        for: 5m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "Too many active WASM instances"
          description: "{{ $value }} active instances (threshold: 500)"

      # No absent() arm: absence means nothing has been retried. Deliberately
      # NOT seeded on the producer side either — a flat 0 per retry `reason`
      # would assert that each reason is being watched for when the only thing
      # distinguishing "zero timeouts" from "the timeout path was deleted" is
      # a call site nothing checks.
      - alert: HighRetryRate
        expr: rate(wasm_retries_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "High WASM retry rate"
          description: "Retry rate is {{ $value | humanize }} retries/sec (threshold: 0.5/sec)"

  # ========================================================================
  # Service Health Alerts
  # ========================================================================
  - name: service_health
    interval: 30s
    rules:
      # TalosWorkerDown deliberately does NOT live here. It is defined once, in
      # the canonical deploy/helm/talos/files/alerts.yaml (group
      # talos.infra.availability, for: 2m) — the same file the chart's
      # PrometheusRule embeds. This file used to carry a second copy with
      # for: 1m and a different label set; that was invisible while
      # docker-compose.yml mounted no rules at all, and the moment both files
      # were mounted (2026-08-02) the dev stack loaded BOTH and fired BOTH on
      # one worker outage — observed live, two `firing` alerts for one event.
      # Alertmanager cannot dedup them: the label sets differ
      # (component: worker vs category: availability), so it is two pages, two
      # `for` windows, and two contradictory runbook pointers for one incident.
      # Enforced by structural lint check 65(d): no alert name may be defined
      # in more than one mounted rule file.

      # Prometheus scrape failures. Broader than TalosWorkerDown by design —
      # this fires for ANY down target, including the controller and
      # Prometheus's own self-scrape. Not a duplicate of a named per-job alert.
      #
      # No absent() arm: Prometheus synthesises an `up` sample for every
      # configured target on every scrape, so `up` cannot be absent while any
      # target is configured. "A job an alert needs is not scraped at all" is
      # a config defect and is gated at build time by structural lint check
      # 65(a), not at runtime by an alert.
      - alert: PrometheusScrapeFailure
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Prometheus scrape failure"
          description: "Failed to scrape {{ $labels.job }} for > 5 minutes"

  # ========================================================================
  # Throughput
  # ========================================================================
  - name: throughput
    interval: 30s
    rules:
      # `LowWASMThroughput` (rate(wasm_executions_total[5m]) < 10) WAS HERE
      # and is deleted. Its 10 executions/second floor came from the demo
      # binary's synthetic 10-per-second workload, not from any Talos SLO; no
      # real deployment sustains it, so once the producer seeds at 0 the rule
      # would have sat permanently firing at `info` on every stack. A
      # permanently-red signal trains operators to ignore red, which is the
      # same defect this file exists to close. `NoWASMExecutions` below is the
      # honest form of the question. If a throughput floor is ever wanted
      # again it needs a real SLO number and a business-hours gate, not a
      # threshold inherited from a demo.

      # ── THE FLAGSHIP ────────────────────────────────────────────────────
      # `absent()` FIRST, then the zero-rate comparison. The two arms cover
      # different failures and the alert is only complete with both:
      #
      #   absent(...)          the series does not exist: the worker never
      #                        started its metrics subsystem
      #                        (OTEL_METRICS_ENABLED unset), the exporter
      #                        failed, the instrument was renamed, or the
      #                        worker predates the startup seeding. This arm
      #                        is the one that was missing, and it is the only
      #                        arm that can fire on a cold-dead worker.
      #   sum(rate(...)) == 0  the series exists and is flat: a worker that is
      #                        up, instrumented, and simply not being given
      #                        work.
      #
      # THE `sum()` IS LOAD-BEARING AND WAS ADDED IN REVIEW. Without it this
      # arm keeps the source series' labels, and the producer-side seeding
      # this same change introduced creates THREE of them —
      # `seed_zero_series` writes status=success, status=error and
      # status=retry_exhausted. An idle worker therefore raised THREE
      # simultaneous NoWASMExecutions alerts differing only by a `status`
      # label that means nothing on this alert (`status="error"` does not say
      # errors occurred; it says the error-status counter is flat). One
      # condition, three pages — our own fix manufacturing the alert-fatigue
      # this file exists to reduce. `sum()` collapses them to one AND
      # aggregates correctly: any status with traffic makes the sum positive,
      # so the alert stays silent. Both arms now yield the same bare `{}`
      # label set, so the alert looks identical whichever one fired.
      # Reproduced and pinned in alerts_test.yml ("seeded worker exports
      # THREE status series; exactly ONE alert").
      #
      # Note the label fan-out is only a defect where the label is MEANINGLESS
      # to the alert. `HighWASMErrorRate`/`HighRetryRate` deliberately keep
      # their `type`/`reason` labels — one alert per failing error type is the
      # useful shape there, and neither counter is seeded, so neither fans out
      # while idle.
      #
      # SEVERITY IS UNCHANGED (warning) across both arms — an absent detector
      # must not page harder than the condition it stands in for.
      #
      # BE HONEST ABOUT WHAT THIS CANNOT DISTINGUISH: firing means "idle OR
      # broken", and on a dev stack that is idle by nature it will fire and
      # stay firing. That is the alert's literal subject and always was; the
      # bug was that it could not say so. To tell the two apart, look at
      # `WASMMetricsPipelineDead` below — if that is also firing, the worker
      # is reachable but producing nothing, which is a defect. If only this
      # one is firing, the worker is instrumented and genuinely idle.
      #
      # NEITHER ARM IS PER-INSTANCE. `absent()` yields nothing as soon as
      # ANY instance exports the series, and the `sum()` above aggregates
      # across the whole fleet for the same reason it drops `status`. So a
      # single silent replica in a scaled worker fleet is invisible to BOTH
      # arms — and the compose stack does scale the worker
      # (`WORKER_REPLICAS:-2`), so this is not hypothetical here.
      # The meta-detector below does NOT close that gap either — it uses the
      # same global `absent()`.
      # Per-replica silence would need a right-join from `up` onto the metric
      # (`up{job="talos-worker"} == 1 unless on(instance) <metric>`), which is
      # deliberately not attempted here: the bare `{}` result set both arms
      # now share is what makes these two rules simple and reviewable, and
      # one silent replica out of two still leaves the fleet doing work.
      # Say it rather than imply coverage that is not there.
      - alert: NoWASMExecutions
        expr: |
          absent(wasm_executions_total)
          or
          sum(rate(wasm_executions_total[30m])) == 0
        for: 30m
        labels:
          severity: warning
          component: wasm-runtime
        annotations:
          summary: "No WASM executions detected"
          description: >-
            No executions in the last 30 minutes — the worker is idle, or its
            execution pipeline is broken. If WASMMetricsPipelineDead is also
            firing, the worker is reachable but exporting nothing and this is
            NOT mere idleness.

  # ========================================================================
  # Meta-detection: is the signal itself alive?
  # ========================================================================
  - name: wasm_pipeline_liveness
    interval: 30s
    rules:
      # `up == 1` certifies REACHABILITY, not PRODUCTION. The 2026-08-02
      # grounding found `up{job="talos-worker"} == 1` green while the entire
      # TSDB held zero `wasm_*` series of any kind — a target answering
      # scrapes with nothing in them. Every per-metric alert above is silent
      # in that state, because each one's own series is missing. This rule is
      # the generalisation: it watches the pipeline rather than a metric, and
      # it is what would have caught this class without a human noticing.
      #
      # WHY IT CANNOT SIT PERMANENTLY RED, which was the explicit design
      # constraint (a permanently-firing alert trains operators to ignore red,
      # the same defect this change closes):
      #
      #   * It is gated on the target being UP. On any deployment that does
      #     not scrape a worker, `up{job="talos-worker"}` is empty, the `and`
      #     has no left-hand side, and the rule is inert. It cannot fire on a
      #     controller-only or non-Talos stack.
      #   * It is gated on `wasm_executions_total` being ABSENT, and a worker
      #     built from this tree with metrics enabled SEEDS that series at 0
      #     during startup, before its first execution. So an idle-but-healthy
      #     worker does not trip it — idleness is `NoWASMExecutions`'s
      #     subject, brokenness is this one's.
      #   * It lives ONLY in this dev-stack file, which is loaded only by the
      #     compose stacks — the deployments that explicitly run this
      #     Prometheus AND set OTEL_METRICS_ENABLED=true for the worker. It is
      #     not in the chart's PrometheusRule.
      #
      # It DOES fire, correctly and until fixed, when a worker is scraped with
      # its metrics subsystem disabled or broken. That is not a false
      # positive: in that state every WASM alert in this file is blind, and an
      # operator should know that before trusting any of them.
      #
      # The `on()` is load-bearing: `max()` collapses the left side to the
      # empty label set while `absent()` returns `{}` too, but written without
      # it a future edit that keeps a label on either side would silently stop
      # matching and the rule would go quiet rather than loud.
      - alert: WASMMetricsPipelineDead
        expr: |
          (max(up{job="talos-worker"}) == 1)
          and on()
          absent(wasm_executions_total)
        for: 15m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Worker target is UP but exports no WASM metrics"
          description: >-
            Prometheus is scraping a worker successfully and receiving no
            wasm_executions_total series. Every wasm_* alert is blind while
            this is true. Check, in order: OTEL_METRICS_ENABLED is set for the
            worker (it defaults to FALSE, and the runtime skips building
            RuntimeMetrics entirely when unset); the worker's /metrics body is
            non-empty; and the instrument name has not drifted from the one
            these rules select on (talos-worker-runtime's exported-name
            pinning test is the arbiter).
